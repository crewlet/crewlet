# How a Crewlet release is built.
#
# A release is still one command — `git tag v1.2.0 && git push origin v1.2.0`
# — but what a tag produces is now a set of binaries rather than a package on
# an index. See decisions/901-release-tooling.md for why goreleaser,
# and RELEASING.md for the runbook.
#
# THE TAG IS THE VERSION. Nothing in the tree records it: the tag is stamped
# into `internal/version.value` at link time, so there is no second place for
# it to disagree with. A binary built without that stamp — `go install`, a
# local `go build` — reports its module build info instead, so it names itself
# honestly rather than claiming to be a release.
#
# Rehearse locally with `make snapshot`, which builds every target and the
# container image without touching GitHub. Run it that way rather than by
# hand: signing is NOT part of the publish phase `--snapshot` skips, so the
# bare command mints a real Sigstore certificate over a throwaway build, and
# the target passes the `--skip=sign` that stops it (RELEASING.md). That a
# rehearsal exists at all is the whole point of keeping this declarative: the
# PyPI pipeline it replaced could only rehearse by uploading to TestPyPI.
version: 2

project_name: crewlet

builds:
  - id: crewlet
    main: ./cmd/crewlet
    binary: crewlet
    env:
      # Pure Go, all the way down: the store driver
      # (turso.tech/database/tursogo) and the embedded NATS server both
      # compile without cgo, which is what makes the matrix below a plain
      # GOOS/GOARCH loop instead of a cross-toolchain estate.
      #
      # "Pure Go" is not "self-contained" for the driver: its database engine
      # is a native library embedded in the module and extracted at run time
      # (internal/store/turso.go). That is what bounds the matrix below — the
      # loop is free, the platforms are not.
      - CGO_ENABLED=0
    flags:
      # Strip the build machine's paths out of the binary, so two builds of
      # one tag from two checkouts produce the same bytes.
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/crewlet/crewlet/internal/version.value={{ .Version }}
    # Pinned to the commit's own timestamp rather than the build's, for the
    # same reason as -trimpath: a rebuild of a tag must be verifiable
    # against the artifact that shipped.
    mod_timestamp: "{{ .CommitTimestamp }}"
    # FOUR TARGETS, and the list is bounded by the driver rather than by the
    # compiler. turso-go-platform-libs embeds its native library for
    # linux/amd64, linux/arm64, darwin/amd64, darwin/arm64 and windows/amd64,
    # and for nothing else.
    #
    # Windows is dropped even though windows/amd64 has one (decisions/003).
    # The release used to publish windows/amd64 AND windows/arm64, and the
    # second could not open a store at all: no embedded library, so the binary
    # started and failed at its first query unless the operator knew to set
    # CREWLET_STORE_DRIVER=sqlite — the fallback driver that has since been
    # removed. Shipping one architecture of an operating system and silently
    # breaking the other is worse than shipping neither, and a Windows build
    # was already the one that refused `providers.sandbox: {type: local}`
    # (decisions/901). internal/store/platform.go turns a build for any
    # platform off this list into a compile error that says why.
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  # The musl linux build — Alpine and anything else on musl.
  #
  # A SECOND BINARY RATHER THAN A SECOND SWITCH, because which C library the
  # embedded database engine is linked against is fixed when the archive is
  # built, not when it runs. turso-go-platform-libs embeds libs/linux_{arch}
  # behind `!musl` and libs/linux_{arch}_musl behind `musl`, and the tag is
  # the only thing that chooses.
  #
  # Without this there is no musl artifact at all, and an operator who
  # re-bases the shipped image on Alpine gets the glibc shared object: it
  # extracts, its sha256 matches, and dlopen fails — a failure that arrives
  # as "the cache will not verify", about a cache that is perfect. That is
  # what internal/store/libc_linux.go now adds a sentence to, and this build
  # is what gives that sentence something to point at.
  #
  # darwin is absent on purpose: there is one C library there.
  - id: crewlet-musl
    main: ./cmd/crewlet
    binary: crewlet
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      - musl
    ldflags:
      - -s -w
      - -X github.com/crewlet/crewlet/internal/version.value={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: crewlet
    ids: [crewlet]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # tar.gz everywhere. The zip override existed for Windows and went with
    # it; linux and darwin both want a tarball.
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

  # The musl archives, named apart from the glibc ones.
  #
  # The suffix is load-bearing: both builds produce a binary called `crewlet`
  # for the same GOOS/GOARCH, so without it the two archives collide on one
  # filename and one silently replaces the other in checksums.txt.
  - id: crewlet-musl
    ids: [crewlet-musl]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}_musl
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless Sigstore signing over the checksum file.
#
# One signature covering the file that covers every artifact, rather than a
# signature per archive: verifying the checksums file and then the checksum
# is the same proof with one fetch instead of six.
#
# It replaces the property PyPI Trusted Publishing gave — no long-lived
# credential anywhere in this repository. The certificate is minted from the
# workflow's OIDC token and logged to Rekor; there is no private key to leak
# because there is no private key.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

release:
  # GitHub writes the body from the pull requests merged since the previous
  # tag, grouped by .github/release.yml. That generated body is the ONLY
  # record of what a release contains (there is no CHANGELOG.md), so
  # goreleaser must ask for it rather than write a competing one from commit
  # subjects.
  prerelease: auto

  # What to do when the Release ALREADY EXISTS, which here means exactly one
  # thing: a re-run of a tag whose late steps failed (the image push, the
  # signing) after the Release was created. `replace` makes that re-run
  # idempotent — the body is regenerated from the same pull request list it
  # was built from the first time.
  #
  # The default, `keep-existing`, would leave a half-written body standing.
  # `append` — which this was — duplicates the entire changelog on every
  # re-run, in the one artifact that IS the record of the release, and
  # nobody notices until they read it.
  #
  # The cost is a hand-edit to the body being lost if someone then re-runs
  # the tag. RELEASING.md sends that case to a new patch release instead,
  # and prose that must survive belongs in release.header/footer, which are
  # regenerated too.
  mode: replace

changelog:
  use: github-native

# The container image, built once per architecture and joined under one tag.
#
# GHCR rather than Docker Hub: the release workflow already holds a GitHub
# token scoped to this repository, so publishing needs no second account and
# no second credential.
# glibc, because the image is debian:trixie-slim. The musl build has no image
# of its own: an operator on Alpine is building their own image anyway, and
# that is what the musl ARCHIVE is for.
dockers_v2:
  - id: crewlet
    ids: [crewlet]
    images:
      - ghcr.io/crewlet/crewlet
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      # `latest` follows STABLE releases only. A pre-release that took it
      # would hand `docker pull crewlet` to every operator who pinned
      # nothing, which is the container equivalent of a pre-release becoming
      # GitHub's "Latest".
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "https://github.com/crewlet/crewlet"
      org.opencontainers.image.licenses: MIT
