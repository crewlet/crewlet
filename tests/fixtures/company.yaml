name: "Acme AI Corp"
mission: "Build intelligent products that help people"
vision: "AI for everyone"

policies:
  - "All code must be reviewed before merging"
  - "Communicate decisions in writing"

providers:
  llm:
    default:
      type: openai
      model: gpt-4o
    budget:
      type: openai
      model: gpt-4o-mini

units:
  - name: Engineering
    type: department
    knowledge:
      - ./knowledge/engineering/
    children:
      - name: Backend
        type: team
        goals:
          - "Maintain API reliability above 99.9%"
          - "Ship features on 2-week cadence"
        lead: Tech Lead
        roles:
          - name: Tech Lead
            llm: default
            goal: "Coordinate backend team and make architecture decisions"
            backstory: "Senior engineer with 10 years of distributed systems experience"
            responsibilities:
              - "Coordinate backend team work"
              - "Make architecture decisions"
              - "Review all PRs"
            # manages auto-inferred from team roles

          - name: Senior Engineer
            llm: default
            goal: "Design and build reliable APIs"
            responsibilities:
              - "Design and build APIs"
              - "Write and review code"
              - "Mentor junior engineers"

          - name: Junior Engineer
            llm: budget
            goal: "Implement features and fix bugs"
            responsibilities:
              - "Implement assigned features"
              - "Write tests"
              - "Fix bugs"

  - name: Product
    type: department
    children:
      - name: Product Management
        type: team
        lead: Product Manager
        roles:
          - name: Product Manager
            llm: default
            goal: "Define product strategy and translate into actionable specs"
            responsibilities:
              - "Define product requirements"
              - "Write user stories"
              - "Prioritize backlog"

extensions:
  - crewlet_api:
      port: 8080
  - crewlet_metrics:
      export: prometheus
