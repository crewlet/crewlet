name: dependabot-recreate

# When a person merges to `main`, ask Dependabot to recreate every bump that is
# in conflict, once per head commit. It does not wait for Dependabot's own rebase
# (a few minutes: #167, two minutes after #168 merged), so a bump Dependabot
# would have rebased by itself is recreated instead, which ends in the same
# branch for the price of one more force-push and CI run. A wait would only save
# that, and a job that sleeps ten minutes printing nothing reads as hung.
#
# It comments `recreate`, not `rebase`, because the bumps that stay stuck are
# the ones Dependabot will not touch: once a branch holds a commit that is
# neither Dependabot's nor marked `[dependabot skip]`, Dependabot skips the
# automatic rebase and answers `@dependabot rebase` with "edited by someone
# other than Dependabot", so the bump stays stuck for good. Recreate is the
# command that works on it, and it OVERWRITES EVERY COMMIT ON THE BRANCH, a
# person's included. That is the price, paid by any bump in conflict after a
# merge.
#
# The comment has to come from a person. Dependabot ignores commands written by
# `github-actions[bot]` or by a GitHub App (dependabot-core#9147). So it is made
# with DEPENDABOT_RECREATE_TOKEN: a fine-grained personal access token for this
# repository, Pull requests: read and write, owned by an account with Write
# access. That scope can also approve pull requests, so the secret belongs to an
# ENVIRONMENT limited to the branch `main` (Settings -> Environments), which
# releases it to a run on `main` and to no other branch a writer can push. Create
# the environment BEFORE this reaches `main`: a workflow that names one that does
# not exist creates it, open to every branch.
#
# Not covered: a bump merges itself with GITHUB_TOKEN, and GitHub starts no
# workflow for an event that token caused (#167, #170, #171 and #173 have no push
# run), so a conflict a bump's merge makes waits for the next merge by a person,
# or for "Run workflow". Those are the conflicts Dependabot rebases itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A newer merge cancels a run still in flight. That run listed the bumps before
# the merge, and what it already posted is on the pull requests' own comments,
# which the newer run reads, so nothing is lost by stopping it. At worst a comment
# was sent as the cancel arrived and the bump is asked twice.
concurrency:
  group: dependabot-recreate
  cancel-in-progress: true

jobs:
  recreate:
    name: comment on the bumps still in conflict
    runs-on: ubuntu-latest
    # A fork has no secret and would fail on every push to its own `main`.
    if: ${{ !github.event.repository.fork }}
    environment: dependabot-recreate
    # A hang detector: two minutes of retries at most, plus a few API calls.
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail

          # An empty secret is the failure this job is expected to meet on its
          # first run, and gh's own message for it names neither the secret nor
          # the environment it has to live in.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPENDABOT_RECREATE_TOKEN is empty. It is a secret of the dependabot-recreate ENVIRONMENT (Settings -> Environments), not an ordinary Actions secret. See the header of .github/workflows/dependabot-recreate.yml."
            exit 1
          fi

          # GitHub works out whether a pull request conflicts when it is first
          # asked, and answers UNKNOWN until it has. Ask until every bump has an
          # answer, two minutes at most; one still UNKNOWN waits for the next merge.
          #
          # Only the number and the answer are listed. GraphQL refuses a query that
          # could reach more than 500,000 nodes, and one that also asks for every
          # pull request's commits and each commit's authors is a hundred times a
          # hundred times a hundred. Each conflicting bump is read on its own below.
          for _ in 1 2 3 4 5 6 7 8; do
            prs="$(gh pr list --author app/dependabot --base main --limit 1000 \
              --json number,mergeable)"
            jq -e 'all(.[]; .mergeable != "UNKNOWN")' <<<"$prs" >/dev/null && break
            sleep 15
          done

          jq -r '.[] | select(.mergeable == "CONFLICTING") | .number' <<<"$prs" |
            while read -r n; do
              # Nobody has asked for a recreate since the branch last changed. A
              # refused `rebase` does not count: it left the branch as it was. Both
              # timestamps are UTC ISO-8601, which compares as text.
              asked="$(gh pr view "$n" --json commits,comments | jq '
                (.commits[-1].committedDate) as $head
                | any(.comments[];
                    (.body | test("^@dependabot recreate"))
                    and .createdAt > $head)')"
              if [ "$asked" = true ]; then
                echo "#$n is in conflict, and Dependabot was already asked since its last commit"
                continue
              fi
              gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" \
                -f body='@dependabot recreate' --silent
              echo "asked Dependabot to recreate #$n"
            done
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_RECREATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
