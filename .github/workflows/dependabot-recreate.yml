name: dependabot-recreate

# When one dashboard bump merges, every other open one conflicts. Each carries
# its own rebuilt bundle (dependabot-dashboard.yml), the emitted names are
# content-hashed, and so two branches that both rebuilt `static/dashboard`
# collide on `index.html` and on every chunk. The resolution is always to
# REBUILD, never to merge (CONTRIBUTING.md), and a rebuild here means asking
# Dependabot to recreate the branch so dependabot-dashboard.yml can push a fresh
# bundle onto it.
#
# Nothing else will do that. A conflicted pull request runs NO workflows, so
# dependabot-dashboard.yml cannot reach it. Dependabot rebases a conflicted bump
# by itself, but only when every commit on the branch is its own or carries
# `[dependabot skip]`; a commit anyone else added makes it refuse, and
# `@dependabot recreate` is the command that works regardless. This workflow
# says it, so nobody has to notice that a bump has been sitting there red.
#
# WHAT IT WILL NOT DO is discard somebody's work. `recreate` throws away every
# commit on the branch, so a bump is only asked for one when EVERY commit on it
# was made by a bot: Dependabot's own and the App that pushes the bundle. A
# conflicted bump that carries anything else is reported in the run summary and
# left alone. A commit whose author GitHub cannot resolve to an account counts
# as a person's.
#
# WHEN IT RUNS. On a push to `main` that changes `static/dashboard`, which is the
# moment a bump has just merged, and every hour. The hourly run is the one that
# does the work: the pushes that Dependabot's merges make start no workflows,
# because auto-merge is queued with `GITHUB_TOKEN` and GitHub does not start a
# workflow for an event that token caused (the merge commits of #167, #170, #171
# and #173 have no push-event run at all). The `push` trigger is for the merge a
# person makes. Hourly bounds how long a conflicted bump can sit unnoticed, and
# costs a few API reads.
#
# ASKING IS CHEAP AND ONCE. A bump is asked about once per head commit: a
# comment of ours newer than the head's own date means the question has been
# put. Once Dependabot recreates the branch the head is new and the bump is
# eligible again.
#
# ONE THING THIS CANNOT KNOW is whether Dependabot acts on a command written by
# `github-actions[bot]` rather than by a person with write access. Nothing in
# GitHub's documentation says either way. So when a request has stood
# unanswered for six hours it says so, as a warning on the run, instead of
# leaving the bump to look as if the workflow worked.

on:
  push:
    branches: [main]
    paths:
      - static/dashboard/**
  schedule:
    # Off the hour, where every other scheduled workflow queues.
    - cron: "23 * * * *"
  workflow_dispatch:

# Nothing by default; the one job asks for what it uses.
permissions: {}

# Two runs at once would each see "not yet asked" and both comment. Queue the
# second rather than cancel it: it runs a moment later and finds the first's
# comment.
concurrency:
  group: dependabot-recreate
  cancel-in-progress: false

jobs:
  recreate:
    name: ask Dependabot to recreate conflicted dashboard bumps
    runs-on: ubuntu-latest

    # Reading pull requests, commits and comments, and writing one comment.
    # There is no checkout and no secret, and no part of a pull request (title,
    # branch name, body) reaches a shell: only numbers and SHAs do.
    permissions:
      contents: read
      pull-requests: write

    # A hang detector. Worst case is every open bump waiting out its full minute
    # for GitHub to compute mergeability, which is a handful of minutes.
    timeout-minutes: 15

    steps:
      - name: comment on the conflicted bumps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # Six hours: Dependabot normally acknowledges a command within
          # minutes, and the schedule is hourly, so by six hours a handful of
          # runs have passed over the same unanswered request.
          stale_after=$((6 * 3600))
          note() { echo "- $*" >> "$GITHUB_STEP_SUMMARY"; }

          numbers="$(gh api --paginate \
            "repos/$repo/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.user.login == "dependabot[bot]") | .number')"

          for n in $numbers; do
            # Only a bump that touches the dashboard carries a bundle to collide.
            files="$(gh api --paginate \
              "repos/$repo/pulls/$n/files?per_page=100" --jq '.[].filename')"
            grep -qE '^(dashboard|static/dashboard)/' <<<"$files" || continue

            # GitHub computes mergeability on demand and answers "unknown" until
            # it has. Asking again is what starts the computation.
            state=unknown
            for _ in 1 2 3 4 5 6; do
              pr="$(gh api "repos/$repo/pulls/$n")"
              state="$(jq -r .mergeable_state <<<"$pr")"
              [ "$state" != unknown ] && break
              sleep 10
            done
            if [ "$state" != dirty ]; then
              note "#$n: not conflicting ($state)"
              continue
            fi

            # Anything that is not a bot's makes recreate destructive.
            people="$(gh api --paginate \
              "repos/$repo/pulls/$n/commits?per_page=100" \
              --jq '.[] | select(((.author.login // "") | endswith("[bot]")) | not) | .sha[0:7]')"
            if [ -n "$people" ]; then
              note "#$n: conflicting, but carries commits that are not a bot's ($(tr '\n' ' ' <<<"$people")); recreating it would discard them, so it is left for a person."
              echo "::warning::#$n conflicts with main and carries a person's commits; recreate would discard them."
              continue
            fi

            head="$(jq -r .head.sha <<<"$pr")"
            headdate="$(gh api "repos/$repo/commits/$head" \
              --jq .commit.committer.date)"
            last="$(gh api --paginate "repos/$repo/issues/$n/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("@dependabot recreate"))) | .created_at' \
              | sort | tail -n 1)"
            if [ -n "$last" ] && [[ "$last" > "$headdate" ]]; then
              age=$(( $(date +%s) - $(date -d "$last" +%s) ))
              if [ "$age" -gt "$stale_after" ]; then
                echo "::warning::#$n is still conflicting $((age / 3600))h after it was asked to recreate. Dependabot may not act on commands from github-actions[bot]; comment it yourself."
              fi
              note "#$n: already asked at $last"
              continue
            fi

            gh api "repos/$repo/issues/$n/comments" -f body='@dependabot recreate' --silent
            note "#$n: conflicting; asked Dependabot to recreate it"
          done
