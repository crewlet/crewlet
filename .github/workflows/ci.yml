name: ci

# CI for the engine. The Go tree IS the repository, so this runs on
# everything rather than on a path filter: a path list on a repository-wide
# workflow is a way to skip the build for exactly the change nobody thought
# of.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The module pins its own toolchain in go.mod; auto lets the setup-go
  # toolchain fetch it rather than failing on a mismatch.
  GOTOOLCHAIN: auto

# THE GO CACHES. Every Go job below runs the same six steps around its own
# work, written ONCE here as YAML anchors (`&name`) and repeated by alias
# (`*name`), so the jobs cannot drift apart. GitHub Actions and Dependabot both
# resolve aliases; merge keys (`<<:`) are NOT supported, which is why each
# anchor is a whole step.
#
# Why not setup-go's own cache, which this used to be: it keys on go.sum alone,
# so every Go job here shared ONE key, and a key is saved only by the first job
# to miss it. That was always `cross-compile (linux, amd64)` — the fastest
# job, building CGO_ENABLED=0 without -race — so every later run restored 461
# MB of a non-race, no-cgo build into the race, cgo, lint and other-platform
# jobs, which could use none of it: `test (race)` compiled cold for 152s before
# its first package started, and its own save was refused ("Unable to reserve
# cache") every time. Measured on runs 37517249211 and 37699674195.
#
# So: ONE MODULE CACHE, keyed exactly on go.sum and saved by `build + vet`
# after `go mod download` has fetched the test-only modules too; and ONE BUILD
# CACHE PER JOB (per matrix leg), restored from the newest one main saved for
# that job and saved again only by a push to main. A pull request never saves:
# an entry it writes is visible to no other pull request and to main not at
# all, and it would only push main's entries out of the repository's 10 GB.
#
# Nothing here can make a test pass that should fail. A build-cache entry is
# keyed by an action ID that hashes the inputs, the flags (-race), the
# toolchain and the IDs of everything the package depends on, so a stale entry
# can only miss; and the test targets pass -count=1, so every test binary runs.

jobs:
  build:
    name: build + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - &setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The caches are the steps below; see THE GO CACHES above.
          cache: false
      # THE EPOCH is an hour before this job touched the build cache, and it
      # is what makes the prune at the end of the job exact: the go command
      # re-stamps an entry's mtime when it USES it, unless the stamp is under
      # an hour old (cmd/go/internal/cache: mtimeInterval). So after the job,
      # an entry this job created or used is newer than the epoch, and one it
      # only restored is older — unless the run that saved it ended within the
      # hour, which is at most an hour of churn.
      - &go-caches
        name: locate the Go caches, and mark when this job began using them
        run: |
          touch -d '-1 hour' "$RUNNER_TEMP/gocache-epoch"
          gocache="$(go env GOCACHE)"
          gomodcache="$(go env GOMODCACHE)"
          echo "GOCACHE=$gocache" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$gomodcache" >> "$GITHUB_ENV"
      # Exact, with no restore-keys: a near-miss would restore a superset of
      # modules that only grows, and a miss costs one download from the proxy.
      - &gomod-restore
        name: restore the module cache
        id: gomod
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GOMODCACHE }}
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      # The job's id and its matrix leg name the cache, so every job and every
      # leg keeps its own: a -race build, a cgo-free darwin/arm64 build and
      # the linter's export data share almost nothing. The newest entry main
      # saved for this job is what a miss on this commit's key restores.
      - &gobuild-restore
        name: restore this job's build cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GOCACHE }}
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: gobuild-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
      # Every module the build AND the tests need, so the cache saved below is
      # whole: without this a test-only module (jsonschema) was fetched again
      # by every test job of every run.
      - run: go mod download
      - name: save the module cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gomod.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GOMODCACHE }}
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - run: go build ./...
      # THE ONLY VET THE TEST PACKAGES GET. Both test targets run `go test
      # -vet=off` (the Makefile's GOTESTRUN says why): `go vet ./...` runs every
      # analyzer `go test` would, and more, over the same packages and their
      # _test.go files. Drop this step and nothing in CI vets at all.
      - run: go vet ./...
      # This tree's Go files by internal/sourcetree's rule, never `.`, which
      # gofmt walks into every nested checkout — the Makefile's GOFILES says
      # why. Listed first so a listing that failed stops the step (bash -e)
      # instead of handing gofmt no paths, which it reads as stdin and passes.
      - name: gofmt
        run: |
          files="$(go run ./internal/sourcetree/gofiles)"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      # `go mod tidy` has to be a no-op on a pull request, and only half of
      # that is covered without this step. An UNDER-tidy module already fails
      # loudly everywhere: a missing requirement or go.sum entry stops
      # `go build ./...` in this job and in every other one. The opposite
      # direction is caught by NOTHING -- a `require` left behind when its
      # last import was deleted, a stale go.sum line, a wrong `// indirect`
      # marker: each of those builds green, tests green and cross-compiles
      # green, then lands as unrelated churn in whichever pull request next
      # happens to run tidy, on top of whatever that one was actually for.
      #
      # -diff rather than `go mod tidy` followed by `git diff`: it prints the
      # patch and exits non-zero WITHOUT writing the files. So this reports
      # the drift instead of quietly repairing it, and no later step in this
      # job can be handed a go.mod the commit does not contain.
      - name: go mod tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error::go.mod / go.sum are not tidy. The diff above is what 'go mod tidy' would write -- run: make tidy"
            exit 1
          fi
      # Only what this job created or used, by the epoch above. Without the
      # prune, every save would carry forward everything the restored cache
      # held, and the go command only trims entries five days unused — so each
      # job's cache would grow to five days of every commit's builds, several
      # times over the repository's 10 GB.
      #
      # Whole ENTRIES (`<id>-a`, `<id>-d`) at depth two, removed recursively —
      # the shape of the go command's own trim. Not every old FILE: a cached
      # EXECUTABLE (what `go run` keeps since Go 1.24) is a `-d` DIRECTORY,
      # and using it re-stamps the directory and not the binary inside, so a
      # file-by-file prune would empty an entry this job had just used.
      # Saved even when the job failed, since a compile is no less right for
      # a test that failed after it; never when it was cancelled.
      - &gobuild-prune
        name: keep only what this job used of the build cache
        if: ${{ !cancelled() && env.GOCACHE != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          find "$GOCACHE" -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) \
            ! -newer "$RUNNER_TEMP/gocache-epoch" -exec rm -rf {} +
          du -sh "$GOCACHE"
      - &gobuild-save
        name: save this job's build cache
        if: ${{ !cancelled() && env.GOCACHE != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GOCACHE }}
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}

  # THE DCO GATE — the one job here whose subject is git history rather than
  # the tree, and therefore the one whose failure cannot be fixed by editing a
  # file: a missing trailer is repaired by REWRITING the commit. That is the
  # whole argument for checking it here, at the moment a pull request opens,
  # instead of at review time when the rewrite costs a force-push under a
  # reviewer who has already read the diff. `make signoff-check` is the same
  # script against origin/main..HEAD, which is the cheapest moment of all.
  #
  # Nothing checked this until it existed, and 61 of the 361 non-merge commits
  # behind it carry no trailer — which is what a convention held by memory
  # alone decays into. Only a pull request's OWN commits are judged, so that
  # history stays as it is. What the script certifies, and what it
  # deliberately does NOT (the trailer is never matched against the author),
  # is written at its top.
  signoff:
    name: sign-off
    # PULL REQUESTS ONLY, and this `if:` is load-bearing rather than tidiness:
    # the step below reads `github.event.pull_request.*`, which a `push` event
    # does not populate at all, so without the guard a push to main would run
    # the script over an empty range and pass by having nothing to look at.
    #
    # It is also the WHOLE gate now. A `sign-off (main)` job used to sit beside
    # it, re-running the same script over `before..after` on each push to main,
    # because the commit the merge button WRITES does not exist when this job
    # reports: GitHub composes that message at merge time, after every check
    # has reported, and it does not always carry the branch's trailers —
    # `074e3a1` and `7d0e29e` reached main unsigned exactly that way, from
    # branches whose own commits were properly signed. That job was a DETECTOR
    # rather than a preventer, and it is gone, so nothing watches for it
    # happening again. What keeps the trailers now is the repository's squash
    # and merge commit-message settings, which live in Settings and which
    # nothing in this tree can see or assert.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Not shallow: the default single-commit fetch has neither the base
          # commit nor the branch's own history, so there would be no range
          # to walk and this job would pass by having nothing to look at.
          fetch-depth: 0
      # The pull request's OWN base and head, not origin/main..HEAD: the
      # checkout sits on the merge ref, and a fork's origin is the fork.
      # Both values are commit SHAs GitHub computed, taken through the
      # environment rather than interpolated into the shell — a `run:` that
      # pastes `${{ }}` into its script is the shape that becomes an
      # injection the day one of those fields is not what you assumed.
      - name: every commit carries a Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-signoff.sh "$BASE_SHA" "$HEAD_SHA"
      # The gate's own suite. It is bash reading git history, so nothing in the
      # Go suite reaches it, and it regresses SILENTLY in both directions: a
      # gate that stops failing reports a certification nobody made, and one
      # that starts failing wedges every pull request. Both happened while it
      # was being written.
      - run: scripts/check-signoff_test.sh

  # The dashboard is a React + TypeScript application built by Vite, and this
  # job runs its three gates: `dashboard-lint` (prettier), `dashboard-check`
  # (the rebuild-and-diff below) and `dashboard-test` (typecheck + Vitest).
  # Its own assertions run here — the wire protocol, the router's history
  # rules, the route table against the design doc and every dashboard address
  # the rest of the tree prints, the ordering comparators, no price anywhere,
  # and the MEASURED contrast of every colour token over every surface it can
  # land on, in both themes and for protan and deutan vision. None of that is
  # checkable by looking at the stylesheet, which is why it is computed from
  # the file that actually ships.
  #
  # `dashboard-check` is the load-bearing one. static/dashboard is COMMITTED —
  # `go build ./...` and `go install …@latest` must work on a clean checkout
  # with no node, and an embed directive cannot run a bundler — so a bundle
  # that has drifted from its source compiles, embeds, serves and passes every
  # Go test while running code nobody wrote. This rebuilds it and judges the
  # tree, the same way `go mod tidy -diff` and the generated schema/ are gated.
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `latest` is the newest Node release, resolved by setup-node at run
      # time, and NOTHING IN THE TREE NAMES A VERSION — deliberately, because
      # nothing would ever move one if it did. Dependabot reads `dependencies`
      # and `uses:` refs; it bumps neither `engines.node` (dependabot-core
      # #11243, open) nor a workflow's `with:`. A pin here would not stay put,
      # it would just go quietly out of date, and the dashboard's toolchain
      # tracks current Node anyway.
      #
      # The cost is real and worth knowing: a new Node major lands here with
      # no commit, so this job can go red on a day nobody changed anything.
      # When that happens the fix is `lts/*` (the current LTS, which lags a
      # major behind), not a hand-maintained number. Make it in
      # dependabot-dashboard.yml's `build` job in the same commit: that job
      # rebuilds the bundle this one diffs, and is only worth anything if it
      # runs on the same node.
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # `npm ci` rather than `npm install`: the lockfile is the pin, and a
      # build whose dependency versions drift is a build whose committed output
      # cannot be reproduced — which is exactly what the drift gate below
      # depends on.
      - run: npm ci
        working-directory: dashboard
      - run: npm run format:check
        working-directory: dashboard
      - run: npm run typecheck
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      # THE SAME PREDICATE AS `make dashboard-check`, whose comment carries the
      # reasoning; change the two together. `git diff` sees only the paths
      # the commit already has, and every emitted name is content-hashed, so
      # the chunk a commit leaves out (`git commit -a` never stages a new
      # file) is a path the diff cannot see: `git ls-files --others` is the
      # half that catches it, and without `--exclude-standard` because the
      # embed is `all:dashboard`, which ships an ignored file too.
      - name: the committed bundle is what this source builds
        run: |
          npm --prefix dashboard run build
          untracked="$(git ls-files --others -- static/dashboard)"
          if ! git diff --exit-code -- static/dashboard || [ -n "$untracked" ]; then
            echo "::error::static/dashboard is not what dashboard/ builds."
            echo "What a rebuild changed or wrote that the commit does not carry:"
            git status --porcelain --untracked-files=all --ignored=matching \
              -- static/dashboard | grep -v '^. ' || true
            echo "Run:"
            echo "  make dashboard && git add -A -- static/dashboard"
            exit 1
          fi

  # THE TEST SUITE RUNS AS SHARDS: each half of the partition (below) is cut
  # into N pieces that run on N runners at once. One runner per half was the
  # floor of the whole workflow — the parallel half held a four-vCPU runner
  # 90-99% busy for fifteen minutes, and the solo half ran internal/e2e and
  # five minutes of everything else one after another.
  #
  # THIS JOB DECIDES ONCE what every shard is cut by, and that is its whole
  # reason to exist. internal/solo/partition deals packages to shards by their
  # measured durations, and each shard computes its own slice — so two shards
  # reading two DIFFERENT measurements could each leave out a package the other
  # thought it had. A prefix restore answers with the newest entry, and a main
  # run can save a newer one between two shards' restores; restored ONCE here
  # and handed to every shard as an artifact, they all read one file.
  #
  # The measurement is the `tests` job's, saved from the last run on main. When
  # there is none (the first run, or the entry was evicted after a week unread)
  # the file is empty, every package weighs the same and the shards split by
  # count: slower, and exactly as complete.
  plan:
    name: plan the test shards
    runs-on: ubuntu-latest
    outputs:
      parallel: ${{ steps.shards.outputs.parallel }}
      solo: ${{ steps.shards.outputs.solo }}
    steps:
      - name: restore the newest measured package durations
        uses: actions/cache/restore@v6
        with:
          path: test-weights.tsv
          key: test-weights-${{ github.sha }}
          restore-keys: test-weights-
      # ONE NUMBER PER HALF, and every shard name is derived from it, so the
      # matrix and the `I/N` each shard is handed cannot disagree.
      #
      # TWO EACH, and both are measured rather than chosen. The solo half is
      # internal/e2e (427s on main, 562s on a pull request) against 300s for
      # the other six together, so e2e is the floor at two and a third runner
      # would idle. The parallel half dealt two ways by CI's own measured
      # durations simulates at 472s and 423s, the first of them
      # internal/search alone — so a third shard would buy little until search
      # itself is shorter. Each shard is a whole runner, which is what this
      # costs.
      - name: cut each half into shards
        id: shards
        run: |
          touch test-weights.tsv
          echo "measured durations: $(wc -l < test-weights.tsv) package(s)"
          shards() { jq -cn --argjson n "$1" '[range(1; $n + 1) | "\(.)/\($n)"]'; }
          parallel="$(shards 2)"
          solo="$(shards 2)"
          echo "parallel=$parallel" >> "$GITHUB_OUTPUT"
          echo "solo=$solo" >> "$GITHUB_OUTPUT"
      # overwrite: a re-run of the whole workflow runs this again in the same
      # run, where the name is taken. Retained as long as the repository keeps
      # artifacts, because a re-run of one failed shard — which GitHub allows
      # for thirty days — reads THIS file, and must cut its shard as before.
      - uses: actions/upload-artifact@v7
        with:
          name: test-weights
          path: test-weights.tsv
          if-no-files-found: error
          overwrite: true

  test:
    name: test (race) ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, for the reason `cross` gives below.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.parallel) }}
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      - *go-caches
      - *gomod-restore
      - *gobuild-restore
      - &test-weights
        name: fetch the measured durations the plan cut the shards by
        uses: actions/download-artifact@v8
        with:
          name: test-weights
          path: ${{ runner.temp }}
      # THE MAKEFILE IS THE COMMAND, rather than a copy of it. Every other job
      # here inlines its own, and CLAUDE.md's rule that "the Makefile is the
      # same command CI runs, or it is a lie" was therefore held by hand —
      # by nothing, since internal/version/makefile_test.go was dropped. The
      # test jobs call `make` so that for them it is true by construction:
      # SHARD, TEST_WEIGHTS and TEST_REPORT are the Makefile's own knobs, and
      # their defaults are what `make test` runs on a laptop.
      #
      # The race detector is not optional: the engine's concurrency model is
      # real parallelism, so every "atomic because single-threaded" assumption
      # is a data race until the detector says otherwise. -count=1, -race and
      # -timeout 30m all live in the Makefile now; 30m is a HANG DETECTOR
      # rather than a budget, because go's own default is 10 minutes PER
      # PACKAGE.
      #
      # THE PACKAGES THAT RUN ALONE ARE EXCLUDED, and run in the `end-to-end
      # gates` shards below. Not a coverage cut — CI runs both and `make check`
      # depends on both targets — a CONTENTION cut, and which packages those
      # are is COMPUTED from a marker import rather than named here: `go doc
      # ./internal/solo` carries the measurement and the reason, and
      # internal/solo's roster guard fails the build when a package that
      # stands up a multi-member broker has not declared itself.
      #
      # This step was a `go list ./... | grep -v '/internal/e2e…'` filter, and
      # it named ONE package while THREE others stood up multi-member clusters
      # inside this job.
      #
      # Weights and reports live in the runner's temp directory, never in the
      # checkout, which the suite's own gates read as this repository's tree.
      - name: one shard of the suite, minus the packages that run alone
        env:
          SHARD: ${{ matrix.shard }}
        run: make test SHARD="$SHARD" TEST_WEIGHTS="$RUNNER_TEMP/test-weights.tsv" TEST_REPORT="$RUNNER_TEMP/report"
      # What this shard ran, for the `tests` job to hold against the half.
      # Uploaded after a failure too, so a red shard's report says how far it
      # got; overwrite, because a re-run of a failed shard uploads it again.
      - &test-report
        name: keep what this shard ran
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/report
          if-no-files-found: error
          overwrite: true
      - *gobuild-prune
      - *gobuild-save

  gates:
    name: end-to-end gates ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.solo) }}
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      - *go-caches
      - *gomod-restore
      - *gobuild-restore
      - *test-weights
      # THE PACKAGES THAT RUN ALONE — `make test-solo`, which is every package
      # importing internal/solo, run at -p 1 so their brokers do not contend
      # with each other either. Which packages those are is computed, never
      # written here: `go doc ./internal/solo`. A shard is a runner of its
      # own, so sharding takes contention away rather than adding it.
      #
      # internal/e2e is why this job installs node: it runs a real engine, a
      # real broker and the real API, then replays the frames its socket
      # produced through the dashboard's OWN protocol module — the built
      # static/dashboard/protocol.js, which is committed, so nothing has to be
      # built here. Both halves of the wire protocol are checked against each
      # other here and nowhere else, so a missing node fails rather than skips.
      #
      # `latest` for the reason the `dashboard` job above states at length: no
      # node version is pinned anywhere in the tree, because Dependabot moves
      # neither a workflow `with:` nor an `engines` field, so a pin would go
      # quietly out of date rather than stay put. No npm and no install here —
      # this only needs a node. (It does NOT have to match the dashboard job:
      # what runs here is the COMMITTED bundle, not that job's fresh output.)
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - name: one shard of the packages that run alone
        env:
          SHARD: ${{ matrix.shard }}
        run: make test-solo SHARD="$SHARD" TEST_WEIGHTS="$RUNNER_TEMP/test-weights.tsv" TEST_REPORT="$RUNNER_TEMP/report"
      - *test-report
      - *gobuild-prune
      - *gobuild-save

  # THE ONE CHECK THAT SAYS THE SUITE PASSED, and the one `main`'s protection
  # rule must require in place of the shards: their names carry the shard
  # count, and a required check that names a shard stops being reported the
  # day N changes — which blocks every pull request, or, if it was never
  # added, lets them merge with no test result at all. CONTRIBUTING.md, "A
  # bump merges itself", says what the rule must name.
  #
  # `always()`, because a required check that is SKIPPED counts as passing: if
  # this job were skipped whenever a shard failed or the run was cancelled, the
  # merge button would treat a red suite as a green one.
  #
  # It certifies two things the shards cannot certify about themselves:
  #   - each shard passed, read from the jobs' results through the environment
  #     rather than pasted into the script;
  #   - the shards of each half covered it EXACTLY ONCE. internal/solo/partition
  #     asserts that before it prints a shard, from the list it computed; this
  #     holds what each shard actually RAN (skipgate's ran.txt) against the
  #     half every shard says it was cut from (half.txt), after checking all
  #     the shards were cut from the same one. A package no shard ran, or one
  #     that ran twice, fails here whatever went wrong upstream.
  #
  # And on main it keeps what this run measured as the next run's weights:
  # only from a run where every shard passed, since a failed package's time
  # stops wherever the failure stopped it.
  tests:
    name: tests
    needs: [plan, test, gates]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every shard of both halves passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null; then
            echo "::error::the test shards, or the plan they were cut by, did not all succeed (above)."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
      - name: every package of each half ran in exactly one shard
        run: |
          for half in parallel solo; do
            lists=(reports/*/"$half"/half.txt)
            if [ ! -e "${lists[0]}" ]; then
              echo "::error::no shard of the $half half left a report."
              exit 1
            fi
            for list in "${lists[@]}"; do
              if ! cmp -s "${lists[0]}" "$list"; then
                echo "::error::the $half shards were not cut from one list: ${lists[0]} and $list differ."
                diff "${lists[0]}" "$list" || true
                exit 1
              fi
            done
            sort "${lists[0]}" > "$RUNNER_TEMP/$half.half"
            sort reports/*/"$half"/ran.txt > "$RUNNER_TEMP/$half.ran"
            twice="$(uniq -d "$RUNNER_TEMP/$half.ran")"
            if [ -n "$twice" ]; then
              echo "::error::these ran in more than one $half shard:"
              echo "$twice"
              exit 1
            fi
            if ! diff "$RUNNER_TEMP/$half.half" "$RUNNER_TEMP/$half.ran"; then
              echo "::error::the $half shards did not run exactly the $half half: '<' is in the half and ran in no shard, '>' ran in a shard and is not in the half."
              exit 1
            fi
            echo "$half: $(wc -l < "$RUNNER_TEMP/$half.ran") package(s), each in exactly one of ${#lists[@]} shard(s)"
          done
      - name: the package durations this run measured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sort reports/*/*/timings.tsv > test-weights.tsv
      - name: keep them for the next run's plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: test-weights.tsv
          key: test-weights-${{ github.sha }}

  # THERE IS NO SEPARATE "stores" JOB ANY MORE. One existed, running the store
  # contract suites twice over CREWLET_STORE_DRIVER=turso|sqlite, because
  # mainline SQLite was a certified fallback driver and the matrix was what
  # kept every statement inside the two dialects' intersection. There is one
  # driver now, the variable is gone, and the suites run in
  # the `test` job with everything else — under -race, which the old job also
  # gave them and which the general job gives them too.
  #
  # What the second driver actually caught is not lost: internal/store's
  # capability_test.go re-measures Turso's vector and full-text surface at
  # every run and fails when it MOVES in either direction, and
  # TestTursoIsTheOnlyDriverInTheBinary fails if modernc.org/sqlite is ever
  # linked back in.

  cross:
    name: cross-compile the release targets
    runs-on: ubuntu-latest
    # The release matrix is not exercised by any other job: `go build ./...`
    # above compiles for the runner and nothing else, so a change that only
    # breaks darwin — a build tag, a syscall, a platform-gated file — reaches
    # the tag before anyone sees it, and a broken tag is a release that has to
    # be re-cut. goreleaser is the thing that would catch it and it runs only
    # on a `v*` push.
    #
    # The pairs mirror .goreleaser.yaml and the Makefile's CROSS_TARGETS,
    # and nothing asserts that they still do -- change all three together.
    # Compiling is the whole test: these binaries are not run,
    # because a darwin binary cannot be, and what breaks a cross-target is
    # almost always a build constraint rather than behaviour.
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      - *go-caches
      - *gomod-restore
      - *gobuild-restore
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      # THE LINUX ARTIFACT MUST STAY DYNAMIC, which is the opposite of what
      # a Go project usually wants and is the whole point of this step.
      #
      # The store's database engine is loaded with dlopen, and dlopen does
      # not work in a statically linked program: glibc's own linker warns
      # that it "requires at runtime the shared libraries from the glibc
      # version used for linking", and measured here it is worse than that —
      # a `CGO_ENABLED=1 -linkmode external -extldflags -static` build
      # SIGSEGVs inside the first call into the library, on the machine that
      # built it. So a static binary is not a portability win to celebrate,
      # it is an artifact that crashes at its first query.
      #
      # Nothing else in the tree would notice it happening. This step is what
      # turns "somebody added -extldflags -static because a static Go binary
      # is obviously better" into a red build instead of a release.
      - name: assert the linux artifact's linkage
        if: matrix.goos == 'linux'
        run: |
          go build -o /tmp/crewlet ./cmd/crewlet
          file /tmp/crewlet
          readelf -d /tmp/crewlet | grep NEEDED || true
          if ! readelf -l /tmp/crewlet | grep -q INTERP; then
            echo "::error::the linux binary is statically linked."
            echo "That is NOT an improvement: the store's database engine is"
            echo "loaded with dlopen, which a static binary cannot do — this"
            echo "artifact will segfault at its first query. Whatever added"
            echo "-static (or an external link mode) has to come back out."
            echo "This was measured; the linked-static build segfaults."
            exit 1
          fi
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
      - *gobuild-prune
      - *gobuild-save

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      - *go-caches
      - *gomod-restore
      - *gobuild-restore
      # `latest` is deliberate, and it is one of the four floating versions
      # in this repository: the other three are the `node-version: latest` in
      # the `dashboard` and `end-to-end gates` jobs above and in
      # dependabot-dashboard.yml's `build` job, each held that way for its own
      # reason stated at its own line.
      #
      # Here the reason is that Dependabot bumps the ACTION ref
      # (`golangci-lint-action@v9`) and never a `with:` input, so a pinned
      # linter would be a version nothing watches — the exact shape the
      # pinning rule exists to avoid — and it would hold new checks out of
      # CI until somebody remembered. The cost is that a lint
      # result is not reproducible across time: the linter must also be built
      # with a Go at least as new as go.mod's `go` line, or it refuses the
      # module outright, so an older local build reports nothing rather than
      # disagreeing. Run the gate through `make lint` and match CI by taking
      # the newest release.
      #
      # The action keeps its own analysis cache (~/.cache/golangci-lint); the
      # build cache above is the go command's, which loading the packages
      # fills.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # No working-directory: the module is the repository.
      - *gobuild-prune
      - *gobuild-save
  # THERE IS NO SEPARATE "integration" JOB, and that is a correction rather
  # than an omission. One existed, running `go test ./... -tags=integration`
  # with CREWLET_INTEGRATION=1 — and NOTHING reads either: no file carries
  # that build tag and no code reads that variable. It was the `test` job
  # again, at the cost of a second full race-detector run on every pull
  # request, reported under a name that implied coverage it did not have.
  #
  # NO JOB HERE STARTS A BROKER, either, and that is worth stating because it
  # used to. Every queue backend now certifies itself in-process: the
  # JetStream conformance and fleet suites start an embedded NATS server per
  # test, and the store's suites run under `test` now that there is one driver
  # to run them on. So `test` is the whole queue gate, with nothing to
  # configure and no environment variable whose absence silently skips a
  # backend.
