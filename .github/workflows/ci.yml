name: ci

# CI for the engine. The Go tree IS the repository, so this runs on
# everything rather than on a path filter: a path list on a repository-wide
# workflow is a way to skip the build for exactly the change nobody thought
# of.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The module pins its own toolchain in go.mod; auto lets the setup-go
  # toolchain fetch it rather than failing on a mismatch.
  GOTOOLCHAIN: auto

jobs:
  build:
    name: build + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

  test:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Ensure node is present
        # Gate G5 runs the dashboard's ~350 JavaScript assertions against the
        # tree this binary embeds, under plain `node` — no package.json, no
        # node_modules, no runner. That is the dashboard's ONLY coverage, and
        # without node the gate skips and the build stays green, so this step
        # fails rather than warning.
        #
        # The version is recorded rather than pinned: the suites use ES
        # modules and `node:assert` and nothing else, so a major bump is not
        # a risk worth a setup action; what IS worth having is the number in
        # the log, so "it broke on the new image" is a diff rather than a
        # theory. TestTheGoWorkflowDeclaresItsNodeDependency asserts this step
        # is still here.
        run: |
          command -v node || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nodejs
          }
          echo "node $(node --version)"
      # The race detector is not optional here: the engine's whole
      # concurrency model changed from one cooperative event loop to real
      # parallelism, so every "atomic because asyncio" assumption the
      # Python code made is a potential data race in the port.
      - run: go test ./... -race -count=1

  gates:
    name: end-to-end gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # internal/e2e runs a real engine, a real broker and the real API, then
      # replays the frames its socket produced through the dashboard's own
      # store.js. Both halves of the wire protocol are checked against each
      # other here and nowhere else, so a missing node fails rather than skips.
      - name: Ensure node is present
        run: |
          command -v node || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nodejs
          }
          echo "node $(node --version)"
      - run: go test ./internal/e2e/... -race -count=1 -v

  stores:
    name: stores (dual driver)
    runs-on: ubuntu-latest
    # Turso is the chosen embedded database and mainline SQLite is the
    # certified fallback driver (D4). Running the store contract suites
    # against BOTH is what keeps the escape hatch real rather than
    # theoretical, and what stops Turso-only SQL reaching the schema —
    # Turso is currently the NARROWER dialect (see decisions/002).
    strategy:
      fail-fast: false
      matrix:
        driver: [turso, sqlite]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./internal/store/... -race -count=1
        env:
          CREWLET_STORE_DRIVER: ${{ matrix.driver }}

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # No working-directory: the module is the repository.

  # THERE IS NO SEPARATE "integration" JOB, and that is a correction rather
  # than an omission. One existed, running `go test ./... -tags=integration`
  # with CREWLET_INTEGRATION=1 — and NOTHING reads either: no file carries
  # that build tag and no code reads that variable. It was the `test` job
  # again, at the cost of a second full race-detector run on every pull
  # request, reported under a name that implied coverage it did not have.
  #
  # The suites that genuinely need a service each have their own job and
  # their own gate: `stores` over both certified drivers, and `pulsar`
  # against a real broker. Embedded NATS runs in-process, so the JetStream
  # conformance and fleet suites need no container at all.

  pulsar:
    name: pulsar conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Started here rather than in a `services:` block, which cannot do it:
      # the apachepulsar/pulsar image has no entrypoint that starts a broker
      # (its CMD is a shell), and `services:` accepts `options` but no
      # command, so there is nowhere to say `bin/pulsar standalone`.
      #
      # The suite needs an ADMIN endpoint as well as the broker port:
      # subscription lifecycle runs over admin REST, because creating a
      # subscription by subscribing joins a Shared subscription a peer owns
      # and steals its traffic (measured). A deployment without 8080 reachable
      # is a deployment where seat mailboxes cannot be created at all.
      #
      # The broker is configured the way a Crewlet deployment MUST be, not the
      # way it ships. Two reapers are on by default and both destroy the
      # invariant seat ownership rests on — a subscription that outlives its
      # consumer (docs/guides/fleet.md, docs/concepts/seat-ownership.md):
      # brokerDeleteInactiveTopicsEnabled removes an idle topic outright, and
      # subscriptionExpirationTimeMinutes deletes a subscription whose last
      # consumer left. Certifying against a broker whose reapers would eat an
      # unowned seat's mailbox in production is certifying the wrong broker.
      #
      # forceDeleteNamespaceAllowed is for the suite alone: each queue gets its
      # own namespace (parallel subtests share subject names), and without it
      # the cleanup cannot remove one that still holds topics.
      #
      # The settings are APPENDED to standalone.conf rather than passed as
      # PULSAR_PREFIX_* env vars: the latter needs the image's
      # apply-config-from-env.py, and a config mechanism this job cannot
      # verify is a config mechanism that silently does nothing. Pulsar loads
      # the file with java.util.Properties, where the last occurrence of a key
      # wins, so appending overrides whatever the image ships.
      #
      # The leading `echo` is load-bearing: the shipped standalone.conf ends
      # WITHOUT a trailing newline, so appending directly glues the first key
      # onto compactionServiceFactoryClassName — corrupting that setting and
      # losing this one, with the broker starting perfectly happily either way.
      - name: start pulsar
        run: |
          docker run -d --name pulsar \
            -p 6650:6650 -p 8080:8080 \
            apachepulsar/pulsar:4.0.6 \
            sh -c "{ echo; printf '%s\n' \
                       brokerDeleteInactiveTopicsEnabled=false \
                       subscriptionExpirationTimeMinutes=0 \
                       forceDeleteNamespaceAllowed=true; } >> conf/standalone.conf &&
                   exec bin/pulsar standalone --no-functions-worker --no-stream-storage"

      - name: wait for pulsar
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/admin/v2/clusters >/dev/null; then
              echo "broker ready after ~$((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::pulsar did not become ready"; docker logs pulsar | tail -80; exit 1

      # The conformance suite SKIPS without this variable, and skipping is not
      # passing — this job is the only place the Pulsar backend is actually
      # certified. The timeout is generous because every subtest provisions
      # its own namespace on a cold standalone broker.
      - name: conformance
        run: go test ./internal/queue/pulsar/... -race -count=1 -timeout 25m
        env:
          CREWLET_TEST_PULSAR_URL: pulsar://localhost:6650
          CREWLET_TEST_PULSAR_ADMIN_URL: http://localhost:8080

      - name: broker logs
        if: failure()
        run: docker logs pulsar | tail -200
