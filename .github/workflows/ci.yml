name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # Deliberately NOT matrixed over interpreters. Ruff is a self-contained
    # binary that reads the Python it targets from `tool.ruff.target-version`
    # in pyproject.toml, not from the interpreter running it, so a second job
    # would re-run the same analysis and reach the same answer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every interpreter the package advertises a classifier for. Adding one
        # here and to the classifiers in pyproject.toml is the same change.
        python-version: ["3.12", "3.13"]
    services:
      # The storage contract suites are parameterised over three backends: the
      # memory twin, a SQL fake, and a REAL PostgreSQL — and the third one only
      # appears when CREWLET_TEST_DSN is set. Without this service every one of
      # those cases skipped here, silently, which is exactly the failure mode
      # CONTRIBUTING warns about ("a skip is not a pass"): the fake can confirm
      # that SQL means what its author thought, but only a server rejects a
      # statement it cannot parse. Leases, the config plane, the completion
      # ledger, budgets, webhook dedupe, rate limits and A2A channels are all
      # SQL, and all of them coordinate a fleet.
      #
      # Same image as the bundled docker-compose.yml, which is where its
      # version is pinned and where Dependabot proposes the pg major — service
      # images in a workflow are not a surface Dependabot watches, so tracking
      # compose keeps one source of truth rather than adding an unwatched one.
      postgres:
        image: timescale/timescaledb:latest-pg18
        env:
          POSTGRES_USER: crewlet
          POSTGRES_PASSWORD: crewlet
          POSTGRES_DB: crewlet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crewlet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CREWLET_TEST_DSN: postgresql://crewlet:crewlet@localhost:5432/crewlet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,all]"
      - name: Apply database migrations
        # The pgvector columns bake their width into the DDL and the sequence
        # is forward-only, so the migrator refuses to guess one: without a
        # width it stops before them and everything after stays pending. Any
        # width works for the suite — the tests exercise the SQL, not the
        # embeddings — so this names the model default from config.py.
        run: |
          python - <<'PY'
          import asyncio
          import os

          from crewlet.db.client import Database
          from crewlet.db.migrator import migrate


          async def main() -> None:
              db = await Database.connect(os.environ["CREWLET_TEST_DSN"])
              try:
                  applied = await migrate(
                      db, template_vars={"embedding_dimensions": "1536"}
                  )
              finally:
                  await db.close()
              print(f"applied {len(applied)} migrations")


          asyncio.run(main())
          PY
      - name: Run tests
        # Pulsar is deliberately NOT here. The broker-behaviour suite and the
        # real-broker half of tests/test_fleet still skip in CI: a standalone
        # broker is a minute of startup and a service container cannot supply
        # the command it needs, so those stay a `docker compose up -d` run per
        # CONTRIBUTING. The memory twin models the broker and the same suite
        # runs against both, which is what keeps that gap bounded.
        run: python -m pytest

  package:
    # The same build the release workflow runs, on every pull request. Packaging
    # breaks are otherwise invisible until the tag that publishes them, and a
    # bad upload to PyPI cannot be replaced — only yanked.
    #
    # Built once, on one interpreter, and handed to `package-install` as an
    # artifact. The wheel is `py3-none-any`, so rebuilding it per interpreter
    # would produce the same bytes — and would mean each install check verified
    # a *different* build instead of the one artifact a release would ship.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        # Builds the wheel from the sdist, so anything missing from the sdist
        # fails here rather than shipping a wheel nobody can rebuild.
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: ci-distributions
          path: dist/
          if-no-files-found: error

  package-install:
    # Install the built wheel on every interpreter the package claims to
    # support. The `test` job covers an editable install of `[dev,all]` from the
    # source tree; this covers what people actually get from PyPI — the wheel,
    # with core dependencies only — resolved fresh on each interpreter.
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Kept identical to the `test` job's matrix and to the Python
        # classifiers in pyproject.toml; tests/test_packaging fails the build
        # if the three ever disagree.
        python-version: ["3.12", "3.13"]
    steps:
      # No checkout on purpose: nothing here may resolve against the source
      # tree, or `import crewlet` could pass without the wheel providing it.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: ci-distributions
          path: dist/
      - name: Install the wheel into a clean environment and smoke-test it
        # Proves the console script runs and the non-Python package data
        # (dashboard assets, SQL migrations, py.typed) shipped — the test suite
        # runs against the source tree and cannot catch either.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/crewlet --version
          /tmp/smoke/bin/python - <<'PY'
          import pathlib

          import crewlet

          root = pathlib.Path(crewlet.__file__).parent
          missing = [
              str(p)
              for p in ("static/dashboard/index.html", "py.typed")
              if not (root / p).exists()
          ]
          if not list((root / "db/migrations").glob("*.sql")):
              missing.append("db/migrations/*.sql")
          if missing:
              raise SystemExit(f"Wheel is missing package data: {missing}")
          print("Wheel package data is complete.")
          PY
