name: ci

# CI for the engine. The Go tree IS the repository, so this runs on
# everything rather than on a path filter: a path list on a repository-wide
# workflow is a way to skip the build for exactly the change nobody thought
# of.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The module pins its own toolchain in go.mod; auto lets the setup-go
  # toolchain fetch it rather than failing on a mismatch.
  GOTOOLCHAIN: auto

jobs:
  build:
    name: build + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

  test:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Ensure node is present
        # Gate G5 runs the dashboard's ~350 JavaScript assertions against the
        # tree this binary embeds, under plain `node` — no package.json, no
        # node_modules, no runner. That is the dashboard's ONLY coverage, and
        # without node the gate skips and the build stays green, so this step
        # fails rather than warning.
        #
        # The version is recorded rather than pinned: the suites use ES
        # modules and `node:assert` and nothing else, so a major bump is not
        # a risk worth a setup action; what IS worth having is the number in
        # the log, so "it broke on the new image" is a diff rather than a
        # theory. TestTheGoWorkflowDeclaresItsNodeDependency asserts this step
        # is still here.
        run: |
          command -v node || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nodejs
          }
          echo "node $(node --version)"
      # The race detector is not optional here: the engine's whole
      # concurrency model changed from one cooperative event loop to real
      # parallelism, so every "atomic because asyncio" assumption the
      # Python code made is a potential data race in the port.
      - run: go test ./... -race -count=1

  gates:
    name: end-to-end gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # internal/e2e runs a real engine, a real broker and the real API, then
      # replays the frames its socket produced through the dashboard's own
      # store.js. Both halves of the wire protocol are checked against each
      # other here and nowhere else, so a missing node fails rather than skips.
      - name: Ensure node is present
        run: |
          command -v node || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nodejs
          }
          echo "node $(node --version)"
      - run: go test ./internal/e2e/... -race -count=1 -v

  # THERE IS NO SEPARATE "stores" JOB ANY MORE. One existed, running the store
  # contract suites twice over CREWLET_STORE_DRIVER=turso|sqlite, because
  # mainline SQLite was a certified fallback driver and the matrix was what
  # kept every statement inside the two dialects' intersection. There is one
  # driver now (decisions/003), the variable is gone, and the suites run in
  # the `test` job with everything else — under -race, which the old job also
  # gave them and which the general job gives them too.
  #
  # What the second driver actually caught is not lost: internal/store's
  # capability_test.go re-measures Turso's vector and full-text surface at
  # every run and fails when it MOVES in either direction, and
  # TestTursoIsTheOnlyDriverInTheBinary fails if modernc.org/sqlite is ever
  # linked back in.

  cross:
    name: cross-compile the release targets
    runs-on: ubuntu-latest
    # The release matrix is not exercised by any other job: `go build ./...`
    # above compiles for the runner and nothing else, so a change that only
    # breaks darwin — a build tag, a syscall, a platform-gated file — reaches
    # the tag before anyone sees it, and a broken tag is a release that has to
    # be re-cut. goreleaser is the thing that would catch it and it runs only
    # on a `v*` push.
    #
    # The pairs mirror .goreleaser.yaml, and internal/version asserts that
    # they still do. Compiling is the whole test: these binaries are not run,
    # because a darwin binary cannot be, and what breaks a cross-target is
    # almost always a build constraint rather than behaviour.
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      # THE LINUX ARTIFACT MUST STAY DYNAMIC, which is the opposite of what
      # a Go project usually wants and is the whole point of this step.
      #
      # The store's database engine is loaded with dlopen, and dlopen does
      # not work in a statically linked program: glibc's own linker warns
      # that it "requires at runtime the shared libraries from the glibc
      # version used for linking", and measured here it is worse than that —
      # a `CGO_ENABLED=1 -linkmode external -extldflags -static` build
      # SIGSEGVs inside the first call into the library, on the machine that
      # built it. So a static binary is not a portability win to celebrate,
      # it is an artifact that crashes at its first query.
      #
      # Nothing else in the tree would notice it happening. This step is what
      # turns "somebody added -extldflags -static because a static Go binary
      # is obviously better" into a red build instead of a release.
      - name: assert the linux artifact's linkage
        if: matrix.goos == 'linux'
        run: |
          go build -o /tmp/crewlet ./cmd/crewlet
          file /tmp/crewlet
          readelf -d /tmp/crewlet | grep NEEDED || true
          if ! readelf -l /tmp/crewlet | grep -q INTERP; then
            echo "::error::the linux binary is statically linked."
            echo "That is NOT an improvement: the store's database engine is"
            echo "loaded with dlopen, which a static binary cannot do — this"
            echo "artifact will segfault at its first query. Whatever added"
            echo "-static (or an external link mode) has to come back out."
            echo "See decisions/901-release-tooling.md, which records the"
            echo "measurement."
            exit 1
          fi
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # `latest` is the one floating version in this repository, and it is
      # deliberate. Dependabot bumps the ACTION ref above, never a `with:`
      # input, so a pinned linter would be a version nothing watches — the
      # exact shape the pinning rule exists to avoid — and it would hold new
      # checks out of CI until somebody remembered. The cost is that a lint
      # result is not reproducible across time: the linter must also be built
      # with a Go at least as new as go.mod's `go` line, or it refuses the
      # module outright, so an older local build reports nothing rather than
      # disagreeing. Run the gate through `make lint` and match CI by taking
      # the newest release.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # No working-directory: the module is the repository.

  # THERE IS NO SEPARATE "integration" JOB, and that is a correction rather
  # than an omission. One existed, running `go test ./... -tags=integration`
  # with CREWLET_INTEGRATION=1 — and NOTHING reads either: no file carries
  # that build tag and no code reads that variable. It was the `test` job
  # again, at the cost of a second full race-detector run on every pull
  # request, reported under a name that implied coverage it did not have.
  #
  # The suite that genuinely needs a service has its own job and its own
  # gate: `pulsar`, against a real broker. Embedded NATS runs in-process, so
  # the JetStream conformance and fleet suites need no container at all, and
  # the store's suites run under `test` now that there is one driver to run
  # them on.

  pulsar:
    name: pulsar conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The broker is docker-compose.yml's `pulsar` service, and that file is
      # the ONLY place its version and its settings live. Dependabot watches
      # it (the `docker-compose` ecosystem in .github/dependabot.yml), so a
      # bump reaches this job by being merged — where a second pin here would
      # have to be noticed and moved by hand, and a conformance run against
      # whichever version nobody moved is green either way. A local
      # `make pulsar-up` and this job now certify the same build by
      # construction rather than by two pins somebody keeps equal;
      # internal/version asserts it stays one pin.
      #
      # A `services:` block still cannot do this: the apachepulsar/pulsar
      # image has no entrypoint that starts a broker (its CMD is a shell), and
      # `services:` accepts `options` but no command, so there is nowhere to
      # say `bin/pulsar standalone`. Compose can, which is what both this job
      # and `make pulsar-up` drive.
      #
      # The service is NAMED rather than the profile brought up whole: Dekaf
      # shares the `pulsar` profile and is a web UI with no bearing on what
      # the suite certifies, so naming the broker keeps a second image out of
      # the job. Naming a service also activates its profile on its own; the
      # flag is kept so the line reads the same as the one in the Makefile.
      #
      # --wait blocks on the service's own healthcheck
      # (`pulsar-admin brokers healthcheck`) instead of a readiness loop this
      # job would maintain separately. The ceiling is that healthcheck's worst
      # case — a 30s start_period plus 10 retries at 10s — with room for a cold
      # start on a shared runner, and it fails in minutes rather than hanging
      # to GitHub's six-hour ceiling.
      - name: start pulsar
        run: docker compose --profile pulsar up -d --wait --wait-timeout 300 pulsar

      # THE SETTINGS ARE PROVED, NOT TRUSTED — and that is what lets this job
      # take them from the compose file at all. The service applies them with
      # the image's apply-config-from-env.py, and a config mechanism nothing
      # verifies is a config mechanism that silently does nothing, which is
      # why this job used to append the three keys itself. Reading back the
      # file the broker booted from costs a second and settles it.
      #
      # All three are load-bearing. Two reapers are on by default and both
      # destroy the invariant seat ownership rests on — a subscription that
      # outlives its consumer (docs/guides/fleet.md,
      # docs/concepts/seat-ownership.md): brokerDeleteInactiveTopicsEnabled
      # removes an idle topic outright, and subscriptionExpirationTimeMinutes
      # deletes a subscription whose last consumer left. Certifying against a
      # broker whose reapers would eat an unowned seat's mailbox in production
      # is certifying the wrong broker. forceDeleteNamespaceAllowed is for the
      # suite alone: each queue under test gets its own namespace (parallel
      # subtests share subject names), and without it the cleanup cannot
      # remove one that still holds topics.
      #
      # The host probe is the other half. The healthcheck runs INSIDE the
      # container, so it says the broker is well without saying the published
      # ports reached the runner — and the suite drives subscription lifecycle
      # over admin REST on 8080, not just the binary protocol on 6650. A
      # deployment without 8080 reachable is one where seat mailboxes cannot
      # be created at all.
      - name: verify the broker took its settings
        run: |
          status=0
          for setting in brokerDeleteInactiveTopicsEnabled=false \
                         subscriptionExpirationTimeMinutes=0 \
                         forceDeleteNamespaceAllowed=true; do
            key=${setting%%=*}
            want=${setting#*=}
            # The LAST occurrence, not any occurrence. Pulsar reads this file
            # with java.util.Properties, where a later line wins, so "the
            # value is in there somewhere" answers a different question from
            # "this is the value the broker took" -- and the two differ in
            # exactly the case worth catching, a default left below an
            # override.
            got=$(docker compose --profile pulsar exec -T pulsar sh -c \
                    "grep -E '^[[:space:]]*$key[[:space:]]*=' conf/standalone.conf | tail -1" \
                  | tr -d '\r' | sed -e 's/^[^=]*=[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ "$got" = "$want" ]; then
              echo "  ok  $key=$got"
            else
              echo "::error::the broker took $key=${got:-<absent>}, not $want"
              status=1
            fi
          done
          curl -sf http://localhost:8080/admin/v2/clusters >/dev/null \
            || { echo "::error::admin REST is not reachable on the runner"; status=1; }
          exit $status

      # The conformance suite SKIPS without this variable, and skipping is not
      # passing — this job is the only place the Pulsar backend is actually
      # certified. The timeout is generous because every subtest provisions
      # its own namespace on a cold standalone broker.
      - name: conformance
        run: go test ./internal/queue/pulsar/... -race -count=1 -timeout 25m
        env:
          CREWLET_TEST_PULSAR_URL: pulsar://localhost:6650
          CREWLET_TEST_PULSAR_ADMIN_URL: http://localhost:8080

      - name: broker logs
        if: failure()
        run: docker compose --profile pulsar logs --tail 200 pulsar
