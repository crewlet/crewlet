name: ci

# CI for the engine. The Go tree IS the repository, so this runs on
# everything rather than on a path filter: a path list on a repository-wide
# workflow is a way to skip the build for exactly the change nobody thought
# of.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A PUSH TO A PULL REQUEST CANCELS THAT PULL REQUEST'S RUN FOR THE COMMIT IT
# REPLACED, and nothing else is ever cancelled. Nobody can merge the replaced
# commit, so its run only holds runners — ten jobs of them — that the new
# commit's run is queueing for.
#
# The group is UNIQUE PER RUN for every other event, and that is the half that
# is easy to get wrong. A group keyed on the ref would put every push to main
# into one group, and GitHub keeps one running and ONE pending run per group,
# cancelling a pending one when another queues — even with cancel-in-progress
# off — so main's runs would serialise behind each other and the middle of
# three quick merges would be cancelled outright. A main run is the record of
# a merge and the run that saves the caches and the test weights below; none
# of them may be dropped. Named after the workflow because a concurrency group
# is shared by every workflow in the repository.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# THE GO CACHES. Every Go job below runs the same six steps around its own
# work — `git recipe (macOS)` all but the module cache's, for the reason given
# at that job — written ONCE here as YAML anchors (`&name`) and repeated by
# alias (`*name`), so the jobs cannot drift apart. GitHub Actions and
# Dependabot both resolve aliases; merge keys (`<<:`) are NOT supported, which
# is why each anchor is a whole step.
#
# Why not setup-go's own cache, which this used to be: it keeps BOTH Go caches
# in ONE entry under ONE key, made of the runner, the Go version and a
# dependency file's hash (this workflow pointed it at go.sum), with nothing for
# the job, the target or the build flags. So every Go job here shared one key.
# A key is saved only by the first job to finish without finding it, and never
# again: there are no restore-keys to fall back to and no refresh, no way to
# save from main alone, and no prune. On main the first to finish was always
# one of the four cross-compile legs, CGO_ENABLED=0 and no -race, and which leg
# varied from run to run; every other job restored its ~450 MB and could use
# only the module half. `test (race)` reached its first package result
# 101-158 s in with that cache restored and 103-160 s without it, and its own
# build was never stored: refused ("Unable to reserve cache") on the run that
# created the key, skipped as a hit on every run after. Measured on main's
# runs from 35184635644 to 37918882598: the eight that created a key, and the
# ones that restored it. setup-go has declined a key prefix (its issue #358)
# and has no restore-only mode (#316, open), and its own docs ("Parallel
# builds") send this case to `cache: false` and actions/cache, which is what
# this file does.
#
# So: ONE MODULE CACHE, keyed exactly on go.sum and saved by `build + vet`
# after `go mod download` has fetched the test-only modules too; and a BUILD
# CACHE for each job whose wait it shortens, restored from the newest one main
# saved and saved again only by a push to main. A pull request never saves: an
# entry it writes is visible to no other pull request and to main not at all,
# and it would only push main's entries out of the repository's 10 GB.
#
# THE BUDGET. The repository has 10 GB of caches, and once a save takes it
# past that, GitHub evicts the least recently used entries, whatever they are.
# Every job and leg used to save its own entry on every push to main: 15 of
# them, 6.69 GB in run 42418325020. So two pushes overran the limit, and the
# pull requests after them found their jobs' entries gone and started cold
# (#753: the lint job's among them, and a cold lint then ran into its timeout).
# Measured from that run's saves, as stored (compressed), an entry is now kept
# only where it shortens the run's longest wait, or where a second job shares
# it:
#   - the race shards (4, 2.20 GB) and the end-to-end shards (2, 0.63 GB),
#     the run's longest jobs at 7-15 minutes each;
#   - `build + vet` (1.15 GB), which `golangci-lint` restores too: loading the
#     packages for the linter compiles what that job's `go build` and `go vet`
#     compile, and a cold lint took 370-610 s against 110-150 s warm;
#   - `test plan` (13 MB), which `test weights` restores for the one tool the
#     two run, and `git recipe (macOS)` (56 MB);
#   - the linter's own analysis cache (6 MB), kept by its job and saved whole.
# The cross-compile legs keep NONE: 1.78 GB between the four, for a leg that
# built in 19-24 s warm and in 110-167 s with no cache at all (run
# 42423731626, the first without), beside shards that run ten minutes.
# By those figures a push saves about 4.04 GB. With each build cache pruned to
# exactly what its job used (THE EPOCH, below), the first push under this
# budget saved 2.98 GB (run 42427469948). The entries keyed on what they hold
# rather than on the commit are saved only when that changes: the modules
# (0.27 GB), the pinned gits (0.06 GB), the pinned Chromiums (0.30 GB, both
# linux64 builds as actions/cache stores them, tar and zstd, measured from a
# development machine's cache) and npm's cache (0.04 GB). `caches`, at the end
# of the run, then deletes every entry a newer one of its kind supersedes. So
# the repository holds one set, 3.36 GB in 15 entries after that run and 3.66
# GB in 16 with the Chromiums', and a push's saves take it to about 6.6 GB
# until that job runs, 6.9 GB on the push that moves a Chromium pin or the
# layout of its recipe.
#
# Nothing here can make a test pass that should fail. A build-cache entry is
# keyed by an action ID that hashes the inputs, the flags (-race), the
# toolchain and the IDs of everything the package depends on, so a stale entry
# can only miss; and the test targets pass -count=1, so every test binary runs.

jobs:
  build:
    name: build + vet
    # ONE FIXED LTS IMAGE for every Linux job here (`*linux`), never
    # `ubuntu-latest`: GitHub moves that label to a new Ubuntu release under
    # every job at once, and CI's environment would change with no commit.
    runs-on: &linux ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # go.mod's own toolchain, installed exactly, and no GOTOOLCHAIN of this
      # file's: setup-go exports GOTOOLCHAIN=local to every later step, so a
      # workflow-level `auto` was overridden and never reached a Go command.
      - &setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The caches are the steps below; see THE GO CACHES above.
          cache: false
      # THE EPOCH is the moment this job began, and it is what makes the
      # prune at the end of the job exact. The go command re-stamps an entry's
      # mtime when it USES it, but only once the stamp is an hour old
      # (cmd/go/internal/cache: mtimeInterval). So an entry restored from a
      # save less than an hour old would look used whether it was or not, and
      # main saves more often than that: the prune used to keep a restored
      # entry whenever the run that saved it ended within the hour. Now every
      # restored entry is first dated two hours back (`gobuild-age`, after the
      # restore). After the job, an entry this job created or used is newer
      # than the epoch, and one it only restored is older, however often main
      # saves.
      #
      # Written for BOTH dates, because `git recipe (macOS)` runs it too: BSD
      # date takes `-v-2H` and GNU date `-d '-2 hours'`, each refusing the
      # other's, and the stamps are set with POSIX `touch -t`, since BSD touch
      # refuses GNU touch's `-d`. Both run in UTC, because `touch -t` reads its
      # argument in the zone TZ names.
      - &go-caches
        name: locate the Go caches, and mark when this job began using them
        run: |
          touch "$RUNNER_TEMP/gocache-epoch"
          aged="$(TZ=UTC0 date -v-2H +%Y%m%d%H%M.%S 2>/dev/null || TZ=UTC0 date -d '-2 hours' +%Y%m%d%H%M.%S)"
          echo "GOCACHE_AGED=$aged" >> "$GITHUB_ENV"
          gocache="$(go env GOCACHE)"
          gomodcache="$(go env GOMODCACHE)"
          echo "GOCACHE=$gocache" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$gomodcache" >> "$GITHUB_ENV"
      # Exact, with no restore-keys: a near-miss would restore a superset of
      # modules that only grows, and a miss costs one download from the proxy.
      - &gomod-restore
        name: restore the module cache
        id: gomod
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GOMODCACHE }}
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      # The job's id and its matrix leg name the cache, so every job and every
      # leg keeps its own: a -race build, a cgo-free darwin/arm64 build and
      # the linter's export data share almost nothing. The newest entry main
      # saved for this leg is what a miss on this commit's key restores, and
      # a leg main has never saved (a new shard) takes its job's newest.
      - &gobuild-restore
        name: restore this job's build cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GOCACHE }}
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-
            gobuild-${{ runner.os }}-${{ github.job }}-
      # What the restore brought, dated before the job: see THE EPOCH above.
      # Only a run that prunes and saves needs the dates, so only a push to
      # main sets them, and a miss leaves no directory to date.
      - &gobuild-age
        name: date the restored build cache before this job
        if: ${{ env.GOCACHE != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          [ -d "$GOCACHE" ] || exit 0
          TZ=UTC0 find "$GOCACHE" -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) \
            -exec touch -h -t "$GOCACHE_AGED" {} +
      # Every module the build AND the tests need, so the cache saved below is
      # whole: without this a test-only module (jsonschema) was fetched again
      # by every test job of every run.
      - run: go mod download
      - name: save the module cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gomod.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GOMODCACHE }}
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - run: go build ./...
      # THE ONLY VET THE TEST PACKAGES GET. Both test targets run `go test
      # -vet=off` (the Makefile's GOTESTRUN says why): `go vet ./...` runs every
      # analyzer `go test` would, and more, over the same packages and their
      # _test.go files. Drop this step and nothing in CI vets at all.
      - run: go vet ./...
      # This tree's Go files by internal/sourcetree's rule, never `.`, which
      # gofmt walks into every nested checkout — the Makefile's GOFILES says
      # why. Listed first so a listing that failed stops the step (bash -e)
      # instead of handing gofmt no paths, which it reads as stdin and passes.
      - name: gofmt
        run: |
          files="$(go run ./internal/sourcetree/gofiles)"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      # `go mod tidy` has to be a no-op on a pull request, and only half of
      # that is covered without this step. An UNDER-tidy module already fails
      # loudly everywhere: a missing requirement or go.sum entry stops
      # `go build ./...` in this job and in every other one. The opposite
      # direction is caught by NOTHING -- a `require` left behind when its
      # last import was deleted, a stale go.sum line, a wrong `// indirect`
      # marker: each of those builds green, tests green and cross-compiles
      # green, then lands as unrelated churn in whichever pull request next
      # happens to run tidy, on top of whatever that one was actually for.
      #
      # -diff rather than `go mod tidy` followed by `git diff`: it prints the
      # patch and exits non-zero WITHOUT writing the files. So this reports
      # the drift instead of quietly repairing it, and no later step in this
      # job can be handed a go.mod the commit does not contain.
      - name: go mod tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error::go.mod / go.sum are not tidy. The diff above is what 'go mod tidy' would write -- run: make tidy"
            exit 1
          fi
      # The own suite of the git recipe (scripts/git.sh) and of the weekly pin
      # check (scripts/git-pin-check.sh, .github/workflows/pins.yml) — `make
      # git-test`. Both are shell no Go test reaches, and each fails silently:
      # the check that calls every pin current because it read nothing is the
      # one the weekly workflow would run with nobody the wiser. It runs the
      # real scripts against local stand-ins, so it builds no git and reads no
      # network, and needs only what the runner image carries (make, tar, xz,
      # curl, GnuPG). Here rather than in a job of its own: it takes seconds,
      # and a job of its own would spend longer starting.
      - name: the git recipe's and the pin check's own suite
        run: scripts/git-pin_test.sh
      # The own suite of the Chromium recipe (scripts/chromium.sh) and of its
      # weekly pin check (scripts/chromium-pin-check.sh) — `make
      # chromium-test` — for the git suite's reasons, against a stand-in Chrome
      # for Testing tree and release listing under file://, so it fetches no
      # Chromium and reads no network. It needs curl, zip, unzip and sha256sum,
      # all on the runner image, and takes about ten seconds.
      - name: the Chromium recipe's and the pin check's own suite
        run: scripts/chromium-pin_test.sh
      # Only what this job created or used, by the epoch above. Without the
      # prune, every save would carry forward everything the restored cache
      # held, and the go command only trims entries five days unused — so each
      # job's cache would grow to five days of every commit's builds, several
      # times over the repository's 10 GB.
      #
      # Whole ENTRIES (`<id>-a`, `<id>-d`) at depth two, removed recursively —
      # the shape of the go command's own trim. Not every old FILE: a cached
      # EXECUTABLE (what `go run` keeps since Go 1.24) is a `-d` DIRECTORY,
      # and using it re-stamps the directory and not the binary inside, so a
      # file-by-file prune would empty an entry this job had just used.
      # Saved only from a job that SUCCEEDED, because only a job that ran to
      # its end is known to have compiled its whole working set. One that
      # failed early — a module download refused, a partition that listed
      # nothing — used nothing, so the prune above would leave an empty
      # directory, and saved, that would become the newest entry: every
      # pull request after it would restore nothing and compile cold until
      # a later main run saved a whole one. A failed main run saves nothing
      # instead, and the last good entry stays the one restored.
      - &gobuild-prune
        name: keep only what this job used of the build cache
        if: ${{ success() && env.GOCACHE != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          find "$GOCACHE" -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) \
            ! -newer "$RUNNER_TEMP/gocache-epoch" -exec rm -rf {} +
          du -sh "$GOCACHE"
      - &gobuild-save
        name: save this job's build cache
        if: ${{ success() && env.GOCACHE != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GOCACHE }}
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ github.sha }}

  # THE DCO GATE — the one job here whose subject is git history rather than
  # the tree, and therefore the one whose failure cannot be fixed by editing a
  # file: a missing trailer is repaired by REWRITING the commit. That is the
  # whole argument for checking it here, at the moment a pull request opens,
  # instead of at review time when the rewrite costs a force-push under a
  # reviewer who has already read the diff. `make signoff-check` is the same
  # script against origin/main..HEAD, which is the cheapest moment of all.
  #
  # Nothing checked this until it existed, and 61 of the 361 non-merge commits
  # behind it carry no trailer — which is what a convention held by memory
  # alone decays into. Only a pull request's OWN commits are judged, so that
  # history stays as it is. What the script certifies, and what it
  # deliberately does NOT (the trailer is never matched against the author),
  # is written at its top.
  signoff:
    name: sign-off
    # PULL REQUESTS ONLY, and this `if:` is load-bearing rather than tidiness:
    # the step below reads `github.event.pull_request.*`, which a `push` event
    # does not populate at all, so without the guard a push to main would run
    # the script over an empty range and pass by having nothing to look at.
    #
    # It is also the WHOLE gate now. A `sign-off (main)` job used to sit beside
    # it, re-running the same script over `before..after` on each push to main,
    # because the commit the merge button WRITES does not exist when this job
    # reports: GitHub composes that message at merge time, after every check
    # has reported, and it does not always carry the branch's trailers —
    # `074e3a1` and `7d0e29e` reached main unsigned exactly that way, from
    # branches whose own commits were properly signed. That job was a DETECTOR
    # rather than a preventer, and it is gone, so nothing watches for it
    # happening again. What keeps the trailers now is the repository's squash
    # and merge commit-message settings, which live in Settings and which
    # nothing in this tree can see or assert.
    if: github.event_name == 'pull_request'
    runs-on: *linux
    steps:
      - uses: actions/checkout@v7
        with:
          # Not shallow: the default single-commit fetch has neither the base
          # commit nor the branch's own history, so there would be no range
          # to walk and this job would pass by having nothing to look at.
          fetch-depth: 0
      # The pull request's OWN base and head, not origin/main..HEAD: the
      # checkout sits on the merge ref, and a fork's origin is the fork.
      # Both values are commit SHAs GitHub computed, taken through the
      # environment rather than interpolated into the shell — a `run:` that
      # pastes `${{ }}` into its script is the shape that becomes an
      # injection the day one of those fields is not what you assumed.
      - name: every commit carries a Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-signoff.sh "$BASE_SHA" "$HEAD_SHA"
      # The gate's own suite. It is bash reading git history, so nothing in the
      # Go suite reaches it, and it regresses SILENTLY in both directions: a
      # gate that stops failing reports a certification nobody made, and one
      # that starts failing wedges every pull request. Both happened while it
      # was being written.
      - run: scripts/check-signoff_test.sh

  # The dashboard is a React + TypeScript application built by Vite, and this
  # job runs its three gates: `dashboard-lint` (prettier), `dashboard-check`
  # (the rebuild-and-diff below) and `dashboard-test` (typecheck + Vitest).
  # Its own assertions run here — the wire protocol, the router's history
  # rules, the route table against the design doc and every dashboard address
  # the rest of the tree prints, the ordering comparators, no price anywhere,
  # and the MEASURED contrast of every colour token over every surface it can
  # land on, in both themes and for protan and deutan vision. None of that is
  # checkable by looking at the stylesheet, which is why it is computed from
  # the file that actually ships.
  #
  # `dashboard-check` is the load-bearing one. static/dashboard is COMMITTED —
  # `go build ./...` and `go install …@latest` must work on a clean checkout
  # with no node, and an embed directive cannot run a bundler — so a bundle
  # that has drifted from its source compiles, embeds, serves and passes every
  # Go test while running code nobody wrote. This rebuilds it and judges the
  # tree, the same way `go mod tidy -diff` and the generated schema/ are gated.
  dashboard:
    name: dashboard
    runs-on: *linux
    steps:
      - uses: actions/checkout@v7
      # `latest` is the newest Node release, resolved by setup-node at run
      # time, and NOTHING IN THE TREE NAMES A VERSION — deliberately, because
      # nothing would ever move one if it did. Dependabot reads `dependencies`
      # and `uses:` refs; it bumps neither `engines.node` (dependabot-core
      # #11243, open) nor a workflow's `with:`. A pin here would not stay put,
      # it would just go quietly out of date, and the dashboard's toolchain
      # tracks current Node anyway.
      #
      # The cost is real and worth knowing: a new Node major lands here with
      # no commit, so this job can go red on a day nobody changed anything.
      # When that happens the fix is `lts/*` (the current LTS, which lags a
      # major behind), not a hand-maintained number. Make it in
      # dependabot-dashboard.yml's `build` job in the same commit: that job
      # rebuilds the bundle this one diffs, and is only worth anything if it
      # runs on the same node.
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      # NPM'S CACHE is restored here and saved only by a push to main, as the
      # Go caches are, rather than by setup-node's `cache: npm`: that saves on
      # any miss, a pull request's included, and a pull request's entry is
      # visible to that pull request alone (THE BUDGET, at the top). It is
      # keyed exactly on the lockfile, as setup-node keyed it, because `npm
      # ci` installs exactly what the lockfile names.
      - name: locate npm's cache
        run: echo "NPM_CACHE=$(npm config get cache)" >> "$GITHUB_ENV"
      - name: restore npm's cache
        id: npm
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.NPM_CACHE }}
          key: npm-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}
      # `npm ci` rather than `npm install`: the lockfile is the pin, and a
      # build whose dependency versions drift is a build whose committed output
      # cannot be reproduced — which is exactly what the drift gate below
      # depends on.
      - run: npm ci
        working-directory: dashboard
      - name: save npm's cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.npm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.NPM_CACHE }}
          key: npm-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}
      - run: npm run format:check
        working-directory: dashboard
      - run: npm run typecheck
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      # The layout suites measure panes in a headless browser, at the revision
      # the locked test runner names, with the system libraries it needs.
      - name: install the layout suites' headless browser
        run: npx --no playwright install --with-deps --only-shell chromium
        working-directory: dashboard
      - run: npm run test:layout
        working-directory: dashboard
      # THE SAME PREDICATE AS `make dashboard-check`, whose comment carries the
      # reasoning; change the two together. `git diff` sees only the paths
      # the commit already has, and every emitted name is content-hashed, so
      # the chunk a commit leaves out (`git commit -a` never stages a new
      # file) is a path the diff cannot see: `git ls-files --others` is the
      # half that catches it, and without `--exclude-standard` because the
      # embed is `all:dashboard`, which ships an ignored file too.
      # Both trees the build writes: the dashboard, and the artifact tree
      # (the page runtime and the artifact kit) the third target emits.
      - name: the committed bundle is what this source builds
        run: |
          npm --prefix dashboard run build
          untracked="$(git ls-files --others -- static/dashboard static/artifacts static/protocol)"
          if ! git diff --exit-code -- static/dashboard static/artifacts static/protocol || [ -n "$untracked" ]; then
            echo "::error::static/dashboard, static/artifacts or static/protocol is not what dashboard/ builds."
            echo "What a rebuild changed or wrote that the commit does not carry:"
            git status --porcelain --untracked-files=all --ignored=matching \
              -- static/dashboard static/artifacts static/protocol | grep -v '^. ' || true
            echo "Run:"
            echo "  make dashboard && git add -A -- static/dashboard static/artifacts static/protocol"
            exit 1
          fi

  # EACH HALF RUNS ON SEVERAL RUNNERS AT ONCE, its packages dealt by measured
  # duration (`go doc ./internal/solo/partition`). GitHub Actions' only fan-out
  # is `strategy.matrix`, so a half is four jobs: `test plan` deals it once,
  # the matrix legs run a shard each, an aggregate job carries the name
  # `main`'s ruleset requires, and `test weights` keeps the next run's
  # measurement. One runner per half was right while the parallel half was
  # 1,144 package-seconds (37900112073) and wrong at 8,905 (41745668479),
  # where `test (race)` took 44 minutes and set every pull request's wait.
  #
  # THE SHARD COUNTS are one line each, `RACE_SHARDS` and `SOLO_SHARDS` below,
  # and every leg, name and proof follows them. Four for the parallel half,
  # because it cannot end before its longest package, internal/gitlet/host
  # (1,735 of the 8,905 seconds), and at four that package's shard carries
  # about 490 package-seconds beside it, which the runner's three other
  # workers finish in minutes. Three would put 1,233 beside it; five or six
  # would save at most those minutes for one or two more runners, each paying
  # about a minute of setup (checkout, the Go caches, the pinned gits, node)
  # before its first test.
  #
  # Two for the solo half, whose shards run at -p 1 and so take the SUM of
  # their packages. internal/gitlet/gitletcluster alone is 738 to 861 of its 1,266
  # to 1,527 seconds (main's runs 41714027577 to 41745668479), so two shards
  # put it on one runner and the other nine on the other, and a third would
  # leave gitletcluster's shard the floor and buy nothing. Each shard is a runner
  # of its own, so no two of these packages ever share a machine: sharding
  # takes contention away rather than adding any (`go doc ./internal/solo`).
  #
  # THE PLAN DEALS ONCE, for every runner. The partition is a function of the
  # commit and the weights file, and a weights file restored by each shard
  # could differ between them: a main run that saves a new one between two
  # shards' restores would hand them different deals, losing or doubling a
  # package. So the plan restores it, proves every package of each half lands
  # in exactly one shard, and passes that one file to every shard.
  #
  # A MEASUREMENT IS KEYED ON THE CODE THAT WROTE IT AND THE CODE THAT READS
  # IT: a hash of internal/skipgate and internal/solo/partition. The reader is
  # strict, and a refusal of a file this code wrote fails the plan, as a
  # defect in the writer or the reader. When this code has no measurement yet
  # (the pull request that changes either package, and main until its first
  # passing run after the merge), the plan offers the newest one older code
  # wrote, and a file the reader refuses is dropped with a warning and the run
  # deals by package count. So a format change can never wedge CI, and a
  # change to either package still deals by real durations.
  plan:
    name: test plan
    runs-on: *linux
    env:
      RACE_SHARDS: 4
      SOLO_SHARDS: 2
    outputs:
      race: ${{ steps.legs.outputs.race }}
      solo: ${{ steps.legs.outputs.solo }}
      weights-key: ${{ steps.key.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      - *go-caches
      - *gomod-restore
      - *gobuild-restore
      - *gobuild-age
      # Named once, here, for the restore below and for `test weights`' save.
      - name: name the measurement's cache key
        id: key
        run: echo "prefix=test-weights-${{ hashFiles('internal/skipgate/**', 'internal/solo/partition/**') }}-" >> "$GITHUB_OUTPUT"
      - name: restore the package durations main last measured
        id: weights
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/test-weights.tsv
          key: ${{ steps.key.outputs.prefix }}${{ github.sha }}
          restore-keys: |
            ${{ steps.key.outputs.prefix }}
            test-weights-
      # The weights live in the runner's temp directory, never in the checkout,
      # which the suite's own gates read as this repository's tree. An empty
      # file is what a cache miss leaves: a deal by package count. `merge` of
      # one file is the strict reader alone, with no `go list` to fail instead.
      - name: hold the measurement to the partition's reader
        env:
          CURRENT: ${{ steps.key.outputs.prefix }}
          MATCHED: ${{ steps.weights.outputs.cache-matched-key }}
        run: |
          weights="$RUNNER_TEMP/test-weights.tsv"
          touch "$weights"
          echo "restored: ${MATCHED:-nothing}"
          if ! go run ./internal/solo/partition merge "$weights" > /dev/null; then
            case "$MATCHED" in
              "$CURRENT"*) echo "::error::this code refuses a measurement this code wrote"; exit 1 ;;
            esac
            echo "::warning::$MATCHED was written by other code and this reader refuses it: this run deals by package count"
            : > "$weights"
          fi
      # What the shards will run, run here first: each shard's own invocation,
      # whose union must be the whole half, each package once. A package lost
      # from every shard, or dealt to two, is a line `diff` prints. The whole
      # half's list goes to the aggregate job, which holds what ran against it.
      - name: every package in exactly one shard
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/plan"
          cp "$RUNNER_TEMP/test-weights.tsv" "$RUNNER_TEMP/plan/"
          partition() { go run ./internal/solo/partition -weights "$RUNNER_TEMP/plan/test-weights.tsv" "$@"; }
          prove() {
            local half="$1" n="$2" dir="$RUNNER_TEMP/deal-$1"
            mkdir -p "$dir"
            partition "$half" | sort > "$RUNNER_TEMP/plan/$half.txt"
            for i in $(seq 1 "$n"); do
              partition -shard "$i/$n" "$half" > "$dir/$i"
              echo "::group::the $half half, shard $i/$n: $(wc -l < "$dir/$i") packages"
              cat "$dir/$i"
              echo "::endgroup::"
            done
            seq -f "$dir/%g" 1 "$n" | xargs cat | sort | diff "$RUNNER_TEMP/plan/$half.txt" -
            echo "the $half half: $(wc -l < "$RUNNER_TEMP/plan/$half.txt") packages, each in exactly one of $n shards"
          }
          prove parallel "$RACE_SHARDS"
          prove solo "$SOLO_SHARDS"
      - name: name the matrix legs
        id: legs
        run: |
          echo "race=[$(seq -s, 1 "$RACE_SHARDS")]" >> "$GITHUB_OUTPUT"
          echo "solo=[$(seq -s, 1 "$SOLO_SHARDS")]" >> "$GITHUB_OUTPUT"
      # Kept for the thirty days a run can be re-run in, and overwritten by a
      # re-run of this job: a shard re-run alone must deal from this same file.
      - name: hand the shards the weights they deal by
        uses: actions/upload-artifact@v7
        with:
          name: test-plan
          path: ${{ runner.temp }}/plan
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - *gobuild-prune
      - *gobuild-save

  # ONE SHARD OF THE PARALLEL HALF per leg, as the plan dealt it. fail-fast is
  # off so a failure in one shard still reports every other's, as the single
  # job did.
  test:
    name: test (race) ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: plan
    runs-on: *linux
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.race) }}
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      - *go-caches
      - *gomod-restore
      - *gobuild-restore
      - *gobuild-age
      - &plan-download
        name: the weights the plan dealt by
        uses: actions/download-artifact@v8
        with:
          name: test-plan
          path: ${{ runner.temp }}/plan
      # THE PINNED GITS. `make test` runs the suite on the gits
      # scripts/git-pin.env pins, which scripts/git.sh builds into
      # CREWLET_GIT_CACHE (the Makefile's `##@ The pinned gits` says why the
      # suite never runs the runner's own git), and the make step builds
      # whatever the restore did not bring: the Makefile stays the command.
      #
      # The directory is set HERE and read by both the recipe and the cache, so
      # the path cached is the path built by construction: git.sh's own default
      # follows XDG_CACHE_HOME, and a runner image that set it would otherwise
      # build into one directory while the cache saved another, empty.
      #
      # KEYED ON THE PIN AND THE RECIPE, exactly, with no restore-keys: a build
      # is a function of both, and a near-miss restores builds this run would
      # not use (git.sh names each build by version and recipe, so it would
      # build beside them anyway). A pull request that changes either builds the
      # three gits, about four minutes, on every run until main saves them. Only
      # these shards, `end-to-end gates` and `git recipe (macOS)` run git, so
      # only they carry the steps.
      #
      # AND ON THE IMAGE'S OS RELEASE (ImageOS, such as `ubuntu24`): a build
      # links that release's libc, libcurl and zlib, so one made on a newer
      # release is not restored on an older one.
      - &git-cache-dir
        name: name the pinned gits' cache directory and OS release
        run: |
          echo "CREWLET_GIT_CACHE=$HOME/.cache/crewlet/git" >> "$GITHUB_ENV"
          echo "CREWLET_GIT_CACHE_OS=${ImageOS:?the runner image sets no ImageOS}" >> "$GITHUB_ENV"
      - &git-restore
        name: restore the pinned gits main built
        id: git
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CREWLET_GIT_CACHE }}
          key: git-${{ runner.os }}-${{ runner.arch }}-${{ env.CREWLET_GIT_CACHE_OS }}-${{ hashFiles('scripts/git-pin.env', 'scripts/git.sh') }}
      # libcurl's development files are what building git's HTTPS transport
      # needs and the runner image may not carry; the C toolchain and zlib's
      # headers it does. Only a miss builds, so only a miss installs.
      - &git-deps
        name: install what building git needs
        if: steps.git.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev zlib1g-dev
      # THE PINNED CHROMIUMS. Both test targets depend on `make chromium`,
      # which fetches the two Chrome for Testing builds
      # scripts/chromium-pin.env pins into CREWLET_CHROMIUM_CACHE (the
      # Makefile's `##@ The pinned Chromiums`), and name them (CHROMIUM_ENV).
      # Cached as the gits are, for their reasons: the directory set here is
      # the one both the recipe and the cache read, and the key is what names
      # the builds and nothing else — the pins themselves, the pin file's
      # CHROMIUM_ lines and never its comments, and the layout the recipe
      # sets on its `layout=` line, never the rest of the recipe, which
      # changes no build's bytes (scripts/chromium.sh) — both in the key's
      # last part, so `caches` reads every entry of them as one kind, and with
      # no restore-keys. Without the cache every shard of every run would
      # download about 0.4 GB from Google's bucket, putting a third party on
      # every run's path; with it, a pull request that moves a pin or the
      # layout downloads it on each shard until main saves it, and one that
      # edits a comment downloads nothing. No library is installed: GitHub's
      # Ubuntu image ships Google Chrome, so what a Chrome for Testing build
      # links is there, and a build that could not start fails the recipe's
      # own --version check, naming its deb.deps.
      - &chromium-cache-dir
        name: name the pinned Chromiums' cache directory, and read what names their builds
        id: chromium-key
        run: |
          echo "CREWLET_CHROMIUM_CACHE=$HOME/.cache/crewlet/chromium" >> "$GITHUB_ENV"
          echo "layout=$(sed -n 's/^layout=\([0-9][0-9]*\)$/\1/p' scripts/chromium.sh)" >> "$GITHUB_OUTPUT"
          echo "pins=$(grep '^CHROMIUM_' scripts/chromium-pin.env | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - &chromium-restore
        name: restore the pinned Chromiums main fetched
        id: chromium
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CREWLET_CHROMIUM_CACHE }}
          key: chromium-${{ runner.os }}-${{ runner.arch }}-l${{ steps.chromium-key.outputs.layout }}.${{ steps.chromium-key.outputs.pins }}
      # NODE, because this half runs internal/sandbox/executor's probe of
      # the OpenCode notes plugin the engine embeds, which drives the plugin
      # under plain `node` against a stand-in of the bridge's notes route — and
      # `make test` refuses to start without it (require-node). The probe
      # never skips here: `make test` requires every prerequisite of the suite
      # (internal/prereqtest's CREWLET_REQUIRE_PREREQUISITES), so a missing
      # node fails it, and the skip a bare local loop takes is declared nowhere
      # in internal/skipgate.
      # `latest`, and no npm or install, for the reasons the `gates` job below
      # gives.
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      # THE MAKEFILE IS THE COMMAND, rather than a copy of it. Every other job
      # here inlines its own, and CLAUDE.md's rule that "the Makefile is the
      # same command CI runs, or it is a lie" was therefore held by hand —
      # by nothing, since internal/version/makefile_test.go was dropped. The
      # test jobs call `make` so that for them it is true by construction:
      # TEST_SHARD, TEST_WEIGHTS and TEST_TIMINGS are the Makefile's own knobs,
      # and left unset they are what `make test` runs on a laptop.
      #
      # The race detector is not optional: the engine's concurrency model is
      # real parallelism, so every "atomic because single-threaded" assumption
      # is a data race until the detector says otherwise. -count=1, -race and
      # -timeout 30m all live in the Makefile now; 30m is a HANG DETECTOR
      # rather than a budget, because go's own default is 10 minutes PER
      # PACKAGE.
      #
      # THE PACKAGES THAT RUN ALONE ARE EXCLUDED, and run in the `end-to-end
      # gates` shards below. Not a coverage cut (CI runs both and `make check`
      # depends on both targets) but a CONTENTION cut, and which packages those
      # are is COMPUTED from a marker import rather than named here: `go doc
      # ./internal/solo` carries the measurement and the reason, and
      # internal/solo's roster guard fails the build when a package that
      # stands up a multi-member broker has not declared itself.
      #
      # This step was a `go list ./... | grep -v '/internal/e2e…'` filter, and
      # it named ONE package while THREE others stood up multi-member clusters
      # inside this job.
      - name: this shard of the suite, minus the packages that run alone
        env:
          TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: make test TEST_SHARD="$TEST_SHARD" TEST_WEIGHTS="$RUNNER_TEMP/plan/test-weights.tsv" TEST_TIMINGS="$RUNNER_TEMP/test-timings.tsv"
      # On main only, and only a miss, as every cache here; after the make step,
      # which built what the restore did not bring. The first leg of a job is
      # the one saver of its key, so no two shards race to reserve it.
      - &git-save
        name: save the pinned gits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.git.outputs.cache-hit != 'true' && strategy.job-index == 0
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CREWLET_GIT_CACHE }}
          key: git-${{ runner.os }}-${{ runner.arch }}-${{ env.CREWLET_GIT_CACHE_OS }}-${{ hashFiles('scripts/git-pin.env', 'scripts/git.sh') }}
      # The pinned Chromiums, by the same rule: main only, a miss only, the
      # first leg alone, after the make step fetched what the restore did not
      # bring. The solo shards below restore them and never save.
      - name: save the pinned Chromiums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.chromium.outputs.cache-hit != 'true' && strategy.job-index == 0
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CREWLET_CHROMIUM_CACHE }}
          key: chromium-${{ runner.os }}-${{ runner.arch }}-l${{ steps.chromium-key.outputs.layout }}.${{ steps.chromium-key.outputs.pins }}
      # What this shard ran and how long each package took: the aggregate job
      # holds it against the plan, and `test weights` merges it. Only a shard
      # that passed hands one on, as only a run that passed is kept.
      - &timings-upload
        name: hand on what this shard ran
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-${{ github.job }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-timings.tsv
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - *gobuild-prune
      - *gobuild-save

  # THE CHECK `main`'s RULESET REQUIRES, by its exact name. A matrix leg's name
  # carries its shard, so a rule naming a leg would stop matching the day the
  # count changed. `always()`, because a skipped required check counts as
  # passed and under the default a failed shard skips this job: this one runs
  # and fails on any result but success, however GitHub reports the others.
  #
  # It passes when the plan and every shard passed AND what the shards ran,
  # read from their timings, is the plan's whole half with each package once.
  # The plan proved the deal; this proves every runner ran it.
  race:
    name: test (race)
    needs: [plan, test]
    if: ${{ always() }}
    runs-on: *linux
    env:
      HALF: parallel
      LEGS: test
      PLAN_RESULT: ${{ needs.plan.result }}
      LEGS_RESULT: ${{ needs.test.result }}
    steps:
      - &legs-passed
        name: the plan and every shard passed
        run: |
          echo "test plan: $PLAN_RESULT; the $HALF half's shards: $LEGS_RESULT"
          if [ "$PLAN_RESULT" != success ] || [ "$LEGS_RESULT" != success ]; then
            echo "::error::the $HALF half did not pass: see the failed job above"
            exit 1
          fi
      - *plan-download
      - &timings-download
        name: collect what every shard ran
        uses: actions/download-artifact@v8
        with:
          pattern: test-timings-${{ env.LEGS }}-*
          path: ${{ runner.temp }}/timings
      # skipgate times every package that passed or had no test files, so on a
      # green run each shard's timings name every package it ran.
      - &legs-covered
        name: every package of the half ran in exactly one shard
        shell: bash
        run: |
          set -u
          cut -f1 "$RUNNER_TEMP"/timings/*/test-timings.tsv | sort > "$RUNNER_TEMP/ran.txt"
          twice="$(uniq -d "$RUNNER_TEMP/ran.txt")"
          if [ -n "$twice" ]; then
            echo "::error::run by two shards:"; echo "$twice"; exit 1
          fi
          diff "$RUNNER_TEMP/plan/$HALF.txt" "$RUNNER_TEMP/ran.txt"
          echo "the $HALF half: $(wc -l < "$RUNNER_TEMP/ran.txt") packages ran, each in exactly one shard"

  # THE NEXT RUN'S WEIGHTS: every shard's timings, both halves in one file (the
  # partition weighs a half by its own packages alone), merged by the
  # partition's own strict reader, which refuses a package two shards timed.
  # On every run whose shards all passed, so a pull request proves the merge
  # main relies on; saved on main only, by this one job, so no two jobs race
  # for the key. The merged file is also an artifact, `test-weights`, the one
  # copy of CI's measurement a person can download (`gh run download <run> -n
  # test-weights`).
  weights:
    name: test weights
    needs: [plan, test, gates]
    runs-on: *linux
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      - *go-caches
      # `test plan`'s build cache, not one of this job's own: the one tool this
      # job builds (`go run ./internal/solo/partition`) is one that job builds
      # too, so its entry holds what this job uses, and this job saves no build
      # cache (THE BUDGET, at the top).
      - name: restore the test plan's build cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GOCACHE }}
          key: gobuild-${{ runner.os }}-plan-0-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-plan-0-
      - name: collect every shard's package durations
        uses: actions/download-artifact@v8
        with:
          pattern: test-timings-*
          path: ${{ runner.temp }}/timings
      - name: merge them into one measurement
        run: |
          go run ./internal/solo/partition merge "$RUNNER_TEMP"/timings/*/test-timings.tsv > "$RUNNER_TEMP/test-weights.tsv"
          echo "$(wc -l < "$RUNNER_TEMP/test-weights.tsv") packages timed"
      - uses: actions/upload-artifact@v7
        with:
          name: test-weights
          path: ${{ runner.temp }}/test-weights.tsv
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: save the package durations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/test-weights.tsv
          key: ${{ needs.plan.outputs.weights-key }}${{ github.sha }}

  # ONE SHARD OF THE SOLO HALF per leg, as the plan dealt it, with fail-fast
  # off for the reason the race shards give.
  gates:
    name: end-to-end gates ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: plan
    runs-on: *linux
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.solo) }}
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      - *go-caches
      - *gomod-restore
      - *gobuild-restore
      - *gobuild-age
      - *plan-download
      # THE PACKAGES THAT RUN ALONE, `make test-solo`: every package importing
      # internal/solo, run at -p 1 so their brokers do not contend with each
      # other either. Which packages those are is computed, never written here:
      # `go doc ./internal/solo`. A shard is a runner of its own, so no two of
      # them ever share a machine.
      #
      # internal/e2e is why this job installs node: it runs a real engine, a
      # real broker and the real API, then replays the frames its socket
      # produced through the dashboard's OWN protocol module — the built
      # static/protocol/protocol.js, which is committed, so nothing has to be
      # built here. Both halves of the wire protocol are checked against each
      # other here and nowhere else, so a missing node fails rather than skips.
      #
      # `latest` for the reason the `dashboard` job above states at length: no
      # node version is pinned anywhere in the tree, because Dependabot moves
      # neither a workflow `with:` nor an `engines` field, so a pin would go
      # quietly out of date rather than stay put. No npm and no install here —
      # this only needs a node. (It does NOT have to match the dashboard job:
      # what runs here is the COMMITTED bundle, not that job's fresh output.)
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      # The pinned gits and Chromiums, as in the race shards above, whose
      # comments say why. Restored here and never saved: the first race shard
      # is their one saver.
      - *git-cache-dir
      - *git-restore
      - *git-deps
      - *chromium-cache-dir
      - *chromium-restore
      - name: this shard of the packages that run alone
        env:
          TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: make test-solo TEST_SHARD="$TEST_SHARD" TEST_WEIGHTS="$RUNNER_TEMP/plan/test-weights.tsv" TEST_TIMINGS="$RUNNER_TEMP/test-timings.tsv"
      - *timings-upload
      - *gobuild-prune
      - *gobuild-save

  # THE CHECK `main`'s RULESET REQUIRES for the solo half, by its exact name:
  # the `test (race)` aggregate's steps over this half's plan and shards, and
  # `always()` for the reason given there.
  e2e:
    name: end-to-end gates
    needs: [plan, gates]
    if: ${{ always() }}
    runs-on: *linux
    env:
      HALF: solo
      LEGS: gates
      PLAN_RESULT: ${{ needs.plan.result }}
      LEGS_RESULT: ${{ needs.gates.result }}
    steps:
      - *legs-passed
      - *plan-download
      - *timings-download
      - *legs-covered

  # THE RECIPE'S macOS BRANCH, on every pull request: scripts/git.sh builds the
  # three pinned gits there with shasum, sysctl's core count and the SDK's
  # libcurl, none of which any Linux job reaches, and `make test-gitproc` runs
  # gitproc's own suite on what it built — the floor judgement, a real pool on
  # the node pin, and the two floors' builds through gittest.NodeFloor and
  # gittest.ClientFloor, required as every make target requires them. A
  # contributor on a Mac runs this recipe (CONTRIBUTING.md, Development setup),
  # so a failure here is theirs before it is anybody's: it is fixed, never
  # skipped. Whether the job is a REQUIRED check is a repository setting.
  #
  # The pinned gits' cache steps are the race shards', whose key already
  # carries the runner's OS, its release and its architecture, and there is no
  # install step: Xcode's command line tools, on the image, supply the
  # compiler, libcurl and zlib. The BUILD cache is every Go job's, under this
  # job's own key: what it keeps is the race-instrumented standard library,
  # gitproc's test binaries and skipgate for the runner's darwin, which no
  # other job compiles. Measured from an empty cache on four Linux vCPUs:
  # 29–31 s for the test binaries and 10 s for skipgate, against 1.8 s warm,
  # in an entry of 151 MB.
  # The MODULE cache is not: `build + vet` saves it on Linux, a cache is
  # restored only on the OS that saved it, and an entry of this job's own would
  # hold three modules — uuid, x/sys and x/term, all gitproc's tests and
  # skipgate import, 13 MB — which the proxy served in 0.5–0.8 s.
  gitrecipe-macos:
    name: git recipe (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      - *go-caches
      - *gobuild-restore
      - *gobuild-age
      - *git-cache-dir
      - *git-restore
      - name: gitproc's suite on the pinned gits
        run: make test-gitproc
      - *git-save
      - *gobuild-prune
      - *gobuild-save

  # THERE IS NO SEPARATE "stores" JOB ANY MORE. One existed, running the store
  # contract suites twice over CREWLET_STORE_DRIVER=turso|sqlite, because
  # mainline SQLite was a certified fallback driver and the matrix was what
  # kept every statement inside the two dialects' intersection. There is one
  # driver now, the variable is gone, and the suites run in
  # the `test` job with everything else — under -race, which the old job also
  # gave them and which the general job gives them too.
  #
  # What the second driver actually caught is not lost: internal/store's
  # capability_test.go re-measures Turso's vector and full-text surface at
  # every run and fails when it MOVES in either direction, and
  # TestTursoIsTheOnlyDriverInTheBinary fails if modernc.org/sqlite is ever
  # linked back in.

  cross:
    name: cross-compile the release targets
    runs-on: *linux
    # The release matrix is not exercised by any other job: `go build ./...`
    # above compiles for the runner and nothing else, so a change that only
    # breaks darwin — a build tag, a syscall, a platform-gated file — reaches
    # the tag before anyone sees it, and a broken tag is a release that has to
    # be re-cut. goreleaser is the thing that would catch it and it runs only
    # on a `v*` push.
    #
    # The pairs mirror .goreleaser.yaml and the Makefile's CROSS_TARGETS,
    # and nothing asserts that they still do -- change all three together.
    # Compiling is the whole test: these binaries are not run,
    # because a darwin binary cannot be, and what breaks a cross-target is
    # almost always a build constraint rather than behaviour.
    #
    # NO BUILD CACHE, by THE BUDGET at the top: a leg built in 19-24 s from its
    # own entry and in 110-167 s with none, which no run waits on (its job ends
    # well inside the shards' seven to twelve minutes), against 1.78 GB of
    # entries between the four. The module cache it restores is `build +
    # vet`'s.
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      - *go-caches
      - *gomod-restore
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      # THE LINUX ARTIFACT MUST STAY DYNAMIC, which is the opposite of what
      # a Go project usually wants and is the whole point of this step.
      #
      # The store's database engine is loaded with dlopen, and dlopen does
      # not work in a statically linked program: glibc's own linker warns
      # that it "requires at runtime the shared libraries from the glibc
      # version used for linking", and measured here it is worse than that —
      # a `CGO_ENABLED=1 -linkmode external -extldflags -static` build
      # SIGSEGVs inside the first call into the library, on the machine that
      # built it. So a static binary is not a portability win to celebrate,
      # it is an artifact that crashes at its first query.
      #
      # Nothing else in the tree would notice it happening. This step is what
      # turns "somebody added -extldflags -static because a static Go binary
      # is obviously better" into a red build instead of a release.
      - name: assert the linux artifact's linkage
        if: matrix.goos == 'linux'
        run: |
          go build -o /tmp/crewlet ./cmd/crewlet
          file /tmp/crewlet
          readelf -d /tmp/crewlet | grep NEEDED || true
          if ! readelf -l /tmp/crewlet | grep -q INTERP; then
            echo "::error::the linux binary is statically linked."
            echo "That is NOT an improvement: the store's database engine is"
            echo "loaded with dlopen, which a static binary cannot do — this"
            echo "artifact will segfault at its first query. Whatever added"
            echo "-static (or an external link mode) has to come back out."
            echo "This was measured; the linked-static build segfaults."
            exit 1
          fi
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}

  lint:
    name: golangci-lint
    runs-on: *linux
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      - *go-caches
      - *gomod-restore
      # `build + vet`'s build cache, not one of this job's own: loading every
      # package with its export data, as golangci-lint does, compiles what that
      # job's `go build ./...` and `go vet ./...` compile. So its entry makes
      # this job warm too, and this job saves no build cache (THE BUDGET, at
      # the top).
      - name: restore build + vet's build cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GOCACHE }}
          key: gobuild-${{ runner.os }}-build-0-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-build-0-
      # THE LINTER'S ANALYSIS CACHE is kept here, not by the action. The
      # action keys its own on the runner, a 7-day interval and go.mod's hash,
      # and saves only when that key misses. So for a week the entry stays the
      # first one saved (main saved it in 2 of 16 pushes), and a pull request
      # that misses saves one that only it can read (#753). Here it is
      # restored from main's newest entry and saved only by a push to main,
      # WHOLE, without the dating and pruning a build cache gets. Pruning buys
      # nothing here, because the entry stays small whole. A lint with no
      # analysis cache took 204 s and wrote 91 MB on disk, 6 MB as stored. One
      # that restored an entry pruned to 0.6 MB took 73 s (run 42431149880), so
      # most of what a cold lint writes is never read again, and a whole entry
      # is at most those 6 MB. golangci-lint's own trim removes entries stamped
      # more than five days ago.
      - name: locate the linter's analysis cache
        run: echo "GOLANGCI_LINT_CACHE=$HOME/.cache/golangci-lint" >> "$GITHUB_ENV"
      - name: restore the linter's analysis cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.GOLANGCI_LINT_CACHE }}
          key: golangci-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-
      # `latest` is deliberate, and it is one of the five floating versions
      # in this repository: the others are the `node-version: latest` in the
      # `dashboard` and `end-to-end gates` jobs above and in
      # dependabot-dashboard.yml's `build` job, and goreleaser's `~> v2` in
      # release.yml, each held that way for its own reason stated at its own
      # line.
      #
      # Here the reason is that Dependabot bumps the ACTION ref
      # (`golangci-lint-action@v9`) and never a `with:` input, so a pinned
      # linter would be a version nothing watches — the exact shape the
      # pinning rule exists to avoid — and it would hold new checks out of
      # CI until somebody remembered. The cost is that a lint
      # result is not reproducible across time: the linter must also be built
      # with a Go whose language version (major.minor) is at least go.mod's
      # `go` line's, or it refuses the module outright, so an older local build
      # reports nothing rather than disagreeing. Run the gate through
      # `make lint` and match CI by taking the newest release.
      #
      # The analysis cache is the one restored above, not the action's
      # (`skip-cache`), and the build cache is `build + vet`'s, which loading
      # the packages reads.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true
          # No working-directory: the module is the repository.
      - name: save the linter's analysis cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.GOLANGCI_LINT_CACHE }}
          key: golangci-lint-${{ runner.os }}-${{ github.sha }}
  # THERE IS NO SEPARATE "integration" JOB, and that is a correction rather
  # than an omission. One existed, running `go test ./... -tags=integration`
  # with CREWLET_INTEGRATION=1 — and NOTHING reads either: no file carries
  # that build tag and no code reads that variable. It was the `test` job
  # again, at the cost of a second full race-detector run on every pull
  # request, reported under a name that implied coverage it did not have.
  #
  # NO JOB HERE STARTS A BROKER, either, and that is worth stating because it
  # used to. Every queue backend now certifies itself in-process: the
  # JetStream conformance and fleet suites start an embedded NATS server per
  # test, and the store's suites run under `test` now that there is one driver
  # to run them on. So `test` is the whole queue gate, with nothing to
  # configure and no environment variable whose absence silently skips a
  # backend.

  # THE OTHER HALF OF THE BUDGET (at the top): once a push to main has saved
  # its set, every entry that a newer one of its kind supersedes is deleted,
  # so the repository holds one set rather than whatever eviction leaves. An
  # entry's kind is its key without the last part, which is the commit for an
  # entry saved on every push and the hash of what it holds for the rest (the
  # modules, the pinned gits, the pinned Chromiums, npm's cache, the test
  # weights). Only main's entries of the kinds this file saves are listed,
  # newest first, and the first of each kind is kept. So no kind is ever
  # emptied, and a job that failed, and therefore saved nothing, keeps the
  # entry it saved last.
  #
  # This is the one job here that changes anything outside its own run, so
  # every line of it is security review:
  #   - `actions: write`, the scope that deleting a cache needs, is this job's
  #     alone (the workflow's is `contents: read`), and the job runs only on a
  #     push to main. On a pull request, a fork's included, it is skipped, so
  #     no token with that scope is ever minted for a pull request's code;
  #   - it checks nothing out and runs nothing of the repository's: its one
  #     step is the script below, from main's own copy of this file;
  #   - what it reads is the API's list of main's caches, it deletes by the
  #     numeric ids that list gives, and the keys are only printed.
  # `always()`, so that it also runs after jobs that failed: those saved
  # nothing, and keeping each kind's newest entry leaves theirs as it was.
  caches:
    name: keep main's newest caches
    needs: [build, dashboard, plan, test, weights, gates, gitrecipe-macos, lint]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: *linux
    permissions:
      actions: write
    steps:
      - name: delete the entries a newer one of their kind supersedes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/$REPO/actions/caches?ref=refs/heads/main&sort=created_at&direction=desc&per_page=100" \
            --jq '.actions_caches[] | [.id, .key, .size_in_bytes] | @tsv' > "$RUNNER_TEMP/caches.tsv"
          declare -A newest
          kept=0 count=0
          while IFS=$'\t' read -r id key size; do
            case "$key" in
              gobuild-*|gomod-*|git-*|chromium-*|test-weights-*|golangci-lint-*|npm-*) ;;
              *) continue ;;
            esac
            kind="${key%-*}-"
            if [ -z "${newest[$kind]:-}" ]; then
              newest[$kind]=$key
              kept=$((kept + size)) count=$((count + 1))
              echo "keep    $key ($size B)"
            elif out="$(gh api -X DELETE "repos/$REPO/actions/caches/$id" 2>&1)"; then
              echo "deleted $key ($size B), superseded by ${newest[$kind]}"
            elif grep -q 'HTTP 404' <<<"$out"; then
              echo "gone    $key: another run deleted it first"
            else
              echo "::error::deleting $key: $out"
              exit 1
            fi
          done < "$RUNNER_TEMP/caches.tsv"
          echo "main keeps $count entries, $kept B"
