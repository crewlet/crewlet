name: release

# Publishes the Crewlet binaries, archives, checksums and container image
# with goreleaser. See RELEASING.md for the runbook.
#
# A release is one command: `git tag v1.2.0 && git push origin v1.2.0`. The
# TAG is the version — it is stamped into internal/version at link time, and
# nothing in the tree records one for it to disagree with.
#
# The same pipeline runs in SNAPSHOT mode without a tag: on demand, and on
# any pull request that touches the release surface. That is what stops it
# running for the first time on the tag that publishes. Snapshot mode is
# also how the container image gets built without a registry — goreleaser's
# dockers_v2 builds and pushes in ONE step, so `--skip=publish` would skip
# the image build entirely and leave the Dockerfile untested.
#
# An image of every commit on main is built from the same .goreleaser.yaml by
# main-image.yml, a workflow of its own: docs-publish.yml reads every
# completed run of THIS workflow whose event was a push as a new v* tag, so a
# push-to-main trigger here would republish the docs site on every merge.
#
# EVERY ACTION IS PINNED BY COMMIT SHA, with its release in a trailing comment
# that Dependabot keeps in step when it bumps the pin. A version tag is a ref
# its owner can move, and the publish job runs whatever it resolves to with
# write access to the Releases, the image registry and an OIDC identity that
# signs. A SHA is the one ref nobody can repoint.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    # Only when the release surface itself changes. A full four-target build
    # on every engine pull request would buy nothing: what breaks here is
    # this config, the Dockerfile, the module's own toolchain, or the
    # variable the -X flag stamps — internal/version is release surface
    # because moving or renaming `value` is what makes the stamp apply to
    # nothing, and running the built binary is what proves it still lands.
    paths:
      - ".goreleaser.yaml"
      - "Dockerfile"
      - ".github/workflows/release.yml"
      # main-image.yml builds the image of main from this pipeline, and its
      # own dry run skips the image (building it there would push it), so a
      # pull request that changes only that workflow gets its image build
      # from this job.
      - ".github/workflows/main-image.yml"
      - "go.mod"
      - "internal/version/**"
      # The before hook's generator: a module it can no longer read, or a
      # change to what it copies, fails the release rather than the pull
      # request unless the pipeline runs here too.
      - "scripts/notices/**"

permissions:
  contents: read

# Never let two releases race to the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: goreleaser snapshot
    # Everything except a tag. Same pipeline, pushing nothing.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: goreleaser derives the version from the most
      # recent tag, and a shallow clone has none — which turns every run into
      # a v0.0.0 snapshot that proves nothing about the real version path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # THE GO CACHES, on ci.yml's policy. setup-go's own cache is OFF: its one
      # entry, keyed on the runner, the Go version and go.mod, is one nothing
      # on main writes any more (ci.yml keeps a cache per job), so a pull
      # request here would restore nothing and then SAVE under its own ref —
      # an entry no other ref can read, which only pushes main's entries out
      # of the repository's 10 GB. No GOTOOLCHAIN is set: setup-go installs
      # go.mod's own toolchain and exports GOTOOLCHAIN=local to every later
      # step, which overrode the workflow-level `auto` this file used to set. The module cache
      # ci.yml's build + vet saves on main is restored, read-only, under the
      # same exact key. No build cache is: goreleaser builds four targets with
      # -trimpath and its own -ldflags, which share no build action with any
      # ci.yml job, so a release compiles cold, once per tag.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: locate the module cache
        run: echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
      - name: restore the module cache main saved
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOMODCACHE }}
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}

      # The image is built for linux/arm64 as well as amd64, and the base
      # image's package install RUNs on the target architecture. Without
      # binfmt registered, the arm64 leg fails at apt-get with an exit code
      # and no explanation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # goreleaser ITSELF IS PINNED EXACTLY, in every goreleaser step of
      # this file and of main-image.yml, and the same version in each, so
      # the snapshot rehearses with the build that publishes. Not a range
      # like `~> v2`: the action downloads the newest release in it on every
      # run and checks it only against the checksums file of that same
      # release, so a new goreleaser — broken or compromised — would run
      # here unreviewed, in the jobs holding the Releases, the registry and
      # the signing identity. The cost is that Dependabot never bumps a
      # `with:` input, so this pin is moved by hand (CONTRIBUTING.md says
      # how): take the newest v2 release from goreleaser's own releases.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          # `check` first so a config error is reported as a config error
          # rather than as whatever the build does with a bad field.
          args: check

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=sign

      - name: Prove the built binary reports the stamped version
        # The ldflags stamp is the one part of this pipeline with no other
        # symptom: a renamed variable or a moved package silently stops
        # applying, the link still succeeds, and the binary falls back to
        # its module build info. Nothing but running the binary catches it.
        #
        # The comparison is EQUALITY against what goreleaser recorded it
        # built, never a sentinel. Sniffing for "dev" is what this used to
        # do, and it stopped working: since Go 1.24 an unstamped build in a
        # repository reports a pseudo-version derived from the tags —
        # v0.0.0-20260829195106-ce2beccb7330, which contains no "dev" — so a
        # stamp that applied to nothing shipped green. `dev` is only ever
        # reachable when debug.ReadBuildInfo fails outright.
        #
        # goreleaser records .version without its `v`, and the stamp is
        # `v` + .version (.goreleaser.yaml), so the expected string is built
        # the same way here.
        #
        # THIS IS THE CHECK THAT CAN SEE A DEAD STAMP, and the publish job's
        # cannot. A release builds at a commit that carries its tag, so the
        # build info an unstamped binary falls back to is that same tag, and
        # its comparison passes either way — it proves the published binary
        # names its tag, not how. Here the snapshot's version
        # (v0.2.0-SNAPSHOT-<commit>) is never what Go derives from the
        # repository, so a stamp that applied to nothing fails.
        run: |
          set -euo pipefail
          built="v$(jq -er .version dist/metadata.json)"
          reported="$(./dist/crewlet_linux_amd64_v1/crewlet --version | awk '{print $2}')"
          echo "goreleaser built ${built}; the binary reports ${reported}"
          if [ "${reported}" != "${built}" ]; then
            echo "::error::the version stamp did not land: the binary reports ${reported}, goreleaser built ${built}"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-dist
          # The unarchived per-target directories are the same binaries
          # again; uploading only what a user would download keeps this
          # under a gigabyte.
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

  publish:
    name: publish the release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # The GitHub Release and its attached archives.
      contents: write
      # The container image, to this repository's own GHCR namespace.
      packages: write
      # The ONLY credential in play beyond the run's own token: an OIDC
      # identity cosign mints a short-lived certificate from, to sign the
      # checksums and the image. There is no private key, so there is none
      # to leak.
      id-token: write
    steps:
      # Full history and tags. goreleaser reads the tag it was triggered by
      # AND the one before it, because GitHub generates the release notes
      # from the pull requests merged between them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The Go caches as in the snapshot job, for its reasons: the module
      # cache main saved, read-only, and no build cache.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: locate the module cache
        run: echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
      - name: restore the module cache main saved
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOMODCACHE }}
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # cosign is the installer's own default (cosign 3 from installer v4),
      # not a `cosign-release:` input: Dependabot bumps the action and never
      # an input, so the default is the cosign that moves with the pin. The
      # signing arguments in .goreleaser.yaml are cosign 3's bundle form, and
      # a major of cosign that changes them changes them with this pin.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # GHCR, with the run's own token. No second account and no stored
      # credential — which is the property Trusted Publishing gave the
      # pipeline this replaces.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: check

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove the published binary reports the tag
        # Same equality check as the snapshot job, and it matters more here:
        # this is the artifact people download, and a wrong version on it is
        # permanent.
        #
        # Two assertions more than the snapshot makes, because here there is
        # a tag to be wrong about: goreleaser's recorded tag must be the ref
        # this run was triggered by, and the version it stamps must be that
        # tag exactly, `v` included — the version a release reports IS its
        # tag.
        #
        # What this cannot see is HOW the binary came to report it: an
        # unstamped build falls back to its module version, which at a
        # tagged commit is the same tag. The snapshot job's comparison is the
        # one that catches a stamp that applies to nothing.
        run: |
          set -euo pipefail
          built="v$(jq -er .version dist/metadata.json)"
          tag="$(jq -er .tag dist/metadata.json)"
          reported="$(./dist/crewlet_linux_amd64_v1/crewlet --version | awk '{print $2}')"
          echo "tag ${tag}; goreleaser built ${built}; the binary reports ${reported}"
          if [ "${tag}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::goreleaser built ${tag}, but this run was triggered by ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "${built}" != "${tag}" ]; then
            echo "::error::goreleaser stamps ${built}, which is not the tag ${tag} it built"
            exit 1
          fi
          if [ "${reported}" != "${built}" ]; then
            echo "::error::the version stamp did not land: the binary reports ${reported}, goreleaser built ${built}"
            exit 1
          fi
