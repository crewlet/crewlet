name: dependabot-rebase

# When a person merges to `main`, ask Dependabot to rebase any bump that is STILL
# in conflict. Dependabot rebases a conflicted bump itself within minutes (#167,
# two minutes after #168 merged) while every commit on it is its own or marked
# `[dependabot skip]`, which the bundle commit is, and it stops trying after 30
# days. So this waits ten minutes for that, and for GitHub to work out who
# conflicts, and comments on whatever is left.
#
# It comments `rebase`, never `recreate`: Dependabot refuses to rebase a branch
# holding somebody else's commit, where recreate would delete it. A bump is
# asked once per head commit, so one that stays stuck is not asked again until
# its branch changes.
#
# The comment has to come from a person. Dependabot ignores commands written by
# `github-actions[bot]` or by a GitHub App (dependabot-core#9147). So it is made
# with DEPENDABOT_REBASE_TOKEN: a fine-grained personal access token for this
# repository, Pull requests: read and write, owned by an account with Write
# access. That scope can also approve pull requests, so the secret belongs to an
# ENVIRONMENT limited to the branch `main` (Settings -> Environments), which
# releases it to a run on `main` and to no other branch a writer can push. Create
# the environment BEFORE this reaches `main`: a workflow that names one that does
# not exist creates it, open to every branch.
#
# Not covered: a bump merges itself with GITHUB_TOKEN, and GitHub starts no
# workflow for an event that token caused (#167, #170, #171 and #173 have no push
# run), so a conflict a bump's merge makes waits for the next merge by a person,
# or for "Run workflow". Those are the conflicts Dependabot rebases itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A newer merge replaces a run that is still waiting, instead of both commenting.
concurrency:
  group: dependabot-rebase
  cancel-in-progress: true

jobs:
  rebase:
    name: comment on the bumps still in conflict
    runs-on: ubuntu-latest
    # A fork has no secret and would fail on every push to its own `main`.
    if: ${{ !github.event.repository.fork }}
    environment: dependabot-rebase
    timeout-minutes: 20
    steps:
      - run: |
          set -euo pipefail

          # Ten minutes: Dependabot's own rebase has taken up to four and a half
          # here. A run started by hand has nothing to wait for.
          if [ "$GITHUB_EVENT_NAME" = push ]; then sleep 600; fi

          # GitHub works out whether a pull request conflicts when it is first
          # asked, and answers UNKNOWN until it has. Ask until every bump has an
          # answer, two minutes at most; one still UNKNOWN waits for the next merge.
          for _ in 1 2 3 4 5 6 7 8; do
            prs="$(gh pr list --author app/dependabot --base main --limit 100 \
              --json number,mergeable,commits,comments)"
            jq -e 'all(.[]; .mergeable != "UNKNOWN")' <<<"$prs" >/dev/null && break
            sleep 15
          done

          # Conflicting, and nobody has asked since the branch last changed. Both
          # timestamps are UTC ISO-8601, which compares as text.
          jq -r '.[]
            | select(.mergeable == "CONFLICTING")
            | select((.commits[-1].committedDate) as $head
                | any(.comments[];
                    (.body | test("^@dependabot (rebase|recreate)"))
                    and .createdAt > $head)
                | not)
            | .number' <<<"$prs" |
            while read -r n; do
              gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" \
                -f body='@dependabot rebase' --silent
              echo "asked Dependabot to rebase #$n"
            done
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
