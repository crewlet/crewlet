name: dependabot-notehelper

# dependabot-dashboard.yml's twin for the note helper's builds. The engine
# embeds a build of internal/notehelper per box arch, committed under
# internal/sandbox/executor/notehelper, and ci.yml's build job rebuilds and
# diffs them. A Go binary carries its modules' versions, so a Dependabot gomod
# bump of a module the helper links (golang.org/x/net,
# github.com/klauspost/compress) changes both builds and sat red on that gate
# until a person ran `make notehelper`. This workflow is
# that person: it rebuilds on Dependabot's pull request and, if the builds
# changed, commits them onto Dependabot's branch. ci.yml then rebuilds them
# from source and diffs them again, so what this commits is checked by a
# build it did not make. It approves nothing and queues no merge.
#
# Everything security-reviewed is dependabot-dashboard.yml's, line for line:
# the author AND actor guard on both jobs, the untrusted `build` job holding
# `contents: read` and no secret, the `push` job running only the runner's
# tools and GitHub's actions, the token (DASHBOARD_BUNDLE_TOKEN, a Dependabot
# secret with Contents: read and write on this repository alone), the push of
# the exact head commit, never forced, and `[dependabot skip]`. That file's
# header has why each is so; change the two together.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    # A gomod bump edits these two and nothing else; a dashboard or Action
    # bump cannot move the builds.
    paths:
      - go.mod
      - go.sum

# Nothing by default; each job asks for exactly what it uses.
permissions: {}

# One run per pull request, the actor in the key: dependabot-dashboard.yml
# says why.
concurrency:
  group: >-
    dependabot-notehelper-${{ github.event.pull_request.number }}-${{
    github.actor }}
  cancel-in-progress: true

jobs:
  # The untrusted half: it holds nothing worth stealing.
  build:
    name: rebuild the note helper
    # A fixed LTS image, never `ubuntu-latest`: ci.yml's `build` job says why.
    runs-on: ubuntu-24.04

    # Both halves are load-bearing, as in dependabot-merge.yml. The author check
    # limits this to a bump; the ACTOR check limits it to a run Dependabot itself
    # started, the only kind GitHub gives Dependabot's secrets to. A person's
    # "Update branch" click or pushed commit runs as that person and is skipped.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'

    permissions:
      contents: read

    # A hang detector: two cross-builds of a small program and a module
    # download, a couple of minutes cold.
    timeout-minutes: 10

    outputs:
      changed: ${{ steps.drift.outputs.changed }}

    steps:
      # The pull request's merge ref, checkout's default and what ci.yml's
      # build job rebuilds, so this produces the builds that job will demand.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # go.mod's own toolchain, as ci.yml's build job installs it.
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - run: make notehelper

      # ci.yml's drift question, asked of the one directory. The two builds
      # are copied out by name when anything there moved.
      - name: has the rebuild changed the committed builds
        id: drift
        run: |
          set -euo pipefail
          out=internal/sandbox/executor/notehelper
          builds="$RUNNER_TEMP/notehelper-builds"
          changes="$(git status --porcelain --untracked-files=all --ignored=matching -- "$out")"
          if [ -z "$changes" ]; then
            echo "$out already is what internal/notehelper builds."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changes"
          mkdir -p "$builds"
          for arch in amd64 arm64; do
            cp "$out/notehelper-linux-$arch.gz" "$builds/"
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: notehelper-builds
          path: ${{ runner.temp }}/notehelper-builds
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The privileged half: it runs nothing the bump brought in.
  push:
    name: commit the note helper builds
    needs: build
    if: >-
      needs.build.outputs.changed == 'true' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    # A fixed LTS image, never `ubuntu-latest`: ci.yml's `build` job says why.
    runs-on: ubuntu-24.04

    # The built-in token is not used at all; every call below uses the personal
    # access token.
    permissions: {}

    timeout-minutes: 5

    steps:
      - name: the token is configured
        env:
          TOKEN: ${{ secrets.DASHBOARD_BUNDLE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::DASHBOARD_BUNDLE_TOKEN must be set as a DEPENDABOT secret (Settings -> Secrets and variables -> Dependabot; the Actions tab is the wrong one, a run Dependabot starts cannot read it). See the header of .github/workflows/dependabot-dashboard.yml."
            exit 1
          fi

      # The EXACT commit the rebuild ran against, not the branch: if Dependabot
      # has force-pushed since, the push at the end is refused as a
      # non-fast-forward and nothing is overwritten.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.DASHBOARD_BUNDLE_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: notehelper-builds
          path: ${{ runner.temp }}/notehelper-builds

      - name: commit and push
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          builds="$RUNNER_TEMP/notehelper-builds"
          out=internal/sandbox/executor/notehelper

          # The directory is data from the untrusted job, so what is checked is
          # its NAMES and kinds: exactly the two builds, regular files, gzip
          # by their magic bytes, and nothing else at any depth. Where they
          # are written is this file's, never the directory's.
          want="$(printf '%s\n' notehelper-linux-amd64.gz notehelper-linux-arm64.gz)"
          got="$(cd "$builds" && find . -mindepth 1 -printf '%P %y\n' | sort)"
          if [ "$got" != "$(printf '%s f\n' $want)" ]; then
            echo "$got"
            echo "::error::the rebuilt note helper holds something other than the two regular files notehelper-linux-amd64.gz and notehelper-linux-arm64.gz. Refusing to commit it."
            exit 1
          fi
          for f in $want; do
            if [ "$(head -c 2 "$builds/$f" | od -An -tx1 | tr -d ' \n')" != "1f8b" ]; then
              echo "::error::$f is not gzip. Refusing to commit it."
              exit 1
            fi
            cp "$builds/$f" "$out/$f"
          done
          git add -- "$out/notehelper-linux-amd64.gz" "$out/notehelper-linux-arm64.gz"

          if git diff --cached --quiet; then
            echo "The branch already carries these builds; nothing to commit."
            exit 0
          fi

          # The push is authenticated by the token; this is only the author line.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # `-s` because scripts/check-signoff.sh judges every commit a pull
          # request adds. `[dependabot skip]` is not one of the words Actions
          # reads as "skip this run".
          git commit -s -F - <<'EOF'
          build(notehelper): rebuild the note helper for this dependency bump

          A Go build carries its modules' versions, so this bump changed the
          note helper builds the engine embeds, and they no longer matched
          what internal/notehelper builds (make notehelper-check). This is
          that rebuild, made by .github/workflows/dependabot-notehelper.yml.

          [dependabot skip] lets Dependabot force-push over this commit, so
          it keeps rebasing this branch. When it does the commit is gone,
          and the workflow runs again and pushes a fresh one.
          EOF

          # A plain push, never forced: it succeeds only if the branch is still
          # at the commit this run started from.
          git push origin "HEAD:refs/heads/${BRANCH}"
