name: coding image

# THE CONTAINER SANDBOX'S REFERENCE IMAGE: images/coding, which
# `providers.sandbox.local.image` names for a `run_in: container` box
# (docs/concepts/code-sandbox.md, "Local sandboxes").
#
# A PULL REQUEST BUILDS IT; A PUSH TO MAIN ALSO PUBLISHES IT. Each platform
# is built and smoke-tested on its own runner by `make coding-image`, the
# command a contributor runs, so the arm64 leg runs natively rather than under
# QEMU. On main the image is then built for both platforms and pushed as
# ghcr.io/crewlet/crewlet-coding:main, signed, on main-image.yml's pattern and
# for its reasons: ONE TAG, AND IT MOVES, never `latest` and never a release's
# tag. The image is versioned by what it pins, not by the engine's tag.
#
# A PATH FILTER, unlike ci.yml, because nothing outside these paths reaches
# the image: its build context is images/coding alone, and the Makefile holds
# the command that builds and smokes it.

on:
  pull_request:
    paths:
      - "images/coding/**"
      - ".github/workflows/coding-image.yml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "images/coding/**"
      - ".github/workflows/coding-image.yml"
      - "Makefile"

permissions:
  contents: read

# A newer push to the same pull request, or to main, cancels the run before
# it: only the newest commit's image is worth finishing. Named after the
# workflow because a concurrency group is shared by every workflow in the
# repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # An apt install, a Node runtime copy and two CLI tarballs: minutes, not
    # the six-hour default under which a hung step holds a runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build and smoke-test the image
        run: make coding-image

  publish:
    name: build, push and sign main's coding image
    needs: build
    # Only a push to main publishes, and only this repository's: a fork's
    # own push to its main would run with the fork's token and identity.
    if: github.event_name == 'push' && github.repository == 'crewlet/crewlet'
    runs-on: ubuntu-24.04
    # One two-platform image whose arm64 leg runs its install under QEMU.
    timeout-minutes: 45
    permissions:
      contents: read
      # The image, to this repository's own GHCR namespace, and the deletion
      # of the ones it replaces.
      packages: write
      # The keyless signature, minted from this run's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/coding
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/crewlet/crewlet-coding:main
          labels: |
            org.opencontainers.image.title=crewlet-coding
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/crewlet/crewlet-coding@${DIGEST}"
      # The images `main` no longer names, as main-image.yml prunes the
      # engine's: untagged IMAGES, keeping a tagged image's platform
      # manifests and signatures, and only those older than an hour.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: crewlet-coding
          delete-untagged: true
          delete-orphaned-images: true
          older-than: 1 hour
