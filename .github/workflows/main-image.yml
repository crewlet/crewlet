name: main image

# THE ENGINE IMAGE OF MAIN: ghcr.io/crewlet/crewlet:main, rebuilt on every
# push to main. See RELEASING.md, "Images from main".
#
# ONE TAG, AND IT MOVES. Each push to main builds the image of its head commit
# and moves `main` to it. Nothing else is ever pushed: no tag per commit, never
# `latest`, never a release's tag — an image of main is not a release. The
# binary inside reports `main-` and the first twelve hex digits of the commit
# (internal/version), which no release version can be.
#
# A PUSH TO MAIN IS ITS ONLY TRIGGER. A pull request has nothing to publish.
# One touching the Dockerfile, go.mod, internal/version or scripts/notices
# runs release.yml's snapshot job, which builds the release image from this
# same Dockerfile and checks its binary's version; nothing runs this file's
# own build before a merge, so a change here is first exercised on main. The
# job has no event condition, so any other trigger would hand the registry
# and a signing identity to a run no merge started.
#
# THE RELEASE'S BUILD, without goreleaser: a release run needs a semver tag
# on the commit, and a snapshot run pushes nothing. The binaries are built
# with .goreleaser.yaml's settings and staged in the layout it stages, and the
# image from the same Dockerfile for the same two platforms. Change the build
# in .goreleaser.yaml and change it here.
#
# ITS OWN WORKFLOW rather than a job in release.yml: docs-publish.yml reads
# every completed push run of `release` as a new v* tag.
#
# EVERY ACTION IS PINNED BY COMMIT SHA, as in release.yml and for its reason:
# this job holds the registry and a signing identity.

on:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push CANCELS the run before it, in progress or pending: only the
# newest commit's image is worth finishing, since `main` moves to it next.
# Named after the workflow because a concurrency group is shared by every
# workflow in the repository.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    name: build, push and sign main's image
    # A fork's own push to its main would run with the fork's token and
    # identity, so it could only fail here.
    if: github.repository == 'crewlet/crewlet'
    runs-on: ubuntu-latest
    # Two binaries and one two-platform image whose arm64 leg runs its
    # package install under QEMU. Not the six-hour default, under which a hung
    # step holds `main` back until the next push cancels it.
    timeout-minutes: 30
    permissions:
      contents: read
      # The image, to this repository's own GHCR namespace.
      packages: write
      # The keyless signature: cosign mints a short-lived certificate from
      # this run's OIDC identity, as the release does.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache, on release.yml's policy and for its reasons.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The two linux binaries, stamped `main-` and twelve hex digits of the
      # commit (the length Go gives a commit in a pseudo-version), staged
      # beside the license and both notices files the Dockerfile copies. The
      # amd64 binary is run before anything is pushed: a -X flag that names
      # nothing still links, and its only symptom is a binary that reports its
      # module version instead of the commit.
      - name: build the binaries and the image context
        run: |
          set -euo pipefail
          version="main-${GITHUB_SHA:0:12}"
          context="${RUNNER_TEMP}/image"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath \
              -ldflags "-s -w -X github.com/crewlet/crewlet/internal/version.value=${version}" \
              -o "${context}/linux/${arch}/crewlet" ./cmd/crewlet
          done
          reported="$("${context}/linux/amd64/crewlet" --version | awk '{print $2}')"
          if [ "${reported}" != "${version}" ]; then
            echo "::error::the binary reports ${reported}; this commit is ${version}"
            exit 1
          fi
          go run ./scripts/notices -out "${context}/build/notices/THIRD_PARTY_NOTICES.txt" \
            -main ./cmd/crewlet -targets linux/amd64,linux/arm64
          install -D -m 0644 LICENSE "${context}/LICENSE"
          install -D -m 0644 static/dashboard/THIRD_PARTY_NOTICES.txt \
            "${context}/static/dashboard/THIRD_PARTY_NOTICES.txt"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/crewlet/crewlet:main
          labels: |
            org.opencontainers.image.title=crewlet
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      # Keyless, by the digest just pushed, as docker_signs signs a release's
      # image; the certificate names this workflow on main and this commit.
      # cosign is the installer's default, as in release.yml and for its
      # reason: the pin Dependabot moves is the action's.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/crewlet/crewlet@${DIGEST}"
