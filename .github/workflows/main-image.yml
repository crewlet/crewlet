name: main image

# AN ENGINE IMAGE OF MAIN, beside the ones a release publishes. See
# RELEASING.md, "Images from main".
#
# WHICH COMMITS. The commit at the head of every push to main, and main's tip
# at every hourly run. NOT every commit main contains: a commit reached only
# through a merge's second parent, or pushed together with later commits,
# has a Go module version (`go get …@<sha>` resolves it) and no image.
#
# Each image is pushed to the release's own repository,
# ghcr.io/crewlet/crewlet, under TWO tags:
#
#   - its Go MODULE VERSION — the pseudo-version proxy.golang.org reports for
#     the commit (v0.1.1-0.20261010171839-4e45c6b992a2), which is also what
#     the binary inside prints. It is IMMUTABLE: published once, never
#     rebuilt, so a deployment that pins a main commit pins the same string
#     for the module and the image and always gets the same bytes.
#   - `main`, which names the image of main's tip once that image is
#     published, and until then the last tip whose image was.
#
# It never writes `latest` or a release's tag. What PREVENTS that is the
# template: a pseudo-version always has a pre-release part, so the
# `{{ if not .Prerelease }}latest{{ end }}` guard in .goreleaser.yaml drops
# `latest`. What the image job adds is DETECTION, after the push: it fails the
# run, before signing, unless the push named exactly one tag, the commit's own
# — so a template change that let another tag through goes red on the first
# merge rather than landing silently on every one.
#
# ONE BUILD, THE RELEASE'S. The image comes from `goreleaser release` over the
# same .goreleaser.yaml, Dockerfile, ldflags and buildx call a tag uses, with
# three differences: CREWLET_MAIN_IMAGE disables the GitHub Release and its
# changelog (stated in that file), `--skip=archive` leaves no archives and so
# no checksums, and `--skip=sign` moves the image signature out of goreleaser
# to the end of the job, after the image has proved what it is — the same
# `cosign sign <image>@<digest> --yes` docker_signs runs for a release, so a
# main-image signature means "built here AND passed the proof". A second,
# hand-written build here would be a second recipe for "the engine image"
# that nothing compares with the first.
#
# THIS IS ITS OWN WORKFLOW rather than a job in release.yml for a reason
# outside both: docs-publish.yml fires on every completed `release` run whose
# event was a push, and reads that as "a v* tag". A push to main in
# release.yml would republish the docs site on every merge.
#
# WHO CAN REACH THE PUSH. The publishing jobs run on `push` to main and on
# `schedule`, and both of those fire only for this repository's own default
# branch — a fork's pull request cannot produce either event here. The `plan`
# job they all hang off also requires `github.event_name != 'pull_request'`
# and this repository's name, so a fork that enables Actions runs nothing
# that tries to publish. A pull request, from a fork or not, reaches only the
# `dry-run` job: `contents: read`, no secret, no OIDC token, and nothing
# pushed. There is no pull_request_target, workflow_run or workflow_dispatch
# trigger.
#
# EVERY ACTION IS PINNED BY COMMIT SHA, as in release.yml and for its reason:
# these jobs hold the registry and a signing identity.

on:
  push:
    branches: [main]
  # THE BACKSTOP FOR MERGES THAT START NO RUN. Dependabot's bumps are merged
  # by dependabot-merge.yml with GITHUB_TOKEN, and GitHub starts no `push`
  # workflow for an event that token authored — so without this, a bump that
  # landed after the last person's merge would leave `main` an hour, a day or
  # a week behind. A scheduled run builds main's tip when it has no image and
  # does nothing else when it has one. Minute 41 rather than 0, because
  # GitHub delays the top of the hour.
  schedule:
    - cron: "41 * * * *"
  pull_request:
    # The surface this workflow depends on: release.yml's snapshot paths,
    # which list this file too. The dry run proves the version path and the
    # release-free goreleaser run; the image build is release.yml's snapshot
    # job, which builds the same dockers_v2 block. What neither runs is this
    # file's own image invocation (its flags, its push, its signing): that
    # is first exercised on main (RELEASING.md, "Rehearsing it").
    paths:
      - ".github/workflows/main-image.yml"
      - ".goreleaser.yaml"
      - "Dockerfile"
      - "go.mod"
      - "internal/version/**"
      - "scripts/notices/**"

permissions:
  contents: read

# A pull request's run is cancelled by its next push, as in ci.yml.
#
# Every other run is grouped BY COMMIT, never cancelled: the push run and an
# hourly run of the same commit never interleave, so the second sees the
# first's image and builds nothing. GitHub keeps one pending run per group and
# cancels it when another queues, which here only ever drops a duplicate of
# the same commit. The group holds a WHOLE RUN, so it does not cover a re-run
# of one failed job; that is why the image job asks the registry again itself
# immediately before the push. Ordering ACROSS commits — which one `main`
# names — is the tag-main job's, under a group of its own.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-commit-{1}', github.workflow, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/crewlet/crewlet
  # What the Sigstore certificate of a keyless signature is issued by. The
  # identity it names is checked per use below.
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  plan:
    name: version and registry state
    if: github.event_name != 'pull_request' && github.repository == 'crewlet/crewlet'
    runs-on: ubuntu-latest
    # A clone, a small build, two HTTP calls and a cosign verify: minutes,
    # with room for a slow runner. Not the six-hour default, under which a
    # hung step holds this commit's concurrency group for the afternoon.
    timeout-minutes: 10
    permissions:
      contents: read
      # Write, though this job writes nothing, only to ask the registry for
      # a token with the scope the push asks for (pull,push), so "absent"
      # here is never a token that could not see the tag. And because a
      # read-only check could fail closed before the first push: on
      # 2026-10-10, before ghcr.io/crewlet/crewlet existed, GHCR's token
      # endpoint answered DENIED to a pull-scoped request for it (asked
      # anonymously; a run's read-only token was not measured), while
      # pull,push is the scope a push that creates the package must be
      # granted. The image job repeats the check under its own token
      # before pushing.
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.registry.outputs.build }}
    steps:
      # Full history and tags, and no credential left in the checkout: Go
      # derives the version from the tags, and the image job tags the commit
      # locally, which a persisted credential would make pushable.
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # go.mod's own toolchain, and no setup-go cache, on release.yml's policy.
      - &setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # THE VERSION IS GO'S, never this file's. Since Go 1.24 `go build`
      # stamps the main module's version from the repository, by the same
      # rule the module proxy applies: the newest semver tag the commit
      # descends from, its patch plus one, then `-0.<UTC committer time>-<12
      # hex of the commit>`. Re-implementing that rule in shell would be a
      # second answer to a question Go already answers, and it has cases
      # (a pre-release base, a commit that carries a tag) a copy gets wrong.
      # scripts/notices is the smallest main package in the module, and
      # standard-library only, so this builds in seconds.
      #
      # What is asserted is what makes Go's answer the PROXY's answer:
      #   - a full clone. A shallow one has no tags and Go answers
      #     v0.0.0-<time>-<sha> — the right suffix on the wrong base, which
      #     no proxy reports and no deployment can pin;
      #   - a v* tag in the commit's history, for the same reason;
      #   - the suffix is THIS commit's committer time and hash, and nothing
      #     follows it (a modified tree adds +dirty).
      # A commit that carries a release tag reports that tag instead, and
      # publishes nothing here: the tag's own release owns that image.
      - &version
        name: compute the commit's Go module version
        id: version
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "::error::the checkout is shallow, and Go derives a v0.0.0 version from a history with no tags"
            exit 1
          fi
          if [ -z "$(git tag --merged HEAD --list 'v*')" ]; then
            echo "::error::no v* tag is in this commit's history, so Go has no base for its version"
            exit 1
          fi
          stamp="${RUNNER_TEMP}/stamp"
          go build -o "${stamp}" ./scripts/notices
          version="$(go version -m "${stamp}" | awk '$1 == "mod" {print $3}')"
          sha="$(git rev-parse HEAD)"
          when="$(TZ=UTC git log -1 --date=format-local:%Y%m%d%H%M%S --format=%cd HEAD)"
          # Read whole before matching: `grep -q` stops at its first match,
          # and under pipefail a writer it stopped early fails the test.
          tags="$(git tag --points-at HEAD)"
          if grep -qxF -- "${version}" <<<"${tags}"; then
            echo "::notice::${sha} carries the tag ${version}; its release publishes that image, so this run publishes none"
            tagged=true
          elif [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(.+[.-])?${when}-${sha:0:12}$ ]]; then
            tagged=false
          else
            echo "::error::Go stamped ${version}, which is neither a tag on ${sha} nor its pseudo-version (…${when}-${sha:0:12})"
            exit 1
          fi
          echo "${sha} is ${version}"
          {
            echo "version=${version}"
            echo "tagged=${tagged}"
          } >> "${GITHUB_OUTPUT}"

      # The string a deployment pins is the one the proxy serves, so the tag
      # is checked against the proxy itself rather than trusted to agree.
      # Skipped for a tagged commit, which publishes nothing here, and whose
      # answer the proxy may still be caching from before the tag existed.
      - name: cross-check the version with the Go module proxy
        if: steps.version.outputs.tagged == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          info="$(curl -fsS --retry 5 --retry-all-errors \
            "https://proxy.golang.org/github.com/${GITHUB_REPOSITORY}/@v/${GITHUB_SHA:0:12}.info")"
          proxied="$(jq -er .Version <<<"${info}")"
          hash="$(jq -er .Origin.Hash <<<"${info}")"
          echo "proxy.golang.org: ${GITHUB_SHA:0:12} is ${proxied} (${hash})"
          if [ "${hash}" != "${GITHUB_SHA}" ] || [ "${proxied}" != "${VERSION}" ]; then
            echo "::error::the proxy answers ${proxied} for ${hash}; Go stamped ${VERSION} for ${GITHUB_SHA}"
            # The one disagreement that is expected: a release tag put on an
            # ANCESTOR of this commit after the proxy first answered for it.
            # Go now bases the version on that tag; the proxy keeps the
            # answer it cached. Same commit, same time, different base, and
            # it ends with the next merge, whose commit nobody asked about
            # before the tag existed (RELEASING.md, "Its tags").
            if [ "${hash}" = "${GITHUB_SHA}" ] && [ "${proxied##*.}" = "${VERSION##*.}" ]; then
              echo "::error::both name this commit and its time and differ only in the base tag: a release tag newer than the proxy's answer is in this commit's history, and the proxy is still serving what it cached before. Nothing is wrong with the image; the next commit on main publishes normally"
            fi
            exit 1
          fi

      - &cosign
        # cosign is the installer's default, as in release.yml and for its
        # reason: the pin Dependabot moves is the action's.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - &login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # THE PER-COMMIT TAG IS WRITTEN ONCE. A rebuild is never the same
      # image — the `created` label is the build's time — so a re-run, or
      # the hourly run after a push run, would otherwise move a tag somebody
      # pinned to different bytes. The registry is asked directly, by HTTP
      # status, because only a 404 means "absent": a tool that exits non-zero
      # for "not found" exits non-zero for a refused token and a network
      # error too, and reading those as "absent" would rebuild over a
      # published tag. This check is the early exit for the hourly run with
      # nothing to do; the image job asks again before it pushes.
      #
      # A tag that exists must carry this workflow's signature FROM THIS
      # COMMIT (--certificate-github-workflow-sha: Fulcio writes the commit a
      # run was based on into the certificate). One that does not was pushed
      # by a run that failed its proof or its signing — the signature is the
      # job's last step, so a signed image is one that passed — or by
      # something other than this workflow. It fails here rather than being
      # skipped as done or signed after the fact: signing bytes this run did
      # not build would vouch for them. Delete the tag in the package's
      # settings and re-run.
      - name: is this commit's image already published?
        id: registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAGGED: ${{ steps.version.outputs.tagged }}
        run: |
          set -euo pipefail
          if [ "${TAGGED}" = true ]; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          repo="${IMAGE#ghcr.io/}"
          token="$(curl -fsS -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${repo}:pull,push" | jq -er .token)"
          headers="${RUNNER_TEMP}/manifest-headers"
          code="$(curl -sS --head -o /dev/null -D "${headers}" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${VERSION}")"
          case "${code}" in
            404)
              echo "${IMAGE}:${VERSION} is not published yet"
              echo "build=true" >> "${GITHUB_OUTPUT}"
              ;;
            200)
              digest="$(awk 'tolower($1) == "docker-content-digest:" {print $2}' "${headers}" | tr -d '\r')"
              if ! cosign verify "${IMAGE}@${digest}" \
                  --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
                  --certificate-github-workflow-sha "${GITHUB_SHA}" \
                  --certificate-oidc-issuer "${OIDC_ISSUER}" > /dev/null; then
                echo "::error::${IMAGE}:${VERSION} (${digest}) exists without this workflow's signature for ${GITHUB_SHA}: a run pushed it and failed its proof or its signing, or something else pushed it. Delete that tag and re-run"
                exit 1
              fi
              echo "::notice::${IMAGE}:${VERSION} is already published and signed (${digest}); it is never rebuilt"
              echo "build=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::the registry answered ${code} for ${IMAGE}:${VERSION}"
              exit 1
              ;;
          esac

  image:
    name: build, prove, sign and push the commit's image
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    # Four targets compiled cold, a two-platform image whose arm64 leg runs
    # under QEMU, and a `docker run` of each: a quarter of an hour on a normal
    # day. Not the six-hour default, under which a hung step holds this
    # commit's concurrency group, and with it the hourly run's retry.
    timeout-minutes: 45
    permissions:
      contents: read
      # The image, to this repository's own GHCR namespace.
      packages: write
      # The keyless signature over the image: cosign mints a short-lived
      # certificate from this run's OIDC identity, as the release does.
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - *checkout
      - *setup-go
      - *cosign
      - *login

      # THE EXISTENCE CHECK AGAIN, under this job's own token, immediately
      # before the push — and here only a 404 goes on. plan's answer is not
      # enough on its own: "Re-run failed jobs" re-runs this job WITHOUT
      # plan, reusing plan's old `build=true`, so a run whose push succeeded
      # and whose proof then failed would, re-run, push the same tag again
      # with a different digest. Asked here, check and push are one job
      # attempt again whatever was re-run. A tag found here was pushed by an
      # earlier attempt: "Re-run all jobs" lets plan judge it (published and
      # signed is done; unsigned must be deleted first).
      - name: the commit's tag must still be absent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${IMAGE#ghcr.io/}"
          token="$(curl -fsS -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${repo}:pull,push" | jq -er .token)"
          code="$(curl -sS --head -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${VERSION}")"
          if [ "${code}" != 404 ]; then
            echo "::error::the registry answered ${code} for ${IMAGE}:${VERSION} just before the push, and only 404 may be built: a published tag is never rebuilt. If an earlier attempt of this job pushed it, use \"Re-run all jobs\" so plan judges it"
            exit 1
          fi
          echo "${IMAGE}:${VERSION} is still absent"

      # The module cache ci.yml's build + vet saves on main, read-only, as in
      # release.yml; no build cache, for release.yml's reason.
      - &gomodcache
        name: locate the module cache
        run: echo "GOMODCACHE=$(go env GOMODCACHE)" >> "${GITHUB_ENV}"
      - &gomod-restore
        name: restore the module cache main saved
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOMODCACHE }}
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}

      # binfmt for the arm64 leg's package install, as in release.yml.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - &buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # goreleaser builds a version from a TAG on the commit it builds, and
      # refuses one that names another commit. The tag is made here, in this
      # checkout only: persist-credentials is off, so nothing can push it,
      # and a pseudo-version is not a tag anybody should ever see on the
      # repository.
      - name: tag the commit locally with its version
        run: git tag "${VERSION}"

      - &goreleaser-check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Exactly release.yml's goreleaser, for the reason at its pin: a
          # range would run whatever goreleaser released last in a job that
          # pushes and signs.
          version: v2.18.3
          args: check

      # No GITHUB_TOKEN: with CREWLET_MAIN_IMAGE set there is no Release and
      # no changelog for goreleaser to call GitHub for, and a token it does
      # not hold is one this step cannot use for anything else. The push to
      # GHCR uses the docker login above. `--skip=sign` skips docker_signs
      # (goreleaser's DockerPipe.Skip): the image is signed below, after the
      # proof, so a signature never stands on an image that failed it.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean --skip=archive,sign
        env:
          CREWLET_MAIN_IMAGE: "true"
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}

      - name: Prove the pushed image is the commit's, and nothing more
        id: prove
        # The version, by equality, as release.yml's publish job checks it —
        # here against the image a deployment pulls, on every platform it was
        # built for, and not only the binary left in dist/. Like that check,
        # it proves WHAT the engine reports and not that the -X stamp put it
        # there: the commit carries the version as a (local) tag, so an
        # unstamped binary would report the same string. release.yml's
        # snapshot job is what catches a stamp that applies to nothing.
        #
        # And that the run wrote EXACTLY ONE tag, the commit's own. This
        # DETECTS a tag that should not have been written — the push has
        # already happened by now, so it cannot prevent one; the template
        # guard in .goreleaser.yaml is what prevents it. A run that fails
        # here leaves its push UNSIGNED, which plan then refuses to treat as
        # published.
        run: |
          set -euo pipefail
          tag="$(jq -er .tag dist/metadata.json)"
          built="v$(jq -er .version dist/metadata.json)"
          if [ "${tag}" != "${VERSION}" ] || [ "${built}" != "${VERSION}" ]; then
            echo "::error::goreleaser built tag ${tag}, version ${built}; this commit is ${VERSION}"
            exit 1
          fi
          reported="$(./dist/crewlet_linux_amd64_v1/crewlet --version | awk '{print $2}')"
          if [ "${reported}" != "${VERSION}" ]; then
            echo "::error::the version stamp did not land: the binary reports ${reported}, this commit is ${VERSION}"
            exit 1
          fi

          names="$(jq -r '[.[] | select(.type == "Docker Image") | .name] | unique | join(" ")' dist/artifacts.json)"
          if [ "${names}" != "${IMAGE}:${VERSION}" ]; then
            echo "::error::the run pushed [${names}]; it may push ${IMAGE}:${VERSION} and nothing else"
            exit 1
          fi
          digest="$(jq -er '[.[] | select(.type == "Docker Image") | .extra.Digest] | unique | if length == 1 then .[0] else error("not one digest") end' dist/artifacts.json)"
          published="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -er .digest)"
          if [ "${published}" != "${digest}" ]; then
            echo "::error::${IMAGE}:${VERSION} names ${published}; goreleaser pushed ${digest}"
            exit 1
          fi

          for platform in $(jq -r '[.[] | select(.type == "Docker Image") | .extra.Platforms[]] | unique | .[]' dist/artifacts.json); do
            reported="$(docker run --rm --platform "${platform}" "${IMAGE}@${digest}" --version | awk '{print $2}')"
            echo "${platform}: the image reports ${reported}"
            if [ "${reported}" != "${VERSION}" ]; then
              echo "::error::the ${platform} image reports ${reported}, this commit is ${VERSION}"
              exit 1
            fi
          done
          echo "${IMAGE}:${VERSION} is ${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      # THE SIGNATURE IS THE LAST THING, so it means "passed everything
      # above". Exactly the command docker_signs runs for a release
      # (.goreleaser.yaml), by digest and keyless; its certificate names this
      # workflow on main and the commit the run was based on, which plan and
      # tag-main check.
      - name: sign the proved image by digest
        env:
          DIGEST: ${{ steps.prove.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign "${IMAGE}@${DIGEST}" --yes
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --certificate-github-workflow-sha "${GITHUB_SHA}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" > /dev/null
          echo "${IMAGE}:${VERSION} (${DIGEST}) is signed by ${GITHUB_WORKFLOW_REF} at ${GITHUB_SHA}"

  # `main` FOLLOWS THE TIP OF MAIN, NOT THIS RUN'S COMMIT. Two quick merges
  # build in parallel and finish in either order, and GitHub keeps only one
  # PENDING job per concurrency group, cancelling it when another queues — so
  # "point main at my own commit, serialised" would drop a commit or let the
  # older build land last. Instead every run of this job asks GitHub for main's
  # tip at the moment it runs, and points `main` at THAT commit's image if it
  # is published. Runs are serialised, each moves `main` to the newest tip it
  # can see, and none can move it backwards. When the tip's image is not
  # published yet, `main` stays where it is — on the last tip whose image
  # was, even if a commit between the two has an image of its own: the tip's
  # own run comes after its own image job and moves it (and for a tip that
  # started no run, or whose build failed, the hourly schedule does).
  tag-main:
    name: point main at the image of main's tip
    needs: [plan, image]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    # A few registry calls and a cosign verify. Every later run of this job,
    # for every commit, queues behind this one in its group, so a hang must
    # end in minutes rather than hold `main` still for six hours.
    timeout-minutes: 10
    # Only the retag. No `contents`: nothing is checked out, and main's tip is
    # read with an anonymous `git ls-remote` of this public repository.
    permissions:
      packages: write
    concurrency:
      group: ${{ github.workflow }}-tag-main
      cancel-in-progress: false
    steps:
      - *buildx
      - *cosign
      - *login
      - name: point main at the image of main's tip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tip="$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" refs/heads/main | awk '{print $1}')"
          info="$(curl -fsS --retry 5 --retry-all-errors \
            "https://proxy.golang.org/github.com/${GITHUB_REPOSITORY}/@v/${tip:0:12}.info")"
          version="$(jq -er .Version <<<"${info}")"
          if [ "$(jq -er .Origin.Hash <<<"${info}")" != "${tip}" ]; then
            echo "::error::the proxy answered for $(jq -r .Origin.Hash <<<"${info}"), not main's tip ${tip}"
            exit 1
          fi
          echo "main's tip is ${tip}, ${version}"

          repo="${IMAGE#ghcr.io/}"
          token="$(curl -fsS -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${repo}:pull,push" | jq -er .token)"
          # Prints the digest a tag names, or nothing when the registry says
          # 404; any other answer fails the job.
          digest_of() {
            local headers="${RUNNER_TEMP}/headers-$1" code
            code="$(curl -sS --head -o /dev/null -D "${headers}" -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/$1")"
            case "${code}" in
              200) awk 'tolower($1) == "docker-content-digest:" {print $2}' "${headers}" | tr -d '\r' ;;
              404) ;;
              *) echo "::error::the registry answered ${code} for ${IMAGE}:$1" >&2; return 1 ;;
            esac
          }

          source="$(digest_of "${version}")"
          if [ -z "${source}" ]; then
            echo "::notice::${IMAGE}:${version} is not published yet; main stays where it is until that commit's run moves it"
            exit 0
          fi
          # Only an image signed FOR THE TIP becomes `main`. The identity is
          # exact: this workflow on main, or — when main's tip carries the
          # release tag the proxy named — the release workflow at that tag.
          # And --certificate-github-workflow-sha binds the signature to the
          # tip itself (the release ran at its tag's commit, so that holds
          # for a tagged tip too). That is what makes the proxy's mapping
          # from commit to version safe to follow: an answer naming another
          # commit's version, or a tag pushed under the wrong one, names an
          # image whose certificate carries a different commit, and fails.
          workflows="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows"
          identity="${workflows}/main-image.yml@refs/heads/main"
          # The commits the tag names (an annotated tag's own object, then
          # the commit it peels to), read whole before matching: `grep -q`
          # stops at its first match, and under pipefail a writer it stopped
          # early would turn a tagged tip into an untagged one.
          tagged="$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "refs/tags/${version}" "refs/tags/${version}^{}" | awk '{print $1}')"
          if grep -qxF -- "${tip}" <<<"${tagged}"; then
            identity="${workflows}/release.yml@refs/tags/${version}"
          fi
          cosign verify "${IMAGE}@${source}" \
            --certificate-identity "${identity}" \
            --certificate-github-workflow-sha "${tip}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" > /dev/null

          current="$(digest_of main)"
          if [ "${current}" = "${source}" ]; then
            echo "main already names ${IMAGE}:${version} (${source})"
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:main" "${IMAGE}@${source}"
          # The SAME manifest, byte for byte: the signature is over the
          # digest, so `main` is covered by it only while the digests agree.
          moved="$(digest_of main)"
          if [ "${moved}" != "${source}" ]; then
            echo "::error::main names ${moved} after the retag, not ${IMAGE}:${version} (${source})"
            exit 1
          fi
          echo "main: ${current:-nothing} -> ${IMAGE}:${version} (${source})"

  dry-run:
    name: main image dry run
    # Every pull request this file's paths match — a fork's included, which is
    # why this job holds nothing beyond the workflow's `contents: read`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Four targets compiled cold, and no image: well under this.
    timeout-minutes: 30
    steps:
      - *checkout
      - *setup-go
      # On a pull request this is the version of the MERGE commit GitHub
      # made, which has a pseudo-version of its own: the path is the same.
      - *version
      - *gomodcache
      - *gomod-restore
      - name: tag the commit locally with its version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git tag "${VERSION}"
      - *goreleaser-check
      # The main path minus the image (dockers_v2 builds AND pushes in one
      # step, so building it here would mean pushing it), and so minus its
      # signature, which the main path takes after its proof. `--skip=docker`
      # rather than `--skip=publish` on purpose: the publish phase still runs,
      # and with NO GITHUB_TOKEN. If CREWLET_MAIN_IMAGE stopped disabling the
      # Release, goreleaser fails here with "missing GITHUB_TOKEN" instead of
      # on main trying to create a Release nobody wanted. Under
      # `--skip=publish` the same mistake passes: the Release is a publisher,
      # and a skipped publisher never asks for its token.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean --skip=archive,sign,docker
        env:
          CREWLET_MAIN_IMAGE: "true"
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}
      - name: Prove the built binary reports the commit's version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="$(jq -er .tag dist/metadata.json)"
          reported="$(./dist/crewlet_linux_amd64_v1/crewlet --version | awk '{print $2}')"
          echo "version ${VERSION}; goreleaser built ${tag}; the binary reports ${reported}"
          if [ "${tag}" != "${VERSION}" ] || [ "${reported}" != "${VERSION}" ]; then
            echo "::error::goreleaser built ${tag} and the binary reports ${reported}; the commit is ${VERSION}"
            exit 1
          fi
