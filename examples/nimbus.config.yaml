# yaml-language-server: $schema=../schema/bootstrap.schema.json
# Tier A bootstrap config for the Nimbus example company.
#
# Pairs with examples/nimbus.company.yaml (Tier B) — a CHAT-ONLY company on
# a coding-CLI subscription, so this node needs no API key, no broker, no
# database and no public URL.  Bring the pair up end to end:
#
#     # 1. Chat: the server, an admin, the team, the channels, the bots.
#     docker compose --profile mattermost up -d --wait
#     COMPANY=examples/nimbus.company.yaml scripts/mattermost-dev-bootstrap.sh
#
#     # 2. The model: authenticate the `claude` CLI inside Crewlet's own
#     #    directory, then prove it end to end BEFORE the first turn.
#     crewlet llm login default -from-host      # or -capture-token
#     crewlet llm doctor default
#
#     # 3. This node's own API token, and go.
#     export CREWLET_API_TOKEN_FOUNDER="$(openssl rand -hex 32)"
#     set -a; . ./.env; set +a          # MATTERMOST_URL + the bot tokens
#                                       #   the bootstrap wrote
#     crewlet run -config examples/nimbus.config.yaml \
#                 -company examples/nimbus.company.yaml
#
#     # optional — only if you enable the `secrets:` keyring below.
#     # `crewlet secrets keygen -key-id 2026-01` prints the export line + snippet:
#     export CREWLET_SECRET_KEY_2026_01="<base64 key from `crewlet secrets keygen`>"
#
# THERE ARE NO EXTERNAL SERVICES HERE apart from the chat server the
# compose file starts.  The stream is a NATS JetStream server embedded in
# this process and the store is one local file, so a single binary in an
# empty directory is a working company — no broker to operate, no database
# to provision, nothing to point a DSN at.  Both slots take an external
# address when a deployment outgrows that; see docs/guides/deployment.md
# and docs/guides/fleet.md.
#
# Restart-only Tier A fields only:
#   - stream      : where the durable event log lives
#   - store       : this node's local materialized index
#   - coordination: where seat leases live (a fleet needs the shared slot)
#   - node        : this process's identity, roles and labels
#   - api         : host / port / bearer-auth tokens
#   - secrets     : optional encryption keyring — encrypts the whole
#                   Tier B company config at rest (see below)
#   - logging     : how loud this node is (level) and in what shape (format)
#
# Everything else (roles, LLMs, MCP servers, integrations, policies,
# budgets) lives in the Tier B company YAML — versioned in the store and
# live-editable via the ``/config/*`` REST API.

logging:
  level: info       # debug, info (default), warn, error
  format: console   # console (default: columns, and colour on a terminal),
                    #   text (slog key=value), json (for a log shipper)

# ── The durable event log ─────────────────────────────────────────────
#
# `embedded` runs a NATS JetStream server inside this process: no
# listener, no port, no service to operate.  In the solo case there is no
# socket at all, so the broker cannot be reached from outside the
# process.
#
# store_dir is NOT optional for a real company.  Leaving it empty selects
# an in-memory server — right for a test, and a company that expects to
# survive a restart must not leave it unset, because nothing published
# outlives the process.
#
# `type: nats` dials an external NATS server or cluster instead, and takes
# `url` (plus `credentials` / `token` / `tls` where the estate demands
# them).  It is the same client code either way: embedded versus external
# is a connection choice, not a second backend.
stream:
  type: embedded
  store_dir: "./nimbus-data/stream"
  replicas: 1                     # 1 solo; 3 in a fleet, where it is what
                                  #   makes a publish quorum-durable

# ── This node's local database ────────────────────────────────────────
#
# One FILE, owned exclusively by this process for the life of the
# process.  It is not a shared database and there is no DSN: two engines
# pointed at one file corrupt it.  A fleet's nodes each keep their own
# rebuildable copy — the stream is the truth, this is the cache.
store:
  path: "./nimbus-data/nimbus.db"
  # There is no `driver:` here and no CREWLET_STORE_DRIVER either — Turso
  # is the database and the only one.  A file that still carries the key
  # is answered by name rather than as a typo.

# ── Seat ownership ────────────────────────────────────────────────────
#
# `local` keeps the leases inside this process — correct for exactly one
# node, and catastrophic for more than one, since every node would hold
# every lease and run every seat.  A fleet needs `embedded-kv`: the leases
# live in a replicated KV riding the STREAM's own NATS connection, which
# is what stops two processes running the same seat.  One connection
# deliberately — two to the same broker fail independently, so a node
# could go on renewing live leases over a working connection while the one
# carrying its inbox is dead: alive to its peers, deaf to its work.  See
# docs/guides/fleet.md.
coordination:
  type: local

# ── This process's identity ───────────────────────────────────────────
#
# The id is the STICKINESS hint a lease claim carries, so a restarted node
# tends to get its own seats back.  Empty reads CREWLET_NODE_ID and then
# defaults to node-0 — fine for one node, and a fleet must give each
# member a distinct, stable one.
node:
  id: "${CREWLET_NODE_ID}"
  # roles: [ingress, seats, workers]   # omit for all three
  # labels: {zone: eu-west}            # what a role's placement selector matches
  # max_concurrent: 32                 # agent turns THIS PROCESS runs at once.
                                       #   Per node, so a fleet's ceiling is
                                       #   N x this.  Omit for the default (32),
                                       #   which is above the seat count of a
                                       #   single-node company.  NOT the same
                                       #   knob as the cli-agent provider's own
                                       #   max_concurrent in the company YAML,
                                       #   which caps that provider's
                                       #   subprocesses — and on this pair that
                                       #   one (4) is the binding ceiling, not
                                       #   this one: a turn past it waits in
                                       #   this process for a CLI slot.

api:
  host: "0.0.0.0"
  # A port > 0 makes `crewlet run` start the EMBEDDED API inside the engine
  # process — one process serves engine + dashboard + webhooks.  Open the
  # dashboard at http://localhost:8000/ once it is up.
  #
  # 8000 rather than 80, deliberately.  The only reason to bind the plain
  # http port is so a webhook URL an external service registers needs no
  # `:port` suffix (http://host.docker.internal/webhooks/jira), and this
  # company has NO inbound webhook at all: Mattermost has none, so the
  # engine holds one outbound websocket per seat and nothing has to reach
  # it.  Port 80 would buy nothing and cost a privileged bind — on Linux a
  # non-root process needs `sudo sysctl net.ipv4.ip_unprivileged_port_start=80`
  # (persist in /etc/sysctl.d/) or CAP_NET_BIND_SERVICE.  Add a tracker or
  # a code host and 80 becomes worth it again; docs/guides/deployment.md
  # covers that shape.  In a SPLIT deployment the ingress node serves this
  # and the others set port 0 so only one process binds it.
  port: 8000
  auth:
    tokens:
      - id: founder
        token: "${CREWLET_API_TOKEN_FOUNDER}"

# ── Secret encryption at rest (OPTIONAL) ──────────────────────────────
#
# Uncomment to encrypt the ENTIRE Tier B company config at rest. With a
# keyring configured, the whole company payload is stored as one opaque
# AES-256-GCM blob (`{"__encrypted__": "enc:v1:…"}`) — org chart,
# policies, model choices, and every secret are ciphertext in the store.
# The keyring below is the sole root of trust: it lives here in Tier A /
# the environment, never in the store.
#
# Without this block (the default), Tier B is stored verbatim — secrets
# are `${VAR}` references resolved from the environment at construction
# time.
#
# Enable it:
#   1. Mint a key + snippet:   crewlet secrets keygen -key-id 2026-01
#   2. Export the printed key:  export CREWLET_SECRET_KEY_2026_01=<base64>
#   3. Uncomment the block, then encrypt the active revision once:
#        crewlet config seal
#   Afterwards only this key is needed to read the config.
#
# Rotate the master key with `crewlet config rekey` (keep the old key in
# `keys` until it succeeds). See docs/concepts/configuration.md#secrets.
#
# secrets:
#   active_key_id: "2026-01"          # which key seals NEW writes
#   keys:
#     - id: "2026-01"                 # colon-free id; stamped into every envelope
#       material: "${CREWLET_SECRET_KEY_2026_01}"   # base64(32 bytes)
#     # During a rotation, keep the previous key here so its ciphertext
#     # still decrypts, then drop it once `crewlet config rekey` completes:
#     # - id: "2025-07"
#     #   material: "${CREWLET_SECRET_KEY_2025_07}"
