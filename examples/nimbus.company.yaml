# yaml-language-server: $schema=../schema/company.schema.json
# Nimbus — Cloud-native infrastructure control plane + open AI framework
#
# A WHOLE COMPANY WITH NO OUTSIDE ACCOUNT.  Every surface its seats work on
# is the engine's own: Chatlet for chat, Worklet for work items, Doclet for
# pages and Gitlet for the code, each held in the fleet's own store with
# nothing to sign up for, provision or point a webhook at.  The one thing it
# needs from outside is a model — Claude Code on the plan you already pay
# for — and, for similarity recall, an OpenAI key for embeddings.
# examples/nimbus.config.yaml's header has the commands that run it.
#
# Every vendor surface is additive and documented on its own page — chat on
# Mattermost or Slack (docs/integrations/mattermost.md,
# docs/integrations/slack.md), a code host on GitLab or GitHub
# (docs/integrations/gitlab.md, docs/integrations/github.md), the tracker
# and the wiki on Jira and Confluence (docs/integrations/jira.md,
# docs/integrations/confluence.md).  Chat, the tracker and the wiki are each
# ONE axis: a vendor there replaces the engine's own (`chat.backend`,
# `tracker.backend`, `knowledge.backend` below) rather than joining it.  A
# code host is the exception: Gitlet runs beside GitLab or GitHub.
name: "Nimbus"
mission: "Turn any hardware into cloud-native infrastructure — and give AI teams one open framework to build on top of it"
vision: >
  Phase 1 (shipped): a cloud-native control plane that turns bare metal, on-prem, cloud, and edge
  hardware into seamless Kubernetes clusters ready to serve AI/ML pipelines and applications at
  enterprise scale.
  Phase 2 (in progress): an open, Python-first framework — analogous in spirit to Ray — that runs
  on Nimbus clusters and unifies how teams develop, schedule, and serve distributed AI workloads
  (training, fine-tuning, batch inference, online serving). The framework owns the developer surface
  (SDK, CLI, examples, docs); the control plane (nimbuscore) owns the cluster surface (provisioning,
  multi-region, GPU scheduling primitives). The two are designed together.

policies:
  - "Communicate decisions in writing"
  - "Capture personal-context facts you need to recall later (delegation context, stakeholder preferences, ongoing operational state) via `reflect_and_persist` — pass `ttl_days` for facts that age out naturally (e.g. delegation context lasts the change's lifetime)"
  - "Document team-shared knowledge (decisions, conventions, runbooks) as pages in the company knowledge base so other agents can read it — `reflect_and_persist` writes are personal-only"
  - "Use work items to manage all product backlog items — never track tasks only in memory"
  - "Use pages to document architecture decisions, runbooks, and meeting notes — search before creating new docs"
  - "Each engineering role owns specific repositories (see the `Repo Ownership` page in the LEAD space); in a repository you do not own, work only on your own branch and propose it as a change for its owner to review"
  - "The Phase-2 AI framework is developed in a dedicated repository owned by AI Systems Engineering; the control plane (nimbuscore, nimbusk0s) stays focused on cluster-level primitives that the framework depends on"

# The company's ONE clock, as an IANA zone (default UTC).  Every calendar
# edge the engine cuts is cut on it: where "today" and "this week" begin
# for a ``due=`` filter, a due band, an overdue mark and each person's own
# day; what a relative date ("next Friday") or an all-day due date resolves
# to; and the wall clock a schedule that names no ``timezone`` of its own
# fires on — so the 09:00 schedules below fire at 09:00 in Berlin.  A clock for
# AUTHORED instants and calendar edges only: no duration is measured
# against it, because a duration measured on a wall clock changes length
# twice a year.  See docs/getting-started/configuration.md.
timezone: "Europe/Berlin"

# How the company's people sign in, the same on every node and changed from
# Settings › Sign-in policy without a restart.  Each node holds these within
# its operator's limits (`api.auth.limits` in nimbus.config.yaml), so a value
# past one is refused there.  Left out, a session lives 7 days, ends after 12
# hours unused, a sensitive change asks again after an hour, a password is at
# least 12 characters and a second factor is required.  This walkthrough runs
# on loopback, so it lets people sign in with a password alone.
sign_in:
  require_second_factor: false
  # session_lifetime_seconds: 604800
  # idle_timeout_seconds: 43200
  # step_up_seconds: 3600
  # min_password_length: 16

# Company-wide token budget — ceilings on total LLM tokens across EVERY
# agent (CEO, CTO, PM, DevRel, the three engineers, their sub-agents, and
# the learning/aux passes), one per calendar WINDOW on the company clock
# above.  Every model round is charged against the company's ceilings
# BEFORE a seat's own; the first completion that would push a window past
# its ceiling stops that turn and emits a ``budget_exhausted`` event
# (budget_type="org").
#
# Each key is optional and a window with no key has no ceiling: ``day``
# runs Berlin midnight to midnight, ``week`` is the ISO week from Monday,
# ``month`` the calendar month, and each opens again on its own when it
# turns over.  0 is refused rather than read as "unlimited" — leave the key
# out instead.  Here the month is the company's allowance (roughly four
# weeks of the schedules below plus ordinary chat traffic for seven seats)
# and the day is the fuse: a runaway loop burns at most one day's allowance
# before the company stops, rather than the month's.  No per-agent
# ``token_budget`` is set below, so these two are the only ceilings in
# force and the whole company shares them.
#
# THEY STILL APPLY ON A SUBSCRIPTION.  A plan is not metered per token by
# its vendor, but the harness reports its usage and the engine counts it —
# so the day ceiling is what stops a scheduling loop burning a whole plan
# window overnight.
#
# Usage is durable — the counter lives in the fleet's coordination store,
# so it survives engine restarts and is one number for the whole company
# however many nodes run it.  See docs/getting-started/configuration.md
# § Token budgets and docs/guides/deployment.md § Token Budgets.
token_budget:
  day: 3000000                                  # 3M tokens per Berlin day, org-wide
  month: 40000000                               # 40M tokens per calendar month, org-wide

# Skill variables — generic name->value facts substituted into tool-skill
# text wherever a skill writes ${name}.  NIMBUS DECLARES NONE, and that is
# what running Worklet and Doclet buys here: the one address
# its skills need is where people reach this deployment's dashboard, and the
# engine injects that itself as ${crewlet_base_url} from ``api.external_url``
# in the OPERATOR's own Tier A file.  The bundled platform-mentions skill
# builds every shareable link on it (${crewlet_base_url}/#/worklet/ENG-42 and
# ${crewlet_base_url}/#/doclet/pages/{page-id}), so there is nothing for
# an operator to keep in step.
#
# The name is RESERVED: a company that declares ``crewlet_base_url`` itself
# is refused, because two sources for one address is how a skill comes to
# link at the deployment the company used to run on.  A company on a vendor
# tracker declares that vendor's browser-facing base here instead.
# See docs/concepts/tool-skills.md#skill-variables.

providers:
  llm:
    # ── The one model: Claude Code on YOUR subscription ─────────────
    #
    # Every model is reached through a harness the engine drives — the
    # vendor's own harness, not an HTTP client of Crewlet's.  This company
    # runs on Claude Code, headless, on the flat-rate plan you already pay
    # for, so no model key is metered per token.  Crewlet never sees a
    # password: the harness holds the vendor's own OAuth login and
    # `crewlet llm login` only decides WHERE that credential lands.
    #
    # On an Anthropic API key instead, the same entry takes
    # `auth: { mode: api-key }` (it reads ANTHROPIC_API_KEY) in place of the
    # plan.  `harness: codex` (OpenAI's models) and `harness: opencode` run a
    # seat's executor too; opencode reads `model` in its own grammar,
    # <provider>/<model> (anthropic/claude-sonnet-5).  The rest serve only a
    # seat's reviewer, workers and side passes, through llm_review /
    # llm_subagent / llm_auxiliary.
    #
    # PREREQUISITE: the `claude` binary on the machine running
    # `crewlet run`, and one of these, once, with the keyring and founder
    # token examples/nimbus.config.yaml's header exports set (the command
    # loads that file):
    #
    #   crewlet llm login default -from-host  -company examples/nimbus.company.yaml \
    #                                         -config  examples/nimbus.config.yaml
    #
    # `-from-host` COPIES the login this machine already has into Crewlet's
    # own directory; your own ~/.claude is never read at runtime, because
    # each seat's child process gets its own HOME.  Plain
    # `crewlet llm login default` instead brokers `claude auth login`
    # attached to your terminal, for a machine with no login yet.  It
    # returns you to your shell once you have signed in — if a login
    # command ever leaves you sitting in an interactive session, it did
    # not run the vendor's auth subcommand.
    #
    # `-capture-token` is the better route where you can take it — it mints
    # a headless CLAUDE_CODE_OAUTH_TOKEN, so there is no credential file to
    # sync and no refresh token shared with your personal login — but it
    # writes into the ENCRYPTED SECRET STORE, sealed under the Tier A
    # keyring examples/nimbus.config.yaml declares (`crewlet secrets keygen
    # -key-id 2026-01` prints the key to export).
    #
    # Then, before the first turn:
    #
    #   crewlet llm doctor default -company examples/nimbus.company.yaml \
    #                              -config  examples/nimbus.config.yaml
    #
    # With the engine stopped both commands reach the fleet's secret store
    # themselves, through this node's own broker.  Once the engine runs,
    # they go through it: run them with CREWLET_API_TOKEN set to
    # $CREWLET_API_TOKEN_FOUNDER.
    #
    # `doctor` is the command that matters here.  An entry can be
    # configured perfectly and still not work — a missing binary, a
    # profile whose flags drifted from the installed version, an expired
    # login, or the one nothing else catches: a harness that never reaches
    # the seat's tools — the `crewlet` MCP server it is handed — and
    # answers in prose with nothing called, which ends the phase without
    # its submission.  Only a real run calling a real tool proves that, so
    # `doctor` runs one.
    #
    # See docs/concepts/llm-backends.md.
    default:
      harness: claude-code          # the default, written out
      model: sonnet                 # whatever `claude --model` accepts:
                                    #   haiku | sonnet | opus, or a full
                                    #   model id.  Sonnet, because this
                                    #   company's seats write and review
                                    #   code across its projects; haiku
                                    #   is cheaper against a plan window
                                    #   and faster to launch, but the
                                    #   weakest at calling the seat's tools
                                    #   when it should, which is what
                                    #   `crewlet llm doctor` exercises.
      run_in: direct                # where a seat's executor runs on this
                                    #   entry: a cell of providers.sandbox
                                    #   below.  On the ENTRY rather than the
                                    #   seat, because it is a property of
                                    #   this runtime: whether its work gets
                                    #   the engine user's reach (direct) or
                                    #   none of the host's files (container).
      # ONE LOGIN, NAMED.  state_dir defaults to a directory derived PER
      # PROVIDER KEY (~/.crewlet/llm-harness/default here), so a second entry
      # on this same login — a per-phase model on the same plan, say —
      # names this same path to share it.  That is deliberately explicit:
      # two unrelated providers must never silently collide and prune each
      # other's state.  The login is shared per harness: each keeps its
      # files in a subdirectory named for it (here .../claude/claude-code),
      # so an entry on this path that drove another harness would share
      # nothing.
      #
      # A LITERAL PATH — unlike every credential field here it is not
      # ${VAR}-expanded, because it names where the engine keeps files
      # rather than a secret (the same reason the store path is a Tier A
      # field).  So it lives under ./nimbus-data with everything else
      # this example writes, which does mean `rm -rf nimbus-data` logs
      # the harness out; `crewlet llm login default -from-host` puts it back
      # with no browser round-trip.  Point it at a persistent volume
      # when the engine runs in an ephemeral container.
      state_dir: "./nimbus-data/llm-harness/claude"
      max_concurrent: 4             # harness processes on this host at once (the
                                    #   reviewer, workers, side passes),
                                    #   ACROSS the whole company; executor
                                    #   runs are not counted — each seat
                                    #   runs one at a time.  Written out rather than
                                    #   left to the identical default,
                                    #   because on this backend it is the
                                    #   knob that shapes the deployment:
                                    #   each process is a full Node runtime
                                    #   at ~200-400 MB resident (4 keeps peak
                                    #   near 1.5 GB), and a subscription plan
                                    #   throttles concurrency far below what
                                    #   an API key allows — so a higher
                                    #   number mostly buys rate-limit errors.
                                    #   Note it is a SEPARATE ceiling from
                                    #   Tier A's node.max_concurrent (32
                                    #   turn segments): a reviewer, worker
                                    #   or side pass past this queues for a
                                    #   harness slot, and the learning passes
                                    #   below queue for the same four.
      auth:
        mode: subscription          # subscription (default) | api-key | inherit-env | env.
                                    #   Deliberately not inherit-env: a
                                    #   backend that silently picked up a
                                    #   stray ANTHROPIC_API_KEY would bill
                                    #   the metered account while you
                                    #   believed you were on a flat rate.

  # A second plan of the same model makes a FLEET: a seat set to
  # fleet:<key> runs each new turn on whichever member has room, so seats
  # spread across the plans instead of spending the first one first.  Every
  # company also has default-fleet, empty until written.  Members are entries
  # of one model class on one harness.  See docs/concepts/llm-fleets.md.
  # llm_fleets:
  #   claude-sonnet:
  #     name: Claude Sonnet
  #     strategy: balanced            # balanced (default) | sequential
  #     members: [default, second-plan]
  embeddings:
    type: openai
    # The model decides the width — 3072 here — so `dimensions` is left
    # unset. It is an override for deliberately shortening a vector, not a
    # field every config has to carry.
    model: text-embedding-3-large
    api_key: "${OPENAI_API_KEY}"
  # Code sandbox — where every agent seat's executor runs.  A seat's
  # executor is its harness's own run (Claude Code, the default entry's
  # harness, with that SAME model and that same plan login), in a box from
  # this catalogue; an engineering seat's run checks a repository out of
  # Gitlet (``code`` below) with `code_checkout`, implements the work on the
  # seat's own branch and proposes it as a change.
  # Here every box is a `direct` box on the engine host, which keeps each
  # run's state apart but does not isolate the host: see the catalogue
  # below.  See docs/concepts/code-sandbox.md.
  #
  # NO EXTRA CREDENTIAL.  The harness those boxes run is the `default`
  # entry's `claude-code`, and in either cell the backend seeds that
  # provider's credential files into the box and writes the refreshed one
  # back afterwards — so the run uses the subscription `crewlet llm login`
  # already established.  Nor does the box's git need one: the engine hands each
  # run its own Gitlet credential, scoped to the repositories it checks out
  # and ending with the run, and configures the box's git to present it —
  # at the address CREWLET_BOX_GIT_URL names, which
  # examples/nimbus.config.yaml's header exports.  A node without it refuses
  # every checkout (`sandbox_git_url_unset`) rather than grant a box a
  # repository it cannot reach.
  sandbox:
    # THE PROVIDER BLOCK IS A CATALOGUE: it says how boxes are made, and
    # each providers.llm entry places its runs in one of its two cells with
    # its `run_in` — the run whose harness needs this machine's own reach and
    # the run whose generated code must reach none of its files are different
    # runs, and a company-wide cell could only ever answer for both.
    #
    # This company runs every executor `direct`: each seat's executor runs
    # as a process tree on the machine running `crewlet run` — no image,
    # nothing to provision — as a first run on your own machine while its
    # seats take work from you alone.  Every executor is its harness, fully
    # permissioned, as the engine's user, so before a seat takes work from
    # anyone else (a person you invite onto a seat, a vendor chat or code
    # host), or on a host others share, move the executors into `container`
    # (below), which the plan login still seeds.
    # Its image must carry the harness (Claude Code here) as well as the
    # toolchains those seats' setup steps check for (Go, Node with
    # corepack, uv): a step only checks for its tool, so nothing installs
    # either into the image.
    # (`fake: true` is in-process stubs for a demonstration — it runs no
    # real harness.)
    #
    # PREREQUISITE for the local backend: the harness the entries drive
    # must be installed on that machine, since `direct` runs it as a child
    # process: the `claude` binary here, Claude Code's own CLI, and
    # `opencode` (OpenCode 2.3.2, the @opencode/cli package) for an entry on
    # the other harness that runs an executor.  So must each engineering seat's toolchain (Go; Node
    # with corepack; uv), and git 2.40 or newer, Gitlet's floor for every
    # client, which a checkout's first command checks: a `direct` box's
    # setup commands run on that machine as the engine's user, so the
    # seats' steps below CHECK for their tools and name what is missing,
    # rather than install anything on the host.
    local:
      # The local backend serves both cells, chosen per entry:
      #
      #   run_in: direct     state isolation only — each box gets its own
      #                      HOME, XDG directories and an allowlisted
      #                      environment (never the engine's own tokens),
      #                      and writes outside the box are refused — but
      #                      the agent runs as the engine's user with the
      #                      engine's filesystem access. The right trade for
      #                      a first run on your own machine while its
      #                      seats take work from you alone, the wrong one
      #                      once a seat takes work from anyone else, or
      #                      on a host others share.
      #
      #   run_in: container  real host isolation. Needs an image carrying
      #                      the harness, and is where a container box is
      #                      SIZED (run_args takes --cpus/--memory):
      #
      #                        image: "your-registry/harness:latest"
      #                        runtime: auto      # auto | docker | podman
      #                        run_args: ["--cpus", "2", "--memory", "4g"]
      #
      #                      It is also the one cell a seat's own browser
      #                      runs in (role.sandbox.browser: true), on a Linux
      #                      host whose Docker Engine or Podman shares its
      #                      kernel with the boxes: every entry such a seat
      #                      launches on names run_in: container, and the
      #                      image carries Node 22 and Chromium
      #                      (code-sandbox.md, recipe 3). Chromium keeps its
      #                      own sandbox, which Docker's default seccomp
      #                      profile refuses: give the box Playwright's
      #                      profile, or else waive the sandbox:
      #
      #                        run_args: ["--security-opt", "seccomp=/etc/crewlet/playwright-seccomp.json"]
      #                        chromium_sandbox: waived   # Chromium with --no-sandbox
      state_dir: "./nimbus-data/sandboxes"       # box directories; removed at teardown,
                                                 #   and one a crashed engine left is
                                                 #   reclaimed by its node
    # WHERE A RUN ON AN ENTRY THAT NAMES NO run_in HAPPENS. Required for
    # `local:`, which serves two cells, `direct` and `container`, unless
    # every entry a seat's executor launches on names its own. There is
    # deliberately no implicit answer: `direct` runs the harness as the
    # engine's user, which is a trade to make deliberately and never one to
    # inherit by accident, and `container` needs an image.
    default_run_in: direct                       # direct | container
    host_grace_seconds: 900                      # how long a node that launched boxes may be away (a restart, a deploy) before its runs are recorded lost or released, and the orphan reaper's cutoff on its box root — NOT a run cap: a job runs as long as it needs. 900 is the default.
    default_pause_ttl_seconds: 1800              # a sandbox blocked on a person's answer is PAUSED (its working tree held as it was if they reply soon; the run's harness session is continued in any box where the turn kept it); a paused box costs its state for as long as it is held, so the engine reaps it after this long and re-seeds from the pushed branch. 0 = never pause, always re-seed; omit the key entirely for this 1800s default.
    # ENGINE-WIDE setup steps — applied to every agent seat's box
    # before each role's own role.sandbox.setup extras.  Put anything shared
    # by ALL seats here exactly once; keep stack-specific provisioning
    # (Go/Node/Python below) on the owning role.  The engine ships NO steps
    # of its own — provisioning is entirely this config.
    #
    # NO GIT-AUTH STEP, and nothing is missing: the company's code is on
    # Gitlet, and a repository there is GRANTED to a run rather than
    # cloned by a recipe.  The run's agent calls `code_checkout` through
    # its tool bridge, the engine writes the grant on the run's record and
    # answers the commands that clone it, and the box's git already carries
    # the run's own credential and the seat's commit identity, set by the
    # engine.  A recipe that configured git for Gitlet would only be a
    # second copy of that, which the engine's own configuration overrides.
    # A seat on a vendor code host needs one; docs/integrations/gitlab.md
    # has the recipe.
    setup:
      - name: nimbus-conventions
        brief: >-
          Every Nimbus repository lives on Gitlet, the company's own git
          host. Check one out with `code_checkout` — it answers the
          commands that clone it into your working directory on your own
          branch, `seats/<your handle>/<the work item's key>` — and push
          there; no seat pushes to `main`. Propose your branch as a change
          (`open_change` on the checkout, or the change tools), keep each
          change small and focused, and stay inside the repositories your
          brief names: each has one owning seat, and work in another
          seat's repository goes to its owner as a change.

# Ask Crewlet: a chat in the dashboard that answers questions and
# prepares changes for approval, acting only as the signed-in person.
# Off until it is assigned a model: any providers.llm entry on a harness a
# helper can run (claude-code or pi), here the seats' default.  It runs the
# entry with the harness's own web tools off and no tool of its own, while
# the seats keep theirs.  token_budget caps each person on top of the
# company's own budget.  See docs/getting-started/configuration.md#ask-crewlet.
# assistant:
#   model: default                  # or fleet:<key>, any member of a fleet
#   token_budget: { day: 200000 }

# Turn engine — executor/reviewer settings.  Includes the round-cap
# extension judge for the first-turn onboarding pass: when the pass
# exhausts its base round cap without finishing, a cheap LLM judge
# inspects the tool log and decides whether to grant more rounds (the
# agent is making progress) or fall through to the existing rescue path
# (the agent is thrashing).  See
# docs/concepts/turn-engine.md#round-cap-extension-judge.
turn_engine:
  extension_enabled: true                 # round-cap extension judge
  extension_round_step: 8                 # max rounds the judge may grant per call
  # llm_judge per role is not set — the judge falls back to the role's
  # main ``llm`` (here: the org-wide ``default`` provider).
  # Delegation bounds are left at their defaults here; the two templates
  # below are what a seat actually reaches for.

# Worker templates — the reusable delegates a seat's executor hands work
# to with ``delegate``.  A template holds the half of a worker that does
# not change per task (persona, tools, model, answer shape) so the seat
# writes only the task itself.  NAMING A TOOL HERE GRANTS NOTHING: every
# name still passes the worker filter — the caller's own live tools,
# minus the engine-control denylist, minus anything that writes to a
# shared surface.  See docs/concepts/turn-engine.md#workers.
workers:
  researcher:
    description: >-
      reads the team's own pages and reports what they actually say,
      with the page titles it read
    system_prompt: |
      You research a narrow question against the team's knowledge base.

      Report only what you can point at. Where the pages do not answer
      the question, say so plainly rather than filling the gap — the
      agent that delegated this cannot tell your inference from what a
      page said, and will act on both.
    tools: [search_knowledge, get_page]
    max_turns: 10
    output:
      type: object
      properties:
        findings:
          type: string
          description: What the pages say about the question, in your own words.
        sources:
          type: array
          items: {type: string}
          description: The titles of the pages you actually read.
        gaps:
          type: string
          description: What the question asked that the pages do not answer.
      required: [findings]

  synthesist:
    description: >-
      reconciles several workers' findings into one recommendation with
      its open questions
    system_prompt: |
      You are given other workers' answers as your input. Reconcile them
      into one recommendation.

      Where they disagree, say so and say which you believe and why —
      the agent reading you has to act on ONE answer, and averaging two
      contradictory ones produces a third that neither worker supports.
    # No ``tools:`` at all — a synthesist reasons over what it was given.
    # A worker with no tools cannot go looking for anything, and that
    # bound is worth having on purpose.
    max_turns: 4
    output:
      type: object
      properties:
        recommendation:
          type: string
          description: The single answer the parent should act on.
        disagreements:
          type: string
          description: Where the inputs conflicted, and which you believed.
        open_questions:
          type: string
          description: What nobody answered and somebody has to.
      required: [recommendation]

# Agent-learning subsystem — episodic memory, reflection, skill
# synthesis/refinement/promotion, counterparty profiling.  Auto-disables
# when the database or embeddings provider above is missing.
# See docs/concepts/agent-learning.md.
learning:
  enabled: true
  reflect:
    enabled: true                          # PersistDecider runs after every terminal turn
    summarize_episodes: true               # cheap-model briefing of the Similar prior work hits
  counterparty:
    enabled: true                          # observe + auto-inject counterparty traits
  skill_synthesis:
    enabled: true                          # single-turn synthesis on >=5 tool calls
    scheduler_enabled: true                # background clustering pass for cross-turn patterns
  skill_refinement:
    enabled: true                          # observed-in-practice / counter-example notes
  skill_promotion:
    enabled: true                          # promote sibling skills to unit scope
  personal_memory:
    max_refreshes_per_turn: 3              # cap on distinct context_hint values per turn
  episode_lifecycle:
    # Drains the episodes table on a write-triggered, demand-proportional
    # cadence: drops non-terminal noise + skill-consolidated rows past
    # grace, LLM-compacts clusters of similar routine turns into
    # kind='compacted' aggregate summaries.  See agent-learning.md.
    max_raw_episodes_per_agent: 500        # threshold that fires CompactionRequested
    non_terminal_max_age_days: 14          # drop self_iterate past this
    consolidated_grace_days: 30            # drop skill-consolidated raw rows past this
    compaction_min_age_days: 30            # only compact raw rows older than this
    compaction_min_cluster_size: 3         # singletons / pairs left raw
    compacted_max_age_days: 0              # 0 = keep compacted summaries forever

# Scheduler — role/unit-scoped recurring work (cron analogue).  Auto-enabled
# because the org below declares ``schedules:`` and a database is configured.
# See docs/concepts/scheduling.md.
scheduling:
  enabled: true
  tick_seconds: 10
  jitter_seconds: 30                       # spread schedules that share a popular cron minute (e.g. 9am)


# NO ``integrations:`` BLOCK, and that is the point of this example: every
# surface below is the engine's own, so there is no vendor account to
# provision, no per-seat vendor token to seal and no webhook to register.
# Each integration a company adds goes here — Mattermost or Slack for chat,
# GitLab or GitHub for code, Jira and Confluence for the tracker and the
# wiki — and its page shows the blocks: docs/integrations/.

# Which chat this company talks on: Chatlet, the engine's own — channels,
# threads, direct messages, mentions and reactions, held as records on the
# company's own log and read in the dashboard.  Every seat is given its chat
# tools (``post_message``, ``reply_in_thread``, ``send_dm``,
# ``read_channel`` and the rest) with no MCP server to run, and every person
# talks as the human seat they hold, so the founder below needs no contact
# identity to be reached: she is ``@jane-founder``.
#
# ONE AXIS, as the tracker and the knowledge base below are: ``vendor``
# (Mattermost or Slack) REPLACES Chatlet rather than joining it, and a
# company naming ``chatlet`` beside an ``integrations.mattermost`` or
# ``integrations.slack`` block is refused — with two live chat homes a
# person replies where the agents are not reading.
#
# An unset ``backend`` DERIVES the same answer from the absence of a vendor
# chat block; it is written out because this is the reference example and a
# reader should see the choice rather than infer it.
#
# Each unit's room is the ``channel`` it names in the org chart below: the
# engine creates and staffs it — every seat in the unit's subtree and its
# lead — and a message there wakes the unit's own agent seats.  A child unit
# that names none inherits its parent's.  See docs/concepts/chatlet.md.
chat:
  backend: chatlet
  chatlet:
    # ``typing_status`` drives the working indicator a seat shows while it
    # reasons about a message.  ``addressed`` shows it only when someone is
    # actually waiting on THAT seat — a direct message, a direct @mention,
    # or a thread it already follows — which keeps a room from lighting up
    # one indicator per seat on every message.  ``always`` (the default)
    # covers every turn a message wakes.
    typing_status: addressed
    # ``message_retention_days`` is left at its default, a year (30..3650;
    # 0 keeps messages for ever), and ``default_channel_private`` at false:
    # a room created without a stated visibility is readable by every seat.

# Which tracker and which knowledge base this company runs.  Nimbus runs
# Worklet and Doclet: its work items and its pages live in the fleet's own
# store, replicated to every data node, with no third-party account behind
# either.  ONE OF EACH: naming ``worklet`` or ``doclet`` beside an
# ``integrations.jira`` or ``integrations.confluence`` block is refused,
# because work would be filed in two places with nothing keeping them in
# step.  The two axes are independent: a company may run Worklet against a
# Confluence wiki, or Jira against Doclet.
#
# An unset ``backend`` DERIVES the same answer from the absence of the
# vendor block, so both fields could be dropped; they are written out here
# because this is the reference example and a reader should see the choice
# rather than infer it.
tracker:
  backend: worklet

  # The clock Worklet's dates mean is the company's own ``timezone`` at
  # the top of this file, and how long a person's inbox keeps Worklet's
  # notices is the company's too: ``inbox``, below.

# How long a person's inbox keeps a notice.  A person's inbox is every
# native domain's notices under one set of rules, so the horizon that
# ages it is the company's rather than any one domain's, and it is left at
# its default here: ``inbox: {retention_days: 365}``, a year (30..3650).
# It is the one horizon that deletes anything, and what it deletes is a
# DERIVED inbox row rather than the history it points at, which answers
# for ever.

knowledge:
  backend: doclet

  # Read scope deliberately omitted (``scope`` unset), and on Doclet that
  # is the ordinary case rather than a decision: the pages
  # are the company's own, every seat reads them through the engine, and
  # there is no third-party permission model underneath to mirror.  Set
  # ``scope: [...]`` to narrow the turn-start search to a curated set of
  # containers.  This is independent of each unit's ``space`` identity
  # below, which is for routing + writes, not reads.
  #
  # ``skills_container`` (default ``TS``) and ``root_space`` (default
  # ``HOME``) are both left unset.  Both are reserved: excluded from search
  # and routing, and refused as a unit's own ``space``.
  # See docs/concepts/knowledge-system.md.

# Gitlet, the engine's own git host, holds every Nimbus repository: each is
# rows every data node holds, and each push's bytes are one object in the
# object store.  Seats read it through the ``code_*`` tools, and an
# engineering seat's executor checks a repository out with ``code_checkout``
# (see the sandbox above).  People clone and push over HTTPS at
# ``<api.external_url>/git/<name>.git`` with a token of their own
# (``crewlet iam token -login`` mints one) as git's password.
#
# Every activation reconciles this list: a name added is created, a changed
# setting is settled, and a repository removed from it is DELETED —
# restorable by declaring it again for ``deleted_retention_days`` (unset:
# 7) — and purged after that, its name free again.  An owner is a unit (by
# its id, or its name when it has none) or a seat (by its handle).
#
# WHO MAY DO WHAT IS DERIVED FROM THE CHART, never listed: a seat's
# ``code.access`` (on each role below) caps it, and its relation to the
# owner decides within that cap.  The four control-plane and console
# repositories and the framework's belong to the Core unit, so its
# engineers — ``full_access`` — write them, and Core's effective lead, the
# CTO, maintains them; which engineer owns which repository is the
# company's own convention, written down on the Repo Ownership page and in
# each seat's brief rather than in a grant.  Every other seat reads them
# (``visibility`` unset is ``company``).  A ``full_access`` seat also owns
# ``refs/heads/seats/<handle>/`` on every repository it reads, which is
# where DevRel proposes a docstring or an example into an engineer's
# repository.
#
# A protection rule matches branches or tags by glob (``*`` one path
# component, ``**`` any number).  A plain rule on ``main`` refuses every
# seat's push to it (``direct_push`` unset is ``persons``) and every force
# and delete, so a seat's work reaches ``main`` only as a change it proposes
# and merges — a ref no rule matches may be force-pushed or deleted, which
# is why ``crewlet validate`` warns about a default branch left unprotected.
# ``direct_push: none`` freezes the refs it matches, a person's push
# included.
#
# The framework and the docs site start EMPTY: the first commit a seat
# pushes starts the branch, so declaring them now is the decision to have
# them, which the AI Systems Engineer and DevRel then fill.
#
# ``scratch`` is left unset: a seat's own repositories, ``<handle>.<slug>``,
# which only its tools make, are at most 50 a seat (``max_per_seat``) and
# deleted once idle for 7 days (``idle_days``) unless a live turn holds one.
# ``checks`` is left unset too, and the checks a repository defines in its
# ``.crewlet/checks.yaml`` run in no box here: a check runs a change's own
# code, so never in a ``direct`` box, only in a container made from
# ``providers.sandbox.local.image``, which this direct catalogue does not
# set.  Setting it runs them, on the Gitlet node that claims each one.
#
# ``identity_domain`` is the domain a commit the engine builds through a tool
# spells its addresses in: its committer, ``Crewlet <engine@example.com>``,
# and the author of a seat whose role states no email address,
# ``<handle>@example.com`` — the identity a box's own commits carry too.
# Unset is ``seats.invalid``, a name nobody owns.
# See docs/concepts/gitlet.md.
code:
  backend: gitlet
  identity_domain: example.com
  repos:
    - name: nimbuscore
      owner: {unit: core}
      description: The Go HTTP/REST control-plane service. Agent SWE's.
      protect:
        - branch: main
        - branch: release/*
          direct_push: none
    - name: nimbusk0s
      owner: {unit: core}
      description: The k0s-based worker image. Agent SWE's.
      protect:
        - branch: main
    - name: console
      owner: {unit: core}
      description: The authenticated management dashboard (React + Vite + TypeScript). Agent Frontend SWE's.
      protect:
        - branch: main
    - name: website
      owner: {unit: core}
      description: The public marketing site. Agent Frontend SWE's.
      protect:
        - branch: main
    - name: nimbusflow
      owner: {unit: core}
      description: The Phase-2 Python-first AI framework. Agent AI Systems Engineer's.
      protect:
        - branch: main
    - name: docs
      owner: {unit: developer-relations}
      description: The developer docs site. Agent DevRel's.
      protect:
        - branch: main
    - name: infra
      owner: {seat: agent-cto}
      description: Deployment manifests for the Nimbus control plane.
      protect:
        - branch: main

# NO ``mcp_servers:``, and nothing is missing.  Chat, work items, pages and
# code are BUILTIN tools on this company — Chatlet's, Worklet's, Doclet's
# and Gitlet's — granted to every seat without a server to run, a process to
# supervise or a token to mint.  Web research needs no server either: a
# seat's Claude Code keeps its own web search and fetch (WebSearch,
# WebFetch) on the same plan login, so the PM's and DevRel's "use web
# search" guidelines are met with no search vendor's account.  A company
# adds a server here for a system the engine has no tool for — its own
# APIs, or a vendor surface — each with its own credential; see
# docs/guides/tools-and-mcp.md.

# Root-level seats — above all units.  The founder is a HUMAN seat at
# the top of the chart: agents know who she is (identity prompts say
# "Reports to: Jane Founder (human)" for the CEO), the Agent CEO
# escalates to her in chat or on the work item with an @-mention, and what
# she writes in chat, on a work item, on a page or on a change is
# attributed to her seat by name in agent prompts.  She manages only the
# top agent — lead inheritance handles the rest of the tree.
# See docs/concepts/humans-in-the-org.md § The founder seat.
roles:
  - name: Jane Founder
    handle: jane-founder                       # the seat's IDENTITY, stated rather than
                                               #   left to be minted: an import mints a
                                               #   missing one from the name, so a name
                                               #   corrected in this file would be a new seat
    kind: human
    goal: "Own Nimbus's direction and make the final call on what ships"
    backstory: "Founder of Nimbus."
    responsibilities:
      - "Final approval on strategy, roadmap trade-offs, and high-impact bets"
      - "Unblock anything the Agent CEO escalates"
    manages: [agent-ceo]                       # BY HANDLE: `manages:` names seats by their
                                               #   handle and units by their key, so a
                                               #   changed display name moves no reference
    # NO ``contact`` block.  A contact identity is how agents reach a
    # person on a VENDOR surface — a Mattermost username, a Slack user id,
    # a GitLab username — and this company runs none: on Chatlet, Worklet,
    # Doclet and Gitlet she acts AS this seat, so a mention of
    # ``@jane-founder`` is how she is reached.
    #
    # WHO SHE IS ON THE DASHBOARD is not written here either.  She signs in
    # as a person in the identity directory, invited ONTO this seat — from
    # its card in Company › Structure (Invite), or `crewlet iam invite
    # <address> -seat jane-founder`.  Every person holds a human seat from
    # the moment they join, so there is no separate bind: the directory
    # binds her here as her invitation is redeemed, and what she says in
    # chat, files or pushes is hers.  A credential is something a person
    # holds, and the company document names none of them.

# Flexible org — units can nest to any depth.
# Each unit has a type (department, team, squad, pod, etc.) and can
# contain roles directly and/or child units.
units:
  - name: Leadership
    id: leadership                             # the unit's KEY: what `manages:` and a
                                               #   root seat's `unit:` resolve.  The name
                                               #   above is display, so renaming the team
                                               #   moves nothing that points at it.  Stated,
                                               #   because a missing one is minted from the
                                               #   name on every import of this file
    type: department
    lead: agent-ceo                            # the LEAD'S HANDLE, never its display name
    # The unit's ROOM on Chatlet (``chat`` above): created and staffed by the
    # engine with every seat in the unit's subtree and its lead, and
    # inherited by a child unit that names none, so Executives talk here too.
    # Two units naming one channel is refused: a room belongs to one unit.
    channel: leadership
    children:
      - name: Executives
        id: executives
        type: team
        lead: agent-ceo
        # Tracker + knowledge identity — the project this unit files work
        # in and the container it writes pages to.  Inbound activity with
        # no better recipient (unassigned items, page changes nobody was
        # mentioned in) routes to the unit lead (Agent CEO), and the
        # container is the team's write / skill-promotion home.  The keys
        # are VENDOR-NEUTRAL: they name a Worklet project and a Doclet space,
        # or a Jira project and a Confluence space, depending on which
        # backends the company runs; the org chart does not change when it
        # switches.
        # NEITHER is a tool credential (a vendor tool's would be per-agent,
        # under a role's ``mcp_env``) and neither scopes knowledge reads.
        project: "LEAD"
        space: "LEAD"
        roles:
          - name: Agent CEO
            handle: agent-ceo
            goal: "Define Nimbus's product vision and strategic direction, prioritize high-impact initiatives across product and engineering, make final calls on roadmap trade-offs, and ensure the team stays aligned on building an open, composable infrastructure control plane that wins in the AI/ML and enterprise market"
            backstory: >
              Founder-minded CEO with deep roots in cloud infrastructure and platform engineering.
              Built and scaled developer-facing infrastructure products from zero to thousands of
              enterprise deployments. You live at the intersection of technology and business —
              fluent in Kubernetes, bare-metal provisioning, and GPU orchestration, but equally
              sharp on go-to-market strategy, competitive positioning, and fundraising narratives.
              You understand that Nimbus competes against the incumbent enterprise Kubernetes
              management platforms and hyperscaler-native stacks — and you know exactly where
              Nimbus's open, composable approach creates defensible differentiation. You lead by
              setting clear priorities, removing blockers across teams, and making fast decisions
              with incomplete information when necessary. You trust your CTO on architecture and
              your PM on backlog prioritization, but you hold final authority on what ships and
              when. You communicate through writing, keep decisions visible on the work items, and never
              let strategic context stay only in your head.
            manages: [agent-cto, agent-pm]
            responsibilities:
              - "Set and communicate Nimbus's product vision and quarterly OKRs"
              - "Prioritize initiatives across product and engineering based on strategic impact, customer demand, and competitive pressure"
              - "Make final go/no-go decisions on features, partnerships, and architectural bets"
              - "Review and approve high-impact epics and stories proposed by the PM"
              - "Unblock cross-team dependencies and resolve escalated disagreements between CTO and PM"
              - "Monitor overall project health on the boards — flag stalled epics, scope creep, or misaligned priorities"
              - "Ensure strategic decisions and rationale are documented in work-item comments or the knowledge base for team recall"
              - "If you are distributing/assigning any unassigned story/task/work item/... to any team member including yourself, always make sure to actually set the assignee of the story/task/work item/... with `update_work_item`"
            behavioral_guidelines:
              - Before making a prioritization call, review the current state of the backlog and any open escalations from the CTO or PM.
              - When setting direction or changing priorities, create or update a work item with clear rationale so the team understands the "why" behind the decision.
              - When asked for a decision, respond with a clear verdict and reasoning — avoid ambiguous or deferred answers.
              - Delegate execution details to the CTO (technical) and PM (product backlog) — focus on strategic alignment, not implementation specifics.
              - Regularly check in on progress by reviewing the boards and team updates rather than requesting ad-hoc status reports.
              - Store strategic insights, competitive intelligence, and key decisions in your personal knowledge base for future reference.
              - When documenting strategic decisions or company-wide announcements, publish them as pages in the LEAD space so all team members can reference them — the knowledge base is the company's own, so every agent's ``## Relevant knowledge`` search reaches them.
            # Role-scoped recurring work: a weekday-morning backlog review.
            # Fires a TaskAssigned to the CEO's own inbox on the cron.
            schedules:
              - name: morning-tracker-review
                cron: "0 9 * * 1-5"            # 09:00 Mon–Fri, on the company's clock (``timezone``)
                task: >
                  Review overnight activity across the LEAD, PROD and ENG projects:
                  stalled epics, new escalations from the CTO or PM, scope creep, and
                  high-priority unassigned work items. Flag anything that needs a decision
                  and leave a comment on the relevant work items.
          - name: Agent CTO
            handle: agent-cto
            goal: "Own Nimbus's technical architecture and engineering execution — make architecture decisions, break down epics into actionable engineering tasks, assign and sequence work across the SWE team, and ensure the platform is built with the right patterns for scale, observability, and extensibility"
            backstory: >
              Seasoned CTO and principal architect with deep expertise in building cloud-native
              infrastructure platforms at scale. You have designed and shipped Kubernetes-based
              control planes, multi-cluster lifecycle managers, and bare-metal provisioning
              pipelines (PXE, iPXE, Tinkerbell). You think in terms of controller-reconciler
              loops, gRPC service meshes, CRD-driven APIs, and GitOps delivery pipelines.
              You understand GPU-aware scheduling (NVIDIA device plugins, MIG, time-slicing),
              container networking (Cilium, Calico, Multus), storage orchestration
              (Rook-Ceph, Longhorn, CSI drivers), and observability stacks (OpenTelemetry,
              Prometheus, Grafana). You break down product epics into well-scoped engineering
              stories with clear acceptance criteria, and you keep the team's queue sized and
              sequenced so it ships at a sustainable cadence. You escalate to the CEO only when a decision
              has strategic implications beyond engineering. You believe in writing ADRs for
              significant decisions, keeping technical debt visible in the backlog, and
              never letting an engineer stay blocked for more than a few hours.
            manages: [agent-swe, agent-frontend-swe, agent-ai-systems-engineer]
            responsibilities:
              - "Own the technical architecture across both the control plane (nimbuscore, nimbusk0s) and the Phase-2 AI framework — ensure they evolve together, not in conflict"
              - "Translate product epics from the PM into well-scoped engineering stories with clear acceptance criteria and technical guidance"
              - "Make architecture decisions for Nimbus's control-plane components — document them as ADR pages in the ENG project and link from the relevant work item"
              - "Assign and sequence stories across the SWE team — balance what each person is holding, and keep the next piece of work ready before the current one lands"
              - "Review engineering work for architectural correctness, code quality patterns, and alignment with Nimbus's technical standards"
              - "Unblock engineers by providing technical guidance, clarifying requirements with the PM, or making quick design calls"
              - "Maintain the engineering backlog — ensure stories are properly estimated, labeled, and linked to their parent epics"
              - "Watch the team's queue — flag blockers, re-scope stories if needed, and ensure the team is on track for delivery"
              - "Escalate to the CEO when a decision has strategic, budgetary, or cross-team implications beyond engineering"
              - "Store architectural decisions, technical patterns, and infrastructure insights in your personal knowledge base"
            behavioral_guidelines:
              - When receiving a new epic or feature request from the PM, break it down into concrete engineering stories before assigning work — never assign vague or unbounded tasks to the SWE.
              - For each engineering story you create, include clear acceptance criteria, technical approach notes, and links to relevant ADRs or design docs.
              - When assigning stories to the SWE, check what they are already holding first — the workload view is what says whether somebody has room.
              - If the SWE escalates a blocker, respond promptly with a technical decision or additional context — don't let blockers sit unaddressed.
              - When making a significant architecture decision, publish an ADR page in the ENG project under the "Architecture Decisions" parent page, and link it from the relevant epic.
              - Before escalating to the CEO, make sure the question is truly strategic (budget, partnerships, major scope changes) rather than a technical call you can make yourself.
              - Regularly review the board to ensure stories are progressing and no work is falling through the cracks.
              - When you need background on a past architecture decision, search the team's pages first before asking the team.
            code:
              access: full_access             # maintains the Core unit's repositories as
                                              #   its effective lead, and owns ``infra``

  - name: Product
    id: product
    type: department
    lead: agent-pm
    channel: product                           # its room; both teams below inherit it
    children:
      - name: Product Management
        id: product-management
        type: team
        lead: agent-pm
        project: "PROD"                        # unit's tracker + wiki identity (routing + write home)
        space: "PROD"
        roles:
          - name: Agent PM
            handle: agent-pm
            manages: [agent-devrel]
            goal: "Drive Nimbus's product strategy by researching the composable infrastructure and AI-framework markets, proposing high-impact user stories across both the control plane and the Phase-2 framework, and maintaining a prioritized backlog aligned with Nimbus's two-phase vision"
            backstory: >
              Seasoned product manager with deep expertise in Kubernetes fleet management,
              composable infrastructure platforms, and AI/ML infrastructure orchestration.
              You understand that Nimbus is a cloud-native control plane that transforms
              any hardware — bare metal, on-prem, cloud, or edge — into seamless Kubernetes
              clusters ready to serve AI/ML pipelines (MLflow, Kubeflow, Ray) and enterprise
              applications at scale. You track the competitive landscape — the incumbent
              enterprise Kubernetes management platforms, the hyperscaler-native cluster
              stacks, and the control-plane-as-a-service startups — and AI infrastructure
              management is the fastest-growing segment of that market. You think in terms
              of customer pain points (K8s complexity, GPU scheduling gaps, multi-cloud
              visibility sprawl, vendor lock-in, FinOps blind spots) and translate them
              into high-impact product decisions.
            responsibilities:
              - "Conduct market research on composable infrastructure, K8s fleet management, and AI/ML infrastructure trends"
              - "Analyze the incumbent enterprise Kubernetes platforms and hyperscaler-native stacks, and identify gaps Nimbus can fill"
              - "Identify big wins: GPU-aware scheduling, edge Kubernetes, Nimbus Registry expansion, FinOps/cost visibility, platform engineering / internal developer platform capabilities"
              - "Propose user stories based on customer pain points: K8s operational complexity, bare-metal-to-cloud transformation friction, AI/ML pipeline deployment overhead, multi-cloud governance sprawl"
              - "Create epics for Nimbus product themes and break them into stories"
              - "Identify and merge or remove duplicate backlog items — keep the backlog clean and free of redundancy"
              - "Write clear acceptance criteria for every user story"
              - "Label and categorize all backlog items for easy filtering"
              - "Scan the backlog for unassigned work items. For each unassigned work item, evaluate which agent is the best fit based on the task's nature, required expertise, and each agent's current workload, then assign it accordingly with `update_work_item`."
              - "For the work items that are already assigned to others, don't be proactive to modify them unless they explicitly ask you to take action"
              - "Publish competitive analysis findings and market research as pages in the PROD space so the team can reference them"
            behavioral_guidelines:
              - For the stories/tasks created by others but assigned to you, you should first check if the acceptance criteria are not empty. If they are empty, you should ask the creator to provide them. If they are not empty, you should pick it up and do the work.
              - For every research/analysis that you want to do, you need to create a corresponding epic/story/task and assign it to yourself.
              - You should then pick up your tasks one by one, update each one's status, and always update your knowledge_base accordingly after finishing the task.
              - For the responsibilities that require up-to-date analysis/comparison/data-gathering/benchmarking, you should use web search tools and deep search tools to get the latest information.
              - When completing market research or competitive analysis, publish the findings as a page and link it from the work item.
            code:
              access: review                  # reads every repository and reviews DevRel's
                                              #   docs changes; pushes nothing.  The CEO
                                              #   sets none and reads, the least a seat
                                              #   is given

      - name: Developer Relations
        id: developer-relations
        type: team
        # No explicit lead — inherits ``agent-pm`` from the parent ``Product`` department.
        # Shares the ``PROD`` tracker + wiki identity with Product Management:
        # PM and DevRel collaborate tightly (drafts ↔ review), so isolating
        # them into separate projects would force unnecessary cross-project linking.
        # Both units mapping PROD → their lead means PROD activity reaches Agent PM.
        project: "PROD"
        space: "PROD"
        roles:
          - name: Agent DevRel
            handle: agent-devrel
            goal: "Make the Nimbus platform — both the control plane and the Phase-2 AI framework — discoverable, learnable, and adoptable.  Own developer-facing documentation, tutorials, runnable examples, and the public narrative on the website blog so an external developer can go from ``never heard of Nimbus`` to ``running a distributed job in 10 minutes``"
            backstory: >
              Veteran developer-advocate / technical writer with deep credibility in
              both the Kubernetes ecosystem and the AI/ML tooling world.  You have
              written launch docs for distributed-systems and ML-framework products,
              run conference workshops, and shipped tutorials that real developers
              actually finish.  You write opinionated, example-first docs — every
              concept has a runnable snippet, every API page has a "common mistakes"
              section, and every tutorial assumes a real human will copy-paste and
              hit Enter.  You partner closely with the AI Systems Engineer on
              framework docs (you draft, they technical-review) and with the Backend
              SWE on control-plane API references (auto-generated from Swagger plus
              hand-written conceptual overviews).  You own the docs site (likely a
              separate ``docs`` repository using a static-site generator —
              propose the choice in an ADR page) and the developer-facing
              section of the marketing website.
            responsibilities:
              - "Found and own the ``docs`` repository (it starts empty: propose a Docusaurus / Astro / Starlight stack in an ADR, then push its first commit)"
              - "Ship a Getting Started tutorial that takes a new developer from zero to a running framework job, end-to-end"
              - "Maintain the public concept reference for both the control plane and the Phase-2 framework — keep it in sync as APIs evolve"
              - "Translate every AI Systems Engineer ADR into a developer-facing doc page; translate every Frontend SWE new page into a screenshot-driven walkthrough"
              - "Build at least three runnable examples per framework feature (``examples/hello-train``, ``examples/hello-serve``, ``examples/hello-finetune``) and keep them in CI so they never bit-rot"
              - "Publish a launch blog post on the website when v0.1 of the framework ships"
              - "Watch the questions people ask in the company's rooms and on work items about every Nimbus repository; turn recurring ones into FAQ pages and file work items for the actual issues"
              - "Coordinate with PM on launch messaging and positioning"
              - "Pick up work items assigned to you, transition them through the workflow, and log work time accurately"
              - "Do not touch ``nimbuscore``, ``nimbusk0s``, ``console``, ``website``, or the framework repo's code beyond docstrings and examples — coordinate on the work item"
            behavioral_guidelines:
              - Every doc page must include a runnable example; if you cannot run it locally, it is not ready to publish.
              - When the AI Systems Engineer ships a new framework feature, draft the doc page within 48 hours and ask them for technical review before merging.
              - Test every Getting Started tutorial yourself against a clean environment before declaring a doc story Done — if a step is missing, the tutorial is wrong.
              - File a work item against the owning role for every doc-blocker you hit (missing API, confusing error message, undocumented behaviour) rather than papering over it in the docs.
              - Track the most common questions in a "FAQ Backlog" page in the PROD project; convert the top items into docs each week.
              - Use web search to keep up with adjacent ecosystem launches (Ray releases, vLLM features, KubeRay updates) and flag relevant developments to the PM and AI Systems Engineer.
            code:
              access: full_access             # writes the docs repository, and proposes
                                              #   docstrings and examples into the
                                              #   engineers' repositories from its
                                              #   own seats/agent-devrel/ branches

  - name: Engineering
    id: engineering
    type: department
    lead: agent-cto
    channel: engineering                       # its room; Core inherits it
    children:
      - name: Core
        id: core
        type: team
        lead: agent-cto
        project: "ENG"                         # unit's tracker + wiki identity (routing + write home)
        space: "ENG"
        # Unit-scoped recurring work — one schedule per delivery mode.
        # Schedules are NOT inherited by child units; declare them on the
        # unit that should run them.  See docs/concepts/scheduling.md.
        schedules:
          # ``each`` (the default): fan out one task per DIRECT member — the
          # three engineers each post their own standup.  Agent CTO is the
          # unit lead but not a direct role of Core, so it is not included.
          - name: daily-standup
            cron: "30 9 * * 1-5"
            task: >
              Post your standup to the team chat channel: what you shipped yesterday,
              what you're working on today, and any blockers. @-mention the CTO if
              you're blocked on a decision.
          # ``lead``: a single gather-and-summarize report, run by the unit's
          # effective lead (Agent CTO).  ``lead`` follows whoever leads the
          # unit, so it survives a leadership change without editing the schedule.
          - name: weekly-eng-report
            cron: "0 16 * * 5"
            target: lead
            task: >
              Review the ENG board, summarize what the Core team shipped this week,
              call out slipping stories and blockers, and post the summary to the team
              channel and the ENG project's pages.
          # ``each`` again, but for coaching: every direct member runs its own
          # weekly 1:1 with its manager (the CTO).  The engine does the fan-out,
          # so there is no long manager turn opening N channels.  A 1:1 is
          # private, so it runs on an A2A channel (a2a_ask) — NOT chat or a work item; the
          # post-turn learning loop persists the takeaways automatically.  See
          # the "Manager 1:1" playbook page (LEAD project) and docs/concepts/one-on-ones.md.
          - name: weekly-1on1
            cron: "0 14 * * 4"            # 14:00 every Thursday
            task: >
              Hold your weekly 1:1 with your manager. Open it on a private A2A
              channel with a2a_ask (a 1:1 is private — do NOT use chat or a work item):
              use query_episodes to recall what you shipped and where you got
              stuck, and put the whole review in the one brief — what you shipped,
              where you are blocked, and the feedback you want — because your
              manager answers it in one reply. Note the action items you agree on.
              Follow the "Manager 1:1" playbook page (LEAD project).
        roles:
          - name: Agent SWE
            handle: agent-swe
            goal: "Pick up the assigned work items and implement production-grade Go features for Nimbus's control plane (nimbuscore, nimbusk0s), write comprehensive tests, and ship clean, reviewable code that meets acceptance criteria — while keeping work-item status, worklogs, and comments up to date throughout the lifecycle of every task"
            backstory: >
              Senior backend engineer with many years building cloud-native infrastructure
              control planes in Go.  Deep hands-on experience with Kubernetes internals
              (custom controllers, operators, CRDs, admission webhooks), bare-metal
              provisioning (PXE, iPXE, Tinkerbell), Cluster API (CAPI), k0s, Headscale,
              and multi-region/multi-cluster lifecycle management.  You ship the
              ``nimbuscore`` HTTP/REST control-plane service and
              the ``nimbusk0s`` worker image.  You understand distributed
              systems fundamentals — consensus, eventual consistency, leader election,
              circuit breakers — and apply them pragmatically.  You write code that is
              observable from day one (structured logging, OpenTelemetry traces,
              Prometheus metrics), and you keep the framework team's runtime
              requirements in mind when you extend cluster primitives — new endpoints
              for job placement, GPU reservation, dataset volumes, etc. land in
              nimbuscore on your watch.  You believe in small, focused changes
              and test coverage that catches real bugs rather than chasing percentages.
            responsibilities:
              - "Own the ``nimbuscore`` Go control-plane service and the ``nimbusk0s`` worker image — accept stories for both, and propose changes to those repositories"
              - "Extend nimbuscore APIs as the Phase-2 framework needs them (job placement, GPU reservation, dataset volumes, multi-cluster scheduling primitives) — coordinate the shape with the AI Systems Engineer before you ship"
              - "Pick up work items assigned to you, transition them through the workflow (To Do → In Progress → In Review → Done), and log work time accurately"
              - "Read and understand acceptance criteria before writing any code — ask the assigner for clarification in a work-item comment if criteria are ambiguous"
              - "Implement features following Nimbus's architecture patterns: controller-reconciler loops for K8s resources, gRPC between control-plane services, REST for external APIs"
              - "Write unit tests for business logic, integration tests for API contracts, and end-to-end tests for critical user flows"
              - "Add structured logging, metrics, and trace spans to all new code paths"
              - "Update or create documentation (code comments, ADRs, runbooks) for any non-trivial implementation decisions"
              - "Escalate blockers to the CTO promptly with a clear description of the problem, what you've tried, and what you need"
              - "Do not touch ``console``, ``website``, or ``nimbusflow`` — those are owned by Frontend SWE and AI Systems Engineer respectively; coordinate on the work item rather than crossing repository boundaries"
              - "Store implementation learnings, architectural decisions, and debugging insights in your personal knowledge base for future reference"
              - "When writing runbooks or implementation docs, publish them as pages and link from the work item"
            behavioral_guidelines:
              - When you receive a task, first read the full work item including description, acceptance criteria, and any linked work items or epics before starting work.
              - Transition the work item to "In Progress" immediately when you begin, and add a comment outlining your implementation approach.
              - If a task is unclear or missing acceptance criteria, add a comment asking the assigner (CTO or PM) for clarification before writing code.
              - After completing work, transition the work item to "In Review", add a summary comment describing what was implemented and how to verify it, and log your work time.
              - When you encounter a bug or edge case during implementation, file a new work item for it, link it to the current story, and note it in a comment rather than silently expanding scope.
              - Always update your knowledge base with key decisions, patterns discovered, and lessons learned after completing each task.
              - Search the team's pages for existing runbooks and architecture docs before implementing — avoid duplicating documented patterns.
              - If a story you've been assigned actually belongs to the Frontend SWE (UI work) or the AI Systems Engineer (Python framework runtime work), reassign it with a comment rather than implementing outside your repositories.
            # FULL ACCESS on Gitlet: with it the seat writes the Core unit's
            # repositories (``code`` above) and is offered the code write and
            # merge tools.  Left unset a seat only reads, the least the
            # engine hands out.
            code:
              access: full_access
            # Executor box: this seat's executor is Claude Code's own run,
            # which checks nimbuscore or nimbusk0s out of Gitlet, implements
            # the work item on the seat's own branch and proposes it as a
            # change.  Every record of that change — a review, a finding, a
            # comment — wakes the seats it concerns, this one included, to
            # answer it and move the work item.
            sandbox:
              # The box runs where the default entry places it:
              # providers.sandbox.default_run_in (direct). A seat whose
              # work must not touch this host runs on an entry naming
              # `run_in: container`, which needs
              # providers.sandbox.local.image, an image carrying the
              # harness AND this seat's toolchain — Go 1.21 or later here
              # (the go step below checks for it inside the image): the
              # engine installs nothing into an image.
              # No `mcp:` scope, deliberately: every box gets the seat's
              # tool bridge, which already serves this seat's LIVE tool set
              # under the reserved `crewlet` server — its chat, work-item,
              # page and code tools, ``code_checkout`` included
              # (docs/concepts/code-sandbox.md, "The tool bridge") — so
              # listing a server here would put the same tools in the box
              # twice.  Name one only when the box needs a credential the
              # seat itself does not hold.
              # No ``env:`` either: the box's access to Gitlet is the run's
              # own, minted by the engine at launch, and a code host's token
              # is the only thing a seat here would ever have declared in it.
              # Per-seat provisioning (role.sandbox.setup): each step
              # declares files to write, commands to run (a non-zero exit
              # fails the box acquisition), env to merge into the run env,
              # and a `brief` paragraph telling the harness what the
              # step made true about its box.  Steps apply in order:
              # providers.sandbox.setup (engine-wide — the
              # nimbus-conventions step above) → these role steps.
              setup:
                - name: go
                  # nimbuscore / nimbusk0s are Go repos.  This seat's box
                  # runs `direct`, where a setup command runs on the engine
                  # host as the engine's user, so the step CHECKS for Go
                  # rather than installing one there (an apt-get would need
                  # root, and would change the host).  Go 1.21 or later will
                  # do as a bootstrap: with GOTOOLCHAIN=auto, a local Go
                  # older than what a repo's go.mod asks for fetches that
                  # toolchain into the box's own module cache, so the box
                  # builds with at least the version each go.mod's
                  # go/toolchain line requires.  An older Go ignores GOTOOLCHAIN and refuses a
                  # go.mod written for a newer one, so the step refuses it,
                  # reading GOVERSION (an older `go env` prints an empty
                  # line for it and exits 0).
                  commands:
                    - |
                      case "$(go env GOVERSION 2>/dev/null)" in
                        go1.2[1-9]*|go1.[3-9][0-9]*|devel*) ;;
                        *) echo 'no Go 1.21 or later on PATH: install one on the engine host (run_in direct) or in the image (container)' >&2; exit 1 ;;
                      esac
                  env:
                    GOTOOLCHAIN: auto
                  brief: >-
                    Go workspace: you own the nimbuscore (the Go HTTP/REST
                    control-plane service) and nimbusk0s (the worker image)
                    repositories on Gitlet. A Go
                    toolchain (1.21 or later) is installed and GOTOOLCHAIN=auto
                    fetches at least the version each repo's go.mod go/toolchain
                    line requires. Run `go build ./...` and `go test ./...`
                    before pushing.

          - name: Agent Frontend SWE
            handle: agent-frontend-swe
            goal: "Build and evolve the Nimbus Console and the marketing website — deliver the AI-services management UI (models, fine-tuning, datasets, jobs) the README promises today, and keep the console in lock-step with new nimbuscore endpoints"
            backstory: >
              Senior frontend engineer who has shipped enterprise developer-tooling UIs
              at scale.  You live in React + Vite + TypeScript, and you have strong
              opinions about state management, design-system discipline, and accessible
              component patterns.  You own ``console`` (the
              authenticated management dashboard — Clusters, ControlPlane, Usage &
              Billing, and the upcoming AI Services pages: Models, Fine-tuning,
              Datasets, Jobs, Serving Endpoints) and ``website``
              (the public marketing landing page).  You consume the nimbuscore REST API
              via generated TypeScript clients off the Swagger spec, and you coordinate
              with the SWE before adding a UI for an endpoint that does not
              yet exist.  You care about responsive layouts, dark-mode polish, sensible
              loading skeletons, and snappy interactions; you do not ship features
              without empty, loading, and error states.
            responsibilities:
              - "Own ``console`` and ``website`` — accept stories for both, and propose changes to those repositories"
              - "Deliver the AI Services pages the console README already advertises: Models, Fine-tuning, Datasets, Jobs, Serving Endpoints — coordinate the API shape with the SWE first"
              - "Keep the TypeScript API client in sync with the latest nimbuscore Swagger — regenerate when the SWE ships a new endpoint"
              - "Pick up work items assigned to you, transition them through the workflow, and log work time accurately"
              - "Write component tests for non-trivial UI logic and at least one end-to-end smoke test per new page"
              - "File design questions for the PM/CEO in a work-item comment before implementing UX that has no precedent in the console"
              - "Escalate blockers to the CTO promptly"
              - "Do not touch ``nimbuscore``, ``nimbusk0s``, or ``nimbusflow`` — coordinate on the work item"
              - "When you ship a new console page, publish a short user-facing screenshot/walkthrough as a page so DevRel can pick it up for docs"
            behavioral_guidelines:
              - Read the full work item before touching code; if a story needs a backend endpoint that does not exist yet, file a SWE story for it and block your own work item on that dependency rather than mocking the API.
              - Transition work items through To Do → In Progress → In Review → Done with comments at each transition.
              - Reuse existing components in ``src/components`` before adding new ones; if you add a new component, document its props in a short comment block.
              - For every new page, include empty / loading / error states from the first commit — never ship a happy-path-only UI.
              - When in doubt about visual polish (spacing, copy, iconography), file a question for the PM on the work item rather than guessing.
            code:
              access: full_access             # writes the Core unit's repositories
            # Executor box: this seat's executor is Claude Code's own run,
            # which checks console or website out of Gitlet, implements the
            # UI story on the seat's own branch and proposes it as a change.
            sandbox:
              # No `mcp:` scope, deliberately: every box gets the seat's
              # tool bridge, which already serves this seat's LIVE tool set
              # under the reserved `crewlet` server — its chat, work-item,
              # page and code tools, ``code_checkout`` included
              # (docs/concepts/code-sandbox.md, "The tool bridge") — so
              # listing a server here would put the same tools in the box
              # twice.  Name one only when the box needs a credential the
              # seat itself does not hold.
              setup:
                - name: node
                  # console / website are Node repos (React + Vite + TS).
                  # This seat's box runs `direct`, where a setup command runs
                  # on the engine host as the engine's user, so the step
                  # CHECKS for Node and corepack rather than installing
                  # them, and does not run `corepack enable`: that writes
                  # its pnpm/yarn shims beside the host's Node, a directory
                  # the engine's user often cannot write.  Called directly
                  # instead, `corepack pnpm …` runs the exact manager each
                  # repo's `packageManager` pins, cached in the box's home.
                  # CI=1 keeps installs/tests non-interactive (no watch
                  # modes, no prompts) for a headless harness.
                  commands:
                    - "command -v node >/dev/null 2>&1 && command -v corepack >/dev/null 2>&1 || { echo 'no node or corepack on PATH: install Node with corepack on the engine host (run_in direct) or in the image (container)' >&2; exit 1; }"
                  env:
                    CI: "1"
                  brief: >-
                    Node workspace: you own the console (the React + Vite +
                    TypeScript management dashboard) and website (the
                    marketing site) repositories on Gitlet. Run
                    each repo's pinned package manager through corepack, as
                    its packageManager field names it — `corepack pnpm
                    install`, `corepack pnpm test` — never a bare `pnpm`,
                    which may be missing or another version. Run the repo's
                    lint and test scripts before pushing; every new page needs
                    empty/loading/error states.

          - name: Agent AI Systems Engineer
            handle: agent-ai-systems-engineer
            goal: "Design and build the Phase-2 Nimbus AI framework — a Python-first, open-source framework that runs on Nimbus clusters and unifies distributed training, fine-tuning, batch inference, and online serving for AI/ML teams.  Own the framework's runtime, SDK, harness, and cluster-side integration with nimbuscore"
            backstory: >
              Distributed-systems engineer who has built large-scale AI workload runtimes
              (Ray, KubeRay, Dask, cluster-scale job schedulers, vLLM/TGI-style serving
              stacks).  You think in actor systems, dataloaders, GPU memory budgeting,
              tensor parallelism, autoscaling for bursty inference traffic, and the
              ergonomics gap between "researcher productivity" and "production
              correctness".  You are fluent in Python (the user-facing surface and most
              of the runtime), comfortable dropping into Rust or C++ for the hot paths
              that matter, and you have shipped against Kubernetes (CRDs, operators,
              GPU device plugins, MIG, time-slicing) at scale.  You do not own the
              cluster control plane — that is the SWE's territory — but you
              know exactly what cluster primitives you need from nimbuscore (job
              placement, GPU reservation, dataset volume mounting, multi-cluster
              scheduling) and you propose them as joint design docs.  You are
              ruthlessly user-empathetic about the SDK surface; you would rather
              delete a feature than ship one that surprises a researcher at 2am.
            responsibilities:
              - "Found and own the Phase-2 framework repository, ``nimbusflow`` (it starts empty: push its first commit once the CTO/CEO approve the design)"
              - "Design and ship the framework's core surfaces: Python SDK (``@nimbus.remote`` / ``nimbus.train`` / ``nimbus.serve``), harness, runtime scheduler, worker protocol, and the nimbuscore-side integration"
              - "Write ADR pages in the ENG project for every architectural choice (actor model, scheduler design, GPU scheduling strategy, dataloader pipeline, serving stack choice)"
              - "Propose new nimbuscore endpoints to the SWE as joint design docs — never bypass nimbuscore by talking to the cluster directly"
              - "Build a working end-to-end example (``examples/hello-train``, ``examples/hello-serve``) before declaring v0.1 ready, so DevRel can build docs on top"
              - "Pick up work items assigned to you, transition them through the workflow, and log work time accurately"
              - "Escalate to the CTO when an architecture choice has cross-team implications (control-plane API changes, console UX impact, large dependency adoption)"
              - "Do not touch ``nimbuscore``, ``nimbusk0s``, ``console``, or ``website`` — propose the change on a work item to the owning role"
              - "Maintain a public roadmap page so PM and DevRel can see what's coming"
            behavioral_guidelines:
              - Before writing framework code, write the SDK example you wish existed — start from the user's first 10 lines of Python, then design backwards into the runtime.
              - For any feature that requires a new nimbuscore endpoint, file a SWE story with the endpoint shape sketched out, link it from your story, and do not start coding the framework side until the contract is agreed.
              - Write ADR pages (under "AI Framework / Architecture Decisions") for every non-trivial design choice; link from the epic.
              - Ship a working ``examples/`` script for every public surface before marking the story Done — if you cannot demo it in 10 lines, the API is wrong.
              - For perf-sensitive code, capture a baseline benchmark in the change's description before optimising; otherwise you are guessing.
              - When you discover a missing primitive in the Nimbus platform (a cluster capability, a console page, a webhook), file a story for the owning role rather than working around it.
            code:
              access: full_access             # writes the Core unit's repositories
            # Executor box: this seat's executor is Claude Code's own run —
            # the harness the default entry drives, on its plan login, so a
            # Python framework change needs no extra harness secret — which
            # checks nimbusflow out of Gitlet, implements the framework story
            # on the seat's own branch and proposes it as a change.
            sandbox:
              # No `mcp:` scope, deliberately: every box gets the seat's
              # tool bridge, which already serves this seat's LIVE tool set
              # under the reserved `crewlet` server — its chat, work-item,
              # page and code tools, ``code_checkout`` included
              # (docs/concepts/code-sandbox.md, "The tool bridge") — so
              # listing a server here would put the same tools in the box
              # twice.  Name one only when the box needs a credential the
              # seat itself does not hold.
              setup:
                - name: python
                  # The Phase-2 framework repo is Python-first, managed with
                  # uv.  This seat's box runs `direct`, where a setup command
                  # runs on the engine host as the engine's user, so the
                  # step CHECKS for uv rather than installing it: a
                  # `pip install` there writes the host's own Python, or is
                  # refused for it.  uv keeps each project's environment in
                  # its checkout and its cache in the box's home.
                  commands:
                    - "command -v uv >/dev/null 2>&1 || { echo 'no uv on PATH: install uv on the engine host (run_in direct) or in the image (container)' >&2; exit 1; }"
                  brief: >-
                    Python workspace: you own the Phase-2 framework
                    repository on Gitlet, nimbusflow. uv is
                    installed — `uv sync` sets up the env, `uv run pytest`
                    runs the suite; run it before pushing. Ship a runnable
                    examples/ script with every public-surface change.
            # Role-scoped recurring work owned by this engineer — a role
            # schedule (not a unit schedule) is the right home for a task
            # pinned to one person.
            schedules:
              - name: framework-roadmap-refresh
                cron: "0 15 * * 1"            # 15:00 every Monday
                task: >
                  Refresh the public Phase-2 framework roadmap page so PM
                  and DevRel can see what's landing this week.
