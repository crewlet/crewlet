# yaml-language-server: $schema=../schema/company.schema.json
# Nimbus — Cloud-native infrastructure control plane + open AI framework
name: "Nimbus"
mission: "Turn any hardware into cloud-native infrastructure — and give AI teams one open framework to build on top of it"
vision: >
  Phase 1 (shipped): a cloud-native control plane that turns bare metal, on-prem, cloud, and edge
  hardware into seamless Kubernetes clusters ready to serve AI/ML pipelines and applications at
  enterprise scale.
  Phase 2 (in progress): an open, Python-first framework — analogous in spirit to Ray — that runs
  on Nimbus clusters and unifies how teams develop, schedule, and serve distributed AI workloads
  (training, fine-tuning, batch inference, online serving). The framework owns the developer surface
  (SDK, CLI, examples, docs); the control plane (nimbuscore) owns the cluster surface (provisioning,
  multi-region, GPU scheduling primitives). The two are designed together.

policies:
  - "Communicate decisions in writing"
  - "Capture personal-context facts you need to recall later (delegation context, stakeholder preferences, ongoing operational state) via `reflect_and_persist` — pass `ttl_days` for facts that age out naturally (e.g. delegation context lasts the MR lifetime)"
  - "Document team-shared knowledge (decisions, conventions, runbooks) as Confluence pages so other agents can read it — `reflect_and_persist` writes are personal-only"
  - "Use Jira work items to manage all product backlog items — never track tasks only in memory"
  - "Use Confluence pages to document architecture decisions, runbooks, and meeting notes — search before creating new docs"
  - "Each engineering role owns specific projects (see the `Repo Ownership` page in the LEAD Confluence space); do not push to projects you do not own without an explicit handoff from their owner"
  - "The Phase-2 AI framework is developed in a dedicated project owned by AI Systems Engineering; the control plane (nimbuscore, nimbusk0s) stays focused on cluster-level primitives that the framework depends on"

# Company-wide token budget — a single hard cap on total LLM tokens across
# EVERY agent (CEO, CTO, PM, DevRel, the three engineers, their sub-agents,
# and the learning/aux passes).  The engine's BudgetManager charges this
# org budget on every LLM completion BEFORE the per-agent budget; the first
# completion that would push the running total past the cap stops that turn
# immediately and emits a ``BudgetExhausted`` event (budget_type="org").
# 0 (or omitting the field) means unlimited.  No per-agent ``token_budget``
# is set below, so this 10M ceiling is the only budget in force and the
# whole company shares it.
#
# NOTE: usage is durable — the counter lives in the fleet's coordination
# store, so it survives engine restarts and is one number for the whole
# company however many nodes run it.  Reset it deliberately, against a
# running node: ``crewlet budgets reset``.  See
# docs/guides/deployment.md § Token Budgets and
# docs/getting-started/quickstart.md § Token Budgets.
token_budget: 10000000                          # 10M tokens, org-wide (all agents combined)

# Skill variables — generic name->value facts substituted into tool-skill
# text wherever a skill writes ${name}.  The bundled platform-mentions
# skill references these so agents share human-clickable links of the
# shape ${jira_base_url}/browse/ENG-42 and
# ${confluence_base_url}/spaces/ENG/pages/{page-id}.
#
# THESE ARE THE BROWSER-FACING ADDRESSES, deliberately: with a cloud_id the
# Atlassian tools return `api.atlassian.com/ex/...` gateway URLs, which a
# colleague cannot open.  Values support ${ENV}.
# See docs/concepts/tool-skills.md#skill-variables.
skill_variables:
  jira_base_url: "${JIRA_SITE_URL}"              # e.g. https://nimbus.atlassian.net
  confluence_base_url: "${CONFLUENCE_SITE_URL}"  # e.g. https://nimbus.atlassian.net/wiki

providers:
  llm:
    # Any OpenAI-compatible endpoint works here: OpenAI itself, OpenRouter,
    # Together, a local vLLM or LiteLLM gateway, … — set LLM_BASE_URL to the
    # provider's /v1/ endpoint and LLM_MODEL to the model name it serves.
    #
    # Prefer Anthropic?  Swap the default for:
    #   default:
    #     type: anthropic
    #     model: claude-sonnet-5
    #     api_keys:
    #       - "${ANTHROPIC_API_KEY}"
    default:
      type: openai-compatible
      model: "${LLM_MODEL}"
      base_url: "${LLM_BASE_URL}"
      timeout_seconds: 300          # large-model turns can be slow — raise the per-call HTTP timeout (default 120)
      api_keys:
        - "${LLM_API_KEY}"
  embeddings:
    type: openai
    model: text-embedding-3-small
    api_key: "${OPENAI_API_KEY}"
    dimensions: 1536
  # Code-runtime sandbox — lets a sandbox-enabled role run its Execute
  # phase as a coding agent (Claude Code / OpenCode) inside an isolated
  # E2B sandbox that implements the work and opens a merge request under
  # the agent's OWN GitLab identity (the service-account PAT each seat
  # declares as GITLAB_TOKEN in role.sandbox.env below — same PAT as its
  # mcp_env.gitlab GITLAB_TOKEN).  The per-role gate is
  # role.sandbox (enabled on the three Engineering seats below); this
  # block is the engine-wide provider.  See
  # docs/concepts/code-sandbox.md and docs/integrations/gitlab.md.
  #
  # default_coding_agent: opencode is deliberate.  Nimbus's only LLM
  # provider is the openai-compatible entry above, and OpenCode is
  # provider-agnostic — it drives the coding agent with that SAME
  # ${LLM_API_KEY} provider, so the sandbox needs NO extra secret.  Claude
  # Code only speaks the Anthropic API, so choosing it here would require
  # adding an 'anthropic' providers.llm entry and pointing each engineer's
  # role.llm_sandbox at it (otherwise the sandbox run fails credential
  # validation — SandboxCredentialError — at launch).
  sandbox:
    # THE ENGINE HOST IS THE BACKEND HERE. `type: local` runs each coding
    # job as a process tree on the machine running `crewlet run` — no
    # remote account, no API key, nothing to provision, which is what
    # makes it the right choice for a company running on your own machine
    # against your own checkouts.
    #
    # For anything shared, `type: e2b` gives every run a fresh VM that is
    # not the engine's — set `api_key` (and `domain` for a self-hosted
    # cluster). Don't want code work at all? Set ``type: none`` and the
    # engineers fall back to native Execute. (``type: fake`` is in-process
    # stubs for tests — it runs no real coding agent and no real MCP.)
    # There is NO DEFAULT: `local` runs code on this host and `none` turns
    # code work off, and neither is a choice to make for you.
    #
    # PREREQUISITE for `local`: the coding agent named below must be
    # installed on that machine, since `direct` runs it as a child
    # process. `opencode` here; `claude-code` is the other supported one.
    type: local                                  # e2b | local | fake | none (required)
    local:
      # `direct` isolates STATE, not the host: each box gets its own HOME,
      # XDG directories and an allowlisted environment (never the engine's
      # own tokens), and writes outside the box are refused — but the
      # agent runs as the engine's user with the engine's filesystem
      # access. That is the right trade for a company running on your own
      # machine against your own checkouts, and the wrong one for anything
      # shared.
      #
      # For host isolation use `container`, which needs an image carrying
      # the coding-agent CLI and is where a local box is SIZED (run_args
      # takes --cpus/--memory, mirroring how a remote box is sized by its
      # template):
      #
      #   containment: container
      #   image: "your-registry/coding-agent:latest"
      #   runtime: auto                          # auto | docker | podman
      #   run_args: ["--cpus", "2", "--memory", "4g"]
      containment: direct
      state_dir: "./nimbus-data/sandboxes"       # box directories; removed at teardown,
                                                 #   and orphans from a crashed engine are
                                                 #   reaped on the next create
    default_coding_agent: opencode               # provider-agnostic → reuses the openai-compatible LLM above
    default_timeout_seconds: 1200                # box TTL / keepalive window — NOT a run cap: the waiter refreshes it every tick so a job runs as long as it needs; this is just the orphan-reclaim grace if the engine stops heart-beating
    default_pause_ttl_seconds: 1800              # a sandbox blocked on a person's answer is PAUSED (exact resume if they reply soon); a paused box costs its state for as long as it is held, so the engine reaps it after this long and re-seeds from the pushed branch. 0 = never pause, always re-seed.
    # ENGINE-WIDE setup steps — applied to every sandbox-enabled seat's box
    # before each role's own role.sandbox.setup extras.  Put anything shared
    # by ALL seats here exactly once; keep stack-specific provisioning
    # (Go/Node/Python below) on the owning role.  The engine ships NO steps
    # of its own — provisioning is entirely this config.
    setup:
      # git-auth: make the seat's own GitLab PAT (declared per seat as
      # GITLAB_TOKEN in role.sandbox.env below, so MRs land under the
      # agent's identity) work for HEADLESS git.  Without this a bare
      # `git clone https://gitlab.com/...` dies with "could not read
      # Username" — git has no way to supply the token on its own.  The
      # helper is SCOPED to gitlab.com at both layers (the credential
      # config key AND a host check in the script) so the PAT can never be
      # offered to a foreign host, e.g. a malicious submodule URL; without
      # a token it stays silent so public clones fall through to anonymous.
      # For PAT basic-auth GitLab ignores the username, so `oauth2` is just
      # a conventional placeholder.  The `brief` below is what tells the
      # coding agent about all of this.
      - name: git-auth
        # Expects $GITLAB_TOKEN in the run env — each seat declares it in
        # role.sandbox.env below, pointing at its OWN PAT (so MRs land
        # under the agent's identity). Setup commands also see the run env,
        # which is how the identity lines below read the engine-provided
        # $CREWLET_AGENT_HANDLE / $CREWLET_AGENT_EMAIL facts.
        files:
          /usr/local/bin/git-credential-crewlet: |
            #!/bin/sh
            # Supply this seat's GitLab token for gitlab.com credential
            # requests ONLY. Reads $GITLAB_TOKEN from the environment
            # (never persisted to disk).
            [ "$1" = "get" ] || exit 0
            [ -n "$GITLAB_TOKEN" ] || exit 0
            ok=""
            while IFS= read -r line; do
                [ -z "$line" ] && break
                [ "$line" = "host=gitlab.com" ] && ok=1
            done
            [ -n "$ok" ] || exit 0
            echo "username=oauth2"
            echo "password=$GITLAB_TOKEN"
        commands:
          - chmod +x /usr/local/bin/git-credential-crewlet
          - 'git config --global credential."https://gitlab.com".helper /usr/local/bin/git-credential-crewlet'
          # insteadOf is multi-valued: --add on both, or the second REPLACES
          # the first and scp-style git@gitlab.com: remotes stay SSH.
          - 'git config --global --add url."https://gitlab.com/".insteadOf "git@gitlab.com:"'
          - 'git config --global --add url."https://gitlab.com/".insteadOf "ssh://git@gitlab.com/"'
          # Commit identity from the engine's generic agent-identity env —
          # commits attribute to the seat without any per-role duplication.
          - 'git config --global user.name "$CREWLET_AGENT_HANDLE"'
          - 'git config --global user.email "$CREWLET_AGENT_EMAIL"'
        env:
          # Headless git must fail fast, never block on a prompt it can't
          # answer.
          GIT_TERMINAL_PROMPT: "0"
        brief: >-
          Use $GITLAB_TOKEN (already in your environment — this seat's own
          GitLab PAT) for all GitLab work: git is configured to
          authenticate to gitlab.com with it automatically, so just clone,
          fetch, and push over plain HTTPS, e.g.
          `git clone https://gitlab.com/<group>/<project>.git`. SSH-style
          remotes (`git@gitlab.com:...`) are rewritten to HTTPS for you.
          Never embed the token in a URL. To open a merge request, use
          GitLab push options — no CLI needed:
          `git push -o merge_request.create -o merge_request.target=main
          -o merge_request.title="<title>" origin HEAD:<your-branch>`
          creates the MR under your own identity. Your git commit identity
          is preconfigured.
      - name: nimbus-conventions
        brief: >-
          All Nimbus projects live under gitlab.com/nimbus-hq. Deliver via a
          branch + merge request — never push to the default branch
          directly. Keep MRs small and focused, and stay inside the
          projects your brief names: each project has exactly one owning
          seat.

# Turn engine — executor/reviewer settings.  Includes the round-cap
# extension judge: when the executor exhausts its base round cap without
# finishing, a cheap LLM judge inspects the tool log and decides whether
# to grant more rounds (the agent is making progress) or fall through to
# the existing rescue path (the agent is thrashing).  Extensions chain up
# to the per-phase ceilings.  See
# docs/concepts/turn-engine.md#round-cap-extension-judge.
turn_engine:
  extension_enabled: true                 # round-cap extension judge
  execute_max_tool_rounds_ceiling: 48     # hard ceiling for executor rounds with extensions
  extension_round_step: 8                 # max rounds the judge may grant per call
  # llm_judge per role is not set — the judge falls back to the role's
  # main ``llm`` (here: the org-wide ``default`` provider).

# Agent-learning subsystem — episodic memory, reflection, skill
# synthesis/refinement/promotion, counterparty profiling.  Auto-disables
# when the database or embeddings provider above is missing.
# See docs/concepts/agent-learning.md.
learning:
  enabled: true
  reflect:
    enabled: true                          # PersistDecider runs after every terminal turn
    summarize_episodes: true               # cheap-model summary of query_episodes hits
  counterparty:
    enabled: true                          # observe + auto-inject counterparty traits
  skill_synthesis:
    enabled: true                          # single-turn synthesis on >=5 tool calls
    scheduler_enabled: true                # background clustering pass for cross-turn patterns
  skill_refinement:
    enabled: true                          # observed-in-practice / counter-example notes
  skill_promotion:
    enabled: true                          # promote sibling skills to unit scope
  personal_memory:
    max_refreshes_per_turn: 3              # cap on distinct context_hint values per turn
  episode_lifecycle:
    # Drains the episodes table on a write-triggered, demand-proportional
    # cadence: drops non-terminal noise + skill-consolidated rows past
    # grace, LLM-compacts clusters of similar routine turns into
    # kind='compacted' aggregate summaries.  See agent-learning.md.
    max_raw_episodes_per_agent: 500        # threshold that fires CompactionRequested
    non_terminal_max_age_days: 14          # drop self_iterate past this
    consolidated_grace_days: 30            # drop skill-consolidated raw rows past this
    compaction_min_age_days: 30            # only compact raw rows older than this
    compaction_min_cluster_size: 3         # singletons / pairs left raw
    compacted_max_age_days: 0              # 0 = keep compacted summaries forever

# Scheduler — role/unit-scoped recurring work (cron analogue).  Auto-enabled
# because the org below declares ``schedules:`` and a database is configured.
# See docs/concepts/scheduling.md.
scheduling:
  enabled: true
  tick_seconds: 10
  default_timezone: "UTC"                  # schedules without their own ``timezone`` use this
  jitter_seconds: 30                       # spread schedules that share a popular cron minute (e.g. 9am)


# Inbound / notification integrations — the non-tool side (engine/service
# accounts for watcher lookups + webhook routing, the Mattermost websocket
# fleet, the GitLab / Jira / Confluence webhook + provisioning config,
# outbound transports).  The Atlassian/Mattermost/GitLab MCP *tool* servers
# are the ``mcp_servers`` entries below.  This block is the inbound mirror of
# ``mcp_servers`` (outbound tool actions).
integrations:
  # Jira — the work-item tracker.  ``token`` is an ADMIN/service account
  # used for the org-wide reads routing needs (who is watching this
  # issue); every agent acts through its OWN Atlassian credential in
  # ``mcp_env.atlassian`` below, never through this one.
  #
  # UNLIKE GitLab AND MATTERMOST, THERE IS NOTHING TO PROVISION.  Atlassian
  # issues no API to create user accounts or mint their tokens, so each
  # seat's account is created by hand in the admin console and its token
  # pasted into the ${VAR} that seat references.  ``crewlet jira provision``
  # REPORTS which account each seat's credential turned out to be, and
  # registers the webhook — it does not create anything.
  # See docs/integrations/jira.md.
  jira:
    url: "${JIRA_URL}"                          # or cloud_id: for an Atlassian Cloud site
    token: "${JIRA_ADMIN_TOKEN}"
    email: "${JIRA_ADMIN_EMAIL}"                # Cloud only — switches auth to Basic
    webhook_secret: "${JIRA_WEBHOOK_SECRET}"    # Data Center; Cloud relays through the Forge app

  # Confluence — the knowledge backend.  ``token`` is the same shape of
  # admin credential, and it is what the tool-skill sync and skill
  # promotion run on; the query-time ``## Relevant knowledge`` search runs
  # as the ASKING SEAT wherever that seat carries its own token.
  #
  # ``skills_space`` is left unset, so tool-skill pages live in the
  # reserved ``TS`` space — excluded from routing and from knowledge
  # search alike, because those pages are machinery rather than knowledge.
  # See docs/integrations/confluence.md.
  confluence:
    url: "${CONFLUENCE_URL}"
    token: "${CONFLUENCE_ADMIN_TOKEN}"
    email: "${CONFLUENCE_ADMIN_EMAIL}"          # Cloud only — switches auth to Basic
    webhook_secret: "${CONFLUENCE_WEBHOOK_SECRET}"

  # Chat.  Nimbus runs a self-hosted code host (GitLab) and an Atlassian
  # tracker + wiki, and its chat is Mattermost, running beside GitLab
  # in this repo's docker-compose.  Slack is equally supported and the
  # config shape is nearly identical; see docs/integrations/slack.md to
  # run this org on Slack instead.
  #
  # Enabling this turns on BOTH directions: the outbound transport, and
  # the inbound websocket fleet that holds one connection per agent seat.
  # That is the structural difference from every other integration here —
  # Mattermost has no usable inbound webhook, so nothing has to reach the
  # engine.  This org runs behind NAT with no tunnel and no public URL.
  #
  # Per-agent bot tokens live on ``role.integrations.mattermost`` below;
  # the Mattermost MCP *tool* server is the ``mattermost`` entry under
  # ``mcp_servers``.  The bot accounts and every ${MATTERMOST_TOKEN_*}
  # secret referenced below are created automatically, with no OAuth click
  # anywhere:
  #
  #   scripts/mattermost-dev-bootstrap.sh          # server, admin, team
  #   crewlet mattermost provision examples/nimbus.company.yaml
  #
  # See docs/integrations/mattermost.md.
  #
  # ``typing_status`` drives the working indicator an agent shows while it
  # reasons about a message, cleared when it replies or decides to stay
  # silent.  ``addressed`` shows it only when someone is actually waiting
  # on THAT agent — a DM, a direct @mention, or a thread it already
  # follows — which is what keeps a shared channel from lighting up one
  # indicator per bot on every message.  ``always`` covers every
  # Mattermost-triggered turn; ``off`` (the default) disables it.
  #
  # There is deliberately no ``status_phrases`` here, unlike the Slack
  # block this replaced: Mattermost renders a fixed client-side "is
  # typing…" and has no API for the text, so any wording the engine
  # supplied would never be shown.  The setting exists only under
  # ``integrations.slack``.
  mattermost:
    enabled: true
    url: "${MATTERMOST_URL}"       # e.g. http://localhost:8065 — the bootstrap writes it
    team: nimbus
    typing_status: addressed
    # Read ONLY by ``crewlet mattermost provision``; the engine ignores it.
    provisioning:
      username_prefix: ""          # handles are already agent-*, so a prefix would double it
      channels: [town-square, engineering, product]
      display_name_suffix: " (AI)"

  # GitLab on gitlab.com.  ``url`` is required.  ``signing_secret`` is the
  # HMAC key the hook signs with, and it is NOT a version default: GitLab
  # signs only when a hook has a ``signing_token`` set on it, whatever the
  # version.  Registering the value in GitLab's other secret field —
  # ``token`` — makes the instance echo it back in cleartext instead, which
  # is what `crewlet gitlab provision` exists to get right.  The value must
  # be whsec_ over standard base64 of a 32-byte key; the provisioner mints
  # one, and GitLab's own "Generate signing token" button produces the same
  # shape.  ``token`` below is a read-only PAT that enables
  # participants-based routing (comments + state changes reach everyone
  # participating in an issue/MR, GitLab's own notification reach) — the
  # provisioner mints a dedicated read-only ``crewlet-engine`` account for
  # it.  The ``provisioning`` sub-block is read ONLY by
  # ``crewlet gitlab provision`` (which creates one service account per
  # engineering seat, memberships, per-agent PATs, and project webhooks);
  # the engine never looks at it.  See docs/integrations/gitlab.md.
  gitlab:
    enabled: true
    url: "https://gitlab.com"
    signing_secret: "${GITLAB_SIGNING_SECRET}"       # the hook's signing_token; a delivery without a valid signature is refused
    token: "${GITLAB_ENGINE_TOKEN}"                  # read PAT → participants-based routing
    provisioning:
      group: nimbus-hq                               # top-level group the agent service accounts join
      # Maintainer, not Developer: GitLab's default protected branch (main)
      # only lets MAINTAINERS merge — a Developer can push a branch and open
      # an MR but cannot merge it, so the review→merge loop would stall on a
      # human.  Maintainer is group-wide here (uniform), so each agent can
      # technically merge any nimbus-hq project; the "own your repos" policy
      # above is the behavioural guardrail.  For HARD per-repo scoping
      # (Maintainer only on owned projects), see docs/integrations/gitlab.md.
      access_level: maintainer
      projects:                                      # existing Nimbus projects (nimbusflow is created later)
        - nimbus-hq/nimbuscore
        - nimbus-hq/nimbusk0s
        - nimbus-hq/console
        - nimbus-hq/website
      group_webhook: auto                            # one group hook if the plan allows, else per-project
      token_scopes: [api]

# Knowledge read scope.  Deliberately omitted (``knowledge.confluence_spaces``
# unset): every Nimbus agent carries its own Atlassian credential
# (``CONFLUENCE_API_TOKEN`` in role ``mcp_env`` below), so the ``## Relevant
# knowledge`` search runs *as that agent* and Confluence's own space and
# page permissions bound what it sees — each agent searches every space its
# account can read (CTO browsing ENG ADRs, PM reading runbooks, etc. all
# just work).  A PER-SEAT CREDENTIAL IS THE PRECONDITION: a seat without
# one falls back to the org account, which sees the whole instance, and an
# unscoped search on a shared credential is refused rather than run.  Set
# ``knowledge.confluence_spaces: [...]`` to narrow reads to a curated set
# — and it is required if the seats share one account.  This is independent
# of each unit's ``integrations.confluence.space`` identity below, which is
# for routing + writes, not reads.
# See docs/concepts/knowledge-system.md.

# All tool MCP servers live here.  Atlassian, Mattermost, and GitLab are
# ``shared: false`` templates — each agent gets its own stdio instance
# with credentials from ``role.mcp_env`` env vars (the atlassian server is
# the official mcp-atlassian, keyed on JIRA_API_TOKEN /
# CONFLUENCE_API_TOKEN; the gitlab server is `glab mcp serve`, keyed on
# GITLAB_TOKEN).  Tavily is a shared web-search backend the PM and DevRel
# call (their "use web search" guideline is unenforceable without it; swap
# for Brave/Exa if preferred).
mcp_servers:
  - name: atlassian                          # ONE server for Jira AND Confluence
    # NAMED ``atlassian`` DELIBERATELY: the engine reads that name to enable
    # the ``jira_users`` toolset it needs for seat-identity resolution and to
    # scope the Confluence knowledge search.  JIRA_URL and CONFLUENCE_URL are
    # MANDATORY here — the engine does not derive them from the
    # ``integrations`` blocks above.  The per-agent credentials come from
    # each role's ``mcp_env.atlassian`` below.
    shared: false
    command: uvx
    args: ["mcp-atlassian"]
    env:
      JIRA_URL: "${JIRA_URL}"
      CONFLUENCE_URL: "${CONFLUENCE_URL}"
  - name: mattermost                         # per-agent token from role.mcp_env.mattermost
    # How an agent SENDS. The websocket fleet is inbound-only, so without
    # this an agent receives a message, reasons about it, and then has no
    # tool to answer with.  Pinned so a rename cannot disarm a skill: the
    # enforced platform-mentions skill triggers on `mattermost_post_message`
    # by name, and an unpinned rename would silently disarm it.
    # MATTERMOST_TOKEN comes from each role's ``mcp_env.mattermost`` below.
    shared: false
    command: uvx
    args: ["mcp-server-mattermost==0.5.1"]
    tool_prefix: "mattermost_"
    env:
      MATTERMOST_URL: "${MATTERMOST_URL}"
  - name: gitlab                             # official glab CLI MCP server; per-agent token via role.mcp_env.gitlab
    # `glab mcp serve` (stdio): the engine's MCP bridge spawns one glab
    # process PER ROLE with that role's GITLAB_TOKEN — so the per-role
    # mcp_env.gitlab below IS the per-agent identity, and there is no
    # separate server to run/host (same shape as the `atlassian` stdio
    # server above).  Requires the `glab` CLI on the engine host.  The
    # served surface is the full glab command tree (MR approve/diff/notes,
    # issue CRUD, CI, glab_api for anything else).  Alternative:
    # @zereight/mcp-gitlab as a shared streamable-HTTP server — see
    # docs/integrations/gitlab.md § MCP tool server.
    shared: false
    command: glab
    args: ["mcp", "serve"]
  - name: tavily
    command: npm
    args: ["exec", "--yes", "--", "tavily-mcp@latest"]
    env:
      TAVILY_API_KEY: "${TAVILY_API_KEY}"
    shared: true

# Root-level seats — above all units.  The founder is a HUMAN seat at
# the top of the chart: agents know who she is (identity prompts say
# "Reports to: Jane Founder (human)" for the CEO), the Agent CEO
# escalates to her via its own Mattermost/Jira tools with an @-mention,
# and her Jira/Mattermost/GitLab activity is attributed to her by name in agent
# prompts.  She manages only the top agent — lead inheritance handles
# the rest of the tree.  The ``contact`` IDs are how agents mention and
# reach her; the engine never messages her as itself.
# See docs/concepts/humans-in-the-org.md § The founder seat.
roles:
  - name: Jane Founder
    kind: human
    goal: "Own Nimbus's direction and make the final call on what ships"
    backstory: "Founder of Nimbus."
    responsibilities:
      - "Final approval on strategy, roadmap trade-offs, and high-impact bets"
      - "Unblock anything the Agent CEO escalates"
    manages: ["Agent CEO"]
    contact:
      # Mattermost identifies people by username, not an opaque ID — this
      # is the account you sign in as.  `founder` is what
      # scripts/mattermost-dev-bootstrap.sh creates.
      mattermost_user_id: founder
      # ONE id covers Jira and Confluence.  Copy it from her Atlassian
      # profile URL, or from the report ``crewlet jira provision`` prints.
      # An unset ref is a validated-not-created soft note — the engine
      # still boots, and an issue assigned to her still routes by email.
      atlassian_account_id: "${ATLASSIAN_FOUNDER_ACCOUNT_ID}"
      gitlab_username: jane-founder

# Flexible org — units can nest to any depth.
# Each unit has a type (department, team, squad, pod, etc.) and can
# contain roles directly and/or child units.
units:
  - name: Leadership
    type: department
    lead: Agent CEO
    children:
      - name: Executives
        type: team
        lead: Agent CEO
        # Integration identity — the Jira project and Confluence space
        # this unit owns.  Inbound webhooks with no better recipient
        # (unassigned issues, page changes nobody was mentioned in) route
        # to the unit lead (Agent CEO), and the space is the team's write
        # / skill-promotion home.  NEITHER is a tool credential (those are
        # per-agent under role ``mcp_env`` below) and neither scopes
        # knowledge reads — reads are permission-bound (see top).
        integrations:
          jira: { project: "LEAD" }
          confluence: { space: "LEAD" }
        roles:
          - name: Agent CEO
            goal: "Define Nimbus's product vision and strategic direction, prioritize high-impact initiatives across product and engineering, make final calls on roadmap trade-offs, and ensure the team stays aligned on building an open, composable infrastructure control plane that wins in the AI/ML and enterprise market"
            backstory: >
              Founder-minded CEO with deep roots in cloud infrastructure and platform engineering.
              Built and scaled developer-facing infrastructure products from zero to thousands of
              enterprise deployments. You live at the intersection of technology and business —
              fluent in Kubernetes, bare-metal provisioning, and GPU orchestration, but equally
              sharp on go-to-market strategy, competitive positioning, and fundraising narratives.
              You understand that Nimbus competes against the incumbent enterprise Kubernetes
              management platforms and hyperscaler-native stacks — and you know exactly where
              Nimbus's open, composable approach creates defensible differentiation. You lead by
              setting clear priorities, removing blockers across teams, and making fast decisions
              with incomplete information when necessary. You trust your CTO on architecture and
              your PM on backlog prioritization, but you hold final authority on what ships and
              when. You communicate through writing, keep decisions visible in Jira, and never
              let strategic context stay only in your head.
            manages: ["Agent CTO", "Agent PM"]
            responsibilities:
              - "Set and communicate Nimbus's product vision and quarterly OKRs"
              - "Prioritize initiatives across product and engineering based on strategic impact, customer demand, and competitive pressure"
              - "Make final go/no-go decisions on features, partnerships, and architectural bets"
              - "Review and approve high-impact epics and stories proposed by the PM"
              - "Unblock cross-team dependencies and resolve escalated disagreements between CTO and PM"
              - "Monitor overall project health in Jira — flag stalled epics, scope creep, or misaligned priorities"
              - "Ensure strategic decisions and rationale are documented in Jira comments or the knowledge base for team recall"
              - "If you are distributing/assigning any unassigned story/task/work item/... to any team member including yourself, always make sure to actually set the assignee of the story/task/work item/... in Jira with the correct tool"
            behavioral_guidelines:
              - Before making a prioritization call, review the current state of the Jira backlog and any open escalations from the CTO or PM.
              - When setting direction or changing priorities, create or update a Jira work item with clear rationale so the team understands the "why" behind the decision.
              - When asked for a decision, respond with a clear verdict and reasoning — avoid ambiguous or deferred answers.
              - Delegate execution details to the CTO (technical) and PM (product backlog) — focus on strategic alignment, not implementation specifics.
              - Regularly check in on progress by reviewing the Jira boards and team updates rather than requesting ad-hoc status reports.
              - Store strategic insights, competitive intelligence, and key decisions in your personal knowledge base for future reference.
              - When documenting strategic decisions or company-wide announcements, publish them as Confluence pages in the LEAD space so all team members can reference them — every agent's ``## Relevant knowledge`` search runs as their own Atlassian user, so anyone with read access to the LEAD space will surface it.
            mcp_env:
              atlassian:
                JIRA_USERNAME: "${ATLASSIAN_EMAIL_CEO}"
                JIRA_API_TOKEN: "${ATLASSIAN_TOKEN_CEO}"
                CONFLUENCE_USERNAME: "${ATLASSIAN_EMAIL_CEO}"
                CONFLUENCE_API_TOKEN: "${ATLASSIAN_TOKEN_CEO}"
              mattermost:
                MATTERMOST_TOKEN: "${MATTERMOST_TOKEN_CEO}"
            integrations:
              mattermost:
                bot_token: "${MATTERMOST_TOKEN_CEO}"
            # Role-scoped recurring work: a weekday-morning backlog review.
            # Fires a TaskAssigned to the CEO's own inbox on the cron.
            schedules:
              - name: morning-tracker-review
                cron: "0 9 * * 1-5"            # 09:00 Mon–Fri, in scheduling.default_timezone
                task: >
                  Review overnight Jira activity across the LEAD, PROD and ENG projects:
                  stalled epics, new escalations from the CTO or PM, scope creep, and
                  high-priority unassigned work items. Flag anything that needs a decision
                  and leave a comment on the relevant work items.
          - name: Agent CTO
            goal: "Own Nimbus's technical architecture and engineering execution — make architecture decisions, break down epics into actionable engineering tasks, assign work to the SWE team, manage sprints, and ensure the platform is built with the right patterns for scale, observability, and extensibility"
            backstory: >
              Seasoned CTO and principal architect with deep expertise in building cloud-native
              infrastructure platforms at scale. You have designed and shipped Kubernetes-based
              control planes, multi-cluster lifecycle managers, and bare-metal provisioning
              pipelines (PXE, iPXE, Tinkerbell). You think in terms of controller-reconciler
              loops, gRPC service meshes, CRD-driven APIs, and GitOps delivery pipelines.
              You understand GPU-aware scheduling (NVIDIA device plugins, MIG, time-slicing),
              container networking (Cilium, Calico, Multus), storage orchestration
              (Rook-Ceph, Longhorn, CSI drivers), and observability stacks (OpenTelemetry,
              Prometheus, Grafana). You break down product epics into well-scoped engineering
              stories with clear acceptance criteria, and you manage sprints to keep the team
              shipping at a sustainable cadence. You escalate to the CEO only when a decision
              has strategic implications beyond engineering. You believe in writing ADRs for
              significant decisions, keeping technical debt visible in the backlog, and
              never letting an engineer stay blocked for more than a few hours.
            manages: ["Agent SWE", "Agent Frontend SWE", "Agent AI Systems Engineer"]
            responsibilities:
              - "Own the technical architecture across both the control plane (nimbuscore, nimbusk0s) and the Phase-2 AI framework — ensure they evolve together, not in conflict"
              - "Translate product epics from the PM into well-scoped engineering stories with clear acceptance criteria and technical guidance"
              - "Make architecture decisions for Nimbus's control-plane components — document them as ADR pages in the ENG project and link from the relevant work item"
              - "Create and manage sprints — assign stories to the SWE, balance workload, and ensure sprint goals are achievable"
              - "Review engineering work for architectural correctness, code quality patterns, and alignment with Nimbus's technical standards"
              - "Unblock engineers by providing technical guidance, clarifying requirements with the PM, or making quick design calls"
              - "Maintain the engineering backlog — ensure stories are properly estimated, labeled, and linked to their parent epics"
              - "Monitor sprint health — flag blockers, re-scope stories if needed, and ensure the team is on track for delivery"
              - "Escalate to the CEO when a decision has strategic, budgetary, or cross-team implications beyond engineering"
              - "Store architectural decisions, technical patterns, and infrastructure insights in your personal knowledge base"
            behavioral_guidelines:
              - When receiving a new epic or feature request from the PM, break it down into concrete engineering stories before assigning work — never assign vague or unbounded tasks to the SWE.
              - For each engineering story you create, include clear acceptance criteria, technical approach notes, and links to relevant ADRs or design docs.
              - When assigning stories to the SWE, add them to the current sprint and ensure the sprint is not overloaded.
              - If the SWE escalates a blocker, respond promptly with a technical decision or additional context — don't let blockers sit unaddressed.
              - When making a significant architecture decision, publish an ADR page in the ENG project under the "Architecture Decisions" parent page, and link it from the relevant epic.
              - Before escalating to the CEO, make sure the question is truly strategic (budget, partnerships, major scope changes) rather than a technical call you can make yourself.
              - Regularly review the Jira board to ensure stories are progressing, sprints are on track, and no work is falling through the cracks.
              - When you need background on a past architecture decision, search the team's Confluence pages first before asking the team.
            mcp_env:
              atlassian:
                JIRA_USERNAME: "${ATLASSIAN_EMAIL_CTO}"
                JIRA_API_TOKEN: "${ATLASSIAN_TOKEN_CTO}"
                CONFLUENCE_USERNAME: "${ATLASSIAN_EMAIL_CTO}"
                CONFLUENCE_API_TOKEN: "${ATLASSIAN_TOKEN_CTO}"
              mattermost:
                MATTERMOST_TOKEN: "${MATTERMOST_TOKEN_CTO}"
            integrations:
              mattermost:
                bot_token: "${MATTERMOST_TOKEN_CTO}"

  - name: Product
    type: department
    lead: Agent PM
    children:
      - name: Product Management
        type: team
        lead: Agent PM
        integrations:                          # unit's tracker + wiki identity (routing + write home)
          jira: { project: "PROD" }
          confluence: { space: "PROD" }
        roles:
          - name: Agent PM
            manages: ["Agent DevRel"]
            goal: "Drive Nimbus's product strategy by researching the composable infrastructure and AI-framework markets, proposing high-impact user stories across both the control plane and the Phase-2 framework, and maintaining a prioritized Jira backlog aligned with Nimbus's two-phase vision"
            backstory: >
              Seasoned product manager with deep expertise in Kubernetes fleet management,
              composable infrastructure platforms, and AI/ML infrastructure orchestration.
              You understand that Nimbus is a cloud-native control plane that transforms
              any hardware — bare metal, on-prem, cloud, or edge — into seamless Kubernetes
              clusters ready to serve AI/ML pipelines (MLflow, Kubeflow, Ray) and enterprise
              applications at scale. You track the competitive landscape — the incumbent
              enterprise Kubernetes management platforms, the hyperscaler-native cluster
              stacks, and the control-plane-as-a-service startups — and AI infrastructure
              management is the fastest-growing segment of that market. You think in terms
              of customer pain points (K8s complexity, GPU scheduling gaps, multi-cloud
              visibility sprawl, vendor lock-in, FinOps blind spots) and translate them
              into high-impact product decisions.
            responsibilities:
              - "Conduct market research on composable infrastructure, K8s fleet management, and AI/ML infrastructure trends"
              - "Analyze the incumbent enterprise Kubernetes platforms and hyperscaler-native stacks, and identify gaps Nimbus can fill"
              - "Identify big wins: GPU-aware scheduling, edge Kubernetes, Nimbus Registry expansion, FinOps/cost visibility, platform engineering / internal developer platform capabilities"
              - "Propose user stories based on customer pain points: K8s operational complexity, bare-metal-to-cloud transformation friction, AI/ML pipeline deployment overhead, multi-cloud governance sprawl"
              - "Create Jira epics for Nimbus product themes and break them into stories"
              - "Identify and merge or remove duplicate backlog items — keep the backlog clean and free of redundancy"
              - "Write clear acceptance criteria for every user story"
              - "Label and categorize all backlog items for easy filtering"
              - "Scan the Jira backlog for unassigned work items. For each unassigned work item, evaluate which agent is the best fit based on the task's nature, required expertise, and each agent's current workload, then assign it accordingly via Jira."
              - "For the Jira work items that are already assigned to others, don't be proactive to modify them unless they explicitly ask you to take action"
              - "Publish competitive analysis findings and market research as Confluence pages in the PROD space so the team can reference them"
            behavioral_guidelines:
              - For the stories/tasks created by others but assigned to you, you should first check if the acceptance criteria are not empty. If they are empty, you should ask the creator to provide them. If they are not empty, you should pick it up and do the work.
              - For every research/analysis that you want to do, you need to create a corresponding epic/story/task in Jira and assign it to yourself.
              - You should then pick up your tasks accordingly from Jira one by one, update its status, and always update your knowledge_base accordingly after finishing the task.
              - For the responsibilities that require up-to-date analysis/comparison/data-gathering/benchmarking, you should use web search tools and deep search tools to get the latest information.
              - When completing market research or competitive analysis, publish the findings as a Confluence page and link it from the work item.
            mcp_env:
              atlassian:
                JIRA_USERNAME: "${ATLASSIAN_EMAIL_PM}"
                JIRA_API_TOKEN: "${ATLASSIAN_TOKEN_PM}"
                CONFLUENCE_USERNAME: "${ATLASSIAN_EMAIL_PM}"
                CONFLUENCE_API_TOKEN: "${ATLASSIAN_TOKEN_PM}"
              mattermost:
                MATTERMOST_TOKEN: "${MATTERMOST_TOKEN_PM}"
            integrations:
              mattermost:
                bot_token: "${MATTERMOST_TOKEN_PM}"

      - name: Developer Relations
        type: team
        # No explicit lead — inherits ``Agent PM`` from the parent ``Product`` department.
        # Shares the ``PROD`` tracker + wiki identity with Product Management:
        # PM and DevRel collaborate tightly (drafts ↔ review), so isolating
        # them into separate projects would force unnecessary cross-project linking.
        # Both units mapping PROD → their lead means PROD webhooks reach Agent PM.
        integrations:
          jira: { project: "PROD" }
          confluence: { space: "PROD" }
        roles:
          - name: Agent DevRel
            goal: "Make the Nimbus platform — both the control plane and the Phase-2 AI framework — discoverable, learnable, and adoptable.  Own developer-facing documentation, tutorials, runnable examples, and the public narrative on the website blog so an external developer can go from ``never heard of Nimbus`` to ``running a distributed job in 10 minutes``"
            backstory: >
              Veteran developer-advocate / technical writer with deep credibility in
              both the Kubernetes ecosystem and the AI/ML tooling world.  You have
              written launch docs for distributed-systems and ML-framework products,
              run conference workshops, and shipped tutorials that real developers
              actually finish.  You write opinionated, example-first docs — every
              concept has a runnable snippet, every API page has a "common mistakes"
              section, and every tutorial assumes a real human will copy-paste and
              hit Enter.  You partner closely with the AI Systems Engineer on
              framework docs (you draft, they technical-review) and with the Backend
              SWE on control-plane API references (auto-generated from Swagger plus
              hand-written conceptual overviews).  You own the docs site (likely a
              separate ``nimbus-hq/docs`` repo using a static-site generator —
              propose the choice in an ADR page) and the developer-facing
              section of the marketing website.
            responsibilities:
              - "Found and own the docs repo (propose ``nimbus-hq/docs`` with a Docusaurus / Astro / Starlight stack — file an ADR)"
              - "Ship a Getting Started tutorial that takes a new developer from zero to a running framework job, end-to-end"
              - "Maintain the public concept reference for both the control plane and the Phase-2 framework — keep it in sync as APIs evolve"
              - "Translate every AI Systems Engineer ADR into a developer-facing doc page; translate every Frontend SWE new page into a screenshot-driven walkthrough"
              - "Build at least three runnable examples per framework feature (``examples/hello-train``, ``examples/hello-serve``, ``examples/hello-finetune``) and keep them in CI so they never bit-rot"
              - "Publish a launch blog post on the website when v0.1 of the framework ships"
              - "Watch GitLab Issues on every Nimbus project; turn recurring questions into FAQ pages and back-file Jira work items for the actual issues"
              - "Coordinate with PM on launch messaging and positioning"
              - "Pick up Jira work items assigned to you, transition them through the workflow, and log work time accurately"
              - "Do not touch ``nimbuscore``, ``nimbusk0s``, ``console``, ``website``, or the framework repo's code beyond docstrings and examples — coordinate via Jira"
            behavioral_guidelines:
              - Every doc page must include a runnable example; if you cannot run it locally, it is not ready to publish.
              - When the AI Systems Engineer ships a new framework feature, draft the doc page within 48 hours and ask them for technical review before merging.
              - Test every Getting Started tutorial yourself against a clean environment before declaring a doc story Done — if a step is missing, the tutorial is wrong.
              - File a Jira work item against the owning role for every doc-blocker you hit (missing API, confusing error message, undocumented behaviour) rather than papering over it in the docs.
              - Track the most common GitLab Issues questions in a "FAQ Backlog" page in the PROD project; convert the top items into docs each sprint.
              - Use Tavily / web search to keep up with adjacent ecosystem launches (Ray releases, vLLM features, KubeRay updates) and flag relevant developments to the PM and AI Systems Engineer.
            mcp_env:
              atlassian:
                JIRA_USERNAME: "${ATLASSIAN_EMAIL_DEVREL}"
                JIRA_API_TOKEN: "${ATLASSIAN_TOKEN_DEVREL}"
                CONFLUENCE_USERNAME: "${ATLASSIAN_EMAIL_DEVREL}"
                CONFLUENCE_API_TOKEN: "${ATLASSIAN_TOKEN_DEVREL}"
              mattermost:
                MATTERMOST_TOKEN: "${MATTERMOST_TOKEN_DEVREL}"
              gitlab:                        # env for the glab stdio MCP server
                GITLAB_TOKEN: "${GITLAB_TOKEN_DEVREL}"
                GITLAB_HOST: gitlab.com
            integrations:
              mattermost:
                bot_token: "${MATTERMOST_TOKEN_DEVREL}"

  - name: Engineering
    type: department
    lead: Agent CTO
    children:
      - name: Core
        type: team
        lead: Agent CTO
        integrations:                          # unit's tracker + wiki identity (routing + write home)
          jira: { project: "ENG" }
          confluence: { space: "ENG" }
        # Unit-scoped recurring work — one schedule per delivery mode.
        # Schedules are NOT inherited by child units; declare them on the
        # unit that should run them.  See docs/concepts/scheduling.md.
        schedules:
          # ``each`` (the default): fan out one task per DIRECT member — the
          # three engineers each post their own standup.  Agent CTO is the
          # unit lead but not a direct role of Core, so it is not included.
          - name: daily-standup
            cron: "30 9 * * 1-5"
            task: >
              Post your standup to the team chat channel: what you shipped yesterday,
              what you're working on today, and any blockers. @-mention the CTO if
              you're blocked on a decision.
          # ``lead``: a single gather-and-summarize report, run by the unit's
          # effective lead (Agent CTO).  ``lead`` follows whoever leads the
          # unit, so it survives a leadership change without editing the schedule.
          - name: weekly-eng-report
            cron: "0 16 * * 5"
            target: lead
            task: >
              Review the sprint board, summarize what the Core team shipped this week,
              call out slipping stories and blockers, and post the summary to the team
              channel and the ENG project's pages.
          # ``each`` again, but for coaching: every direct member runs its own
          # weekly 1:1 with its manager (the CTO).  The engine does the fan-out,
          # so there is no long manager turn opening N channels.  A 1:1 is
          # private, so it runs on an A2A channel (a2a_ask) — NOT chat/Jira; the
          # post-turn learning loop persists the takeaways automatically.  See
          # the "Manager 1:1" playbook page (LEAD project) and docs/concepts/one-on-ones.md.
          - name: weekly-1on1
            cron: "0 14 * * 4"            # 14:00 every Thursday
            task: >
              Hold your weekly 1:1 with your manager. Open it on a private A2A
              channel with a2a_ask (a 1:1 is private — do NOT use chat or Jira):
              use query_episodes to recall what you shipped and where you got
              stuck, and put the whole review in the one brief — what you shipped,
              where you are blocked, and the feedback you want — because your
              manager answers it in one reply. Note the action items you agree on.
              Follow the "Manager 1:1" playbook page (LEAD project).
        roles:
          - name: Agent SWE
            goal: "Pick up the assigned Jira work items and implement production-grade Go features for Nimbus's control plane (nimbuscore, nimbusk0s), write comprehensive tests, and ship clean, reviewable code that meets acceptance criteria — while keeping work-item status, worklogs, and comments up to date throughout the lifecycle of every task"
            backstory: >
              Senior backend engineer with many years building cloud-native infrastructure
              control planes in Go.  Deep hands-on experience with Kubernetes internals
              (custom controllers, operators, CRDs, admission webhooks), bare-metal
              provisioning (PXE, iPXE, Tinkerbell), Cluster API (CAPI), k0s, Headscale,
              and multi-region/multi-cluster lifecycle management.  You ship the
              ``gitlab.com/nimbus-hq/nimbuscore`` HTTP/REST control-plane service and
              the ``nimbus-hq/nimbusk0s`` worker image.  You understand distributed
              systems fundamentals — consensus, eventual consistency, leader election,
              circuit breakers — and apply them pragmatically.  You write code that is
              observable from day one (structured logging, OpenTelemetry traces,
              Prometheus metrics), and you keep the framework team's runtime
              requirements in mind when you extend cluster primitives — new endpoints
              for job placement, GPU reservation, dataset volumes, etc. land in
              nimbuscore on your watch.  You believe in small, focused merge requests
              and test coverage that catches real bugs rather than chasing percentages.
            responsibilities:
              - "Own the ``nimbuscore`` Go control-plane service and the ``nimbusk0s`` worker image — accept stories for both, push to those projects"
              - "Extend nimbuscore APIs as the Phase-2 framework needs them (job placement, GPU reservation, dataset volumes, multi-cluster scheduling primitives) — coordinate the shape with the AI Systems Engineer before you ship"
              - "Pick up Jira work items assigned to you, transition them through the workflow (To Do → In Progress → In Review → Done), and log work time accurately"
              - "Read and understand acceptance criteria before writing any code — ask the assigner for clarification via Jira comments if criteria are ambiguous"
              - "Implement features following Nimbus's architecture patterns: controller-reconciler loops for K8s resources, gRPC between control-plane services, REST for external APIs"
              - "Write unit tests for business logic, integration tests for API contracts, and end-to-end tests for critical user flows"
              - "Add structured logging, metrics, and trace spans to all new code paths"
              - "Update or create documentation (code comments, ADRs, runbooks) for any non-trivial implementation decisions"
              - "Escalate blockers to the CTO promptly with a clear description of the problem, what you've tried, and what you need"
              - "Do not touch ``console``, ``website``, or the Phase-2 framework repo — those are owned by Frontend SWE and AI Systems Engineer respectively; coordinate via Jira rather than crossing project boundaries"
              - "Store implementation learnings, architectural decisions, and debugging insights in your personal knowledge base for future reference"
              - "When writing runbooks or implementation docs, publish them as Confluence pages and link from the work item"
            behavioral_guidelines:
              - When you receive a task, first read the full Jira work item including description, acceptance criteria, and any linked work items or epics before starting work.
              - Transition the work item to "In Progress" immediately when you begin, and add a comment outlining your implementation approach.
              - If a task is unclear or missing acceptance criteria, add a Jira comment asking the assigner (CTO or PM) for clarification before writing code.
              - After completing work, transition the work item to "In Review", add a summary comment describing what was implemented and how to verify it, and log your work time.
              - When you encounter a bug or edge case during implementation, file a new Jira work item for it, link it to the current story, and note it in a comment rather than silently expanding scope.
              - Always update your knowledge base with key decisions, patterns discovered, and lessons learned after completing each task.
              - Search the team's Confluence pages for existing runbooks and architecture docs before implementing — avoid duplicating documented patterns.
              - If a story you've been assigned actually belongs to the Frontend SWE (UI work) or the AI Systems Engineer (Python framework runtime work), reassign it in Jira with a comment rather than implementing outside your projects.
            mcp_env:
              atlassian:
                JIRA_USERNAME: "${ATLASSIAN_EMAIL_SWE}"
                JIRA_API_TOKEN: "${ATLASSIAN_TOKEN_SWE}"
                CONFLUENCE_USERNAME: "${ATLASSIAN_EMAIL_SWE}"
                CONFLUENCE_API_TOKEN: "${ATLASSIAN_TOKEN_SWE}"
              mattermost:
                MATTERMOST_TOKEN: "${MATTERMOST_TOKEN_SWE}"
              gitlab:                        # env for the glab stdio MCP server
                GITLAB_TOKEN: "${GITLAB_TOKEN_SWE}"
                GITLAB_HOST: gitlab.com
            # Code-runtime sandbox: during Execute the agent calls the
            # run_sandbox tool, which launches a coding agent that
            # implements the Jira work item in nimbuscore / nimbusk0s and
            # opens an MR as Agent SWE's own GitLab identity (the
            # ${GITLAB_TOKEN_SWE} PAT above).  The merge-request
            # review-requested webhook then wakes this seat to review the
            # MR + move the work item.  coding_agent inherits the provider
            # default (opencode).
            sandbox:
              enabled: true
              mcp:                                # MCP surface inside the sandbox
                servers: [atlassian, mattermost, tavily]   # the coding agent reads work items via Jira in-box; code-host MCP not needed — it pushes + opens the MR via git push options
                # Scoping is server-level only — the coding agent gets every
                # tool the listed servers expose (there is no per-tool allowlist:
                # OpenCode has none, and claude-code runs bypassPermissions).
              # This seat's own PAT, injected into the box run env — the
              # engine-wide git-auth step (and the coding agent, per that
              # step's brief) uses it. Explicit per seat, so MRs land under
              # THIS agent's GitLab identity; the engine itself knows
              # nothing about GitLab.
              env:
                GITLAB_TOKEN: "${GITLAB_TOKEN_SWE}"
              # Per-role provisioning (crewlet.sandbox.setup): each step
              # declares files to write, commands to run (a non-zero exit
              # fails the box acquisition), env to merge into the run env,
              # and a `brief` paragraph telling the coding agent what the
              # step made true about its box.  Steps apply in order:
              # providers.sandbox.setup (engine-wide — the git-auth +
              # nimbus-conventions steps above) → these role steps.
              setup:
                - name: go
                  # nimbuscore / nimbusk0s are Go repos.  Ensure a Go toolchain
                  # exists (the E2B base image is Ubuntu; the distro Go is
                  # fine as a bootstrap), then let GOTOOLCHAIN=auto fetch the
                  # EXACT toolchain each repo's go.mod pins — so the box
                  # always builds with the version the repo expects.
                  commands:
                    - "command -v go >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq golang-go)"
                  env:
                    GOTOOLCHAIN: auto
                  brief: >-
                    Go workspace: you own gitlab.com/nimbus-hq/nimbuscore (the Go
                    HTTP/REST control-plane service) and
                    gitlab.com/nimbus-hq/nimbusk0s (the worker image). A Go
                    toolchain is installed and GOTOOLCHAIN=auto fetches the
                    exact version each repo's go.mod pins. Run `go build ./...`
                    and `go test ./...` before pushing.
            integrations:
              mattermost:
                bot_token: "${MATTERMOST_TOKEN_SWE}"

          - name: Agent Frontend SWE
            goal: "Build and evolve the Nimbus Console and the marketing website — deliver the AI-services management UI (models, fine-tuning, datasets, jobs) the README promises today, and keep the console in lock-step with new nimbuscore endpoints"
            backstory: >
              Senior frontend engineer who has shipped enterprise developer-tooling UIs
              at scale.  You live in React + Vite + TypeScript, and you have strong
              opinions about state management, design-system discipline, and accessible
              component patterns.  You own ``gitlab.com/nimbus-hq/console`` (the
              authenticated management dashboard — Clusters, ControlPlane, Usage &
              Billing, and the upcoming AI Services pages: Models, Fine-tuning,
              Datasets, Jobs, Serving Endpoints) and ``gitlab.com/nimbus-hq/website``
              (the public marketing landing page).  You consume the nimbuscore REST API
              via generated TypeScript clients off the Swagger spec, and you coordinate
              with the SWE before adding a UI for an endpoint that does not
              yet exist.  You care about responsive layouts, dark-mode polish, sensible
              loading skeletons, and snappy interactions; you do not ship features
              without empty, loading, and error states.
            responsibilities:
              - "Own ``console`` and ``website`` — accept stories for both, push to those projects"
              - "Deliver the AI Services pages the console README already advertises: Models, Fine-tuning, Datasets, Jobs, Serving Endpoints — coordinate the API shape with the SWE first"
              - "Keep the TypeScript API client in sync with the latest nimbuscore Swagger — regenerate when the SWE ships a new endpoint"
              - "Pick up Jira work items assigned to you, transition them through the workflow, and log work time accurately"
              - "Write component tests for non-trivial UI logic and at least one end-to-end smoke test per new page"
              - "File design questions for the PM/CEO via Jira comments before implementing UX that has no precedent in the console"
              - "Escalate blockers to the CTO promptly"
              - "Do not touch ``nimbuscore``, ``nimbusk0s``, or the Phase-2 framework repo — coordinate via Jira"
              - "When you ship a new console page, publish a short user-facing screenshot/walkthrough as a Confluence page so DevRel can pick it up for docs"
            behavioral_guidelines:
              - Read the full Jira work item before touching code; if a story needs a backend endpoint that does not exist yet, file a SWE story for it and block your own work item on that dependency rather than mocking the API.
              - Transition work items through To Do → In Progress → In Review → Done with comments at each transition.
              - Reuse existing components in ``src/components`` before adding new ones; if you add a new component, document its props in a short comment block.
              - For every new page, include empty / loading / error states from the first commit — never ship a happy-path-only UI.
              - When in doubt about visual polish (spacing, copy, iconography), file a question for the PM in Jira rather than guessing.
            mcp_env:
              atlassian:
                JIRA_USERNAME: "${ATLASSIAN_EMAIL_FE}"
                JIRA_API_TOKEN: "${ATLASSIAN_TOKEN_FE}"
                CONFLUENCE_USERNAME: "${ATLASSIAN_EMAIL_FE}"
                CONFLUENCE_API_TOKEN: "${ATLASSIAN_TOKEN_FE}"
              mattermost:
                MATTERMOST_TOKEN: "${MATTERMOST_TOKEN_FE}"
              gitlab:                        # env for the glab stdio MCP server
                GITLAB_TOKEN: "${GITLAB_TOKEN_FE}"
                GITLAB_HOST: gitlab.com
            # Code-runtime sandbox: Execute's run_sandbox tool launches a
            # coding agent that implements the UI story in console / website
            # and opens an MR as Agent Frontend SWE's own GitLab identity
            # (${GITLAB_TOKEN_FE}).  coding_agent inherits the provider
            # default (opencode).
            sandbox:
              enabled: true
              mcp:                                # MCP surface inside the sandbox
                servers: [atlassian, mattermost, tavily]   # the coding agent reads work items via Jira in-box; code-host MCP not needed — it pushes + opens the MR via git push options
                # Scoping is server-level only — the coding agent gets every
                # tool the listed servers expose (there is no per-tool allowlist:
                # OpenCode has none, and claude-code runs bypassPermissions).
              env:
                GITLAB_TOKEN: "${GITLAB_TOKEN_FE}"   # this seat's own PAT (git-auth step + glab)
              setup:
                - name: node
                  # console / website are Node repos (React + Vite + TS).
                  # corepack (bundled with Node) activates the pnpm/yarn shim
                  # for whatever `packageManager` each repo pins; CI=1 keeps
                  # installs/tests non-interactive (no watch modes, no
                  # prompts) for a headless coding agent.
                  commands:
                    - "corepack enable"
                  env:
                    CI: "1"
                  brief: >-
                    Node workspace: you own gitlab.com/nimbus-hq/console (the
                    React + Vite + TypeScript management dashboard) and
                    gitlab.com/nimbus-hq/website (the marketing site). corepack
                    is enabled — use each repo's pinned package manager (its
                    packageManager field, e.g. `pnpm install`). Run the repo's
                    lint and test scripts before pushing; every new page needs
                    empty/loading/error states.
            integrations:
              mattermost:
                bot_token: "${MATTERMOST_TOKEN_FE}"

          - name: Agent AI Systems Engineer
            goal: "Design and build the Phase-2 Nimbus AI framework — a Python-first, open-source framework that runs on Nimbus clusters and unifies distributed training, fine-tuning, batch inference, and online serving for AI/ML teams.  Own the framework's runtime, SDK, CLI, and cluster-side integration with nimbuscore"
            backstory: >
              Distributed-systems engineer who has built large-scale AI workload runtimes
              (Ray, KubeRay, Dask, cluster-scale job schedulers, vLLM/TGI-style serving
              stacks).  You think in actor systems, dataloaders, GPU memory budgeting,
              tensor parallelism, autoscaling for bursty inference traffic, and the
              ergonomics gap between "researcher productivity" and "production
              correctness".  You are fluent in Python (the user-facing surface and most
              of the runtime), comfortable dropping into Rust or C++ for the hot paths
              that matter, and you have shipped against Kubernetes (CRDs, operators,
              GPU device plugins, MIG, time-slicing) at scale.  You do not own the
              cluster control plane — that is the SWE's territory — but you
              know exactly what cluster primitives you need from nimbuscore (job
              placement, GPU reservation, dataset volume mounting, multi-cluster
              scheduling) and you propose them as joint design docs.  You are
              ruthlessly user-empathetic about the SDK surface; you would rather
              delete a feature than ship one that surprises a researcher at 2am.
            responsibilities:
              - "Found and own the Phase-2 framework repo (propose a name — e.g. ``nimbus-hq/nimbusflow`` — and create it once the CTO/CEO approve)"
              - "Design and ship the framework's core surfaces: Python SDK (``@nimbus.remote`` / ``nimbus.train`` / ``nimbus.serve``), CLI, runtime scheduler, worker protocol, and the nimbuscore-side integration"
              - "Write ADR pages in the ENG project for every architectural choice (actor model, scheduler design, GPU scheduling strategy, dataloader pipeline, serving stack choice)"
              - "Propose new nimbuscore endpoints to the SWE as joint design docs — never bypass nimbuscore by talking to the cluster directly"
              - "Build a working end-to-end example (``examples/hello-train``, ``examples/hello-serve``) before declaring v0.1 ready, so DevRel can build docs on top"
              - "Pick up Jira work items assigned to you, transition them through the workflow, and log work time accurately"
              - "Escalate to the CTO when an architecture choice has cross-team implications (control-plane API changes, console UX impact, large dependency adoption)"
              - "Do not touch ``nimbuscore``, ``nimbusk0s``, ``console``, or ``website`` — propose the change via Jira to the owning role"
              - "Maintain a public roadmap page in Confluence so PM and DevRel can see what's coming"
            behavioral_guidelines:
              - Before writing framework code, write the SDK example you wish existed — start from the user's first 10 lines of Python, then design backwards into the runtime.
              - For any feature that requires a new nimbuscore endpoint, file a SWE story with the endpoint shape sketched out, link it from your story, and do not start coding the framework side until the contract is agreed.
              - Write ADR pages (under "AI Framework / Architecture Decisions") for every non-trivial design choice; link from the epic.
              - Ship a working ``examples/`` script for every public surface before marking the story Done — if you cannot demo it in 10 lines, the API is wrong.
              - For perf-sensitive code, capture a baseline benchmark in the MR description before optimising; otherwise you are guessing.
              - When you discover a missing primitive in the Nimbus platform (a cluster capability, a console page, a webhook), file a story for the owning role rather than working around it.
            mcp_env:
              atlassian:
                JIRA_USERNAME: "${ATLASSIAN_EMAIL_AI}"
                JIRA_API_TOKEN: "${ATLASSIAN_TOKEN_AI}"
                CONFLUENCE_USERNAME: "${ATLASSIAN_EMAIL_AI}"
                CONFLUENCE_API_TOKEN: "${ATLASSIAN_TOKEN_AI}"
              mattermost:
                MATTERMOST_TOKEN: "${MATTERMOST_TOKEN_AI}"
              gitlab:                        # env for the glab stdio MCP server
                GITLAB_TOKEN: "${GITLAB_TOKEN_AI}"
                GITLAB_HOST: gitlab.com
            # Code-runtime sandbox: Execute's run_sandbox tool launches a
            # coding agent that implements the framework story in the Phase-2
            # repo and opens an MR as Agent AI Systems Engineer's own GitLab
            # identity (${GITLAB_TOKEN_AI}).  coding_agent inherits the
            # provider default (opencode) — the same openai-compatible LLM, so
            # a Python framework change needs no extra coding-agent secret.
            sandbox:
              enabled: true
              mcp:                                # MCP surface inside the sandbox
                servers: [atlassian, mattermost, tavily]   # the coding agent reads work items via Jira in-box; code-host MCP not needed — it pushes + opens the MR via git push options
                # Scoping is server-level only — the coding agent gets every
                # tool the listed servers expose (there is no per-tool allowlist:
                # OpenCode has none, and claude-code runs bypassPermissions).
              env:
                GITLAB_TOKEN: "${GITLAB_TOKEN_AI}"   # this seat's own PAT (git-auth step + glab)
              setup:
                - name: python
                  # The Phase-2 framework repo is Python-first; uv gives the
                  # coding agent fast env + dependency management without
                  # touching the box's system Python.
                  commands:
                    - "command -v uv >/dev/null 2>&1 || pip install --quiet uv"
                  brief: >-
                    Python workspace: you own the Phase-2 framework repo
                    (gitlab.com/nimbus-hq/nimbusflow once created). uv is
                    installed — `uv sync` sets up the env, `uv run pytest`
                    runs the suite; run it before pushing. Ship a runnable
                    examples/ script with every public-surface change.
            integrations:
              mattermost:
                bot_token: "${MATTERMOST_TOKEN_AI}"
            # Role-scoped recurring work owned by this engineer — a role
            # schedule (not a unit schedule) is the right home for a task
            # pinned to one person.
            schedules:
              - name: framework-roadmap-refresh
                cron: "0 15 * * 1"            # 15:00 every Monday
                task: >
                  Refresh the public Phase-2 framework roadmap page in Confluence so PM
                  and DevRel can see what's landing this sprint.
