# A lookup: the assistant searches Worklet as the person and answers
# from what the search returned.
person:
  apps: [worklet]
question: Is anybody working on the release checklist?
answers:
  - route: GET /worklet/search
    body:
      hits:
        - {key: ENG-42, title: Release checklist for 2.4, status: in_progress, assignee: ada, project: ENG}
script:
  - call: search_work
    args: {q: release checklist}
  - say: Yes. Ada is working on ENG-42, the release checklist for 2.4.
expect:
  calls: [search_work]
  never: [create_task, update_task]
  proposals: 0
  state: completed
  says: [ENG-42]
