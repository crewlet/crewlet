# An agent says it lacks a GitHub permission and asks for it at GitHub. The
# assistant reads the agent's access, sees that the agent's app already holds
# Workflows and its grant in Crewlet leaves it unused, and proposes the grant
# in Crewlet rather than sending anybody to GitHub.
person:
  apps: [admin]
page:
  screen: integrations
  title: Integrations › GitHub
  params: {kind: github}
  query: {}
  resources: []
  selection: null
  source_revision: url:4d2e6f10
  accepts: []
question: >-
  Our Site Reliability Engineer says it cannot change workflow files because
  Workflows is not granted, and asks me to add Workflows to its GitHub App.
  Is that what I should do?
answers:
  - route: GET /org
    body:
      timezone: UTC
      roles:
        - {handle: sre, name: Site Reliability Engineer, kind: agent}
  - route: GET /setup/integrations/{kind}/access/seats/{handle}/{lane}
    body:
      kind: github
      lane: github
      integration: GitHub
      handle: sre
      name: Site Reliability Engineer
      status: in_sync
      status_label: In sync
      grant: Contents Read and write, Pull requests Read and write
      holds: Contents Read and write, Pull requests Read and write
      app_holds: Contents Read and write, Pull requests Read and write, Workflows Read and write
      unused: Workflows Read and write
      scope: acme/api
      account: acme-sre[bot]
      tool: live
      checked_at: "2026-11-10T11:47:00Z"
      applied_at: "2026-11-10T11:38:00Z"
      outcome: Applied
      plan: []
  - route: GET /setup/integrations/{kind}/access
    body:
      kind: github
      revision: r7
      syncing: false
      options:
        - lane: github
          live: false
          permissions:
            - {key: contents, name: Contents}
            - {key: pull_requests, name: Pull requests}
            - {key: workflows, name: Workflows, write_only: true}
      seats:
        - handle: sre
          name: Site Reliability Engineer
          lanes:
            github:
              desired: {enabled: true, permissions: {contents: write, pull_requests: write}, scope: [acme/api]}
              observed: {exists: true, enabled: true, permissions: {contents: write, pull_requests: write}, ceiling: {contents: write, pull_requests: write, workflows: write}}
              status: in_sync
              plan: []
              tool: live
  - route: PUT /setup/integrations/{kind}/access
    body:
      kind: github
      revision: r7
      plans:
        - handle: sre
          lane: github
          steps:
            - {op: level, verb: permissions, text: "Give the agent's tokens Workflows (Read and write)", by: crewlet}
script:
  - call: get_seat_access
    args: {handle: Site Reliability Engineer, integration: github}
  - call: set_seat_access
    args: {handle: sre, integration: github, permissions: {workflows: write}}
expect:
  calls: [get_seat_access, set_seat_access]
  proposals: 1
  state: waiting_for_approval
  shows: [Grant leaves unused, Workflows Read and write]
