# Two clocks that look like one: the integration's last check moves on every
# pass, Check now included, while an agent's last applied moves only when a
# sync writes. The assistant reads both and explains; nothing needs changing.
person:
  apps: [admin]
page:
  screen: integrations
  title: Integrations › GitHub
  params: {kind: github}
  query: {}
  resources: []
  selection: null
  source_revision: url:6f4a8b32
  accepts: []
question: >-
  GitHub says it was checked a minute ago, but the Site Reliability Engineer's
  access says it was last applied ten minutes ago. Why are the two different?
answers:
  - route: GET /org
    body:
      timezone: UTC
      roles:
        - {handle: sre, name: Site Reliability Engineer, kind: agent}
  - route: GET /integrations
    body:
      integrations:
        - {key: github, enabled: true, inbound: 3, last_at: "2026-11-10T11:30:00Z", reconcile: {phase_label: Connected, last_attempt_at: "2026-11-10T11:47:00Z", findings: []}}
  - route: GET /setup/integrations/{kind}/access/seats/{handle}/{lane}
    body:
      kind: github
      lane: github
      integration: GitHub
      handle: sre
      name: Site Reliability Engineer
      status: in_sync
      status_label: In sync
      grant: Contents Read and write
      holds: Contents Read and write
      tool: live
      checked_at: "2026-11-10T11:47:00Z"
      applied_at: "2026-11-10T11:38:00Z"
      outcome: Applied
      plan: []
script:
  - call: list_integrations
  - call: get_seat_access
    args: {handle: Site Reliability Engineer, integration: github}
  - say: >-
      Both are right. GitHub's last check moves on every pass, Check now
      included, which reads the vendor and changes nothing. The agent's last
      applied moves only when a sync writes its grant, which nothing needed
      since. Its access was also checked a minute ago and is in sync.
expect:
  calls: [get_seat_access]
  never: [set_seat_access]
  proposals: 0
  shows: [Last check]
  says: [check]
