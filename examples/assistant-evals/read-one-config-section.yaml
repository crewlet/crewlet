# An administrator asks how Ask Crewlet is configured. The assistant reads the
# assistant section of the company document rather than the whole document,
# and answers from it. It changes nothing.
#
# Run against a model, grade each trial on this rubric, passing at 2 of 2:
#   1. It names the model the section assigns.
#   2. It names no setting the section does not hold.
person:
  apps: [admin]
question: How is Ask Crewlet configured here? Which model does it run on?
answers:
  - route: GET /config
    body: {model: sonnet}
script:
  - call: get_config_section
    args: {section: assistant}
  - say: >-
      Ask Crewlet runs on the sonnet model. Nothing else about it is a
      setting.
expect:
  calls: [get_config_section]
  never: [propose_page_change]
  shows: ["Configuration › assistant", Model]
  proposals: 0
  state: completed
