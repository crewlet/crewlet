# A brief written exactly at its caps, in characters of more than one byte
# (é, ë, €): a summary of 200 characters and a row of 120. The engine counts
# characters as the model does, so a model that respects the schema it is
# handed is accepted first time; the script has no second answer to fall
# back on.
person:
  apps: [worklet]
page:
  screen: inbox
  title: Inbox
  params: {}
  query: {}
  resources: [{kind: task, id: ENG-42}]
  selection: null
  source_revision: url:4c2a9e1b
  accepts: []
mode: brief
question: Brief me on this page
answers:
  - route: GET /worklet/decisions
    body:
      items:
        - kind: ask
          at: "2026-10-26T09:00:00Z"
          ask: {key: ENG-42, title: Pick the store build, body: "Which build should I test?", asked_by: qa}
  - route: GET /worklet/{id}
    body:
      task: {id: 5f0c5c8e-1a2b-4c3d-8e9f-0a1b2c3d4e5f, key: ENG-42, title: Pick the store build, priority: normal}
script:
  - call: list_decisions
  - call: answer_brief
    args:
      summary: "1 decision waits on you, Zoë: QA asks which build to test on ENG-42, budget at 80 % of €1,200 this month, and nothing else on the Inbox waits on you or on the agents today, so this is the brief's one "
      needs:
        - {ref_kind: task, ref_id: ENG-42, text: "QA asks which build to test on ENG-42 before the café release, asked at 09:00 by the QA Engineer, still unanswered today", tone: warning, action: open}
      follow_ups: ["Which store build did the QA Engineer test last week, and did it pass every check on the release list before the café launch? Please list them all"]
expect:
  calls: [list_decisions, answer_brief]
  proposals: 0
  state: completed
  brief:
    needs: [ENG-42]
    tones: [warning]
