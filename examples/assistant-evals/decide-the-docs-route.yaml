              - {id: worker, label: "A Worker route on the free tier"}
              - {id: defer, label: "Defer until the docs release"}
            recommended: origin-rule
            rationale: One rule to maintain, and the Pro plan is a small cost.
            role: approver
script:
  - call: list_decisions
  - call: get_task
    args: {item: ENG-41}
  - call: get_task_thread
