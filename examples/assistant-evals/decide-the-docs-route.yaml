  apps: [admin]
  acts: [comment_on_work_item]
page:
  screen: inbox
  title: Inbox
  params: {}
  query: {}
  resources: [{kind: task, id: ENG-41}]
  selection: {kind: task, id: ENG-41}
  source_revision: url:1a2b3c4d
  accepts: []
