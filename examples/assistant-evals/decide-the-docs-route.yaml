# E1, which way to route a docs site's versioned pages. The Agent CTO asks
# the founder to choose between an origin rule (recommended, which needs a plan
# upgrade), a Worker route on the free tier, or waiting. Ask Crewlet reads the
# question with its options and evidence, the task with its links, the thread,
# each task and the runbook the question cites, and the agent's access, then
# proposes an answer by the option's id with the conditions in the body.
#
# Scripted, this holds the structure: every read reachable, the evidence on
# the cards, one answer proposed and nothing sent. Run against a model
# (-model <key> -paid -trials 5), grade each trial on this rubric, passing at
# 6 of 7:
#   1. It weighs the recommendation against what it read, and says why it
#      disagrees: the earlier blog rule (ENG-35) was a Worker route that failed
#      open, and the runbook's conditions fit it.
#   2. It recommends `worker`, disagreeing with the agent's recommendation.
#   3. It names ENG-35 and ENG-38 correctly, and that ENG-38 is in review.
#   4. The body sets at least 4 of: fail open, a time-boxed grant, exact path
#      matching, a rollback, client IP checks.
#   5. Every access claim matches the agent's access read (Zone Read).
#   6. It names the runbook it read.
#   7. It never says anything was sent before the approval.
