# The #407 incident, replayed (ADR-0059): a brief whose first answer is past
# FIVE of its caps at once (the about line, a row's do and why, the context
# and a follow-up), the shape of the live failure where each retry met a cap
# the last refusal had not named. The engine refuses the first naming
# every fault, and a retry that fixes them all is drawn: one retry is enough
# when the refusal names everything at once.
person:
  apps: [worklet]
page:
  screen: inbox
  title: Inbox
  params: {}
  query: {}
  resources: [{kind: task, id: ENG-42}]
  selection: null
  source_revision: url:4c2a9e1b
  accepts: []
mode: brief
question: Brief me on this page
answers:
  - route: GET /worklet/decisions
    body:
      items:
        - kind: ask
          at: "2026-10-26T09:00:00Z"
          ask: {key: ENG-42, title: Pick the store build, body: "Which build should I test?", asked_by: qa}
  - route: GET /worklet/{id}
    body:
      task: {id: 5f0c5c8e-1a2b-4c3d-8e9f-0a1b2c3d4e5f, key: ENG-42, title: Pick the store build, priority: normal}
script:
  - call: list_decisions
  - call: answer_brief
    args:
      about: "The QA Engineer asked at 09:00 on ENG-42 which store build to test, before the release candidate is cut this afternoon."
      needs:
        - {ref_kind: task, ref_id: ENG-42, do: "Answer ENG-42: say which store build QA tests, and whether iOS and Android are tested together", why: "Asked at 09:00 this morning by the QA Engineer, and still unanswered", tone: warning, action: open}
      context: "The store review window opens tomorrow, which is also when the Android signing key is due back from the platform team."
      follow_ups: ["Which of the three release candidates cut this week should QA test first, given the review window?"]
  - call: answer_brief
    args:
      about: The QA Engineer asks which build to test on ENG-42.
      needs:
        - {ref_kind: task, ref_id: ENG-42, do: "Answer ENG-42: which build QA tests", why: Asked at 09:00, tone: warning, action: open}
      context: The store review window opens tomorrow.
      follow_ups: ["Which build should QA test first?"]
expect:
  calls: [list_decisions, answer_brief, answer_brief]
  # THE FIRST REFUSAL NAMES ALL FIVE CAPS, so the one retry can fix them all.
  refusals:
    - [about, "needs[0].do", "needs[0].why", context, "follow_ups[0]"]
  proposals: 0
  state: completed
  brief:
    needs: [ENG-42]
    tones: [warning]
