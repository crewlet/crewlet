# The Agent CTO asks the founder which way to route the docs site's versioned
# pages, offering three options and recommending one. The assistant reads what
# waits on the person, which lists the question with its comment id, every
# option by its id, the recommendation and why, and what it cites, so it can
# answer with an option's id without reading the raw answer. It proposes the
# answer and nothing is sent until the person approves it.
person:
  apps: [worklet]
  acts: [comment_on_work_item]
page:
  screen: inbox
  title: Inbox
  params: {}
  query: {}
  resources: [{kind: task, id: ENG-41}]
  selection: {kind: task, id: ENG-41}
  source_revision: url:5c1e0b7a
  accepts: []
question: >-
  What is the Agent CTO asking me on ENG-41, and what does it recommend? Answer
  it with the Worker route.
answers:
  - route: GET /worklet/decisions
    body:
      handle: jane-founder
      more: false
      total: 1
      items:
        - kind: ask
          at: "2026-11-14T09:00:00Z"
          put_to_you: true
          may_answer: true
          needs_you: true
          ask:
            key: ENG-41
            title: Serve versioned docs pages from the docs site
            comment: c-12
            asked_by: agent-cto
            asked_at: "2026-11-14T09:00:00Z"
            body: Which way should we route /docs/{version} to the docs site?
            open: true
            decision:
              question: Which way should the edge route versioned docs pages?
              options:
                - {id: origin-rule, label: "Origin rule with a Host override", detail: "Needs a plan upgrade"}
                - {id: worker, label: "A Worker route on the free tier"}
                - {id: defer, label: "Defer until the docs release"}
              recommended: origin-rule
              rationale: One rule to maintain, and the plan upgrade is small.
              role: approver
              evidence:
                - {kind: url, ref: "https://docs.example.com/rules/origin", label: "Origin rules"}
  - route: GET /worklet/comments
    body:
      key: ENG-41
      title: Serve versioned docs pages from the docs site
      comments:
        - id: c-12
          author: agent-cto
          ask: jane-founder
          body: Which way should we route /docs/{version} to the docs site?
          decision:
            question: Which way should the edge route versioned docs pages?
            options:
              - {id: origin-rule, label: "Origin rule with a Host override", detail: "Needs a plan upgrade"}
              - {id: worker, label: "A Worker route on the free tier"}
              - {id: defer, label: "Defer until the docs release"}
            recommended: origin-rule
            role: approver
script:
  - call: list_decisions
  - call: answer_decision
    args:
      item: ENG-41
      answers: c-12
      choice: worker
      body: Use a Worker route on the free tier, matching the exact path only.
expect:
  calls: [list_decisions, answer_decision]
  never: [comment_on_task]
  shows:
    - "origin-rule: Origin rule with a Host override (Needs a plan upgrade)"
    - "worker: A Worker route on the free tier"
    - "One rule to maintain"
    - "url: https://docs.example.com/rules/origin (Origin rules)"
    - "c-12"
    - Answer question
  proposals: 1
  state: waiting_for_approval
