# yaml-language-server: $schema=../schema/bootstrap.schema.json
# Tier A bootstrap config for the SUBSCRIPTION-CLI Nimbus example.
#
# Pairs with examples/nimbus-claude-cli.company.yaml (Tier B) — a CHAT-ONLY
# company on a coding-CLI subscription, so this node needs no API key, no
# broker, no database and no public URL.  `nimbus.config.yaml` beside it is
# the Tier A file for the full-stack example, which does.
#
# Bring the pair up end to end:
#
#     # 0. What this file reads from the environment, which every command
#     #    given -config below needs: the keyring every node needs — see
#     #    `secrets:` below; `crewlet secrets keygen -key-id 2026-01` prints
#     #    the export line + snippet — and this node's own API token.
#     export CREWLET_SECRET_KEY_2026_01="<base64 key from `crewlet secrets keygen`>"
#     export CREWLET_API_TOKEN_FOUNDER="$(openssl rand -hex 32)"
#
#     # 1. Chat: the server, an admin, the team, the channels, the bots.
#     docker compose --profile mattermost up -d --wait
#     COMPANY=examples/nimbus-claude-cli.company.yaml scripts/mattermost-dev-bootstrap.sh
#
#     # 2. The model: authenticate the `claude` CLI inside Crewlet's own
#     #    directory (-capture-token in place of -from-host mints a headless
#     #    token instead), then prove it end to end BEFORE the first turn.
#     #    With this node's engine stopped both reach the fleet's secret
#     #    store themselves, through the node's own broker on
#     #    ./nimbus-data/stream (which nimbus.config.yaml shares); once the
#     #    engine runs, they go through it, with
#     #    CREWLET_API_TOKEN="$CREWLET_API_TOKEN_FOUNDER".
#     crewlet llm login  default -from-host -company examples/nimbus-claude-cli.company.yaml \
#                                           -config  examples/nimbus-claude-cli.config.yaml
#     crewlet llm doctor default            -company examples/nimbus-claude-cli.company.yaml \
#                                           -config  examples/nimbus-claude-cli.config.yaml
#
#     # 3. Go.  Every seat's executor run is a `direct` box on this
#     #    machine and dials api.port below on loopback for its tools.
#     set -a; . ./.env; set +a          # MATTERMOST_URL + the bot tokens
#                                       #   the bootstrap wrote
#     crewlet run -config examples/nimbus-claude-cli.config.yaml \
#                 -company examples/nimbus-claude-cli.company.yaml
#
# THERE ARE NO EXTERNAL SERVICES HERE apart from the chat server the
# compose file starts.  The stream is a NATS JetStream server embedded in
# this process and the store is two local files (the node's own and the
# replicated estate beside it), so a single binary in an empty directory
# is a working company — no broker to operate, no database to provision,
# nothing to point a DSN at.  The stream takes an external address when a
# deployment outgrows that; see docs/guides/deployment.md and
# docs/guides/fleet.md.
#
# Restart-only Tier A fields only:
#   - stream      : where the durable event log lives
#   - store       : this node's local materialized index
#   - coordination: where seat leases live (a fleet needs the shared slot)
#   - node        : this process's identity, roles and labels
#   - api         : host / port / bearer-auth tokens
#   - secrets     : the keyring (REQUIRED) — signs every state-log record
#                   and seals the Tier B company config at rest (see below)
#   - logging     : how loud this node is (level), in what shape (format)
#                   and where it writes (stderr, plus an optional rotating
#                   file — and `stderr: false` hands the stream to that file)
#
# Everything else (roles, LLMs, MCP servers, integrations, policies,
# budgets) lives in the Tier B company YAML — versioned in the store and
# live-editable via the ``/config/*`` REST API.

logging:
  level: info       # debug, info (default), warn, error
  format: console   # console (default: columns, and colour on a terminal),
                    #   text (slog key=value), json (for a log shipper)
  # stderr: false  # hands the stream below the file, for a host whose
                    #   platform already captures stderr and would store
                    #   every line twice. It needs a file, and it never
                    #   silences a boot failure or the watchdog exit notice
  file:             # optional — a durable copy, IN ADDITION to stderr.
                    #   Delete the block to write no file at all, the default.
    path: "./nimbus-data/crewlet.log"
                    #   `${VAR}` works here; on a host running two nodes put
                    #   the node id in the path so they do not share a file
    # format: json  #   the file's OWN shape — unset follows `format` above
    # level: debug  #   the file's OWN level — unset follows `level` above.
                    #   A debug file behind a warn console, or the reverse
    # max_size_mb: 100  # rotates here. There is no "never": an uncapped log
                        #   file fills the disk the store is on
    # max_backups: 5    # kept as <path>.1 (newest) … <path>.5;
                        #   0 keeps none — one file, no history

# ── The durable event log ─────────────────────────────────────────────
#
# `embedded` runs a NATS JetStream server inside this process: no
# listener, no port, no service to operate.  In the solo case there is no
# socket at all, so the broker cannot be reached from outside the
# process.
#
# store_dir is NOT optional, and not merely inadvisable: leaving it empty
# selects an in-memory server, and this company's own records live on that
# stream.  The people who sign in to it do whatever backends it names (the
# identity estate is a state-log domain), and its work items and its pages
# do too, because it runs Worklet and Doclet (see tracker.backend and
# knowledge.backend in the company document).  A restart would recreate those logs empty and this node
# would stop serving for good, so the engine refuses to boot without one
# rather than losing the records — `crewlet validate` refuses it too,
# naming stream.store_dir.  That is a rule about a broker MEMBER, which a
# node holding `data` always is; a node without `data` is a leaf of the
# members' broker with JetStream off, keeps no stream at all, and is
# refused a store_dir (docs/guides/satellite-nodes.md).
#
# `type: nats` dials an external NATS server or cluster instead, and takes
# `url` (plus `credentials` / `token` / `tls` where the estate demands
# them).  It is the same client code either way: embedded versus external
# is a connection choice, not a second backend.
stream:
  type: embedded
  store_dir: "./nimbus-data/stream"
  replicas: 1                     # 1 solo; 3 in a fleet, where it is what
                                  #   makes a publish quorum-durable
  # store_max_bytes: 68719476736  # how much of store_dir's volume this broker
                                  #   may hold — the number every stream
                                  #   ceiling on it is checked against. Left
                                  #   unset the broker takes three quarters of
                                  #   that volume's free space, measured once
                                  #   at boot, which is right when it is the
                                  #   only tenant. SET AND DIVIDE IT when more
                                  #   than one engine runs against one
                                  #   filesystem: free space bounds their sum,
                                  #   so two engines each sizing themselves
                                  #   from what they can see over-commit it

# ── This node's local database ────────────────────────────────────────
#
# One FILE, owned exclusively by this process for the life of the
# process.  It is not a shared database and there is no DSN: two engines
# pointed at one file corrupt it.  A fleet's nodes each keep their own
# rebuildable copy — the stream is the truth, this is the cache.
store:
  path: "./nimbus-data/nimbus.db"
  # Turso is the database and the only one, so there is no driver to pick.

# ── Seat ownership ────────────────────────────────────────────────────
#
# `local` keeps the leases inside this process — correct for exactly one
# node, and catastrophic for more than one, since every node would hold
# every lease and run every seat.  A fleet needs `embedded-kv`: the leases
# live in a replicated KV on the STREAM's own NATS broker, which is what
# stops two processes running the same seat.  On an embedded broker the KV
# holds a second connection beside the queue's, and both are watched:
# either one closing for good stops the node, so it never goes on renewing
# leases over one while the one carrying its inbox is dead — alive to its
# peers, deaf to its work.  See docs/guides/fleet.md.
coordination:
  type: local

# ── This process's identity ───────────────────────────────────────────
#
# The id is the STICKINESS hint a lease claim carries, so a restarted node
# tends to get its own seats back.  Empty reads CREWLET_NODE_ID and then
# defaults to node-0 — fine for one node, and a fleet must give each
# member a distinct, stable one.
node:
  id: "${CREWLET_NODE_ID}"
  # roles: [data, ingress, seats, workers]   # omit for all four; a node
                                       #   without data keeps nothing durable
                                       #   and needs store.scratch plus
                                       #   stream.leaf.urls — see
                                       #   docs/guides/satellite-nodes.md
  # labels: {zone: eu-west}            # what a role's placement selector matches
  # max_concurrent: 32                 # turn segments this process runs
                                       #   at once, whatever starts one: a
                                       #   new turn up to the park at its
                                       #   executor's launch, a run's
                                       #   collection and its review, a
                                       #   person's answer carrying a run on.
                                       #   The executor run in its box holds
                                       #   no slot (each seat runs at most one).
                                       #   Per node, so a fleet's ceiling is
                                       #   N x this.  Omit for the default (32),
                                       #   which is above the seat count of a
                                       #   single-node company.  NOT the same
                                       #   knob as the providers.llm entry's own
                                       #   max_concurrent in the company YAML
                                       #   (4), which caps that entry's CLI
                                       #   processes on this host: a reviewer,
                                       #   worker or side pass past it waits
                                       #   in this process for a CLI slot,
                                       #   while executor runs are not counted.

api:
  host: "0.0.0.0"
  # A port > 0 makes `crewlet run` start the EMBEDDED API inside the engine
  # process — one process serves engine + dashboard + webhooks.  Open the
  # dashboard at http://localhost:8000/ once it is up.
  #
  # IT ALSO SERVES THE MCP TOOL BRIDGE every agent seat needs: each seat's
  # executor runs as its coding CLI's own agentic loop in a box, and the
  # seat's tools reach that box back over /mcp/{token} here.  A `direct`
  # box on this machine dials this port on loopback, which the node
  # derives from the socket it binds — nothing to set, and `port: 0`
  # would leave every executor launch refused.  A `container` or `e2b`
  # box needs CREWLET_MCP_BRIDGE_URL, a URL that box can dial.  In a
  # fleet the URL is the fleet's, the same on every node: any node
  # serving the API, a load balancer in front of several included,
  # relays each call to the node holding the seat.
  #
  # 8000 rather than 80, deliberately.  The only reason to bind the plain
  # http port is so a webhook URL an external service registers needs no
  # `:port` suffix (http://host.docker.internal/webhooks/jira), and this
  # company has NO inbound webhook at all: Mattermost has none, so the
  # engine holds one outbound websocket per seat and nothing has to reach
  # it.  Port 80 would buy nothing and cost a privileged bind — on Linux a
  # non-root process needs `sudo sysctl net.ipv4.ip_unprivileged_port_start=80`
  # (persist in /etc/sysctl.d/) or CAP_NET_BIND_SERVICE.  Add a tracker or
  # a code host and 80 becomes worth it again; docs/guides/deployment.md
  # covers that shape.  In a SPLIT deployment the ingress node serves this
  # and the others set port 0 so only one process binds it.
  port: 8000

  # REQUIRED once a port is set.  Where a PERSON reaches this deployment,
  # which is not where the process binds: its scheme decides the session
  # cookie's Secure flag, its host is the origin every write is checked
  # against, and it is the base of every link a person follows.  With no
  # `api.public` listener of its own it is also the base every webhook URL
  # is built on.  Behind a proxy this is the public address.
  external_url: "http://localhost:8000"

  auth:
    # People sign in with a login and a password, always.  The founder
    # token below invites the first person onto their human seat (that
    # seat's Invite in Agents › Org chart, or `crewlet iam invite <address>
    # -seat jane-founder`) and stays the break-glass credential after.
    #
    # A second factor is `required` when this line is absent.  `optional`
    # is this walkthrough's posture, on a loopback address no password
    # crosses a network to reach; a deployment reached off loopback leaves
    # the line out (validation refuses `optional` there without
    # `accept_insecure: true`).
    totp: optional

    # Whether THIS NODE grants admin to those who hold it: `serve` here,
    # where the founder signs in to run the company; `refuse` would clamp
    # admin away and keep every app.  Required once a port is set, and
    # deliberately without a default.
    admin: serve

    tokens:
      # At least one is required once a port is set: a fresh deployment's
      # identity estate is empty, so this is what creates the first
      # person.  26 characters at minimum, on the RESOLVED value.  The
      # founder's token is admin, which includes every app.
      - id: founder
        token: "${CREWLET_API_TOKEN_FOUNDER}"
        grants: [admin]

# ── The keyring (REQUIRED) ────────────────────────────────────────────
#
# The keyring is this deployment's root of trust, and it does two jobs.
#
# It SIGNS every record on every state log, and every request a node
# without `data` sends the estate service on a data node. The broker has no
# auth of its own, so a signature is the only thing that says a record or a
# request came from this fleet rather than from anything else that can reach
# the cluster port — and a record is whatever the next node applies, a
# request whatever a data node runs as the actor it names. A node with no
# keyring refuses to start for that reason, and `crewlet validate` refuses a
# file without one.
#
# It SEALS the Tier B company config at rest: every write stores the
# whole company document as one opaque AES-256-GCM blob
# (`{"__encrypted__": "enc:v1:…"}`) — the org chart, policies, model
# choices, integrations and every secret as ciphertext. The seal is also
# what says a node of this fleet wrote it, so a node refuses a revision
# stored unsealed.
#
# Set it up:
#   1. Mint a key + snippet:   crewlet secrets keygen -key-id 2026-01
#   2. Export the printed key:  export CREWLET_SECRET_KEY_2026_01=<base64>
#
# Every node in a fleet needs the SAME keyring: one keyed differently
# would refuse every peer's records.
#
# Rotate the master key with `crewlet config rekey` (keep the old key in
# `keys` until it succeeds). See docs/concepts/configuration.md#secrets.
#
secrets:
  active_key_id: "2026-01"          # which key seals NEW writes and signs every record
  keys:
    - id: "2026-01"                 # colon-free id; stamped into every envelope and record
      material: "${CREWLET_SECRET_KEY_2026_01}"   # base64(32 bytes)
#     # During a rotation, keep the previous key here so what it sealed
#     # still opens: drop it only once `crewlet secrets rekey` and a re-seal
#     # of the company document (POST /config/reload, or `crewlet config
#     # rekey` on a stopped node) have run and the rest of the runbook holds —
#     # docs/concepts/secret-store.md, "Rotating the keyring":
#     # - id: "2025-07"
#     #   material: "${CREWLET_SECRET_KEY_2025_07}"
