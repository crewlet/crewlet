version: "2"

# Linting posture for the rewrite: catch the classes of bug the port is
# genuinely exposed to (data races the Python engine could not have, ignored
# errors where Python raised, context misuse) without the noise that makes a
# team disable the linter.

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usetesting
    - wastedassign

  settings:
    errcheck:
      # A deferred Close on a read-only handle is noise; anything that
      # writes must still be checked.
      exclude-functions:
        - (io.Closer).Close
        # Rows.Close after the scan loop: the read already happened, and
        # the error the caller needs is rows.Err(), which every query here
        # checks.
        - (*database/sql.Rows).Close
        # Writing to an operator's terminal. There is no recovery — the
        # report is the only output the command has, and a second write
        # saying "the first write failed" goes to the same broken pipe.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    govet:
      # shadow is ON because it is half of what caught a credential-map
      # write whose failure could never be reported: an inner `if err :=`
      # took the assignment while the check below read a stale outer err.
      #
      # It cannot, however, tell that bug from two shapes the language
      # REQUIRES: a closure passed to db.Tx must have its own err, and
      # `x, err := f()` inside a block declares x too — hoisting x above
      # the block to dodge the report is strictly worse code. Every
      # production site of those shapes carries a //nolint:govet naming
      # this paragraph, so a reader can see which were reviewed; new ones
      # are reported and have to be looked at rather than inherited. Two
      # code-level answers need no directive and say as much: a closure
      # that owns its err can declare it as its named result, `(err
      # error)`, and assign it; and an inner `x, err :=` can name the
      # error for its step (`claimErr`, `updateErr`) where that reads true.
      enable:
        - shadow
    staticcheck:
      # `all` is every check, in all four families: SA (correctness), S
      # (simplification), ST (style) and QF (quickfix suggestions). That is
      # more than golangci-lint's default only by the six ST checks the
      # default leaves off unless asked — ST1000, ST1003, ST1016 (a
      # receiver named two ways), ST1020, ST1021 and ST1022; every SA, S
      # and QF check is in the default already. Two QF checks are off
      # because they argue with how this tree writes code on purpose:
      # QF1008 ("you could remove the embedded field from this selector")
      # — it writes `db.Conn.Begin` rather than `db.Begin`, because naming
      # the embedded type is what says which of two Begins a reader is
      # looking at — and QF1002 ("you could use a tagged switch"). Every
      # other suggestion is a gate, and a new exception is named here with
      # its reason rather than by switching the family off.
      checks:
        - all
        - -QF1008
        - -QF1002
    misspell:
      # Words this tree spells "wrong" ON PURPOSE, and correcting any of
      # them would break what it is for:
      #   noteable — GitLab's own wire field (`noteable_type`). The parser
      #              must spell it the way the vendor sends it.
      #   requred  — the typo in a doc comment ABOUT typos, and the fixture
      #              that proves a misspelled frontmatter key is refused.
      #   enginer  — a fuzzy-match test input; spelling it correctly would
      #              stop testing the fuzzy match.
      #   reasercher — a model's typo'd worker name, and the whole input of
      #              the test that a refusal lists the workers that DO exist.
      #              Spelling it correctly would test nothing.
      #   alwyas   — the typo in a doc comment ABOUT typos, and the fixture
      #              that proves `typing_status: alwyas` is refused rather
      #              than silently degraded. Correcting it would assert the
      #              validator against a value that was never wrong.
      ignore-rules:
        - noteable
        - requred
        - reasercher
        - enginer
        - alwyas
    revive:
      rules:
        - name: exported
          # Every exported symbol carries a doc comment. The engine's
          # value is in its documented invariants; an undocumented
          # exported name is how one gets lost.
          severity: error
        - name: context-as-argument
        - name: error-strings
        - name: indent-error-flow
        - name: var-naming

  exclusions:
    rules:
      # Test helpers legitimately ignore errors on cleanup paths and
      # build long table-driven cases.
      - path: _test\.go
        linters: [errcheck, gocritic, unparam]

      # The certification suites and shared test harnesses live in *test
      # packages rather than _test.go files, because several backends run
      # the same cases. They are test code by every measure that matters
      # here: a helper whose parameter takes one value today is a helper
      # the next case widens.
      #
      # A PATTERN RATHER THAN A LIST, because the list never kept up: it
      # named six of the nine `internal/**/*test/` directories when it was
      # first corrected, and nine of fifteen when it was next read — six
      # *test packages (`externaltest` and `httpxtest` among them) were
      # simply never added. A rule the config states and applies
      # to part of its subject is one the next author cannot tell from a
      # deliberate exception. The pattern IS the claim, so a harness is
      # covered the day it is written: any directory under internal/, at
      # any depth, whose name ends in `test` — the standard library's own
      # name for test support (`httptest`, `fstest`), and one no production
      # package here takes.
      - path: ^internal/(.+/)?[^/]*test/
        linters: [unparam, errcheck, gocritic]

      # A test's own HTTP call has no caller to cancel it and no connection
      # pool to exhaust past the test's lifetime, so the context and
      # body-close rules buy nothing there. They stay on for the engine,
      # which serves real traffic.
      - path: _test\.go
        linters: [noctx, bodyclose]

      # govet's shadow check earns its place in production code — it is
      # half of what caught a credential-map write whose failure could
      # never be reported — but a table-driven test that re-derives `err`
      # inside each case is the shape it cannot tell from that bug, and
      # there is no third party reading a test's error to mislead.
      - path: _test\.go
        linters: [govet]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/crewlet/crewlet
