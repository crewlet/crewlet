<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Crewlet</title>
    <meta name="color-scheme" content="dark light" />
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <!-- THE BOOT SCREEN, until the app replaces it on mount: on a slow connection
         the page was blank until every module had arrived. Styled from a sheet of
         its own (`src/app/boot.css`), as the engine's policy admits no inline style
         or script and the app's own sheet arrives seconds later. -->
    <div id="root">
      <div class="boot" role="status">
        <span class="boot-mark" aria-hidden="true"></span>
        <span class="boot-label">Loading Crewlet</span>
      </div>
    </div>
  </body>
</html>
