# yaml-language-server: $schema=schema/bootstrap.schema.json
# Local-development Tier A bootstrap config (ops-owned, restart-only).
#
# `crewlet run` defaults to ./config.yaml, so this file gives a repo
# checkout a working dev loop against the bundled docker-compose stack
# (`docker compose up -d`) with zero extra setup.
#
# This file carries only the keys the engine needs to talk to its own
# infrastructure: Pulsar, PostgreSQL, the API socket, auth, logging.
# Everything else — name, mission, providers, integrations, roles,
# units — lives in the versioned `company_config` table and is loaded
# via `crewlet config import <company.yaml>` (start from
# examples/nimbus.company.yaml).
#
# See docs/concepts/configuration.md for the two-tier config design.

debug: true

providers:
  queue:
    type: pulsar
    url: "pulsar://localhost:6650"
    # tenant: public                  # optional — must already exist; the engine
    # namespace: default              #   never creates tenants/namespaces itself
  database:
    dsn: "postgresql://crewlet:crewlet@localhost:5432/crewlet"
  knowledge:
    type: pgvector

api:
  # Loopback-only on purpose: this file ships a literal dev token, so the
  # API must never be reachable off-host with it. Change host to "0.0.0.0"
  # only together with a real ${VAR}-sourced token.
  host: "127.0.0.1"
  port: 80
  auth:
    tokens:
      - id: founder
        # ⚠ DEV ONLY — a literal token so the local loop works out of the
        # box. For anything reachable beyond localhost, use a real secret
        # via an env reference: token: "${CREWLET_API_TOKEN_FOUNDER}"
        token: "local-dev-token"

# ── Secret encryption at rest (OPTIONAL) ──────────────────────────────
#
# Uncomment to store the ENTIRE Tier B company config encrypted in the
# DB as one AES-256-GCM blob. The keyring is the sole root of trust and
# lives here in Tier A / the environment — never in the database.
#
#   1. Mint a key + snippet:   crewlet secrets keygen --key-id 2026-01
#   2. Export the printed key:  export CREWLET_SECRET_KEY_2026_01=<base64>
#   3. Uncomment the block, then encrypt the active revision once:
#        crewlet config seal
#
# See docs/concepts/configuration.md#secrets.
#
# secrets:
#   active_key_id: "2026-01"
#   keys:
#     - id: "2026-01"
#       material: "${CREWLET_SECRET_KEY_2026_01}"   # base64(32 bytes)
