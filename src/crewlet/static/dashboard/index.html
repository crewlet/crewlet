    <title>Crewlet Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/static/crewlet-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      The three faces styles/tokens.css names: Inter for text, Inter Tight
      for display, JetBrains Mono for anything that is a code or a number
      that changes.  `display=swap` plus the system fallbacks in each token
      mean an engine on a closed network that cannot reach the CDN renders
      immediately in the fallback face rather than blocking on it — the
      brand's negative tracking is a token, so it applies to whichever face
      actually resolves.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Inter+Tight:wght@500..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/static/dashboard/styles/base.css" />
    <link rel="stylesheet" href="/static/dashboard/styles/components.css" />
    <link rel="stylesheet" href="/static/dashboard/styles/views.css" />
    <!--
      One stylesheet per room. views.css holds what the small shared
      views still need; a room that owns a screen owns its own file, so
      a change to one room's layout cannot reach another's.
    -->
    <link rel="stylesheet" href="/static/dashboard/styles/rooms/mission.css" />
    <link rel="stylesheet" href="/static/dashboard/styles/rooms/activity.css" />

    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <img src="/static/crewlet-icon.png" alt="Crewlet" />
          <h1>Crewlet</h1>
          <!--
            The dot is a BUTTON. It was the only health surface in the
            dashboard and it could show three colours; everything behind
            it — whether a company config is even active, whether the
            event store is durable, how many envelopes this tab dropped —
            was on the wire and reached no screen. Clicking it opens
            #health-pop with the rest.
          -->
          <button
            class="live-dot-btn"
            id="live-dot-btn"
            data-action="health"
            aria-haspopup="dialog"
            aria-expanded="false"
            title="Engine health"
          >
            <span class="live-dot" id="live-dot"></span>
          </button>
        </div>
        <nav id="nav"></nav>
        <div class="sidebar-footer" id="chrome-footer" hidden>
          <span class="inflight-pill" id="inflight"></span>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <button class="icon-btn" id="menu-btn" title="Menu" hidden>
            <span class="ic sm"><svg><use href="#i-menu" /></svg></span>
          </button>
          <h2 id="title">Mission Control</h2>
          <div class="topbar-actions">
            <!--
              One search for the whole page. Per-view search boxes would
              mean one ranking rule per view and four places to keep them
              agreeing; this reaches rooms, seats, and any event or trace
              id pasted from a log.
            -->
            <button class="search-btn" data-action="palette" title="Search (⌘K)">
              <span class="ic sm"><svg><use href="#i-search" /></svg></span>
              <span class="search-label">Search</span>
              <kbd>⌘K</kbd>
            </button>
            <button class="icon-btn" id="density-btn" title="Density"></button>
            <button class="icon-btn" id="theme-btn" title="Toggle theme"></button>
          </div>
        </header>
        <!--
          The button is the banner's one affordance, and it exists for a
          single state: a refused API token. Every other degraded state
          resolves on its own — the engine comes back, a config is
          imported — so the banner only reports them. A rejected token
          resolves for nobody, and the prompt that would ask for one is
          deliberately one-shot (a 30s reconnect backoff must not reopen
          a modal forever), so dismissing it would otherwise leave a
          permanent notice with no way to act on it.
        -->
        <div class="degraded" id="degraded" hidden>
          <span class="ic sm"><svg><use href="#i-alert" /></svg></span>
          <span id="degraded-text"></span>
          <button class="btn sm" id="degraded-action" data-action="set-token-chrome" hidden>
            Set API token
          </button>
        </div>
        <section class="view" id="view"></section>
      </main>
    </div>
    <!--
      The health popover lives at the document root, NOT beside the dot
      that opens it. `.sidebar` is `position: sticky`, which always
      creates a stacking context, so a popover inside it could only be
      ordered against the sidebar's own children — `.main` comes later
      in the document and painted its panels straight over the top,
      whatever z-index the popover carried. `#toasts` is here for the
      same reason.
    -->
    <div class="health-pop-wrap" id="health-pop" hidden></div>
    <!--
      The command palette and the dialog host sit here for the same
      stacking reason as the popover, and because both are modal: they
      take the keyboard from whatever view is mounted, so they must not
      be inside it.
    -->
    <div class="palette-wrap" id="palette" hidden></div>
    <div class="modal-wrap" id="modal-host" hidden></div>
    <div class="toast-wrap" id="toasts"></div>

    <script type="module" src="/static/dashboard/js/app.js"></script>
  </body>
