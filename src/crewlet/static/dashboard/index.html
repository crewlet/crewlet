    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <img src="/static/crewlet-icon.png" alt="Crewlet" />
          <h1>Crewlet</h1>
          <span class="live-dot" id="live-dot" title="Connection status"></span>
        </div>
        <nav id="nav"></nav>
        <div class="sidebar-footer" id="chrome-footer" hidden>
          <span class="inflight-pill" id="inflight"></span>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <button class="icon-btn" id="menu-btn" title="Menu" hidden>
            <span class="ic sm"><svg><use href="#i-menu" /></svg></span>
          </button>
          <h2 id="title">Dashboard</h2>
          <div class="topbar-actions">
            <button class="icon-btn" id="theme-btn" title="Toggle theme"></button>
          </div>
        </header>
        <section class="view" id="view"></section>
      </main>
    </div>
    <div class="toast-wrap" id="toasts"></div>

    <script type="module" src="/static/dashboard/js/app.js"></script>
