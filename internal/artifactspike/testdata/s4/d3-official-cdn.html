<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org chart (d3)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --accent: #3b5bdb; --card: #f5f5f7; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111114; --fg: #f2f2f5; --muted: #a0a0a8; --accent: #7b93ff; --card: #1c1c21; }
}
body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; margin: 12px 0; }
button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--card); color: var(--fg); cursor: pointer; }

</style>
</head>
<body>
<main>
<h1>Headcount by team</h1><svg id="chart" width="640" height="320"></svg>
</main>
<script>
const data = [{ team: "Eng", n: 42 }, { team: "Sales", n: 18 }, { team: "Ops", n: 9 }, { team: "Design", n: 7 }];
const svg = d3.select("#chart");
const x = d3.scaleBand().domain(data.map(d => d.team)).range([40, 620]).padding(0.2);
const y = d3.scaleLinear().domain([0, 50]).range([300, 20]);
svg.selectAll("rect").data(data).join("rect")
  .attr("x", d => x(d.team)).attr("y", d => y(d.n))
  .attr("width", x.bandwidth()).attr("height", d => 300 - y(d.n)).attr("fill", "#3b5bdb");
</script>
</body>
</html>
