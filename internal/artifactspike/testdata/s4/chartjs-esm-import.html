<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline chart (ESM)</title>

<style>
:root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --accent: #3b5bdb; --card: #f5f5f7; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111114; --fg: #f2f2f5; --muted: #a0a0a8; --accent: #7b93ff; --card: #1c1c21; }
}
body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; margin: 12px 0; }
button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--card); color: var(--fg); cursor: pointer; }

</style>
</head>
<body>
<main>
<h1>Pipeline by stage</h1><canvas id="pipe"></canvas>
</main>
<script type="module">
import Chart from "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/auto/+esm";
new Chart(document.getElementById("pipe"), { type: "bar",
  data: { labels: ["Lead", "Qualified", "Proposal", "Won"], datasets: [{ data: [120, 64, 30, 12] }] } });
</script>
</body>
</html>
