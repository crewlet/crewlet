<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --accent: #3b5bdb; --card: #f5f5f7; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111114; --fg: #f2f2f5; --muted: #a0a0a8; --accent: #7b93ff; --card: #1c1c21; }
}
body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; margin: 12px 0; }
button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--card); color: var(--fg); cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; } .value { font-size: 28px; font-weight: 600; } .label { color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>Revenue, last twelve months</h1>
<div class="grid">
  <div class="card"><div class="label">MRR</div><div class="value" id="mrr">$0</div></div>
  <div class="card"><div class="label">Churn</div><div class="value" id="churn">0%</div></div>
  <div class="card"><div class="label">Customers</div><div class="value" id="customers">0</div></div>
</div>
<div class="card"><canvas id="revenue" height="120"></canvas></div>
</main>
<script>
const months = ["Nov","Dec","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct"];
const revenue = [41, 44, 47, 46, 52, 58, 61, 66, 70, 74, 79, 85];
document.getElementById("mrr").textContent = "$" + revenue[revenue.length - 1] + "k";
document.getElementById("churn").textContent = "2.1%";
document.getElementById("customers").textContent = "1,284";
new Chart(document.getElementById("revenue"), {
  type: "line",
  data: { labels: months, datasets: [{ label: "MRR ($k)", data: revenue, borderColor: "#3b5bdb", tension: 0.3 }] },
  options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: false } } }
});
</script>
</body>
</html>
