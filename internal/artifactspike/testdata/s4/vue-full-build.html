<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory (Vue)</title>
<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
<style>
:root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --accent: #3b5bdb; --card: #f5f5f7; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111114; --fg: #f2f2f5; --muted: #a0a0a8; --accent: #7b93ff; --card: #1c1c21; }
}
body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; margin: 12px 0; }
button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--card); color: var(--fg); cursor: pointer; }

</style>
</head>
<body>
<main>
<div id="app" class="card">
  <h1>{{ title }}</h1>
  <input v-model="filter" placeholder="Filter">
  <ul><li v-for="item in shown" :key="item.sku">{{ item.name }} ({{ item.stock }})</li></ul>
</div>
</main>
<script>
Vue.createApp({
  data() { return { title: "Inventory", filter: "", items: [
    { sku: "A1", name: "Desk", stock: 4 }, { sku: "B2", name: "Chair", stock: 11 }, { sku: "C3", name: "Lamp", stock: 0 }] }; },
  computed: { shown() { return this.items.filter(i => i.name.toLowerCase().includes(this.filter.toLowerCase())); } }
}).mount("#app");
</script>
</body>
</html>
