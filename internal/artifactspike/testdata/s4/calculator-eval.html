<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>

<style>
:root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --accent: #3b5bdb; --card: #f5f5f7; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111114; --fg: #f2f2f5; --muted: #a0a0a8; --accent: #7b93ff; --card: #1c1c21; }
}
body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; margin: 12px 0; }
button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--card); color: var(--fg); cursor: pointer; }
.calc { max-width: 320px; } .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; } #display { width: 100%; font-size: 28px; text-align: right; padding: 8px; box-sizing: border-box; }
</style>
</head>
<body>
<main>
<div class="calc card">
  <input id="display" readonly>
  <div class="keys">
    <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button onclick="press('/')">/</button>
    <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button onclick="press('*')">*</button>
    <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button onclick="press('-')">-</button>
    <button onclick="press('0')">0</button><button onclick="press('.')">.</button><button onclick="calculate()">=</button><button onclick="press('+')">+</button>
    <button onclick="clearDisplay()">C</button>
  </div>
</div>
</main>
<script>
const display = document.getElementById("display");
function press(key) { display.value += key; }
function clearDisplay() { display.value = ""; }
function calculate() {
  try { display.value = eval(display.value); } catch (e) { display.value = "Error"; }
}
</script>
</body>
</html>
