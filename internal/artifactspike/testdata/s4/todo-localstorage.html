<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team to-do list</title>

<style>
:root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --accent: #3b5bdb; --card: #f5f5f7; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111114; --fg: #f2f2f5; --muted: #a0a0a8; --accent: #7b93ff; --card: #1c1c21; }
}
body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; margin: 12px 0; }
button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--card); color: var(--fg); cursor: pointer; }
li { list-style: none; padding: 6px 0; } li.done span { text-decoration: line-through; color: var(--muted); } input { padding: 8px; width: 60%; }
</style>
</head>
<body>
<main>
<h1>To-do</h1>
<div class="card">
  <input id="task" placeholder="What needs doing?">
  <button onclick="addTask()">Add</button>
  <button onclick="clearDone()">Clear done</button>
</div>
<ul id="list" class="card"></ul>
</main>
<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
function save() { localStorage.setItem("tasks", JSON.stringify(tasks)); render(); }
function addTask() {
  const input = document.getElementById("task");
  if (!input.value.trim()) return;
  tasks.push({ text: input.value.trim(), done: false });
  input.value = "";
  save();
}
function clearDone() { tasks = tasks.filter(t => !t.done); save(); }
function render() {
  const list = document.getElementById("list");
  list.replaceChildren();
  tasks.forEach((t, i) => {
    const li = document.createElement("li");
    li.className = t.done ? "done" : "";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = t.done;
    box.addEventListener("change", () => { tasks[i].done = box.checked; save(); });
    const span = document.createElement("span");
    span.textContent = " " + t.text;
    li.append(box, span);
    list.append(li);
  });
}
render();
</script>
</body>
</html>
