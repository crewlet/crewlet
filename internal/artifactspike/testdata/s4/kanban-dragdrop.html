<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint board</title>

<style>
:root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --accent: #3b5bdb; --card: #f5f5f7; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111114; --fg: #f2f2f5; --muted: #a0a0a8; --accent: #7b93ff; --card: #1c1c21; }
}
body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; margin: 12px 0; }
button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--card); color: var(--fg); cursor: pointer; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; } .item { background: var(--bg); padding: 8px; margin: 6px 0; border-radius: 6px; cursor: grab; }
</style>
</head>
<body>
<main>
<h1>Sprint board</h1>
<div class="board">
  <div class="col card" data-col="todo"><h2>To do</h2></div>
  <div class="col card" data-col="doing"><h2>Doing</h2></div>
  <div class="col card" data-col="done"><h2>Done</h2></div>
</div>
</main>
<script>
const state = JSON.parse(localStorage.getItem("board") || '{"todo":["Write spec","Review PR"],"doing":["Fix login"],"done":[]}');
function render() {
  document.querySelectorAll(".col").forEach(col => {
    col.querySelectorAll(".item").forEach(n => n.remove());
    state[col.dataset.col].forEach((text, i) => {
      const el = document.createElement("div");
      el.className = "item"; el.draggable = true; el.textContent = text;
      el.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", JSON.stringify([col.dataset.col, i])));
      col.append(el);
    });
  });
}
document.querySelectorAll(".col").forEach(col => {
  col.addEventListener("dragover", e => e.preventDefault());
  col.addEventListener("drop", e => {
    const [from, i] = JSON.parse(e.dataTransfer.getData("text/plain"));
    state[col.dataset.col].push(state[from].splice(i, 1)[0]);
    localStorage.setItem("board", JSON.stringify(state));
    render();
  });
});
render();
</script>
</body>
</html>
