<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product quiz</title>

<style>
:root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --accent: #3b5bdb; --card: #f5f5f7; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111114; --fg: #f2f2f5; --muted: #a0a0a8; --accent: #7b93ff; --card: #1c1c21; }
}
body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
.card { background: var(--card); border-radius: 12px; padding: 16px; margin: 12px 0; }
button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--muted); background: var(--card); color: var(--fg); cursor: pointer; }

</style>
</head>
<body>
<main>
<div class="card"><h1 id="question"></h1><div id="answers"></div><p id="score"></p></div>
</main>
<script>
const questions = [["Which plan has SSO?", ["Team", "Business"], 1], ["How many seats on Starter?", ["3", "10"], 0]];
let at = 0, score = 0;
function showQuestion() {
  const [q, answers] = questions[at];
  document.getElementById("question").textContent = q;
  const box = document.getElementById("answers");
  box.replaceChildren();
  answers.forEach((a, i) => { const b = document.createElement("button"); b.textContent = a; b.addEventListener("click", () => answer(i)); box.append(b); });
}
function answer(i) {
  if (i === questions[at][2]) score++;
  document.getElementById("score").textContent = "Score: " + score;
  at++;
  if (at < questions.length) setTimeout("showQuestion()", 600);
}
showQuestion();
</script>
</body>
</html>
