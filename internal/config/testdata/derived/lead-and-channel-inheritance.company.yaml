# A lead and a channel cascade to child units that set none, to any depth.
# A child that declares its own keeps it, and a lead reaches the members of
# every descendant that inherits it. A declared lead that is no seat's handle
# leaves its unit with no lead rather than falling back to the parent's.
name: Acme
units:
  - name: Engineering
    type: division
    lead: vp-engineering
    channel: "#engineering"
    roles:
      - name: VP Engineering
    children:
      - name: Backend
        roles:
          - name: Backend Developer
        children:
          - name: Storage
            roles:
              - name: Storage Developer
      - name: Infrastructure
        channel: "#infra"
        lead: sre
        roles:
          - name: Site Reliability
            handle: sre
      - name: Security
        lead: ghost
        roles:
          - name: Security Analyst
