# A root seat carrying a unit reference is moved into the unit that key
# names, where its lead auto-manages it; one keying no unit stays at the
# root. A manages entry keying a unit with no seats, or naming nothing, is no
# report. A human seat sits in the chart like any other and is auto-managed
# by its lead.
name: Acme
roles:
  - name: Founder
    kind: human
    contact: {slack_user_id: U0FOUNDER}
    manages: [product-lead, hiring, ghost]
  - name: Designer
    unit: product
  - name: Wanderer
    unit: nowhere
units:
  - name: Product
    id: product
    lead: product-lead
    roles:
      - name: Product Lead
      - name: Sarah Chen
        kind: human
        contact: {slack_user_id: U0SARAH}
  - name: Hiring
    id: hiring
