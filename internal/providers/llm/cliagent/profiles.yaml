# Built-in cli-agent profiles.
#
# DATA, not code: every field here is replaceable from
# providers.llm.<key>.cli.overrides, because these flags and JSON shapes
# belong to vendors who rename them between releases. `written_for` is the
# version each profile was authored against, and `crewlet llm doctor` prints
# it beside the version actually installed — a profile that quietly stopped
# matching its CLI is the failure this file is shaped to make visible.
#
# Paths under credential_paths and volatile_paths are relative to the SEAT
# HOME, so a CLI that keeps two directories can name files in both.

claude-code:
  binary: claude
  vendor: anthropic
  written_for: "Claude Code CLI 2.1.x (`claude --version`)"
  version_args: ["--version"]
  # --no-session-persistence and --safe-mode are the isolation the rest of
  # this backend depends on: no transcript on disk to leak between turns, and
  # no CLAUDE.md, skill, plugin, hook or MCP server admitted from a host the
  # engine does not control. The tool denials make it a text model — Crewlet's
  # tools ride the prompt envelope, and a CLI editing files in its own sandbox
  # is invisible to the tool registry, the permission model and redaction.
  #
  # Web is the one local tool that stays ON, and it has to be ALLOWED rather
  # than merely not denied: print mode never prompts, and a permission-gated
  # tool that is not on the allow list is refused, so a seat that was told it
  # could fetch would have found it could not. A fetch is a read — it never
  # gates delivery — and a subscription seat must not have less reach than the
  # same CLI at a terminal.
  complete_args:
    - "-p"
    - "--output-format"
    - "json"
    - "--no-session-persistence"
    - "--safe-mode"
    - "--strict-mcp-config"
    - "--disable-slash-commands"
    - "--allowedTools"
    - "WebFetch"
    - "WebSearch"
    - "--disallowedTools"
    - "Bash"
    - "Read"
    - "Write"
    - "Edit"
    - "Glob"
    - "Grep"
    - "Task"
    - "NotebookEdit"
    - "TodoWrite"
  local_tools: denied
  model_args: ["--model", "{model}"]
  # THE SYSTEM PROMPT ON ITS OWN CHANNEL, replacing Claude Code's default
  # rather than appending to it. Measured against 2.1.263: with --append-,
  # the model still opens with "I'm Claude Code, here to help with your
  # software engineering tasks" — a coding-agent identity over the top of
  # whatever seat it is actually serving — and the default prose costs ~3.5k
  # input tokens on every round of every phase for guidance about tools this
  # profile denies. Replacing it leaves the web tools working (measured: a
  # WebFetch probe still fetches).
  #
  # The -file variant, not the inline one: a seat's system prompt carries the
  # org chart, its policies, its roster and its own memory, and argv is
  # readable by every account on the machine. It is undocumented in
  # `claude --help` on 2.1.263 but accepted (the help text names it in
  # passing, under --add-dir); an operator on a build that drops it overrides
  # this with ["--system-prompt", "{system}"].
  system_prompt_args: ["--system-prompt-file", "{file}"]
  prompt_mode: stdin
  output: json
  text_paths: [["result"]]
  error_paths: [["is_error"]]
  usage:
    input: [["usage", "input_tokens"]]
    output: [["usage", "output_tokens"]]
    cache_read: [["usage", "cache_read_input_tokens"]]
    cache_write: [["usage", "cache_creation_input_tokens"]]
  config_env:
    CLAUDE_CONFIG_DIR: ".claude"
  credential_paths: [".claude/.credentials.json"]
  volatile_paths:
    # .claude.json is not merely settings: it carries a `projects` map whose
    # entries hold per-directory conversation HISTORY. Observed on disk after
    # a real call, which is why it is pruned rather than trusted — the
    # remaining keys (machineID, migration flags, cached feature data) are
    # re-created on the next start at the cost of a few milliseconds.
    - ".claude/.claude.json"
    # And its BACKUPS, which are byte copies of that same file under
    # timestamped names — pruning the original and leaving the copies would
    # carry the projects map into the next turn by the long way round, and the
    # directory accumulates one file per rotation for the life of the seat.
    - ".claude/backups"
    # The file's lock, for the same reason: pruning what it guards and leaving
    # it behind is half a prune. It is a DIRECTORY, and one a killed CLI
    # leaves held — this build reports "Could not refresh your login because
    # another Claude Code process is refreshing it" off exactly that state.
    - ".claude/.claude.json.lock"
    - ".claude/projects"
    - ".claude/sessions"
    - ".claude/todos"
    - ".claude/tasks"
    - ".claude/history.jsonl"
    - ".claude/statsig"
    - ".claude/shell-snapshots"
    - ".claude/telemetry"
  host_credential_paths: [".claude/.credentials.json"]
  token_env: "CLAUDE_CODE_OAUTH_TOKEN"
  api_key_env: "ANTHROPIC_API_KEY"
  # `auth login`, NOT `/login`. `claude` takes a bare argument as the PROMPT
  # ("Usage: claude [options] [command] [prompt]"), so `claude /login` never ran
  # a login command at all: it opened an INTERACTIVE SESSION carrying `/login`
  # as its first message. On the empty login-home this backend hands it, that
  # session runs its OWN first-run sign-in, and the queued `/login` then asks a
  # SECOND time — after which the operator is sitting in a REPL that never exits
  # and has to Ctrl+C out of a login that had already succeeded. `claude auth
  # login` is the one-shot subcommand: it prints the OAuth URL immediately and
  # returns when the code is pasted.
  #
  # --claudeai is passed EXPLICITLY although it is today's default: `--console`
  # is the same command billing an Anthropic API account instead, and a vendor
  # that flipped the default would move every seat onto metered billing while
  # the plan sat unused — the silent switch applyAuth deletes ANTHROPIC_API_KEY
  # to prevent.
  login_args: ["auth", "login", "--claudeai"]
  # --text because a person ran `crewlet llm status` and is reading this; the
  # CLI's own default is --json.
  status_args: ["auth", "status", "--text"]
  logout_args: ["auth", "logout"]
  capture_token_args: ["setup-token"]
  # A spent plan exits 0 with prose, so it is recognised by the vendor's own
  # words rather than by a status code.
  #
  # MEASURED AGAINST THE INSTALLED CLI, NOT REMEMBERED. The sentinel this
  # profile shipped — "Claude AI usage limit reached", with the reset instant
  # after a pipe — appears NOWHERE in 2.1.263: it was 1.x's wording, and the
  # pipe-and-epoch field went with it. A sentinel that cannot match is worse
  # than none, because a spent plan then classifies FATAL instead of
  # RATE_LIMIT and the fallback chain never carries the seat onto a metered
  # key — the exact failure this mechanism exists to prevent, silent for as
  # long as nobody hits their cap.
  #
  # Two sentinels, because a spent window reaches the operator either way:
  # the CLI's own line (every live variant begins with this exact prefix —
  # "… · continuing automatically", "… · finishing up", "… · resets") and the
  # API error it relays. Neither carries a reset instant any more, so there is
  # no reset_separator: resetAfter then returns 0 and the credential pool uses
  # its configured cooldown, which is the honest answer rather than an
  # invented window.
  limit_markers:
    - sentinel: "Usage limit reached"
    - sentinel: '"type":"rate_limit_error"'
  # "OAuth token has expired" was dead the same way. The live wording is
  # "OAuth token has been revoked", and every other auth failure this CLI
  # reports — "Not logged in", "Login expired", "OAuth token revoked" — ends
  # in the same clause, so "Please run /login" covers all three at once.
  auth_markers:
    - sentinel: "Invalid API key"
    - sentinel: "OAuth token has been revoked"
    - sentinel: "Please run /login"

codex:
  binary: codex
  vendor: openai
  written_for: "Codex CLI 0.153.x (`codex --version`)"
  version_args: ["--version"]
  # read-only sandbox for the same reason as Claude's tool denials, and
  # --skip-git-repo-check because the per-call scratch directory is
  # deliberately not a repository. The sandbox also cuts the shell's network,
  # which is fine — the shell is denied — but the model's OWN web search is a
  # separate tool that the config defaults to an offline index; `live` is the
  # setting that reaches the web, passed as a config override so no file has
  # to be seeded.
  complete_args:
    - "exec"
    - "--json"
    - "--sandbox"
    - "read-only"
    - "--skip-git-repo-check"
    - "-c"
    - 'web_search="live"'
    - "-"
  local_tools: denied
  model_args: ["--model", "{model}"]
  prompt_mode: stdin
  output: jsonl
  # Two shapes, newest first: 0.5x emits item.completed envelopes, 0.4x
  # emitted msg envelopes. Both are listed rather than one being chosen so an
  # operator on either release needs no override.
  text_paths: [["item", "text"], ["msg", "message"]]
  usage:
    input:
      - ["msg", "info", "total_token_usage", "input_tokens"]
      - ["usage", "input_tokens"]
    output:
      - ["msg", "info", "total_token_usage", "output_tokens"]
      - ["usage", "output_tokens"]
    cache_read:
      - ["msg", "info", "total_token_usage", "cached_input_tokens"]
  config_env:
    CODEX_HOME: ".codex"
  credential_paths: [".codex/auth.json"]
  volatile_paths: [".codex/sessions", ".codex/history.jsonl", ".codex/log"]
  host_credential_paths: [".codex/auth.json"]
  api_key_env: "OPENAI_API_KEY"
  login_args: ["login"]
  status_args: ["login", "status"]
  logout_args: ["logout"]
  limit_markers:
    - sentinel: "You've hit your usage limit"
    - sentinel: "rate limit reached"
  auth_markers:
    - sentinel: "Not logged in"
    - sentinel: "run `codex login`"

gemini-cli:
  binary: gemini
  vendor: google
  written_for: "Gemini CLI 0.58.x (`gemini --version`)"
  version_args: ["--version"]
  complete_args: ["--output-format", "json", "--approval-mode", "default"]
  # Gemini takes its tool policy from settings.json in its config directory,
  # which is under the seat HOME. Local tools are excluded from discovery
  # (both the current and the pre-rename tool names, so the file holds across
  # the releases it may meet), and the web tools are put on the no-confirmation
  # list, because a headless run cannot answer a confirmation prompt and a
  # fetch that waited for one would simply fail. The pre-1.0 top-level key is
  # written beside the nested one for the same reason.
  local_tools: denied
  seed_files:
    - path: .gemini/settings.json
      content: '{"tools":{"exclude":["run_shell_command","read_file","write_file","edit_file","replace","glob","grep","search_file_content","list_directory","read_many_files","save_memory"],"allowed":["web_fetch","web_search","google_web_search"]},"excludeTools":["run_shell_command","read_file","write_file","edit_file","replace","glob","grep","search_file_content","list_directory","read_many_files","save_memory"]}'
  model_args: ["--model", "{model}"]
  # NO FLAG EXISTS — this CLI takes its system prompt from a FILE named by an
  # environment variable, which is why reading `--help` reports it as having
  # no such channel at all (it was recorded that way here once). Verified
  # against the shipped 0.58.0 bundle and its own docs/reference/
  # configuration.md: "Replaces the built-in system prompt with content from
  # a Markdown file… Any other string: Treat as a path".
  #
  # A full replacement rather than a merge, which is the behaviour this
  # backend wants for the same reason claude-code's profile records: an
  # appended seat identity sits underneath the vendor's own coding-agent
  # persona. There is no append variant here in any case.
  system_prompt_env: "GEMINI_SYSTEM_MD"
  prompt_mode: stdin
  output: json
  text_paths: [["response"]]
  # Gemini's usage block moved between releases and some builds omit it
  # entirely; when none of these resolves the counts are estimated and
  # `crewlet llm doctor` says so rather than reporting zeros as fact.
  usage:
    input: [["stats", "metrics", "input_tokens"], ["stats", "input_tokens"]]
    output: [["stats", "metrics", "output_tokens"], ["stats", "output_tokens"]]
    cache_read: [["stats", "metrics", "cached_content_tokens"]]
  credential_paths: [".gemini/oauth_creds.json", ".gemini/google_accounts.json"]
  volatile_paths: [".gemini/tmp", ".gemini/history", ".gemini/sessions"]
  host_credential_paths: [".gemini/oauth_creds.json", ".gemini/google_accounts.json"]
  api_key_env: "GEMINI_API_KEY"
  # A project id is configuration, not a credential, and Gemini genuinely
  # needs the ambient one on a Workspace account.
  passthrough_env: ["GOOGLE_CLOUD_PROJECT", "GOOGLE_CLOUD_LOCATION"]
  login_args: []
  limit_markers:
    - sentinel: "Quota exceeded"
    - sentinel: "RESOURCE_EXHAUSTED"
  auth_markers:
    - sentinel: "UNAUTHENTICATED"
    - sentinel: "Please sign in"

qwen-code:
  binary: qwen
  vendor: openai
  written_for: "Qwen Code 0.23.x (`qwen --version`), a Gemini CLI fork"
  version_args: ["--version"]
  complete_args: ["--output-format", "json", "--approval-mode", "default"]
  # A Gemini CLI fork: same settings shape, same tool names, its own directory.
  local_tools: denied
  seed_files:
    - path: .qwen/settings.json
      content: '{"tools":{"exclude":["run_shell_command","read_file","write_file","edit_file","replace","glob","grep","search_file_content","list_directory","read_many_files","save_memory"],"allowed":["web_fetch","web_search","google_web_search"]},"excludeTools":["run_shell_command","read_file","write_file","edit_file","replace","glob","grep","search_file_content","list_directory","read_many_files","save_memory"]}'
  model_args: ["--model", "{model}"]
  # THE FORK RENAMED ITS PARENT'S VARIABLE: `QWEN_SYSTEM_MD`, where Gemini
  # CLI reads `GEMINI_SYSTEM_MD` (this build reads neither of the other's —
  # checked against the shipped 0.23.0 bundle). Same contract otherwise: a
  # path, replacing the built-in prompt.
  #
  # THE ENV VAR RATHER THAN THE FLAG, and this fork is the only profile where
  # the choice arises: 0.23.0 also has --system-prompt and
  # --append-system-prompt. The variable names a FILE, so the seat's system
  # prompt — the org chart, the policies, that seat's own memory — never
  # reaches argv, where /proc/<pid>/cmdline makes it readable by every
  # account on the machine. The flag takes a string and nothing else.
  #
  # Replacing rather than appending, for the reason the claude-code profile
  # records: an appended seat identity sits underneath the vendor's own
  # coding-agent persona, which then keeps introducing itself over the top of
  # the seat. Note this CLI still appends its own QWEN.md context after
  # either one — that is the vendor's, and not something the profile can
  # switch off here.
  system_prompt_env: "QWEN_SYSTEM_MD"
  prompt_mode: stdin
  output: json
  text_paths: [["response"]]
  usage:
    input: [["stats", "metrics", "input_tokens"], ["stats", "input_tokens"]]
    output: [["stats", "metrics", "output_tokens"], ["stats", "output_tokens"]]
  credential_paths: [".qwen/oauth_creds.json"]
  volatile_paths: [".qwen/tmp", ".qwen/history", ".qwen/sessions"]
  host_credential_paths: [".qwen/oauth_creds.json"]
  api_key_env: "DASHSCOPE_API_KEY"
  limit_markers:
    - sentinel: "Quota exceeded"
    - sentinel: "RESOURCE_EXHAUSTED"
  auth_markers:
    - sentinel: "UNAUTHENTICATED"

opencode:
  binary: opencode
  vendor: anthropic
  written_for: "OpenCode 1.18.x (`opencode --version`)"
  version_args: ["--version"]
  complete_args: ["run", "--print-logs=false"]
  # OpenCode takes its tool policy from opencode.json under XDG_CONFIG_HOME,
  # which the child environment points inside the seat HOME. Every rule is an
  # explicit allow or deny — never ask, which a headless run cannot answer.
  # `question` is denied for the same reason: it is the tool that asks a
  # person. Explicit denies hold in every mode, including --auto.
  local_tools: denied
  seed_files:
    - path: .config/opencode/opencode.json
      content: '{"$schema":"https://opencode.ai/config.json","permission":{"read":"deny","edit":"deny","glob":"deny","grep":"deny","bash":"deny","task":"deny","skill":"deny","lsp":"deny","question":"deny","external_directory":"deny","webfetch":"allow","websearch":"allow"}}'
  model_args: ["--model", "{model}"]
  prompt_mode: argv
  output: text
  credential_paths: [".local/share/opencode/auth.json"]
  volatile_paths:
    - ".local/share/opencode/storage"
    - ".local/share/opencode/log"
    - ".local/share/opencode/project"
  host_credential_paths: [".local/share/opencode/auth.json"]
  login_args: ["auth", "login"]
  logout_args: ["auth", "logout"]
  status_args: ["auth", "list"]
  # The one built-in profile with a real credential login, which is why the
  # `crewlet llm login --username/--password-stdin` path exists at all.
  stdin_login:
    args: ["auth", "login", "--username", "{username}"]
    stdin_template: "{password}\n"
  # `429` was here as a third sentinel and is GONE rather than reworded.
  # A sentinel is matched as a plain substring against whatever the CLI
  # printed — on a healthy call, the model's own answer — so three digits
  # match a quoted HTTP status, a stack trace's line number, a token count
  # or any ten-digit epoch, and a match benches the subscription and hands
  # the seat to the fallback chain. That is a working company degrading
  # quietly, and it fires far more often than the spent plan it was for.
  #
  # Not replaced with a guess: nothing here can be verified without the CLI
  # in front of it, and an unverified sentinel is the same mistake in a
  # respectable font. `usage limit` remains, and an operator who sees a
  # spent OpenCode plan classified FATAL has the CLI's own sentence in that
  # error — which is what `cli.overrides.limit_markers` is for.
  limit_markers:
    - sentinel: "usage limit"
  auth_markers:
    - sentinel: "not authenticated"
    - sentinel: "no credentials"

cursor-agent:
  binary: cursor-agent
  vendor: anthropic
  written_for: "Cursor Agent 2026.09.x (`cursor-agent --version`), which versions by DATE"
  version_args: ["--version"]
  complete_args: ["-p", "--output-format", "json"]
  # Cursor reads a permissions block from the project's .cursor/cli.json —
  # the per-call scratch directory IS the project, so the file is seeded there
  # on every call. Its user-level file, cli-config.json, is the login file
  # this profile seeds and syncs back, so the policy is kept out of it. Deny
  # takes precedence over allow.
  local_tools: denied
  seed_files:
    - path: .cursor/cli.json
      in: work
      content: '{"permissions":{"allow":["WebFetch(*)"],"deny":["Shell(*)","Write(*)","Read(*)"]}}'
  model_args: ["--model", "{model}"]
  prompt_mode: stdin
  output: json
  text_paths: [["result"], ["response"]]
  usage:
    input: [["usage", "input_tokens"]]
    output: [["usage", "output_tokens"]]
  config_env:
    CURSOR_CONFIG_DIR: ".cursor"
  credential_paths: [".cursor/cli-config.json", ".cursor/auth.json"]
  volatile_paths: [".cursor/chats", ".cursor/logs", ".cursor/sessions"]
  host_credential_paths: [".cursor/cli-config.json", ".cursor/auth.json"]
  login_args: ["login"]
  logout_args: ["logout"]
  status_args: ["status"]
  limit_markers:
    - sentinel: "usage limit"
    - sentinel: "quota"
  auth_markers:
    - sentinel: "not logged in"

copilot:
  binary: copilot
  vendor: openai
  written_for: "GitHub Copilot CLI 1.0.x (`copilot --version`)"
  version_args: ["--version"]
  # The tool flags come BEFORE -p, so nothing here can be read as the prompt,
  # which is appended last. Denies win over allows; the web tools are
  # allowed explicitly so a non-interactive run does not wait on approval.
  complete_args:
    - "--deny-tool"
    - "shell"
    - "--deny-tool"
    - "write"
    - "--deny-tool"
    - "read"
    - "--allow-tool"
    - "web_fetch"
    - "--allow-tool"
    - "web_search"
    - "-p"
  local_tools: denied
  model_args: ["--model", "{model}"]
  # The prompt goes on argv, so a long transcript is bounded by ARG_MAX
  # (~2 MB on Linux, 256 KB on macOS) and fails at exec rather than at the
  # model. Documented in subscription-llm-backends.md.
  prompt_mode: argv
  output: text
  credential_paths: [".copilot/hosts.json"]
  volatile_paths: [".copilot/history", ".copilot/logs", ".copilot/sessions"]
  host_credential_paths: [".copilot/hosts.json", ".config/gh/hosts.yml"]
  # Copilot authenticates with a GitHub token, so this is its key variable —
  # reached deliberately through auth.mode api-key or inherit-env, never
  # forwarded silently.
  api_key_env: "GITHUB_TOKEN"
  login_args: ["login"]
  logout_args: ["logout"]
  limit_markers:
    - sentinel: "usage limit"
    - sentinel: "rate limit"
  auth_markers:
    - sentinel: "not authenticated"
    - sentinel: "gh auth login"

grok:
  binary: grok
  vendor: openai
  # xAI'S OWN CLI (github.com/xai-org/grok-build, installed from x.ai/cli),
  # NOT the same-named community package on npm. Both put a `grok` on PATH
  # and they are different programs: this profile's `.grok/auth.json`,
  # `--sandbox` and `-p` are the official one's, and the npm build has none
  # of them. If `grok --version` prints a 0.0.x, that is the other one.
  written_for: "Grok Build CLI 1.0.x (`grok --version`) — xAI's OWN, from x.ai/cli"
  version_args: ["--version"]
  # THE DENIAL, THEN THE PROMPT FLAG LAST — see prompt_args below for why `-p`
  # cannot sit here.
  #
  # --disallowed-tools AND NOT --tools, although an allowlist would be the
  # safer shape in general. Read against the source (xai-org/grok-build,
  # crates/codegen/xai-grok-agent/src/builder.rs): the allowlist is applied
  # only `if unresolved.is_empty()` — one entry it does not recognise and the
  # whole retain is SKIPPED with a warning, leaving every tool enabled. The
  # deny list always applies its retain and only warns per entry that matched
  # nothing. So a name this profile gets wrong costs one tool on a denylist
  # and costs EVERYTHING on an allowlist, and the vendor renaming a tool is
  # exactly the drift this format expects.
  #
  # The names are the built-in ids from that same source (they match on the
  # short name, `tool_id_eq` = full id or the part after the last colon).
  # Denied: the shell and its lifecycle, the filesystem and search, the
  # sub-agent and background-task family — which would otherwise run terminal
  # commands the direct denial just removed — the scheduler, and the todo
  # writer. KEPT: web_search and web_fetch, which this backend keeps on for
  # every seat, plus the plan-mode and ask-user tools, which reach nothing.
  # Same stance as claude-code's --disallowedTools and gemini's settings
  # exclude list, expressed in this CLI's vocabulary.
  complete_args:
    - "--disallowed-tools"
    - "run_terminal_cmd,bash,get_terminal_command_output,kill_terminal_command,read_file,search_replace,list_dir,grep,lsp,task,send_subagent_message,workflow,monitor,get_task_output,wait_tasks,kill_task,todo_write,scheduler_create,scheduler_delete,scheduler_list"
  local_tools: denied
  # --sandbox is still not the answer and is deliberately not used: it
  # restricts the network along with the filesystem, which would cut the web
  # tools this backend keeps on.
  model_args: ["--model", "{model}"]
  # Replace, not --rules (which appends): the same reasoning as claude-code
  # and qwen-code. Inline because this flag takes a string and there is no
  # file variant, so the seat's prompt is on argv — see the qwen-code note.
  system_prompt_args: ["--system-prompt-override", "{system}"]
  prompt_mode: argv
  # `-p` TAKES THE PROMPT AS ITS VALUE, so it has to be the last thing before
  # the prompt rather than sitting in complete_args. It used to sit there, and
  # the model flag that follows became the prompt: every call exited on
  # "a value is required for '--single <PROMPT>' but none was supplied".
  prompt_args: ["-p"]
  output: text
  credential_paths: [".grok/auth.json"]
  volatile_paths: [".grok/history", ".grok/sessions"]
  host_credential_paths: [".grok/auth.json"]
  # THE CLI'S OWN WORD: signed out, it says "set the XAI_API_KEY environment
  # variable". GROK_API_KEY is the community npm build's variable and this
  # is not that program.
  api_key_env: "XAI_API_KEY"
  limit_markers:
    - sentinel: "rate limit"
  auth_markers:
    - sentinel: "invalid api key"

muse-code:
  binary: muse
  # Meta's own family, and the field is an open set for exactly this case:
  # writing `openai` because Meta's Model API also speaks chat-completions
  # would make the profile say something false about the model to buy nothing
  # — an unknown family already falls back to the same catalogue default.
  vendor: meta
  written_for: "Muse Code 1.0.3 (`muse --version` prints `1.0.3-R2198.1`)"
  version_args: ["--version"]
  # `muse exec`, the vendor's own headless surface: one prompt, run to
  # completion, the run's events on stdout. Its startup preamble goes to
  # STDERR, so stdout is JSONL and nothing has to be stripped.
  #
  # THE BINARY ON PATH IS A LAUNCHER SHELL SCRIPT, not the agent — see the
  # MUSE_NO_AUTO_UPDATE note under env below, which is why that variable is
  # part of the profile rather than an operator's problem.
  #
  # --json IS NOT OPTIONAL HERE, and the reason is the failure classification
  # rather than the answer. THIS CLI PRINTS NO FAILURE CAUSE ON STDERR: a
  # failed run writes the fixed string "run ended with Failed" there and
  # nothing else, and the real reason exists only in the `run.terminal.failed`
  # event's `payload.reason`. Without --json a spent plan and a dead login
  # reach this backend as a bare exit 1, no marker can fire, and the seat's
  # fallback chain never carries it onto a metered key — the exact silent
  # failure limit_markers exist to prevent.
  #
  # --no-session-log is this CLI's isolation flag and the counterpart of
  # claude-code's --no-session-persistence: no retained session event log, so
  # nothing on disk carries one turn's conversation into the next. It is
  # refused ALONGSIDE --session-id ("a session id needs retained logging"),
  # which is why no session id is passed — every call here is one-shot and a
  # resumable session is precisely what this backend must not have.
  #
  # --disable-approval is what the vendor's own headless guidance asks for:
  # "A non-interactive run has no one to answer an approval prompt, so choose
  # a posture in advance." Skipping the prompt keeps the OS sandbox on and is
  # the only posture that cannot wedge — a held approval in a headless run
  # stays unresolved, and the CLI then sits on the seat's concurrency slot
  # until the wall-clock cap fires. Same reason opencode's seeded policy has
  # no `ask` in it and denies the tool that asks a person.
  #
  # --disable-shell and --disable-write are DEFENCE IN DEPTH AND NOTHING MORE.
  # Measured against 1.0.3: with both set, `bash`, `bash_input`, `write_file`
  # and `edit_file` are still advertised to the model, byte-identical to the
  # baseline surface. They are call-time refusals, not a denial of the tool.
  # What actually removes them is run.toolset in the seeded settings file
  # below; these two are here so that a build whose settings file failed to
  # apply still refuses the call rather than running it.
  #
  # NOT --sandbox-network: it governs the OS sandbox around SHELL commands,
  # and the seeded toolset leaves no shell to sandbox. Not --trust-workspace
  # either — the per-call working directory is created empty, and trusting it
  # is what would admit an AGENTS.md, a rule or a skill from a checkout the
  # engine does not control. Not --max-model-steps: breaching it exits 1, so
  # a cap would DISCARD a finished answer, and cli.timeout_seconds already
  # bounds the call from the outside without throwing the work away.
  complete_args:
    - "exec"
    - "--json"
    - "--no-session-log"
    - "--disable-approval"
    - "--disable-shell"
    - "--disable-write"
  # Denied by REPLACING THE TOOL SURFACE, which is the only thing on this CLI
  # that does: `run.toolset` is an allowlist of exact tool names, validated
  # against the real registry at startup, and it is what makes bash,
  # bash_input, read_file, write_file, edit_file, the memory, goal, cron and
  # subagent families disappear from the model's view. There is no
  # --allowed-tools, no --deny-tool and no project-level settings file.
  #
  # `web_search` is the one name kept, because web is the one local tool this
  # backend never denies. (`web_fetch` is registered but gated off by a remote
  # rollout in 1.0.3 — naming it admits nothing, so it is not named.) Three
  # engine-owned tools survive any toolset and cannot be removed: read_skill,
  # snooze_reminder and write_todos. None of them reaches the filesystem, the
  # shell or the network.
  #
  # "schema_version": 1 is MANDATORY: a settings file without it fails every
  # command at startup with `malformed settings file`.
  local_tools: denied
  seed_files:
    - path: .config/muse/settings.json
      content: '{"schema_version":1,"run":{"toolset":["web_search"]}}'
  model_args: ["--model", "{model}"]
  # NO SYSTEM-PROMPT CHANNEL. The flags common to both surfaces are model,
  # reasoning effort, the permission levers, workspace and session logging,
  # and the headless-only three are --json, --prompt-file and
  # --max-model-steps. Project instructions travel through AGENTS.md /
  # CLAUDE.md, which load only after a workspace is TRUSTED — so on the
  # untrusted per-call directory this backend hands it, nothing of the sort is
  # admitted either. The seat's identity therefore rides the transcript, as it
  # does for codex, opencode, copilot and cursor-agent.
  #
  # --prompt-file IS the reason this profile is prompt_mode: file. The prompt
  # a phase renders is the whole flattened transcript — the seat's identity,
  # the tool catalogue, the conversation and every tool result in it — and on
  # argv that is readable through /proc/<pid>/cmdline by every account on the
  # machine and bounded by ARG_MAX (256 KB on macOS). This CLI is the first
  # built-in profile whose vendor offers a path instead, so it takes it.
  prompt_mode: file
  prompt_args: ["--prompt-file", "{file}"]
  output: jsonl
  # AN ENVELOPED STREAM, so the event kind decides which `payload.text` is the
  # answer. Every line is one envelope and `payload.text` carries three
  # different things: a token FRAGMENT of the reply on `run.output.delta`, a
  # tool's output on `tool.result`, and the assembled reply on
  # `run.terminal.completed`. Reading the path alone would splice tool output
  # into the answer and then repeat the answer — which is why this profile
  # names the discriminator and takes the terminal event only.
  #
  # The terminal event and not the deltas, although the deltas are what a
  # human watches: they are fragments ("Created", " `notes.txt` containing"),
  # and a stream's text hits are joined with a newline here, which would
  # shred every sentence the model wrote. The cost is that a STREAMING caller
  # gets the answer in one delta at the end rather than incrementally.
  event_type_path: ["payload_type"]
  text_events: ["run.terminal.completed"]
  text_paths: [["payload", "text"]]
  # NO USAGE PATHS, because the exec stream carries no token counts at all —
  # not under any key, on any event. The counts are estimated here and
  # `crewlet llm doctor` says so. They do exist on the session log this
  # profile deliberately switches off, and on `muse serve`'s MSP protocol,
  # which is a different transport this backend does not speak.
  #
  # The `muse` on PATH is the LAUNCHER, and left alone it checks for a new
  # release every hour and forks a background download that outlives the call.
  # Three reasons that is wrong under an engine: it swaps the binary under a
  # running fleet with nothing to say so (which is what written_for exists to
  # make visible), it writes its check stamp next to the binary — outside the
  # seat home, so outside the isolation — and the download is a child this
  # backend's process-group teardown can kill mid-write. Upgrades are the
  # operator's, on their schedule.
  env:
    MUSE_NO_AUTO_UPDATE: "1"
  # No config_env: this CLI is XDG-native and has no relocation variable of
  # its own. buildEnv already points XDG_CONFIG_HOME and XDG_DATA_HOME inside
  # the seat's home, and the binary honours both. (MUSE_AUTH_PATH looks like
  # the variable for this and is NOT: it is the LAUNCHER's, absent from the
  # agent binary entirely, so a profile relocating credentials with it would
  # silently get the default path.)
  credential_paths: [".config/muse/auth.json"]
  # THE WHOLE DATA DIRECTORY, not a list of children. .local/share/muse holds
  # the session logs (sessions/YYYY/MM/DD/<id>/session.jsonl) and the personal
  # project memory the vendor documents as living "on your machine outside the
  # repo" without saying where. Nothing durable is in here — the credential
  # and the settings are under .config — so pruning the directory is both
  # complete and safe, where naming children would leave whatever this build
  # adds next. .local/state/muse goes with it for the same reason.
  #
  # And two files inside the config directory, which is otherwise left alone
  # because the credential lives there: trust.json accumulates one workspace
  # trust record per call directory, none of which will ever exist again, and
  # .auth.json.lock is what a killed CLI leaves held — the same half-prune the
  # claude-code profile's .claude.json.lock note records.
  volatile_paths:
    - ".local/share/muse"
    - ".local/state/muse"
    - ".config/muse/trust.json"
    - ".config/muse/.auth.json.lock"
  host_credential_paths: [".config/muse/auth.json"]
  # A Meta Model API key, so it is the METERED credential: reached through
  # auth.mode api-key or inherit-env, never forwarded silently. It takes
  # priority over every stored credential inside the CLI itself, which is
  # exactly why applyAuth deletes it on a subscription call — a stray key
  # would bill pay-as-you-go while the subscription sat unused.
  #
  # There is no token_env and no capture_token_args: this CLI mints no
  # headless token of its own. `muse login` does mint an API key server-side,
  # but it stores it in the credential file rather than printing it, so a
  # subscription seat authenticates from that file — which is why an
  # agent-mode run on a REMOTE cell is refused for this CLI.
  api_key_env: "META_API_KEY"
  # `muse login` brokers the browser sign-in; `muse logout` removes the stored
  # credential and leaves an exported META_API_KEY alone. Both are real
  # subcommands, which matters because `muse` takes a bare argument as a
  # PROMPT — the trap `claude /login` used to be.
  login_args: ["login"]
  logout_args: ["logout"]
  # No status_args: this CLI has no status subcommand. `muse auth` takes
  # exactly one subcommand, `set` (and `muse auth set --api-key-stdin` reads a
  # key from stdin), while the credential status panel is the TUI's `/status`
  # slash command, which a headless run cannot reach.
  #
  # THE AUTH SENTINELS ARE THE CLI'S OWN SENTENCES, and they share a clause:
  # four of the five auth failures this build reports — a rejected saved key,
  # no login to refresh from, an unauthorised token refresh, a login that is
  # no longer saved — all end in "run `muse login`". The fifth is the
  # environment key being rejected, which names META_API_KEY instead. Neither
  # is a phrase a model writes by accident.
  #
  # THE LIMIT SENTINELS ARE THE MODEL API'S ERROR **TYPE**, which is the token
  # a muse failure reason actually carries: a real out-of-credits run surfaced
  # `API error 402 [request_id=…]: Billing verification failed … (billing_error)`,
  # so the parenthesised type is the template. `billing_error` is that
  # captured case — an account that can no longer pay, which is a spent
  # credential and belongs on the fallback chain. `rate_limit_error` is the
  # published type for 429; no 429 from this CLI has been captured, so if your
  # plan's wording differs, put it in cli.overrides.limit_markers rather than
  # letting a spent plan classify FATAL and strand the chain. The error CODES
  # (`rate_limit_exceeded`, `invalid_api_key`) are deliberately not used: the
  # observed template carries the type, not the code.
  limit_markers:
    - sentinel: "rate_limit_error"
    - sentinel: "billing_error"
  auth_markers:
    - sentinel: "run `muse login`"
    - sentinel: "META_API_KEY was rejected"

kimi-code:
  binary: kimi
  # Moonshot's own family. The managed service the OAuth login reaches is
  # api.kimi.com/coding/v1 and its model aliases are `kimi-code/k3`,
  # `kimi-code/kimi-for-coding` and `kimi-code/kimi-for-coding-highspeed` —
  # none of which any other vendor's catalogue would resolve.
  vendor: moonshot
  # MOONSHOT'S OWN CLI, `@moonshot-ai/kimi-code` — NOT the unscoped `kimi-code`
  # package on npm, which is a community wrapper that starts an
  # anthropic-proxy and runs Claude Code behind it. Both install a `kimi` on
  # PATH and they are different programs: this profile's `--agent-file`,
  # `--output-format stream-json` and `~/.kimi-code` layout are the official
  # one's. The same trap the grok profile records, with the same tell — if
  # `kimi --version` prints a 1.0.x, that is the other one.
  #
  # It is also the successor to `kimi-cli`, whose docs are still the first
  # search hit and whose print mode took `--input-format`/`--final-message-only`
  # flags this build does not have. `kimi migrate` is the seam between them.
  #
  # MEASURED AGAINST 0.42.0: the flags off `kimi --help`, the tool surface and
  # the system prompt off the request body the CLI actually sent (a stub HTTP
  # endpoint standing in for the model), and the failure classifications off
  # real 401 and 429 responses. What is NOT measured is a spent Kimi
  # subscription, which no profile here can produce on demand.
  written_for: "Kimi Code CLI 0.42.x (`kimi --version`) — MoonshotAI's OWN, from @moonshot-ai/kimi-code"
  version_args: ["--version"]
  # `--output-format stream-json` IS NOT OPTIONAL, and the reason is the
  # ANSWER rather than the failure classification (the opposite of muse-code's
  # `--json`). The default `text` output is a TRANSCRIPT, not a reply: the
  # vendor's own reference says assistant text is "prefixed with `• `" and
  # "wrapped lines are indented by two spaces". Crewlet's tool calls ride a
  # JSON envelope inside that text, so a bullet on every line and a hard wrap
  # through the middle of it destroys the envelope and the prose together.
  # stream-json prints one JSON object per line and leaves the reply intact.
  #
  # Nothing else belongs here. `--yolo`, `--auto` and `--plan` are REFUSED
  # alongside `--prompt` at startup, and print mode already runs under the
  # `auto` permission policy with static deny rules still in force, so there
  # is no approval for a headless run to wait on. `--add-dir` and
  # `--skills-dir` would widen the per-call directory this backend keeps
  # empty on purpose.
  complete_args: ["--output-format", "stream-json"]
  # DENIED IN THE AGENT FILE, which is the only per-call channel this CLI has
  # for it. `[tools]` and `[[permission.rules]]` live in config.toml — and
  # config.toml is where `kimi login` writes the OAuth reference and the model
  # catalogue, so it is a CREDENTIAL here (see credential_paths) and seeding a
  # policy into it would destroy the login it carries.
  #
  # An allowlist rather than a denylist, and unlike grok that is the safe
  # direction on this CLI: a name it does not recognise "is reported with a
  # warning" and matches nothing, so a stale entry costs one tool rather than
  # lifting the whole restriction.
  #
  # MEASURED, by reading the tool array the CLI actually put on the wire:
  # TWENTY-FIVE tools by default, ONE with this agent file. What goes is
  # `Bash`, `Read`, `Write`, `Edit`, `Grep`, `Glob`, the plan-mode pair,
  # `TodoList`, `Skill`, `AskUserQuestion`, the `Task*` background family, the
  # `Cron*` family, an undocumented GOAL family (`CreateGoal`, `GetGoal`,
  # `UpdateGoal`, `SetGoalBudget`) — and `Agent`/`AgentSwarm`, which is what
  # bounds the construct: with no `Agent` tool there is no sub-agent to
  # delegate to, so `subagents` needs no entry of its own.
  #
  # The goal family is the reason an allowlist is right here beyond the
  # failure-direction argument: it is in the binary and not in the vendor's
  # published tool table, so a denylist written from the docs would have
  # admitted four tools nobody knew to name.
  #
  # `FetchURL` is the one that survives, and it is web — the one local tool
  # this backend never denies. `WebSearch` is named beside it and was NOT in
  # the measured baseline: it is registered only when the Moonshot search
  # service is configured, which the OAuth login provisions
  # (`[services.moonshot_search].oauth` is "injected automatically by the
  # login flow") and a credential-less test does not. So the name is
  # load-bearing on a real subscription seat and inert here, which is the
  # opposite of muse-code's gated `web_fetch` — there, naming it admitted
  # nothing ever.
  local_tools: denied
  model_args: ["--model", "{model}"]
  # `--agent-file`, and it is the tool denial AND the system prompt at once.
  #
  # This CLI's per-call prompt channel is an AGENT FILE: YAML frontmatter
  # declaring the agent's name, its description (REQUIRED) and its tool
  # allowlist, with the BODY as the system prompt. Handed a bare prompt it
  # does not degrade — the vendor's reference says a file passed explicitly
  # "must be valid, otherwise the CLI reports the error and exits" — so the
  # envelope below is what makes the channel usable at all. It is also why
  # this profile's channel is passed on EVERY call, including one carrying no
  # system prompt: see [SystemPromptFile]. Such a call — `crewlet llm doctor`'s
  # two isolation probes are the only ones the engine makes — gets a valid
  # agent file with an EMPTY body, which is an empty system prompt rather than
  # the vendor's default one. That is the right answer for a probe, and it is
  # loud rather than silent if this CLI ever refuses it.
  #
  # `$KIMI_CODE_HOME/SYSTEM.md` is the other prompt override and is NOT usable
  # here: it is one static file per home, and a seat's prompt differs per
  # phase and per turn. `--agent-file` outranks it either way.
  #
  # The body is rendered as a TEMPLATE each time the prompt is built, and
  # `${skills}`, `${agents_md}`, `${cwd}`, `${cwd_listing}`, `${os}`,
  # `${shell}`, `${now}`, `${additional_dirs_info}`, `${base_prompt}` and
  # `${plugin_sections}` substitute inside it. A bare `$` is never special and
  # an unknown `${…}` stays verbatim, so ordinary prose is safe; a seat whose
  # prompt legitimately contains one of those ten names is not, and that is
  # the cost of the only channel this CLI has.
  #
  # NO `${base_prompt}`, deliberately: a body without it "owns the entire
  # prompt", which is the replace-rather-than-append decision every other
  # profile here makes for the same reason — a coding-agent identity over the
  # top of whatever seat is actually being served.
  system_prompt_args: ["--agent-file", "{file}"]
  system_prompt_file:
    # `.md`: agent files are Markdown, and the discovery pass scans for that
    # extension. The default `.txt` name is not worth betting the channel on.
    name: crewlet-seat.md
    # `name` is stated rather than left to the file name, so the channel does
    # not depend on what this package happens to call the file, and
    # `description` is stated because the CLI requires it.
    template: |
      ---
      name: crewlet-seat
      description: The Crewlet seat this run serves. Crewlet drives the model and executes its tools; this CLI is a text model behind that loop.
      tools:
        - WebSearch
        - FetchURL
      ---
      {system}
  # `--prompt` TAKES THE PROMPT AS ITS VALUE, so it goes in prompt_args rather
  # than complete_args — the same shape as grok's `-p`, and the same failure
  # if it sits earlier: the next flag becomes the prompt.
  prompt_mode: argv
  prompt_args: ["--prompt"]
  # An OpenAI-shaped chat stream: one message object per line, discriminated
  # by `role`. Assistant text is `content`; a tool call emits an assistant
  # message carrying `tool_calls` first, then a `role: tool` message, then
  # further assistant messages — so the answer has to be filtered to the
  # assistant's own lines rather than read off every line. Thinking content is
  # not written to the stream at all, and the "resuming session" notices and
  # tool progress go to stderr.
  #
  # With the agent file's allowlist in force there is no tool call and
  # therefore exactly one assistant message, which matters because this
  # package joins a stream's text hits with a newline.
  #
  # The second path is the array form, for the same reason cursor-agent
  # declares two: `content` is a string on this build, and a chat message's
  # content is the field a vendor most often widens to a block list.
  output: jsonl
  event_type_path: ["role"]
  text_events: ["assistant"]
  text_paths: [["content"], ["content", "0", "text"]]
  # NO USAGE PATHS: the stream carries messages, not a usage report, so the
  # counts are estimated and `crewlet llm doctor` says so. The CLI does keep
  # real figures — `[token_counting]` selects the strategy behind its own
  # context display — but they reach the TUI and the session store rather than
  # this stream.
  env:
    # The update preflight, off. Left on, the CLI checks for a release, may
    # install it in the background, and swaps the binary under a running fleet
    # with nothing to say so — which is precisely what `written_for` exists to
    # make visible. Upgrades are the operator's, on their schedule. Same
    # decision as muse-code's MUSE_NO_AUTO_UPDATE.
    KIMI_CODE_NO_AUTO_UPDATE: "1"
    # What `kimi -p` does when background tasks are still pending after the
    # main turn. The default is `steer`, whose own wait ceiling defaults to
    # 2147483 seconds — twenty-four days — and a headless run that reaches it
    # holds the seat's concurrency slot until cli.timeout_seconds fires.
    # `exit` is the only posture that cannot wait. Nothing should ever create
    # a background task here (they come from `Bash`, which the agent file
    # denies), which is exactly why this costs nothing and covers the case
    # where the denial did not apply.
    KIMI_CODE_BACKGROUND_PRINT_BACKGROUND_MODE: "exit"
    # THE RETRY CAP, and this one is MEASURED rather than reasoned. The
    # default is ten attempts with exponential backoff, and against a stub
    # returning 429 the CLI slept through nine retries before giving up:
    #
    #   default (10 attempts) ......... 2 min 24 s
    #   this setting (3 attempts) ..... 5.4 s
    #
    # A spent plan is exactly when the seat's fallback chain must carry it
    # onto a metered key, and at the default the CLI sits on the seat's
    # concurrency slot for two and a half minutes first — on every call, until
    # the plan resets — doing nothing but sleeping. Three keeps one real retry
    # for a transient 500 or an overloaded engine (~1.8 s of backoff) and
    # hands everything past that to the chain and the credential pool, which
    # move to another model or another key rather than hammering a dependency
    # that is already refusing. An auth failure is not retried at all, which
    # this measured at 3.1 s either way.
    KIMI_LOOP_MAX_ATTEMPTS_PER_STEP: "3"
  config_env:
    KIMI_CODE_HOME: ".kimi-code"
  # TWO FILES, because this CLI splits its login across them: `kimi login`
  # writes the OAuth token to credentials/oauth/kimi-code.json AND injects the
  # provider's `[providers.<name>.oauth]` reference into config.toml, which
  # also carries `default_model` and the `[models]` catalogue every `--model`
  # alias resolves against. A seat home with only the token has no provider
  # and no model and fails at startup.
  #
  # Their base names differ (`kimi-code.json`, `config.toml`), which is what
  # the shared credential directory keys on.
  credential_paths:
    - ".kimi-code/credentials/oauth/kimi-code.json"
    - ".kimi-code/config.toml"
  # Sessions, their index, and the logs. Everything else under the home is
  # either the credential above or re-created on the next start.
  #
  # Each session directory holds `agents/*/wire.jsonl`, which the vendor
  # documents as carrying "user prompts, command output, repository paths,
  # tool return values, or traces of credentials" — one seat's turn is not
  # allowed to reach the next one through it.
  volatile_paths:
    - ".kimi-code/sessions"
    - ".kimi-code/session_index.jsonl"
    - ".kimi-code/logs"
  host_credential_paths:
    - ".kimi-code/credentials/oauth/kimi-code.json"
    - ".kimi-code/config.toml"
  # A real one-shot subcommand, not a slash command: `kimi login` runs the
  # RFC 8628 device-code flow, prints the verification URL and user code to
  # stderr, polls, and exits 0 on success. No flags.
  #
  # There is no logout and no status subcommand — `/login` and `/status` are
  # the TUI's, which a headless run cannot reach — so neither is declared.
  login_args: ["login"]
  # NO capture_token_args: this CLI mints no headless token. KIMI_API_KEY is
  # the METERED Moonshot platform key and it is not read from the shell at
  # all — the vendor is explicit that `export KIMI_API_KEY=…` gives no
  # provider its key, because credentials are read only from config.toml. So
  # there is no api_key_env either: the variable exists and setting it would
  # do nothing, and naming a variable the CLI ignores is worse than naming
  # none. A metered account is configured by writing the key into the
  # credential home's config.toml, which then travels to every seat.
  #
  # THE SENTINELS ARE THIS CLI'S OWN CLASSIFICATION, not the vendor's prose,
  # and that is what a measurement bought. A real 429 exits 1 with
  #
  #   error: failed to run prompt: provider.rate_limit: 429 You have reached
  #   your 5-hour usage limit. …
  #
  # and a real 401 with `provider.auth_error: 401 Invalid Authentication`.
  # Everything after the colon is the UPSTREAM provider's message and changes
  # with the plan, the endpoint and the vendor's wording; the
  # `provider.<kind>:` prefix is the CLI's own and does not. Matching the
  # prefix is therefore the sentinel that cannot go stale on a reworded error
  # — which is exactly the drift limit_markers are shaped to survive.
  #
  # The plan-window phrases are kept BESIDE it, from the vendor's published
  # error reference, for a failure that reaches the operator by some path
  # that does not go through the provider classifier. Each is quoted without
  # its leading "You've reached your", because a sentinel is matched verbatim
  # and a vendor rendering a curly apostrophe would silently never match.
  # FAILURES REACH THIS BACKEND ON STDERR AND NOWHERE ELSE, measured: on every
  # failure the answer stream carried only `role: meta` lines and the
  # classification landed on stderr. So the markers below are matched against
  # stderr ALONE, and nothing the model writes can bench this seat's
  # credential — see [MarkerScope]. It is also what keeps the plan-window
  # phrases safe to keep beside the structural sentinel.
  marker_scope: stderr
  limit_markers:
    - sentinel: "provider.rate_limit"
    - sentinel: "5-hour usage limit"
    - sentinel: "weekly (7-day) usage limit"
    - sentinel: "monthly usage limit for this billing cycle"
    - sentinel: "concurrent request limit"
  auth_markers:
    - sentinel: "provider.auth_error"
    - sentinel: "Invalid Authentication"
    - sentinel: "appears to be invalid or may have expired"

hermes:
  binary: hermes
  # NO VENDOR, and that is a statement rather than an omission: this CLI is a
  # front end over 300+ models across Nous Portal, OpenRouter, Anthropic,
  # OpenAI and a dozen more, and its `model` carries its own `provider/id`
  # prefix. Naming one family here would make the field say something false
  # about every entry that chose another; empty falls back to the coding-agent
  # catalogue's own default, which is the honest answer.
  vendor: ""
  # MEASURED AGAINST 0.21.2: the argv driven through the CLI's own argparse
  # (hermes_cli/_parser.py), the toolset resolved through its own registry,
  # the usage-report keys read off hermes_cli/oneshot.py, and the version
  # line off its `--version` fast path. What is NOT measured is a live
  # completion — this CLI's 183-package dependency tree would not install
  # here — so the failure sentinels below are the weakest claim in this entry.
  written_for: "Hermes Agent 0.21.x (`hermes --version`)"
  version_args: ["--version"]
  # THE DENIAL IS ON ARGV, and `--toolsets` is the whole of it.
  #
  # It was nearly a seeded config.yaml, on the strength of the vendor's docs
  # listing `--toolsets` under `hermes chat`. Read against the parser
  # (hermes_cli/_parser.py) it is a TOP-LEVEL flag whose own help says
  # "Applies to -z/--oneshot", and hermes_cli/oneshot.py states the rule:
  # "Toolsets = explicit --toolsets, else the user's `cli` toolsets from
  # `hermes tools`". So passing it REPLACES the set for the invocation and
  # the config file is not consulted at all — a per-call denial rather than a
  # file that can quietly stop applying.
  #
  # `web` resolves to exactly `web_search` and `web_extract` (toolsets.py),
  # which is the surface this backend keeps and nothing else. Everything the
  # default `hermes-cli` platform toolset carries goes with it: file,
  # terminal, browser, code_execution, delegation, cronjob, memory, skills,
  # vision, image_gen, todo, tts, session_search, computer_use and kanban.
  #
  # AND IT FAILS THE SAFE WAY, which is the opposite of grok's allowlist. An
  # entry this build does not know is warned about and dropped; if NOTHING
  # valid survives, the run stops on "--toolsets did not contain any valid
  # toolsets" rather than falling back to every tool. A name that goes stale
  # therefore costs the call, loudly, instead of the restriction.
  #
  # `--ignore-rules` is the other half: it skips the auto-injection of
  # AGENTS.md, SOUL.md, .cursorrules, persistent memory and preloaded skills.
  # Two things follow, and this backend wants both — no context is admitted
  # from a host the engine does not control, and the CLI keeps no second,
  # invisible memory beside the seat's own.
  #
  # NOT --ignore-user-config and NOT --safe-mode. Neither is needed now that
  # the tools are on argv, and each would discard an operator's own
  # cli.overrides.seed_files if they ever add one.
  #
  # AND NOT --yolo, which the vendor's own flag help makes unnecessary rather
  # than merely unwise: `-z` already says "approvals are auto-bypassed". There
  # is no prompt for a headless run to wedge on, so --yolo would grant
  # something for nothing.
  complete_args: ["--ignore-rules", "--toolsets", "web"]
  local_tools: denied
  model_args: ["--model", "{model}"]
  # NO SYSTEM-PROMPT CHANNEL. This CLI's identity slot is SOUL.md, a file in
  # its home rather than a per-call argument — and --ignore-rules deliberately
  # switches its injection off. So the seat's identity rides the transcript,
  # as it does for codex, opencode, copilot, cursor-agent and muse-code.
  #
  # `-z` IS THE ONE-SHOT ENTRY POINT and it takes the prompt as its value, so
  # it goes in prompt_args: the vendor's contract for it is "single prompt in,
  # final response text out, nothing else on stdout or stderr", which is what
  # makes `output: text` correct here. `hermes chat --oneshot -q` is the
  # alternative and is NOT used: the vendor's own note says it is the one to
  # reach for when "you need tool output in the transcript too", and a tool
  # transcript spliced into the reply is what this backend must not have.
  #
  # `-p` IS NOT THE PROMPT FLAG on this CLI — it selects a PROFILE. Nothing
  # here uses it; it is recorded because every other profile in this file
  # spells `-p` as print or prompt, and borrowing that reflex would silently
  # run every seat against a profile named after its own transcript.
  prompt_mode: argv
  prompt_args: ["-z"]
  output: text
  # THE COUNTS COME FROM A FILE, because the entry point that gives a clean
  # answer gives nothing else at all — see [Profile.UsageFileArgs]. The report
  # is written after the run, "even when the run fails", and carries
  # `input_tokens`, `output_tokens`, `cache_read_tokens`, `cache_write_tokens`,
  # `reasoning_tokens`, `total_tokens`, `estimated_cost_usd`, `model`,
  # `provider` and the completed/failed flags.
  #
  # `reasoning_tokens` is deliberately not read: it is a SUBSET of the output
  # count on every vendor that reports both, and adding it would double-charge
  # a thinking model's budget.
  usage_file_args: ["--usage-file", "{usage_file}"]
  usage:
    input: [["input_tokens"]]
    output: [["output_tokens"]]
    cache_read: [["cache_read_tokens"]]
    cache_write: [["cache_write_tokens"]]
  config_env:
    # The vendor's own relocation variable, and the one its official container
    # image uses (HERMES_HOME=/opt/data). It moves the config, the credentials,
    # the session store and the logs — not the installation, which stays
    # wherever the installer put it.
    HERMES_HOME: ".hermes"
  # TWO FILES AGAIN, and for a different reason than kimi-code's: .env holds
  # API keys and bot tokens, auth.json holds the OAuth credential pool that
  # `hermes auth add --type oauth` writes. An entry may use either or both.
  credential_paths:
    - ".hermes/.env"
    - ".hermes/auth.json"
  # state.db is the session store — every message of every session — and
  # SQLite's two sidecars hold the tail of it, so pruning the database and
  # leaving them behind is half a prune. memories/ is the CLI's own persistent
  # memory (MEMORY.md, USER.md) and skills/ is what its skill_manage tool
  # writes: both are exactly the second invisible memory this backend refuses,
  # and --ignore-rules already stops them being injected.
  volatile_paths:
    - ".hermes/state.db"
    - ".hermes/state.db-wal"
    - ".hermes/state.db-shm"
    - ".hermes/sessions"
    - ".hermes/memories"
    - ".hermes/skills"
    - ".hermes/checkpoints"
    - ".hermes/cache"
    - ".hermes/cron"
    - ".hermes/logs"
  host_credential_paths:
    - ".hermes/.env"
    - ".hermes/auth.json"
  # `hermes auth` with no subcommand is the interactive credential wizard, and
  # it is what brokers an OAuth sign-in. `hermes login` still exists and is
  # DEPRECATED in favour of it.
  #
  # No logout_args: `hermes auth logout` requires a provider name, and which
  # provider a seat is logged into is the operator's to know rather than this
  # profile's to guess. `hermes status` needs no argument and reports agent,
  # auth and platform state, so it is the status probe.
  login_args: ["auth"]
  status_args: ["status"]
  # NO api_key_env and NO token_env. This CLI fronts thirty-odd providers and
  # each has its own variable — OPENROUTER_API_KEY, ANTHROPIC_API_KEY,
  # NOUS_API_KEY — so there is no one key variable a profile could name, and
  # naming one would silently be wrong for every other entry. A metered key
  # goes in the credential home's .env (which travels to every seat) or
  # through `cli.env`, where it is ${VAR}-resolved like any other secret.
  #
  # THESE SENTINELS ARE GENERIC, and unusually so for this file, because this
  # CLI publishes no verbatim exhausted-plan wording: it rotates its OWN
  # credential pool and falls through to its OWN fallback providers first, so
  # what reaches this backend is whatever the last provider in that chain
  # said, in its own words. `hermes -z: agent failed:` is the CLI's own
  # prefix on all of it (hermes_cli/oneshot.py) but says nothing about WHICH
  # failure it was, so it cannot separate a spent plan from a dead login.
  #
  # WHAT MAKES THEM SAFE IS THE SCOPE, not the wording. `-z` writes the final
  # response text to stdout and nothing else BY CONTRACT, and every failure
  # goes to stderr — so these are matched against stderr alone and a seat that
  # was ASKED about rate limits cannot answer its way into a credential
  # cooldown. See [MarkerScope]. Without that, "quota" in a model's prose
  # would bench this seat's login, which is the bug this file already fixed
  # once by dropping a bare "429".
  #
  # `hermes auth` is the auth marker because it is the CLI's own remedy
  # sentence — a command name rather than a phrase a model writes by accident.
  marker_scope: stderr
  limit_markers:
    - sentinel: "rate limit"
    - sentinel: "usage limit"
    - sentinel: "quota"
  auth_markers:
    - sentinel: "hermes auth"
    - sentinel: "No credentials"

pi:
  binary: pi
  # NO VENDOR, for the same reason as hermes: this is a harness over 20+
  # providers and its `--model` takes a `provider/id` pattern, so the family
  # belongs to the entry's model rather than to the CLI.
  vendor: ""
  # `@earendil-works/pi-coding-agent`. The project moved from Mario Zechner's
  # `@mariozechner` scope to Earendil Works, so the older package name is a
  # different, frozen thing.
  #
  # MEASURED AGAINST 0.85.1: the flags off `pi --help`, the tool surface and
  # the system prompt off the request body the CLI actually sent (a stub HTTP
  # endpoint standing in for the model), and the error format off real 401
  # and 429 responses.
  written_for: "Pi Coding Agent 0.85.x (`pi --version`)"
  version_args: ["--version"]
  # `-p` is print mode: answer and exit, no TUI. The rest is the isolation,
  # and this CLI is unusually generous with it — every discovery path it has
  # can be switched off by name:
  #
  #   --no-tools          every built-in, extension and custom tool off
  #   --no-context-files  no AGENTS.md / CLAUDE.md discovery
  #   --no-extensions     no extension discovery (extensions EXECUTE)
  #   --no-skills         no skill discovery
  #   --no-prompt-templates / --no-themes  the remaining two discovery passes
  #   --no-approve        project-local files ignored for this run
  #   --no-session        ephemeral: nothing written to the session store
  #
  # --no-tools AND NOT an allowlist, which is the opposite of every other
  # profile here, because there is no web tool to keep. MEASURED off the
  # request body: the baseline this build advertises is FOUR tools — `bash`,
  # `edit`, `read`, `write` — and `--no-tools` sends the tool array empty.
  # (The vendor's README also lists `grep`, `find`, `ls` and a Windows
  # `powershell`; none was registered here, so the four are what a Linux
  # engine host actually faces.) Web is the one local tool this backend never
  # denies, and on this CLI there is simply none to deny.
  #
  # --no-approve rather than trusting the per-call directory: non-interactive
  # modes never show a trust prompt and fall back to `defaultProjectTrust`
  # from the operator's own global settings, which may be `always`. This
  # pins the answer for the run instead of inheriting it.
  complete_args:
    - "-p"
    - "--no-tools"
    - "--no-context-files"
    - "--no-extensions"
    - "--no-skills"
    - "--no-prompt-templates"
    - "--no-themes"
    - "--no-approve"
    - "--no-session"
  local_tools: denied
  model_args: ["--model", "{model}"]
  # Replace, not append: `--append-system-prompt` is the other half of this
  # pair and would leave the harness's own prompt in front of the seat's. The
  # vendor notes that context files and skills are still appended to a
  # replaced prompt — which is why --no-context-files and --no-skills are in
  # complete_args rather than being merely tidy.
  #
  # MEASURED, and the replacement is not quite total: what reached the model
  # was the seat's own prompt followed by one line, `Current working
  # directory: <path>`. That is this backend's per-call scratch directory,
  # it is true, and it is 60-odd characters rather than a coding-agent
  # identity — so it is recorded here rather than fought.
  #
  # Inline, because this CLI takes a string and has no file variant. The one
  # file channel it does have is `~/.pi/agent/SYSTEM.md`, which is static per
  # home and cannot carry a prompt that differs per phase. So the seat's
  # identity is on argv here, as it is for grok — and the prompt already is
  # too, so on a shared host both are readable through /proc/<pid>/cmdline and
  # both count against ARG_MAX. `cli.overrides.system_prompt_args: []` puts
  # the identity back in the transcript for an operator who would rather.
  system_prompt_args: ["--system-prompt", "{system}"]
  prompt_mode: argv
  # `--` stops option parsing, so a transcript that happens to begin with a
  # dash is a prompt rather than an unknown flag. This CLI is the only one
  # here that offers the separator, and the vendor documents exactly this use
  # (`pi -p -- "- Summarize these points"`).
  prompt_args: ["--"]
  # PLAIN TEXT, deliberately, although this CLI has a richer channel.
  # `--mode json` streams every session event and would carry real token
  # counts — but its answer lives at `message.content[N].text`, an array of
  # text, thinking and tool-call blocks whose index moves with whether the
  # model reasoned, and a model that interleaves thinking with prose spreads
  # one reply across several of them. Reading it by index would guess, and a
  # guess about WHICH part of the output is the model's reply is the one thing
  # this backend must never get wrong. Print mode prints the reply and exits.
  #
  # The cost is the token counts, which are estimated here — the same state
  # copilot, grok and muse-code are in, and `crewlet llm doctor` says so. An
  # operator who wants the stream has it in one override:
  #
  #   overrides:
  #     complete_args: ["--mode", "json", …]
  #     output: jsonl
  #     event_type_path: ["type"]
  #     text_events: ["turn_end"]
  #     text_paths: [["message", "content", "0", "text"]]
  #     usage: {input: [["usage", "input"]], output: [["usage", "output"]]}
  output: text
  env:
    # No startup network calls: no version check against pi.dev, no package
    # update check, no install telemetry. The same decision as muse-code's and
    # kimi-code's auto-update switches, plus the reason those two do not have:
    # a check on every call is a per-call round trip on the seat's latency.
    PI_OFFLINE: "1"
  config_env:
    # The vendor's own relocation variable. Note the `agent` segment: the
    # config root is ~/.pi/agent rather than ~/.pi, so the seat home's copy is
    # .pi/agent and every path below is relative to that.
    PI_CODING_AGENT_DIR: ".pi/agent"
  # OAuth tokens and API keys both land here, 0600, and the file auto-refreshes
  # an expired token in place.
  credential_paths: [".pi/agent/auth.json"]
  # --no-session already keeps the store empty, and these are what the CLI
  # writes anyway: sessions/ if an override ever drops the flag, trust.json
  # which accumulates one record per per-call directory that will never exist
  # again, and the model catalogue cache, which PI_OFFLINE keeps stale rather
  # than fresh. Extensions and packages are pruned because an extension is
  # EXECUTABLE: --no-extensions stops discovery, and this stops one turn from
  # leaving something behind for the next to find.
  volatile_paths:
    - ".pi/agent/sessions"
    - ".pi/agent/trust.json"
    - ".pi/agent/models-store.json"
    - ".pi/agent/extensions"
    - ".pi/agent/npm"
    - ".pi/agent/git"
  host_credential_paths: [".pi/agent/auth.json"]
  # THE TUI ITSELF, because `/login` is a SLASH COMMAND rather than a
  # subcommand — this CLI has no headless login of any kind. So the broker
  # starts the interactive session in the credential home and the operator
  # types `/login`, completes the browser flow, then `/exit`.
  #
  # That is the shape the claude-code profile's note warns about, and the
  # difference is that there it was avoidable: `claude auth login` exists and
  # `claude /login` merely LOOKED like a login. Here the REPL is the only
  # route the vendor offers, so the alternative is declaring no login at all
  # and telling the operator, wrongly, that the CLI "authenticates on first
  # use". `--no-session` keeps the sign-in from leaving a session behind.
  #
  # No logout_args and no status_args: `/logout` is a slash command too, and
  # there is no status subcommand.
  login_args: ["--no-session"]
  # `--api-key` exists as a flag but the environment variable is per provider
  # — ANTHROPIC_API_KEY, OPENAI_API_KEY, one for each of the twenty-odd — so
  # there is no single key variable to name, exactly as for hermes. A metered
  # key goes in auth.json (which travels to every seat) or through `cli.env`.
  #
  # THE SENTINELS ARE THE UPSTREAM VENDOR'S, not this CLI's, and a
  # measurement is what settles that rather than a guess: a failing call
  # writes `<status>: <the provider's error JSON, verbatim>` to stderr, e.g.
  #
  #   429: {"message":"…","type":"rate_limit_error","code":"rate_limit_exceeded"}
  #
  # So the only stable tokens are the provider's own `type` and `code`, which
  # is what these are. The status prefix is deliberately NOT one: this file
  # dropped a bare "429" sentinel once already, because three digits match
  # ordinary prose. Pi's subscription providers are Claude Pro/Max, ChatGPT
  # and GitHub Copilot, so both vendors' vocabularies are listed; if yours
  # differs, override cli.overrides.limit_markers.
  #
  # FAILURES REACH THIS BACKEND ON STDERR AND NOWHERE ELSE, measured: a failed
  # call left stdout EMPTY and wrote `<status>: <the provider's error JSON>`
  # to stderr. Matching stderr alone is what stops a model that mentions an
  # error code in prose from benching the seat's credential — and here the
  # exposure would be total, since on a `text` profile the whole of stdout IS
  # the answer. See [MarkerScope].
  marker_scope: stderr
  limit_markers:
    - sentinel: "Usage limit reached"
    - sentinel: '"type":"rate_limit_error"'
    - sentinel: "rate_limit_exceeded"
    - sentinel: "insufficient_quota"
  #
  # The auth sentinels are structural for the same reason, and deliberately
  # NOT this CLI's own `/login` remedy: an auth marker fires KindAuth, which
  # exhausts the credential exactly as a spent plan does, and `/login` is
  # four characters a model writes in its own prose whenever somebody asks it
  # about signing in. The two spellings of the same failure are both listed
  # because a sentinel is matched case-sensitively.
  auth_markers:
    - sentinel: "authentication_error"
    - sentinel: "Invalid API key"
    - sentinel: "invalid_api_key"

# `custom` ships NOTHING on purpose. An operator pointing at their own wrapper
# or a self-hosted gateway declares every field under cli.overrides, and the
# profile validation then names whichever one they left out — which is a far
# better first run than defaults borrowed from an unrelated vendor's CLI.
custom: {}
