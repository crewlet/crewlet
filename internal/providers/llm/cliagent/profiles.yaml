# Built-in cli-agent profiles.
#
# DATA, not code: every field here is replaceable from
# providers.llm.<key>.cli.overrides, because these flags and JSON shapes
# belong to vendors who rename them between releases. `written_for` is the
# version each profile was authored against, and `crewlet llm doctor` prints
# it beside the version actually installed — a profile that quietly stopped
# matching its CLI is the failure this file is shaped to make visible.
#
# Paths under credential_paths and volatile_paths are relative to the SEAT
# HOME, so a CLI that keeps two directories can name files in both.

claude-code:
  binary: claude
  vendor: anthropic
  written_for: "Claude Code CLI 2.x (`claude --version`)"
  version_args: ["--version"]
  # --no-session-persistence and --safe-mode are the isolation the rest of
  # this backend depends on: no transcript on disk to leak between turns, and
  # no CLAUDE.md, skill, plugin, hook or MCP server admitted from a host the
  # engine does not control. The tool denials make it a text model — Crewlet's
  # tools ride the prompt envelope, and a CLI editing files in its own sandbox
  # is invisible to the tool registry, the permission model and redaction.
  #
  # Web is the one local tool that stays ON, and it has to be ALLOWED rather
  # than merely not denied: print mode never prompts, and a permission-gated
  # tool that is not on the allow list is refused, so a seat that was told it
  # could fetch would have found it could not. A fetch is a read — it never
  # gates delivery — and a subscription seat must not have less reach than the
  # same CLI at a terminal.
  complete_args:
    - "-p"
    - "--output-format"
    - "json"
    - "--no-session-persistence"
    - "--safe-mode"
    - "--strict-mcp-config"
    - "--disable-slash-commands"
    - "--allowedTools"
    - "WebFetch"
    - "WebSearch"
    - "--disallowedTools"
    - "Bash"
    - "Read"
    - "Write"
    - "Edit"
    - "Glob"
    - "Grep"
    - "Task"
    - "NotebookEdit"
    - "TodoWrite"
  local_tools: denied
  model_args: ["--model", "{model}"]
  prompt_mode: stdin
  output: json
  text_paths: [["result"]]
  error_paths: [["is_error"]]
  usage:
    input: [["usage", "input_tokens"]]
    output: [["usage", "output_tokens"]]
    cache_read: [["usage", "cache_read_input_tokens"]]
    cache_write: [["usage", "cache_creation_input_tokens"]]
  config_env:
    CLAUDE_CONFIG_DIR: ".claude"
  credential_paths: [".claude/.credentials.json"]
  volatile_paths:
    # .claude.json is not merely settings: it carries a `projects` map whose
    # entries hold per-directory conversation HISTORY. Observed on disk after
    # a real call, which is why it is pruned rather than trusted — the
    # remaining keys (machineID, migration flags, cached feature data) are
    # re-created on the next start at the cost of a few milliseconds.
    - ".claude/.claude.json"
    - ".claude/projects"
    - ".claude/sessions"
    - ".claude/todos"
    - ".claude/tasks"
    - ".claude/history.jsonl"
    - ".claude/statsig"
    - ".claude/shell-snapshots"
    - ".claude/telemetry"
  host_credential_paths: [".claude/.credentials.json"]
  token_env: "CLAUDE_CODE_OAUTH_TOKEN"
  api_key_env: "ANTHROPIC_API_KEY"
  login_args: ["/login"]
  capture_token_args: ["setup-token"]
  # A spent plan exits 0 with prose. The sentinel is emitted verbatim and
  # carries the reset instant after a pipe, so the classification yields a
  # real Retry-After rather than a guess.
  limit_markers:
    - sentinel: "Claude AI usage limit reached"
      reset_separator: "|"
      reset_unit: epoch
  auth_markers:
    - sentinel: "Invalid API key"
    - sentinel: "OAuth token has expired"
    - sentinel: "Please run /login"

codex:
  binary: codex
  vendor: openai
  written_for: "Codex CLI 0.5x (`codex --version`)"
  version_args: ["--version"]
  # read-only sandbox for the same reason as Claude's tool denials, and
  # --skip-git-repo-check because the per-call scratch directory is
  # deliberately not a repository. The sandbox also cuts the shell's network,
  # which is fine — the shell is denied — but the model's OWN web search is a
  # separate tool that the config defaults to an offline index; `live` is the
  # setting that reaches the web, passed as a config override so no file has
  # to be seeded.
  complete_args:
    - "exec"
    - "--json"
    - "--sandbox"
    - "read-only"
    - "--skip-git-repo-check"
    - "-c"
    - 'web_search="live"'
    - "-"
  local_tools: denied
  model_args: ["--model", "{model}"]
  prompt_mode: stdin
  output: jsonl
  # Two shapes, newest first: 0.5x emits item.completed envelopes, 0.4x
  # emitted msg envelopes. Both are listed rather than one being chosen so an
  # operator on either release needs no override.
  text_paths: [["item", "text"], ["msg", "message"]]
  usage:
    input:
      - ["msg", "info", "total_token_usage", "input_tokens"]
      - ["usage", "input_tokens"]
    output:
      - ["msg", "info", "total_token_usage", "output_tokens"]
      - ["usage", "output_tokens"]
    cache_read:
      - ["msg", "info", "total_token_usage", "cached_input_tokens"]
  config_env:
    CODEX_HOME: ".codex"
  credential_paths: [".codex/auth.json"]
  volatile_paths: [".codex/sessions", ".codex/history.jsonl", ".codex/log"]
  host_credential_paths: [".codex/auth.json"]
  api_key_env: "OPENAI_API_KEY"
  login_args: ["login"]
  status_args: ["login", "status"]
  logout_args: ["logout"]
  limit_markers:
    - sentinel: "You've hit your usage limit"
    - sentinel: "rate limit reached"
  auth_markers:
    - sentinel: "Not logged in"
    - sentinel: "run `codex login`"

gemini-cli:
  binary: gemini
  vendor: google
  written_for: "Gemini CLI 0.1x (`gemini --version`)"
  version_args: ["--version"]
  complete_args: ["--output-format", "json", "--approval-mode", "default"]
  # Gemini takes its tool policy from settings.json in its config directory,
  # which is under the seat HOME. Local tools are excluded from discovery
  # (both the current and the pre-rename tool names, so the file holds across
  # the releases it may meet), and the web tools are put on the no-confirmation
  # list, because a headless run cannot answer a confirmation prompt and a
  # fetch that waited for one would simply fail. The pre-1.0 top-level key is
  # written beside the nested one for the same reason.
  local_tools: denied
  seed_files:
    - path: .gemini/settings.json
      content: '{"tools":{"exclude":["run_shell_command","read_file","write_file","edit_file","replace","glob","grep","search_file_content","list_directory","read_many_files","save_memory"],"allowed":["web_fetch","web_search","google_web_search"]},"excludeTools":["run_shell_command","read_file","write_file","edit_file","replace","glob","grep","search_file_content","list_directory","read_many_files","save_memory"]}'
  model_args: ["--model", "{model}"]
  prompt_mode: stdin
  output: json
  text_paths: [["response"]]
  # Gemini's usage block moved between releases and some builds omit it
  # entirely; when none of these resolves the counts are estimated and
  # `crewlet llm doctor` says so rather than reporting zeros as fact.
  usage:
    input: [["stats", "metrics", "input_tokens"], ["stats", "input_tokens"]]
    output: [["stats", "metrics", "output_tokens"], ["stats", "output_tokens"]]
    cache_read: [["stats", "metrics", "cached_content_tokens"]]
  credential_paths: [".gemini/oauth_creds.json", ".gemini/google_accounts.json"]
  volatile_paths: [".gemini/tmp", ".gemini/history", ".gemini/sessions"]
  host_credential_paths: [".gemini/oauth_creds.json", ".gemini/google_accounts.json"]
  api_key_env: "GEMINI_API_KEY"
  # A project id is configuration, not a credential, and Gemini genuinely
  # needs the ambient one on a Workspace account.
  passthrough_env: ["GOOGLE_CLOUD_PROJECT", "GOOGLE_CLOUD_LOCATION"]
  login_args: []
  limit_markers:
    - sentinel: "Quota exceeded"
    - sentinel: "RESOURCE_EXHAUSTED"
  auth_markers:
    - sentinel: "UNAUTHENTICATED"
    - sentinel: "Please sign in"

qwen-code:
  binary: qwen
  vendor: openai
  written_for: "Qwen Code 0.1x (`qwen --version`), a Gemini CLI fork"
  version_args: ["--version"]
  complete_args: ["--output-format", "json", "--approval-mode", "default"]
  # A Gemini CLI fork: same settings shape, same tool names, its own directory.
  local_tools: denied
  seed_files:
    - path: .qwen/settings.json
      content: '{"tools":{"exclude":["run_shell_command","read_file","write_file","edit_file","replace","glob","grep","search_file_content","list_directory","read_many_files","save_memory"],"allowed":["web_fetch","web_search","google_web_search"]},"excludeTools":["run_shell_command","read_file","write_file","edit_file","replace","glob","grep","search_file_content","list_directory","read_many_files","save_memory"]}'
  model_args: ["--model", "{model}"]
  prompt_mode: stdin
  output: json
  text_paths: [["response"]]
  usage:
    input: [["stats", "metrics", "input_tokens"], ["stats", "input_tokens"]]
    output: [["stats", "metrics", "output_tokens"], ["stats", "output_tokens"]]
  credential_paths: [".qwen/oauth_creds.json"]
  volatile_paths: [".qwen/tmp", ".qwen/history", ".qwen/sessions"]
  host_credential_paths: [".qwen/oauth_creds.json"]
  api_key_env: "DASHSCOPE_API_KEY"
  limit_markers:
    - sentinel: "Quota exceeded"
    - sentinel: "RESOURCE_EXHAUSTED"
  auth_markers:
    - sentinel: "UNAUTHENTICATED"

opencode:
  binary: opencode
  vendor: anthropic
  written_for: "OpenCode 0.4x (`opencode --version`)"
  version_args: ["--version"]
  complete_args: ["run", "--print-logs=false"]
  # OpenCode takes its tool policy from opencode.json under XDG_CONFIG_HOME,
  # which the child environment points inside the seat HOME. Every rule is an
  # explicit allow or deny — never ask, which a headless run cannot answer.
  # `question` is denied for the same reason: it is the tool that asks a
  # person. Explicit denies hold in every mode, including --auto.
  local_tools: denied
  seed_files:
    - path: .config/opencode/opencode.json
      content: '{"$schema":"https://opencode.ai/config.json","permission":{"read":"deny","edit":"deny","glob":"deny","grep":"deny","bash":"deny","task":"deny","skill":"deny","lsp":"deny","question":"deny","external_directory":"deny","webfetch":"allow","websearch":"allow"}}'
  model_args: ["--model", "{model}"]
  prompt_mode: argv
  output: text
  credential_paths: [".local/share/opencode/auth.json"]
  volatile_paths:
    - ".local/share/opencode/storage"
    - ".local/share/opencode/log"
    - ".local/share/opencode/project"
  host_credential_paths: [".local/share/opencode/auth.json"]
  login_args: ["auth", "login"]
  logout_args: ["auth", "logout"]
  status_args: ["auth", "list"]
  # The one built-in profile with a real credential login, which is why the
  # `crewlet llm login --username/--password-stdin` path exists at all.
  stdin_login:
    args: ["auth", "login", "--username", "{username}"]
    stdin_template: "{password}\n"
  limit_markers:
    - sentinel: "usage limit"
    - sentinel: "429"
  auth_markers:
    - sentinel: "not authenticated"
    - sentinel: "no credentials"

cursor-agent:
  binary: cursor-agent
  vendor: anthropic
  written_for: "Cursor Agent 2.x (`cursor-agent --version`)"
  version_args: ["--version"]
  complete_args: ["-p", "--output-format", "json"]
  # Cursor reads a permissions block from the project's .cursor/cli.json —
  # the per-call scratch directory IS the project, so the file is seeded there
  # on every call. Its user-level file, cli-config.json, is the login file
  # this profile seeds and syncs back, so the policy is kept out of it. Deny
  # takes precedence over allow.
  local_tools: denied
  seed_files:
    - path: .cursor/cli.json
      in: work
      content: '{"permissions":{"allow":["WebFetch(*)"],"deny":["Shell(*)","Write(*)","Read(*)"]}}'
  model_args: ["--model", "{model}"]
  prompt_mode: stdin
  output: json
  text_paths: [["result"], ["response"]]
  usage:
    input: [["usage", "input_tokens"]]
    output: [["usage", "output_tokens"]]
  config_env:
    CURSOR_CONFIG_DIR: ".cursor"
  credential_paths: [".cursor/cli-config.json", ".cursor/auth.json"]
  volatile_paths: [".cursor/chats", ".cursor/logs", ".cursor/sessions"]
  host_credential_paths: [".cursor/cli-config.json", ".cursor/auth.json"]
  login_args: ["login"]
  logout_args: ["logout"]
  status_args: ["status"]
  limit_markers:
    - sentinel: "usage limit"
    - sentinel: "quota"
  auth_markers:
    - sentinel: "not logged in"

copilot:
  binary: copilot
  vendor: openai
  written_for: "GitHub Copilot CLI 0.3x (`copilot --version`)"
  version_args: ["--version"]
  # The tool flags come BEFORE -p, so nothing here can be read as the prompt,
  # which is appended last. Denies win over allows; the web tools are
  # allowed explicitly so a non-interactive run does not wait on approval.
  complete_args:
    - "--deny-tool"
    - "shell"
    - "--deny-tool"
    - "write"
    - "--deny-tool"
    - "read"
    - "--allow-tool"
    - "web_fetch"
    - "--allow-tool"
    - "web_search"
    - "-p"
  local_tools: denied
  model_args: ["--model", "{model}"]
  # The prompt goes on argv, so a long transcript is bounded by ARG_MAX
  # (~2 MB on Linux, 256 KB on macOS) and fails at exec rather than at the
  # model. Documented in subscription-llm-backends.md.
  prompt_mode: argv
  output: text
  credential_paths: [".copilot/hosts.json"]
  volatile_paths: [".copilot/history", ".copilot/logs", ".copilot/sessions"]
  host_credential_paths: [".copilot/hosts.json", ".config/gh/hosts.yml"]
  # Copilot authenticates with a GitHub token, so this is its key variable —
  # reached deliberately through auth.mode api-key or inherit-env, never
  # forwarded silently.
  api_key_env: "GITHUB_TOKEN"
  login_args: ["login"]
  logout_args: ["logout"]
  limit_markers:
    - sentinel: "usage limit"
    - sentinel: "rate limit"
  auth_markers:
    - sentinel: "not authenticated"
    - sentinel: "gh auth login"

grok:
  binary: grok
  vendor: openai
  written_for: "Grok CLI 0.1x (`grok --version`)"
  version_args: ["--version"]
  complete_args: ["-p"]
  # No per-tool denial exists on this CLI, and its --sandbox flag restricts
  # the network along with the filesystem — which would cut the web tools
  # this backend keeps on. So the stance is declared honestly and
  # `crewlet llm doctor` measures it: its shell probe reports whether this
  # build ran a command on the engine host.
  local_tools: vendor-default
  local_tools_note: "grok exposes no per-tool denial, and --sandbox would also cut the network the web tools need"
  model_args: ["--model", "{model}"]
  prompt_mode: argv
  output: text
  credential_paths: [".grok/auth.json"]
  volatile_paths: [".grok/history", ".grok/sessions"]
  host_credential_paths: [".grok/auth.json"]
  api_key_env: "GROK_API_KEY"
  limit_markers:
    - sentinel: "rate limit"
  auth_markers:
    - sentinel: "invalid api key"

# `custom` ships NOTHING on purpose. An operator pointing at their own wrapper
# or a self-hosted gateway declares every field under cli.overrides, and the
# profile validation then names whichever one they left out — which is a far
# better first run than defaults borrowed from an unrelated vendor's CLI.
custom: {}
